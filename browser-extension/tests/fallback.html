<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Overlay — fallback harness</title>
    <style>
      body {
        margin: 0;
        padding: 16px 20px 60px;
        background: #0f1116;
        color: #e8eaed;
        font: 12px/1.55 ui-monospace, Menlo, monospace;
      }
      h1 { margin: 0 0 4px; font-size: 13px; }
      #summary { margin: 0 0 14px; font-size: 12px; }
      .case { padding: 5px 0; border-top: 1px solid #1c212a; max-width: 900px; }
      .pass::before { content: "PASS "; color: #59c27f; }
      .fail::before { content: "FAIL "; color: #e8705f; }
      .why { color: #8b929d; padding-left: 42px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Subtitle Overlay — fallback harness</h1>
    <p id="summary">running…</p>
    <div id="results"></div>

    <script type="module">
      /* What happens when the daemon is not running.
       *
       * The pipeline itself is checked against the daemon's by
       * subtitle-daemon/tests/test_js_parity.py - same inputs, same outputs, in
       * both languages. This file checks the parts that only exist here: the
       * routing rule, the cache, and the convergence with the daemon.
       *
       * The quota cases are the ones that matter. A download is five a day
       * anonymously, so "did this spend one?" is asserted directly by counting
       * calls to the download endpoint, not inferred from a cache flag.
       */

      // --- stubs ----------------------------------------------------------
      const store = {};
      globalThis.chrome = {
        runtime: { getManifest: () => ({ version: "0.1.0" }) },
        /* The whole surface, not only today's callers - see harness.html. */
        storage: {
          local: {
            get: async (k) => {
              const keys = typeof k === "string" ? [k] : Array.isArray(k) ? k : Object.keys(k ?? store);
              const out = {};
              for (const key of keys) if (key in store) out[key] = store[key];
              return out;
            },
            set: async (obj) => Object.assign(store, obj),
            remove: async (k) => {
              for (const key of typeof k === "string" ? [k] : k) delete store[key];
            },
            clear: async () => {
              for (const key of Object.keys(store)) delete store[key];
            },
          },
        },
      };

      const SRT = [
        "1",
        "00:00:01,000 --> 00:00:02,000",
        "[Ormon] Get down!",
        "",
        "2",
        "00:00:03,000 --> 00:00:04,000",
        "<i>[sighs]</i> Fine.",
        "",
        /* Three marks standing in for dialogue the file does not write down.
         * They reach the overlay as a box with nothing in it, over the picture,
         * at the moment the picture is carrying the words - which is what put
         * the guard in parseSrt. The last one is the awkward case: its letters
         * are all inside the tag. */
        "3",
        "00:00:05,000 --> 00:00:06,000",
        "_",
        "",
        "4",
        "00:00:07,000 --> 00:00:08,000",
        "\u266a\u266a",
        "",
        "5",
        "00:00:09,000 --> 00:00:10,000",
        "<font color=orange>\u00a9",
        "",
      ].join("\n");

      /* The daemon sends base64 of the file's BYTES. Putting the string
       * straight through btoa cannot carry anything outside Latin-1 - not the
       * music mark above, and not the s-cedilla, g-breve and dotless i in every
       * Turkish subtitle there is - so the stub encodes the way the daemon
       * does. sync.js already did; only this stub was narrower than the thing
       * it stands for. */
      const base64 = (text) => btoa(String.fromCharCode(...new TextEncoder().encode(text)));

      // Counters are the assertion surface for quota.
      const calls = { download: 0, features: 0, subtitles: 0, daemonSearch: 0, imported: [], forgotten: [] };
      let daemonRunning = false;
      let daemonFails = null;
      let foreignOnPort = false;
      const daemonCache = new Map();

      const json = (body, status = 200) =>
        new Response(JSON.stringify(body), {
          status,
          headers: { "Content-Type": "application/json" },
        });

      const feature = {
        attributes: {
          imdb_id: "32430579",
          title: "Crime 101",
          year: 2025,
          feature_type: "Movie",
          subtitles_count: 12,
        },
      };

      const subtitleItem = (fileId, release) => ({
        id: `s${fileId}`,
        attributes: {
          language: "en",
          release,
          download_count: 900,
          from_trusted: true,
          hearing_impaired: false,
          files: [{ file_id: fileId, file_name: `${release}.srt` }],
          feature_details: { movie_name: "Crime 101", year: 2025 },
        },
      });

      /* The origin the extension really calls, imported rather than written out
       * again. The port moved once and a stub still answering the old one is a
       * suite that passes while testing a URL nobody requests. */
      const { DAEMON_ORIGIN } = await import("../src/daemon.js");

      globalThis.fetch = async (url, options = {}) => {
        const target = String(url);

        // --- the daemon ---
        if (target.startsWith(DAEMON_ORIGIN)) {
          if (!daemonRunning) throw new TypeError("Failed to fetch");
          /* Something that is not the daemon, holding the port. A dev server
           * answers 200 with its index page for every path it does not know,
           * so nothing fails and nothing parses - which is the case that got
           * through. `python3 -m http.server` on the same port is the other
           * shape and answers 404; that one already ends up here. */
          if (foreignOnPort) {
            return new Response("<!doctype html><title>dev server</title>", {
              status: 200,
              headers: { "Content-Type": "text/html" },
            });
          }
          const path = target.slice(DAEMON_ORIGIN.length);
          if (path.startsWith("/health")) {
            return json({ has_api_key: true, default_languages: ["en"] });
          }
          if (path.startsWith("/search")) {
            calls.daemonSearch++;
            if (daemonFails) return json({ error: daemonFails });
            return json({
              used: { query: "Crime 101" },
              auto_attach_threshold: 0.75,
              results: [{ file_id: 11, language: "en", movie_name: "Crime 101", match_score: 1 }],
            });
          }
          // Exactly the collection, not /cached/<id> - which also starts with it.
          if (path === "/cached" || path.startsWith("/cached?")) {
            if (options.method === "DELETE") {
              const searchesOnly = path.includes("searches_only");
              if (!searchesOnly) daemonCache.clear();
              return json({ subtitles: 0, searches: 0 });
            }
            if (options.method === "POST") {
              const body = JSON.parse(options.body);
              calls.imported.push(body.file_id);
              daemonCache.set(body.file_id, body);
              return json({ imported: true, file_id: body.file_id });
            }
            return json({
              subtitles: [...daemonCache.values()].map((item) => ({
                file_id: item.file_id,
                ...item.meta,
              })),
            });
          }
          const one = path.match(/^\/cached\/(\d+)/);
          if (one) {
            const id = Number(one[1]);
            if (options.method === "DELETE") {
              const existed = daemonCache.delete(id);
              calls.forgotten.push(id);
              return json({ deleted: existed, file_id: id });
            }
            const held = daemonCache.get(id);
            if (!held) return json({ error: "not cached" });
            return json({ content: held.content, meta: held.meta, cues: [] });
          }
          return json({ error: "no such endpoint" }, 404);
        }

        // --- OpenSubtitles ---
        if (target.includes("/features")) {
          calls.features++;
          return json({ data: [feature] });
        }
        if (target.includes("/subtitles")) {
          calls.subtitles++;
          return json({ data: [subtitleItem(11, "Crime.101.1080p"), subtitleItem(22, "Crime.101.720p")] });
        }
        if (target.includes("/download")) {
          calls.download++;
          return json({ link: "https://dl.opensubtitles.com/x.srt", file_name: "x.srt", remaining: 4 });
        }
        if (target.startsWith("https://dl.opensubtitles.com")) {
          return new Response(new TextEncoder().encode(SRT));
        }
        throw new Error(`unstubbed fetch: ${target}`);
      };

      // Every test starts from an empty store, or one test's downloads would
      // satisfy the next test's cache and hide a real regression.
      await new Promise((resolve) => {
        const request = indexedDB.deleteDatabase("sso-subtitles");
        request.onsuccess = request.onerror = request.onblocked = resolve;
      });

      const provider = await import("../src/provider.js");
      const cache = await import("../src/subtitles/cache.js");
      await provider.updateSettings({ apiKey: "test-key", languages: ["en"] });

      // --- assertions -----------------------------------------------------
      const cases = [];
      const check = (name, fn) => cases.push({ name, fn });
      const reset = () => {
        calls.download = calls.features = calls.subtitles = calls.daemonSearch = 0;
        calls.imported = [];
        calls.forgotten = [];
      };
      /* Starting or stopping the daemon has to be followed by a forced probe.
       * The provider caches "is it up?" for a few seconds so the panel does not
       * put a round trip in front of every keystroke, which means a stub that
       * flips between two tests is not noticed - the same way starting the real
       * daemon is not noticed for a moment. This is the options page's "Check
       * again" button. */
      const setDaemon = async (up) => {
        daemonRunning = up;
        await provider.daemonUp({ force: true });
      };

      check("with the daemon stopped, the extension answers the search itself", async () => {
        await setDaemon(false);
        reset();
        const found = await provider.search({ title: "Prime Video: Crime 101", languages: ["en"] });
        if (found.served_by !== "extension") throw new Error(`served by ${found.served_by}`);
        if (!found.results.length) throw new Error("no results");
        if (found.resolved?.imdb_id !== "32430579") throw new Error("title was not resolved");
        if (!calls.features) throw new Error("/features was never consulted");
      });

      check("the extension's own search says which results it identified", async () => {
        /* What separates a result that can be attached without asking from one
         * a human has to look at. It is not the uploader's file name: once
         * /features has recognised the title and the search has gone out by its
         * id, every row is that programme whatever it was called. Measured on
         * The Americans: season 3 episode 13 resolved with no rivals, all seven
         * results were the right episode, and all seven were refused at 0.70
         * because the episode's own title is three words long.
         *
         * Asserted on this side as well as in the worker's suite, because this
         * is the code that answers whenever the daemon is not running - which
         * is the ordinary case. */
        await setDaemon(false);
        reset();
        const found = await provider.search({ title: "Prime Video: Crime 101", languages: ["en"] });
        if (!found.results.length) throw new Error("no results to mark");
        if (!found.results.every((result) => result.identified === true))
          throw new Error("a resolved title's results were not marked as identified");

        /* And the other way. A title the index does not recognise is searched
         * for fuzzily, OpenSubtitles returns something regardless, and there
         * the name score is the only guard there is. */
        const guessed = await provider.search({ query: "Something Else Entirely", languages: ["en"] });
        if (guessed.resolved) throw new Error("the unrelated title resolved after all");
        if (!guessed.results.length) throw new Error("the fuzzy search returned nothing to judge");
        if (guessed.results.some((result) => result.identified))
          throw new Error("a fuzzy search's results were marked as identified");
      });

      check("the title is cleaned before it is searched for", async () => {
        const found = await provider.search({ title: "Prime Video: Crime 101", languages: ["en"] });
        if (found.used.query !== "Crime 101")
          throw new Error(`searched for ${JSON.stringify(found.used.query)}`);
      });

      check("what was typed is cleaned too, not only what the page said", async () => {
        /* The missing half of the check above, and the reason a reported search
         * bug survived a fix. The page-title path was parsed and tested; the
         * typed path was not parsed and not tested, so "The Americans (2013)
         * 2013 - S02 E04" went to OpenSubtitles verbatim - scoring 0.50 against
         * the real name - while the daemon, its tests and the shared parser all
         * agreed the bug was fixed. This is the path that serves the reader
         * whenever the daemon is not running, which is the ordinary case. */
        const found = await provider.search({
          query: "The Americans (2013) 2013 · S02 E04",
          languages: ["en"],
        });
        const used = found.used;
        if (used.query !== "The Americans")
          throw new Error(`searched for ${JSON.stringify(used.query)}`);
        if (used.year !== 2013) throw new Error(`year came out as ${used.year}`);
        if (used.season !== 2 || used.episode !== 4)
          throw new Error(`episode came out as S${used.season}E${used.episode}`);
      });

      check("a typed episode beats the one the page reported", async () => {
        // The panel sends the playing episode with every search, so typing a
        // different one has to win or it cannot be used to ask for another.
        const found = await provider.search({
          query: "The Americans S02 E04",
          season: 1,
          episode: 9,
          languages: ["en"],
        });
        if (found.used.season !== 2 || found.used.episode !== 4)
          throw new Error(`asked for S${found.used.season}E${found.used.episode}`);
      });

      check("a clean typed title is not damaged by being parsed", async () => {
        const found = await provider.search({ query: "Crime 101", languages: ["en"] });
        if (found.used.query !== "Crime 101")
          throw new Error(`searched for ${JSON.stringify(found.used.query)}`);
      });

      check("fetching a subtitle produces annotated cues", async () => {
        reset();
        const result = await provider.fetchSubtitle(11, { imdb_id: "32430579", language: "en" });
        if (result.error) throw new Error(result.error);
        if (result.cues.length !== 2) throw new Error(`${result.cues.length} cues`);
        const speaker = result.cues[0].runs.find((run) => run.kind === "speaker");
        if (!speaker) throw new Error("no speaker run");
        if (!speaker.color) throw new Error("speaker run has no identity colour");
        const sound = result.cues[1].runs.find((run) => run.kind === "sound");
        if (!sound?.symbol) throw new Error("no symbol on the sound run");
        if (!result.cues[1].runs.some((run) => run.styles?.includes("i")))
          throw new Error("italics were lost");
      });

      check("a subtitle that stands in for a burnt-in one is not put on screen", async () => {
        reset();
        const result = await provider.fetchSubtitle(11, { imdb_id: "32430579", language: "en" });
        if (result.error) throw new Error(result.error);
        const unreadable = result.cues.filter((cue) => !/[\p{L}\p{N}]/u.test(cue.text));
        if (unreadable.length)
          throw new Error(`${unreadable.length} cues with nothing to read: ` +
            unreadable.map((cue) => JSON.stringify(cue.text)).join(", "));
        if (result.cues.length !== 2) throw new Error(`${result.cues.length} cues, not 2`);
      });

      check("the same file is not downloaded twice", async () => {
        reset();
        const result = await provider.fetchSubtitle(11, { imdb_id: "32430579", language: "en" });
        if (calls.download !== 0) throw new Error(`spent ${calls.download} more download(s)`);
        if (!result.from_cache) throw new Error("not served from cache");
      });

      check("another upload of the same film is not downloaded either", async () => {
        // This is the case that keying on file_id alone would miss: the same
        // film is on OpenSubtitles many times over, and a search that ranked
        // file 22 first would otherwise spend a download on a subtitle we
        // effectively already hold.
        const owned = await cache.findForTitle("32430579", ["en"]);
        if (!owned) throw new Error("the held subtitle was not found by title");
        if (owned.file_id !== 11) throw new Error(`found ${owned.file_id}`);

        // A fresh search - the year makes a different cache key - so this
        // exercises the live ranking rather than a replayed envelope.
        const found = await provider.search({ query: "Crime 101", year: 2025, languages: ["en"] });
        if (!found.reusing_cached) throw new Error("the search did not prefer what is held");
        if (found.results[0].file_id !== 11)
          throw new Error(`ranked ${found.results[0].file_id} first`);
      });

      /* A search envelope is kept for six hours because searching upstream is
       * slow, not because its answer is timeless. Which results are held, and
       * the reordering that floats a held one to the top, are facts about the
       * download cache rather than about the search - so they are re-derived on
       * every reply, including a replayed one.
       *
       * Left frozen in the envelope they went stale immediately, and the cost
       * was the thing the cache exists to prevent: auto-attach taking a
       * different upload of a film already on disk. */
      check("a replayed search knows about a download made since", async () => {
        // This exact search was cached earlier, before anything was downloaded.
        const replay = await provider.search({ title: "Prime Video: Crime 101", languages: ["en"] });
        if (!replay.from_cache) throw new Error("expected a replay, not a fresh search");
        if (!replay.reusing_cached) throw new Error("the replay did not notice the download");
        if (replay.results[0].file_id !== 11)
          throw new Error(`ranked ${replay.results[0].file_id} first`);
        const flags = Object.fromEntries(replay.results.map((r) => [r.file_id, r.cached]));
        if (flags[11] !== true || flags[22] !== false)
          throw new Error(`stale cached flags: ${JSON.stringify(flags)}`);
      });

      check("a replayed search forgets a promotion that no longer applies", async () => {
        // Deleting a subtitle is a normal thing to do; the envelope must not
        // keep advertising it.
        const db = await new Promise((ok) => {
          const request = indexedDB.open("sso-subtitles");
          request.onsuccess = () => ok(request.result);
        });
        await new Promise((ok) => {
          const tx = db.transaction("subtitles", "readwrite");
          tx.objectStore("subtitles").delete(11);
          tx.oncomplete = ok;
        });
        db.close();

        const replay = await provider.search({ title: "Prime Video: Crime 101", languages: ["en"] });
        if (replay.reusing_cached) throw new Error("a stale promotion survived");
        if (replay.results.some((r) => r.cached)) throw new Error("stale cached flag survived");

        // Put it back so the sync cases downstream still have something to move.
        await provider.fetchSubtitle(11, { imdb_id: "32430579", language: "en" });
      });

      check("a fetch never spends a download on a held file", async () => {
        reset();
        const result = await provider.fetchSubtitle(11, { imdb_id: "32430579" });
        if (calls.download !== 0) throw new Error("a download was spent on a held file");
        if (!result.from_cache) throw new Error("not served from the store");
      });

      check("a search is answered from cache the second time", async () => {
        reset();
        await provider.search({ title: "Crime 101", query: "Crime 101", languages: ["en"] });
        if (calls.subtitles !== 0) throw new Error("searched upstream again");
      });

      check("with the daemon running, it answers instead", async () => {
        await setDaemon(true);
        reset();
        const found = await provider.search({ title: "Crime 101", languages: ["en"] });
        if (found.served_by !== "daemon") throw new Error(`served by ${found.served_by}`);
        if (!calls.daemonSearch) throw new Error("the daemon was not asked");
      });

      /* Ports collide, and this one is on the reader's own machine. The
       * probe asked "did something answer" rather than "did the daemon
       * answer", so a dev server left running there was taken for the daemon:
       * every search went to it, came back as nothing, and the extension's own
       * search - which works, and is the ordinary path now - never ran. It
       * reads as "no subtitles for anything" with no way to tell why. */
      check("something else answering on the daemon's port is not the daemon", async () => {
        foreignOnPort = true;
        await setDaemon(true);
        reset();
        const found = await provider.search({ title: "Crime 101", languages: ["en"] });
        foreignOnPort = false;
        await setDaemon(false);
        if (found.served_by !== "extension")
          throw new Error(`a dev server on the port was taken for the daemon: ${found.served_by}`);
        if (!found.results?.length)
          throw new Error("the extension's own search never ran");
      });

      /* ...and the reader is told which of the two it is.
       *
       * Observed over two days: a static file server from another project held
       * the port and answered every request with its own page. Nothing failed,
       * because the case above means the extension quietly does the work
       * itself - so the only symptom was that word meanings arrived late and
       * knew nothing about the line they were said in, and the settings page
       * said "the daemon is not running". That is true, and it sends the
       * reader to run.sh, which then fails with the port already in use. */
      check("a stranger on the port is reported as that, not as a stopped daemon", async () => {
        foreignOnPort = true;
        await setDaemon(true);
        const blocked = await provider.status();
        foreignOnPort = false;
        await setDaemon(false);
        if (blocked.daemon_running !== false)
          throw new Error("a dev server on the port was reported as the daemon running");
        if (!/listening/i.test(blocked.daemon_blocked || ""))
          throw new Error(`nothing said what was wrong: ${JSON.stringify(blocked.daemon_blocked)}`);
      });

      // A port with nothing on it gets the ordinary advice, because starting
      // the daemon really is the answer to that one.
      check("an empty port is left to the ordinary advice", async () => {
        await setDaemon(false);
        const quiet = await provider.status();
        if (quiet.daemon_running !== false) throw new Error("no daemon, yet reported running");
        if (quiet.daemon_blocked)
          throw new Error(`said something was on the port: ${quiet.daemon_blocked}`);
      });

      check("an error from the daemon is not retried locally", async () => {
        /* An error is an answer. Retrying it here would spend a download to
         * arrive at the same one, and quota is the scarce thing. */
        await setDaemon(true);
        daemonFails = "daily download limit reached";
        reset();
        const found = await provider.search({ title: "Something Else", languages: ["en"] });
        daemonFails = null;
        if (!found.error) throw new Error("the error was swallowed");
        if (calls.features || calls.subtitles)
          throw new Error("the extension searched upstream anyway");
      });

      check("what the extension downloaded is pushed to the daemon", async () => {
        // Without this the daemon would later spend a second download on a file
        // the extension already holds.
        await setDaemon(true);
        daemonCache.clear();
        reset();
        const moved = await provider.syncNow();
        if (!calls.imported.includes(11)) throw new Error("file 11 was never sent");
        if (moved.pushed < 1) throw new Error(`pushed ${moved.pushed}`);
        const sent = daemonCache.get(11);
        if (!sent?.meta?.imdb_id) throw new Error("pushed without the title context");
      });

      check("what the daemon holds is pulled back", async () => {
        await setDaemon(true);
        daemonCache.set(77, {
          file_id: 77,
          content: base64(SRT),
          meta: { imdb_id: "tt777", language: "en", movie_name: "Elsewhere" },
        });
        const moved = await provider.syncNow();
        if (moved.pulled < 1) throw new Error(`pulled ${moved.pulled}`);
        const held = await cache.getSubtitle(77);
        if (!held) throw new Error("file 77 is not in the extension's cache");
        if (new TextDecoder().decode(held.bytes) !== SRT)
          throw new Error("the bytes did not survive the copy");
      });

      check("a pulled subtitle is then usable with the daemon stopped", async () => {
        await setDaemon(false);
        reset();
        const result = await provider.fetchSubtitle(77, {});
        if (result.error) throw new Error(result.error);
        if (calls.download !== 0) throw new Error("it was downloaded again");
        if (result.cues.length !== 2) throw new Error(`${result.cues.length} cues`);
      });

      check("the sha256 matches on both sides of the copy", async () => {
        // The daemon keys duplicate detection on this digest, so a copy that
        // re-encoded the text would break it silently.
        const held = await cache.getSubtitle(77);
        const expected = await cache.sha256Hex(new TextEncoder().encode(SRT));
        if (held.meta.sha256 !== expected)
          throw new Error(`${held.meta.sha256} vs ${expected}`);
      });

      check("without an API key the extension says so rather than failing", async () => {
        await setDaemon(false);
        await provider.updateSettings({ apiKey: "" });
        const found = await provider.search({ title: "Anything At All", languages: ["en"] });
        await provider.updateSettings({ apiKey: "test-key" });
        if (!found.needs_api_key) throw new Error("no needs_api_key flag");
        if (!/API key/i.test(found.error)) throw new Error(`unhelpful: ${found.error}`);
      });

      /* Managing what has been downloaded. The load-bearing case is the one
       * where a deletion has to survive a sync: the two stores copy anything
       * the other is missing, so a naive delete on one side is undone by the
       * next convergence - the button appears to work and quietly reverses
       * itself minutes later. */
      check("the cache lists what is held, with sizes and dates", async () => {
        await setDaemon(false);
        const { entries } = await provider.cacheEntries();
        if (!entries.length) throw new Error("nothing listed");
        const one = entries[0];
        if (!one.bytes) throw new Error("no size");
        if (!one.cached_at) throw new Error("no download date");
        if (!one.held_by.includes("extension")) throw new Error("held_by is wrong");
      });

      check("entries held on both sides are listed once, not twice", async () => {
        await setDaemon(true);
        await provider.syncNow();
        const { entries } = await provider.cacheEntries();
        const ids = entries.map((entry) => entry.file_id);
        if (new Set(ids).size !== ids.length) throw new Error(`duplicated: ${ids}`);
        const shared = entries.find((entry) => entry.held_by.length === 2);
        if (!shared) throw new Error("nothing reported as held by both");
      });

      check("deleting with the daemon running removes it from both", async () => {
        await setDaemon(true);
        reset();
        const result = await provider.cacheDelete(77);
        if (!result.everywhere) throw new Error("did not reach the daemon");
        if (!calls.forgotten.includes(77)) throw new Error("the daemon was not told");
        if (await cache.getSubtitle(77)) throw new Error("still held here");
        if (daemonCache.has(77)) throw new Error("still held by the daemon");
      });

      check("deleting with the daemon stopped does not undo itself", async () => {
        // Delete while it is stopped, then start it and sync. Without the
        // pending-deletion record the sync would see the daemon still holding
        // the file, decide this side was missing it, and copy it back.
        await setDaemon(true);
        await provider.syncNow();
        if (!daemonCache.has(11)) throw new Error("setup: the daemon should hold 11");

        await setDaemon(false);
        const result = await provider.cacheDelete(11);
        if (result.everywhere) throw new Error("claimed to reach a stopped daemon");
        if (await cache.getSubtitle(11)) throw new Error("still held here");

        // Starting the daemon is enough - the queued deletion is applied on
        // reconnect, before anything else in the convergence, so there is no
        // window in which the file could be copied back.
        reset();
        await setDaemon(true);
        await provider.syncNow();
        if (!calls.forgotten.includes(11)) throw new Error("the daemon was never told");
        if (daemonCache.has(11)) throw new Error("the daemon still holds it");
        if (await cache.getSubtitle(11)) throw new Error("it came back on the sync");
      });

      check("forgetting searches keeps the downloads", async () => {
        await setDaemon(false);
        await provider.fetchSubtitle(11, { imdb_id: "32430579", language: "en" });
        await provider.search({ query: "Crime 101", year: 2025, languages: ["en"] });

        const result = await provider.cacheClear({ searchesOnly: true });
        if (!result.searches) throw new Error("no searches were forgotten");
        if (result.subtitles) throw new Error("it deleted downloads too");
        if (!(await cache.getSubtitle(11))) throw new Error("a download was lost");

        reset();
        await provider.search({ query: "Crime 101", year: 2025, languages: ["en"] });
        if (!calls.subtitles) throw new Error("the search was still replayed from cache");
      });

      check("deleting everything empties both stores", async () => {
        await setDaemon(true);
        await provider.syncNow();
        const result = await provider.cacheClear();
        if (!result.everywhere) throw new Error("did not reach the daemon");
        const { entries } = await provider.cacheEntries();
        if (entries.length) throw new Error(`${entries.length} left`);
        if (daemonCache.size) throw new Error("the daemon still holds some");
      });

      // --- run ------------------------------------------------------------
      // An error nobody caught is a failure even when every assertion holds.
      const loose = [];
      window.addEventListener("error", (e) => loose.push(e.message));
      window.addEventListener("unhandledrejection", (e) => loose.push(String(e.reason?.message ?? e.reason)));

      const out = document.getElementById("results");
      let passed = 0;
      for (const { name, fn } of cases) {
        const row = document.createElement("div");
        row.className = "case";
        try {
          await fn();
          row.classList.add("pass");
          row.textContent = name;
          passed++;
        } catch (err) {
          row.classList.add("fail");
          row.textContent = name;
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = err.message;
          row.append(why);
        }
        out.append(row);
      }
      for (const message of [...new Set(loose)]) {
        const row = document.createElement("div");
        row.className = "case fail";
        row.textContent = "nothing caught this error";
        const why = document.createElement("div");
        why.className = "why";
        why.textContent = message;
        row.append(why);
        out.append(row);
      }

      const total = cases.length + new Set(loose).size;
      const summary = document.getElementById("summary");
      summary.textContent = `${passed}/${total} passed`;
      summary.style.color = passed === total ? "#59c27f" : "#e8705f";
      window.__harness = { passed, total, loose: [...new Set(loose)] };
    </script>
  </body>
</html>
