        await sleep(120);
        window.__ssoApi.toTopLayer(hostFor(".sso-root"));
        await sleep(60);

        for (const [what, sel] of [["the overlay", ".sso-root"], ["the toast", ".sso-toast"]]) {
          const node = hostFor(sel);
          if (!node) throw new Error(`${what} has no host`);
          if (!node.matches(":popover-open"))
            throw new Error(`${what} is not in the top layer`);
        }
      });

      check("the panel stays over the focus box when a pointer move re-raises them", async () => {
        /* Two surfaces in the top layer, and the top layer paints in the order
         * its entries were shown in - so the last one re-shown is in front,
         * whatever either z-index says.
         *
         * Both are re-shown on every raise, and a raise happens on every
         * pointer move over the film. Measured with the panel dragged onto the
         * focus box, elementsFromPoint at the box's centre: the panel answered
         * while nothing had moved and the focus box answered from the first
         * pointer move onwards. So the panel covered the box until the mouse
         * moved and then lost the overlap to it, which is the opposite of what
         * study.js promises about a panel being opened on purpose.
         *
         * The check is the overlap itself rather than the call order, because
         * the order is only the mechanism: what a reader sees is which of the
         * two is in front after the mouse has moved. */
        const hostFor = (sel) =>
          [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));
        const study = window.__ssoStudy;
        const studyWas = study.settings().enabled;
        const panelWas = window.__ssoPanel.isOpen();
        /* Read after show(), because the panel builds its host there - taken
         * before, this was null on the run where the panel had never been
         * opened, nothing was put back, and the displaced panel then covered
         * the focus box for every case after this one. */
        let bar = null;
        let written = null;

        try {
          await study.setEnabled(true);
          await window.__ssoPanel.show();
          await sleep(250);
          const box = hostFor(".sso-focus");
          bar = hostFor(".sso-panel");
          if (!box) throw new Error("study is on and there is no focus box to be covered");
          if (!bar) throw new Error("the panel is open and has no host");
          written = bar.getAttribute("style");

          // Onto the box, so there is something to be in front of.
          const target = box.getBoundingClientRect();
          bar.style.setProperty("left", `${Math.max(0, target.left - 30)}px`, "important");
          bar.style.setProperty("top", `${Math.max(0, target.top - 30)}px`, "important");
          bar.style.setProperty("right", "auto", "important");

          const front = () => {
            const b = box.getBoundingClientRect();
            const p = bar.getBoundingClientRect();
            const x = Math.min(b.left + b.width / 2, p.right - 6);
            const y = Math.min(b.top + b.height / 2, p.bottom - 6);
            const first = document.elementsFromPoint(x, y)[0];
            return first === bar ? "panel" : first === box ? "focus box" : "neither";
          };
          if (front() !== "panel")
            throw new Error(`the panel does not cover the focus box it was opened over - ${front()} is in front`);

          // What a mouse over the film does: content.js re-raises every surface.
          for (let move = 0; move < 3; move += 1) {
            document.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 40 + move, clientY: 40 }));
            await sleep(300); // past the 250ms raise throttle, so each one counts
          }
          if (front() !== "panel")
            throw new Error(`after a pointer move the ${front()} is in front of the panel`);
        } finally {
          if (bar && written !== null) bar.setAttribute("style", written);
          if (!panelWas) window.__ssoPanel.hide();
          await study.setEnabled(studyWas);
          await sleep(200);
        }
      });

      check("a surface that has not moved is not measured again", async () => {
        /* What a freeze is actually made of, and it is not script time.
         *
         * content.js keeps every surface in the right parent by calling
         * attachToCorrectParent, from tick() twenty times a second and again
         * from every pointer event. Each call reached panel.reparent and
         * study.reparent, and each of those ended in rescale - which removes a
         * transform and then reads getBoundingClientRect. A write followed by a
         * read is a forced layout, and the browser does that work whether or
         * not any script is slow, so a CPU profile shows nothing.
         *
         * Measured on the nested-player vehicle with two subtitles attached and
         * the panel open: 11.4 layouts a second with the mouse still against
         * 0.8 with the panel shut, and 19.9 with the mouse moving. A hand
         * raises pointermove AND mousemove about 120 times a second each.
         *
         * So the assertion is about the RATIO, not a wall-clock number: sixty
         * pointer events must not each buy a measurement. One or two are fine -
         * something genuinely settling - and sixty means it is back on the
         * per-event path. */
        await window.__ssoPanel.show();
        await sleep(200);
        const host = panelShadow().host;
        const real = Element.prototype.getBoundingClientRect;
        let measured = 0;
        Element.prototype.getBoundingClientRect = function (...args) {
          if (this === host) measured += 1;
          return real.apply(this, args);
        };
        try {
          // Settle first: the first event after the panel opens is allowed to
          // arrange things, and counting that one would test nothing.
          document.dispatchEvent(new PointerEvent("pointermove",
            { bubbles: true, clientX: 300, clientY: 300 }));
          await sleep(60);
          measured = 0;
          for (let i = 0; i < 60; i++) {
            document.dispatchEvent(new PointerEvent("pointermove",
              { bubbles: true, clientX: 300 + (i % 5), clientY: 300 + (i % 3) }));
          }
          await sleep(40);
          if (measured > 6)
            throw new Error(`60 pointer events measured the panel ${measured} times`);
        } finally {
          Element.prototype.getBoundingClientRect = real;
        }
      });

      check("a surface that HAS moved is measured again", async () => {
        /* The other half, and the reason the case above cannot simply delete
         * the measurement. rescale is what counter-scales the panel inside a
         * container the player has scaled - without it the panel renders half
         * again as large in fullscreen - so "measure only when placement
         * changed" has to actually measure when it changed. */
        await window.__ssoPanel.show();
        await sleep(200);
        const host = panelShadow().host;
        const real = Element.prototype.getBoundingClientRect;
        let measured = 0;
        Element.prototype.getBoundingClientRect = function (...args) {
          if (this === host) measured += 1;
          return real.apply(this, args);
        };
        try {
          // Somewhere else to be: a parent that is not the top layer, which is
          // the move a fullscreen session makes.
          const holder = document.createElement("div");
          document.body.appendChild(holder);
          try {
            /* No await between the two calls, on purpose. rescale runs inside
             * reparent, so there is nothing to wait for - and tick() puts the
             * panel back in the top layer every 50ms, which would settle the
             * second move before this case got to make it. Awaiting here
             * failed exactly that way. */
            measured = 0;
            window.__ssoPanel.reparent(holder);
            if (measured === 0) throw new Error("moved into a new parent and never measured");
            measured = 0;
            window.__ssoPanel.reparent(null);
            if (measured === 0) throw new Error("moved back out and never measured");
          } finally {
            holder.remove();
            window.__ssoPanel.reparent(null);
          }
        } finally {
          Element.prototype.getBoundingClientRect = real;
        }
      });

      check("the next episode is noticed without a page load", async () => {
        /* Streaming sites are single pages: the next episode swaps the stream
         * and leaves the tab, the frame and the <video> element where they
         * were. Nothing else in the extension would ever hear about it.
         *
         * What is asserted is the report, not the attach - the worker's half is
         * not loaded in this page. Three rules, and the last two are the ones
         * worth having: it settles before speaking, it says nothing at all
         * while an ad is playing, and it speaks once per programme however many
         * times the tick runs. */
        const video = document.getElementById("v");
        const wasTitle = document.title;
        const wasDuration = video.duration;
        const setDuration = (seconds) =>
          Object.defineProperty(video, "duration", { get: () => seconds, configurable: true });

        try {
          window.__sent.length = 0;
          document.title = "Harness — S01E04";
          setDuration(2400);
          await sleep(400);
          const early = window.__sent.filter((m) => m.type === "sso:programme").length;
          if (early !== 0) throw new Error("it spoke before the player had settled");

          await sleep(1800);
          const said = window.__sent.filter((m) => m.type === "sso:programme");
          if (said.length !== 1)
            throw new Error(`reported ${said.length} times for one episode`);
          if (!said[0].mark.includes("S01E04") || !said[0].mark.startsWith("2400"))
            throw new Error(`reported the wrong programme: ${said[0].mark}`);

          // The tick keeps running; the same programme must not be reported again.
          await sleep(1200);
          if (window.__sent.filter((m) => m.type === "sso:programme").length !== 1)
            throw new Error("it kept reporting the same episode");

          /* An unread count in front of the title is not a new episode. Several
           * players write one, and a title is half the mark. */
          document.title = `(2) ${wasTitle === document.title ? document.title : "Harness — S01E04"}`;
          await sleep(2000);
          if (window.__sent.filter((m) => m.type === "sso:programme").length !== 1)
            throw new Error("a notification count was read as a new episode");

          /* An advert is not a new programme, and on the players that swap the
           * element for one it is exactly what this would otherwise fire on. */
          window.__sent.length = 0;
          const slot = document.getElementById("ad-slot");
          slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
            'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
          await sleep(600);
          document.title = "Harness — S01E05";
          setDuration(2401);
          await sleep(2000);
          const duringAd = window.__sent.filter((m) => m.type === "sso:programme").length;
          slot.innerHTML = "";
          if (duringAd !== 0) throw new Error("an ad break was reported as a new episode");
        } finally {
          document.title = wasTitle;
          setDuration(wasDuration);
          document.getElementById("ad-slot").innerHTML = "";
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      /* The same, on a player that moves nothing in the URL - the local
       * catalogue app swaps the stream and announces what it is playing. The
       * programme mark is the signal, the one that takes the last episode's
       * subtitles off. */
      check("a page's own list is dropped when the programme changes and the URL does not", async () => {
        const own = () => window.__ssoApi.status().own;
        const video = document.getElementById("v");
        const say = (fields) =>
          (video.dataset.ssoNowPlaying = JSON.stringify({ v: 1, kind: "movie", year: 2019, ...fields }));
        try {
          // A programme, announced, and the page's list for it.
          say({ title: "Film One", imdb: "tt7770101" });
          await sleep(300);
          window.postMessage({
            source: "sso-ear", type: "tracks", titleId: "F1", shape: ["mpd"],
            tracks: [{ language: "tr", url: "https://cdn.example/f1.mpd?token=SECRET", type: "", displayName: "Türkçe", format: "dash", forced: false, keys: [], dash: { representation: "t", adaptation: "0" } }],
          }, "*");
          for (let i = 0; i < 40 && own()?.titleId !== "F1"; i++) await sleep(25);
          if (own()?.titleId !== "F1") throw new Error("the list did not arrive");

          // The stream is swapped under the same URL.
          const seen = await tracing(async () => {
            say({ title: "Film Two", imdb: "tt7770102" });
            // Gone; what an ear answers the re-ask with for THIS page may
            // take its place, and that is the same-page rule, not a leak.
            for (let i = 0; i < 120 && own()?.titleId === "F1"; i++) await sleep(25);
            if (own()?.titleId === "F1") throw new Error(`still offering ${JSON.stringify(own())} on the next film`);
            await sleep(50);
          });
          const dropped = seen.find((a) => a.kind === "pageSubtitles" && a.detail?.dropped);
          if (dropped?.detail.dropped !== "programme" || dropped.detail.titleId !== "F1") throw new Error(`drop in the log: ${JSON.stringify(seen.map((a) => [a.kind, a.detail?.dropped]))}`);
        } finally {
          delete video.dataset.ssoNowPlaying;
          window.postMessage({ source: "sso-ear", type: "tracks", titleId: "none", shape: [], tracks: [] }, "*");
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a page that says what it is playing is not waited for", async () => {
        /* The check above is the same episode change on a page that states
         * nothing: it has to settle for 1.5s first, and it restarts that wait
         * every time any of the signals it reads moves again. On the local
         * catalogue app the tab title moved ten seconds after the metadata did.
         *
         * `data-sso-now-playing` removes the wait rather than shortening it,
         * and that is what is asserted here - not "faster", but reported before
         * the settle window could possibly have elapsed. Nothing else may join
         * in either: the title is the signal that lags, so a title change on
         * its own must not be a new episode once the page is announcing. */
        const video = document.getElementById("v");
        const wasTitle = document.title;
        const say = (fields) =>
          (video.dataset.ssoNowPlaying = JSON.stringify({
            v: 1,
            kind: "episode",
            title: "The Americans",
            year: 2013,
            season: 3,
            episode: 9,
            imdb: "tt4331672",
            durationSeconds: 2701.44,
            ...fields,
          }));

        try {
          window.__sent.length = 0;
          say({});
          await sleep(300);
          const quick = window.__sent.filter((m) => m.type === "sso:programme");
          if (quick.length !== 1)
            throw new Error(`reported ${quick.length} times inside the settle window`);
          if (!quick[0].mark.startsWith("sso:1|episode|tt4331672|The Americans"))
            throw new Error(`the mark was not the announcement: ${quick[0].mark}`);

          /* The tab title is half the mark on a page that states nothing, and
           * none of it on a page that announces. */
          document.title = "Harness — something else entirely";
          await sleep(2000);
          if (window.__sent.filter((m) => m.type === "sso:programme").length !== 1)
            throw new Error("the tab title was read as a new episode");

          window.__sent.length = 0;
          say({ episode: 10 });
          await sleep(300);
          const next = window.__sent.filter((m) => m.type === "sso:programme");
          if (next.length !== 1 || !next[0].mark.endsWith("S3E10"))
            throw new Error(`the next episode was not noticed: ${JSON.stringify(next)}`);

          /* A version this build does not know is not read field by field. It
           * falls back to the guessing, which still needs its settle - so the
           * absence of a report inside the window IS the assertion. */
          window.__sent.length = 0;
          say({ v: 99, episode: 11 });
          await sleep(300);
          if (window.__sent.some((m) => m.type === "sso:programme"))
            throw new Error("an announcement from an unknown version was acted on");

          /* And neither is one that names a season without an episode, which
           * would search a whole series. */
          window.__sent.length = 0;
          say({ episode: null });
          await sleep(300);
          if (window.__sent.some((m) => m.type === "sso:programme"))
            throw new Error("a season with no episode was accepted as an announcement");
        } finally {
          delete video.dataset.ssoNowPlaying;
          document.title = wasTitle;
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      /* The worker does not search for a programme under ten minutes by
       * itself (a trailer, a preview), and judges that on `seconds` in the
       * status the frame sends with the programme. Measured on the catalogue
       * app 2026-09-14: the programme was announced the moment a minute of
       * the stream had arrived, the element said 65, and a two-hour film was
       * judged short. So the length sent is the page's stated one first, the
       * element's own only while it has never grown - and a programme told
       * on a short length is told AGAIN, once, when that length grows past
       * the bar or stops being believable. */
      check("a programme told as short is told again when its length turns out to be growing", async () => {
        const video = document.getElementById("v");
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        /* Whether the element's length was already distrusted when this
         * started. Cases before this one grew it, cases after this one lean
         * on that (a stated length only counts once the element's has grown),
         * and a new resource forgets it - so it is put back at the end. */
        const wasDistrusted = window.__ssoApi.status().seconds === null;
        let arrived = 95;
        Object.defineProperty(video, "duration", { get: () => arrived, configurable: true });
        video.dispatchEvent(new Event("loadstart"));
        const announce = () =>
          (video.dataset.ssoNowPlaying = JSON.stringify({ v: 1, kind: "movie", title: "Still Arriving", year: 2020, imdb: "tt0000095" }));
        const told = () => window.__sent.filter((m) => m.type === "sso:programme" && /tt0000095/.test(m.mark));
        try {
          await sleep(600);
          window.__sent.length = 0;
          announce();
          for (let i = 0; i < 40 && told().length < 1; i++) await sleep(50);
          if (told().length !== 1 || told()[0].again) throw new Error(`told ${JSON.stringify(told())}`);
          const status = window.__ssoApi.status();
          if (status.seconds !== 95) throw new Error(`the status says ${status.seconds}s for a 95s element that has never grown`);

          // Then the length steps, the way a stream produced as it is sent does.
          arrived = 98.3;
          for (let i = 0; i < 60 && told().length < 2; i++) await sleep(50);
          if (told().length !== 2 || told()[1].again !== "grew") throw new Error(`after the growth: ${JSON.stringify(told())}`);
          if (window.__ssoApi.status().seconds !== null) throw new Error(`a grown length is still believed: ${window.__ssoApi.status().seconds}`);
          // Once. Another step is not another programme.
          arrived = 101.6;
          await sleep(1200);
          if (told().length !== 2) throw new Error(`told ${told().length} times`);

          // A page that STATES its length is never short on what has arrived.
          delete video.dataset.ssoNowPlaying;
          await sleep(300);
          arrived = 95;
          video.dispatchEvent(new Event("loadstart"));
          await sleep(600);
          video.dataset.ssoNowPlaying = JSON.stringify({ v: 1, kind: "movie", title: "Stated", year: 2020, imdb: "tt0000096", durationSeconds: 5400 });
          for (let i = 0; i < 40 && window.__ssoApi.status().seconds !== 5400; i++) await sleep(50);
          if (window.__ssoApi.status().seconds !== 5400) throw new Error(`the stated length lost to the element's: ${window.__ssoApi.status().seconds}`);
        } finally {
          delete video.dataset.ssoNowPlaying;
          Object.defineProperty(video, "duration", wasDuration);
          video.dispatchEvent(new Event("loadstart"));
          await sleep(600);
          if (wasDistrusted) {
            const settled = video.duration;
            Object.defineProperty(video, "duration", { get: () => settled + 3.3, configurable: true });
            await sleep(600);
            Object.defineProperty(video, "duration", wasDuration);
          }
          await sleep(1200);
          window.__sent.length = 0;
        }
      });

      check("what comes next is said as well, and is not what is playing", async () => {
        /* The app knows the next episode before anybody asks for it, and an
         * episode switch spends 10 to 37 seconds finding subtitles - measured
         * over the twelve switches in the running log since the announcement
         * landed, median about 18, of which a typical one is 3s of search, 3s
         * and 6s of downloading and 4s of lining up. All but the last is
         * spendable while the current episode is still running.
         *
         * Two depths, because the two halves are metered differently: a search
         * is free and goes out at once, a download is five a day and waits for
         * the middle of the current film. And `upNext` is emphatically NOT part
         * of the identity - a page that changes only what is next has not
         * changed what is playing, and reading it as a change would take the
         * subtitles off mid-episode. */
        const video = document.getElementById("v");
        const wasTime = video.currentTime;
        const say = (fields) =>
          (video.dataset.ssoNowPlaying = JSON.stringify({
            v: 1,
            kind: "episode",
            title: "Harness Show",
            year: 2013,
            season: 5,
            episode: 11,
            imdb: "tt7770011",
            durationSeconds: 2700,
            ...fields,
          }));
        const NEXT = {
          kind: "episode", title: "Harness Show", year: 2013,
          season: 5, episode: 12, imdb: "tt7770012",
        };
        const warms = () => window.__sent.filter((m) => m.type === "sso:warmNext");

        try {
          video.currentTime = 5;
          window.__sent.length = 0;
          say({ upNext: NEXT });
          await sleep(300);
          const early = warms();
          if (early.length !== 1)
            throw new Error(`the next episode was named ${early.length} times, want once`);
          if (early[0].committed)
            throw new Error("five seconds in was treated as the reader having committed");
          if (early[0].next?.episode !== 12 || early[0].next?.imdb !== "tt7770012")
            throw new Error(`what was warmed is not the next episode: ${JSON.stringify(early[0].next)}`);

          /* Past the middle of the film - stated as 2700s, so 1500 is past it -
           * the same episode is worth downloading rather than only searching
           * for. One more message, not a stream of them. */
          window.__sent.length = 0;
          video.currentTime = 1500;
          await sleep(400);
          const committed = warms();
          if (committed.length !== 1 || !committed[0].committed)
            throw new Error(`past the middle sent ${JSON.stringify(committed)}`);
          if (window.__sent.some((m) => m.type === "sso:programme"))
            throw new Error("moving the playhead was read as a new episode");

          /* A new answer about what is next is not a new answer about what is
           * playing. */
          window.__sent.length = 0;
          say({ upNext: { ...NEXT, episode: 13, imdb: "tt7770013" } });
          await sleep(300);
          if (window.__sent.some((m) => m.type === "sso:programme"))
            throw new Error("a different next episode was read as a new programme");
          if (warms().length !== 1)
            throw new Error("the new next episode was not warmed");

          /* And a malformed one costs the prefetch and nothing else: a season
           * with no episode would search a whole series, so it is refused by
           * the same rule that refuses it at the top level. */
          window.__sent.length = 0;
          say({ upNext: { ...NEXT, episode: null } });
          await sleep(300);
          if (warms().length !== 0)
            throw new Error(`a season with no episode was warmed: ${JSON.stringify(warms())}`);
          if (!window.__ssoApi.status().attached && !video.dataset.ssoNowPlaying)
            throw new Error("the announcement itself was lost with it");
        } finally {
          delete video.dataset.ssoNowPlaying;
          video.currentTime = wasTime;
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("the find screen stops being about the last episode", async () => {
        /* Reported as "I have clicked the next episode button ... but the
         * subtitle tool still finds the previous title and searches for it".
         *
         * The box was filled with the page's title once, while it was empty,
         * and kept that value for the rest of the session; the results under it
         * kept whatever the last search returned. So the episode after the one
         * you searched for opened a screen naming the previous film, searched
         * for it when pressed, and offered the previous film's files. Seen in
         * the log at 21:06 on 2026-08-23: S03E12's two subtitles attached by
         * hand to S03E13, and taken off again two minutes later. */
        const shadow = panelShadow();
        const wasTitle = document.title;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const setDuration = (seconds) =>
          Object.defineProperty(video, "duration", { get: () => seconds, configurable: true });
        let onNow = "Harness — S05E01";
        window.__stubDaemon = { pageContext: () => ({ title: onNow }) };
        try {
          video.dispatchEvent(new Event("loadstart"));
          document.title = onNow;
          setDuration(3100);
          await sleep(2200);          // long enough for the mark to settle

          // Opened the way a reader opens it, so the box is filled the way a
          // reader's box is filled.
          window.__ssoPanel.hide();
          await window.__ssoPanel.show();
          await sleep(300);
          const find = [...shadow.querySelectorAll(".sso-screen")]
            .find((node) => node.querySelector(".sso-find__for"));
          const box = find.querySelector('input[type="text"]');
          if (box.value !== onNow) throw new Error(`the box opened saying "${box.value}"`);

          [...shadow.querySelectorAll("button")].find((b) => b.textContent === "Search").click();
          await sleep(200);
          if (!shadow.querySelector(".sso-result"))
            throw new Error("the search returned nothing to go stale");

          // The next episode, without a page load, which is how they all start.
          onNow = "Harness — S05E02";
          document.title = onNow;
          /* Shorter, not longer. A length that GROWS is how a stream still
           * arriving looks, and a page that has one and states no length of its
           * own reports no length at all - so a longer next episode would be
           * testing that rule rather than this one. */
          setDuration(2600);
          await sleep(2600);

          if (shadow.querySelector(".sso-result"))
            throw new Error("the last episode's results are still there to be attached");
          if (box.value !== onNow)
            throw new Error(`the box still says "${box.value}"`);
        } finally {
          window.__stubDaemon = null;
          document.title = wasTitle;
          Object.defineProperty(video, "duration", wasDuration);
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a length that dips mid-film is not the next episode", async () => {
        /* Every jump on a player that cannot seek is a new resource on the
         * element, and for the moment before enough of it has arrived
         * `duration` is a few seconds. Read straight into the mark, each of
         * those is a different programme - and each one took both subtitles off
         * and searched again. Measured from the extension's own log on
         * 2026-08-23: 2701, 146, 2701, 530, 2701, 113, 2701, 111, 2701 over one
         * evening on one episode, with two of the searches coming back empty.
         * Reported as "my subtitles are gone again in the middle of the movie".
         *
         * A film's length does not shrink while it plays, so the mark keeps the
         * longest it has been told about until the title changes or the film
         * goes back to its beginning. */
        const wasTitle = document.title;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const setDuration = (seconds) =>
          Object.defineProperty(video, "duration", { get: () => seconds, configurable: true });
        try {
          // A resource nothing has been learned about yet, so this starts from
          // the same place a page load does rather than from whatever the
          // cases above left on the element.
          video.dispatchEvent(new Event("loadstart"));
          document.title = "Harness — S02E01";
          setDuration(2700);
          /* Well past the beginning, which is the state this is about: a film
           * being watched, not one that has just started. The clock only gets
           * there through the offset - the harness's own clip is ten seconds
           * long - so the film measures 1400 + 2700 and the mark says 4100. */
          video.dataset.ssoTimeOffset = "1400";
          window.__sent.length = 0;
          await sleep(2200);
          const first = window.__sent.filter((m) => m.type === "sso:programme");
          if (first.length !== 1 || !first[0].mark.startsWith("4100"))
            throw new Error(`opened with ${JSON.stringify(first.map((m) => m.mark))}`);

          // The player re-opens the stream: eleven seconds of it have arrived.
          window.__sent.length = 0;
          setDuration(11);
          await sleep(2200);
          setDuration(2700);
          await sleep(2200);
          const said = window.__sent.filter((m) => m.type === "sso:programme");
          if (said.length !== 0)
            throw new Error(`a re-opened stream was reported as ${JSON.stringify(said.map((m) => m.mark))}`);
        } finally {
          document.title = wasTitle;
          Object.defineProperty(video, "duration", wasDuration);
          delete video.dataset.ssoTimeOffset;
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a stated episode is noticed before the stream has a length", async () => {
        /* The repair for "I switch to the next episode and it still finds the
         * previous title", and it is about WHEN rather than about what.
         *
         * The mark used to be the element's duration and the tab title, so it
         * could not be formed at all until a length was known. On a stream
         * produced as it is sent there is none for the first seconds of every
         * episode - `loadstart` clears what was learned about the last resource
         * and the element restarts at NaN - and an empty mark is read as "ask
         * again later", which holds the LAST episode's identity through exactly
         * the window in which the episode changed. Measured on the catalogue
         * app 2026-08-25: the tab title moved to the next episode between
         * 09:30:32 and 09:30:42 and the new subtitles went up at 09:30:47, with
         * the previous episode's lines over the new picture until then.
         *
         * A page that states what it is playing has answered this already, in
         * <head>, before a frame is decoded. */
        const wasTitle = document.title;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const script = document.createElement("script");
        script.type = "application/ld+json";
        const states = (episode, name) => {
          script.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "TVEpisode",
            name,
            url: `https://example.invalid/title/tt000000${episode}`,
            episodeNumber: episode,
            partOfSeason: { "@type": "TVSeason", seasonNumber: 4 },
            partOfSeries: { "@type": "TVSeries", name: "The Americans" },
          });
        };
        try {
          // No length at all, which is where the old mark gave up.
          Object.defineProperty(video, "duration", { get: () => NaN, configurable: true });
          states(2, "Pastor Tim");
          document.head.append(script);
          document.title = "Pastor Tim (2016) - Catalogue";
          window.__sent.length = 0;
          await sleep(2400);

          const first = window.__sent.filter((m) => m.type === "sso:programme");
          if (first.length !== 1)
            throw new Error(
              `a stated episode with no length was reported ${first.length} times`,
            );
          if (!first[0].mark.includes("S4E2") || !first[0].mark.includes("The Americans"))
            throw new Error(`reported the wrong programme: ${first[0].mark}`);

          /* The next episode, the way the app starts one: new metadata, new
           * title, and an element whose length is still unknown. */
          window.__sent.length = 0;
          states(3, "Experimental Prototype City of Tomorrow");
          document.title = "Experimental Prototype City of Tomorrow (2016) - Catalogue";
          await sleep(2400);
          const next = window.__sent.filter((m) => m.type === "sso:programme");
          if (next.length !== 1)
            throw new Error(`the next episode was reported ${next.length} times`);
          if (!next[0].mark.includes("S4E3"))
            throw new Error(`still about the last episode: ${next[0].mark}`);
        } finally {
          script.remove();
          document.title = wasTitle;
          Object.defineProperty(video, "duration", wasDuration);
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a stated episode does not move when the stream's length does", async () => {
        /* The other direction, and the reason the stated identity carries no
         * length of its own. The element's number climbs as the stream arrives
         * and drops back to a few seconds every time the player re-opens it:
         * 2701, 146, 2701, 530, 2701 over one evening on one episode. Each flip
         * used to be a different programme, and each one took both subtitles off
         * and searched again - "my subtitles are gone again in the middle of the
         * movie". A page that names what it is playing is believed through all
         * of it.
         *
         * This is the check that stops the fix above being "read the length
         * sooner", which would have made that report worse. */
        const wasTitle = document.title;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const setDuration = (seconds) =>
          Object.defineProperty(video, "duration", { get: () => seconds, configurable: true });
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "TVEpisode",
          name: "Pastor Tim",
          episodeNumber: 2,
          partOfSeason: { "@type": "TVSeason", seasonNumber: 4 },
          partOfSeries: { "@type": "TVSeries", name: "The Americans" },
        });
        try {
          setDuration(2701);
          document.head.append(script);
          document.title = "Pastor Tim (2016) - Catalogue";
          await sleep(2400);

          window.__sent.length = 0;
          for (const seconds of [146, 2701, 113]) {
            setDuration(seconds);
            await sleep(1900);
          }
          const said = window.__sent.filter((m) => m.type === "sso:programme");
          if (said.length !== 0)
            throw new Error(
              `a re-opening stream was reported as ${JSON.stringify(said.map((m) => m.mark))}`,
            );
        } finally {
          script.remove();
          document.title = wasTitle;
          Object.defineProperty(video, "duration", wasDuration);
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a page that states nothing is still keyed on its length", async () => {
        /* The fallback has to survive the fix. Most sites ship no usable
         * schema.org at all, and for those the duration and the tab title are
         * still the only two things that change when the programme does.
         *
         * Asserted on the SHAPE of the mark rather than on a report, because a
         * mark that quietly stopped carrying the length would leave every one of
         * those sites unable to tell two episodes apart, and nothing else here
         * would notice. */
        const wasTitle = document.title;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        try {
          video.dispatchEvent(new Event("loadstart"));
          Object.defineProperty(video, "duration", { get: () => 2400, configurable: true });
          document.title = "Harness - S09E01";
          window.__sent.length = 0;
          await sleep(2400);
          const said = window.__sent.filter((m) => m.type === "sso:programme");
          if (said.length !== 1) throw new Error(`reported ${said.length} times`);
          if (!said[0].mark.startsWith("2400|"))
            throw new Error(`a page stating nothing lost its length: ${said[0].mark}`);
        } finally {
          document.title = wasTitle;
          Object.defineProperty(video, "duration", wasDuration);
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a translation timed by somebody else still needs no click", async () => {
        /* The reason the pair is worth anything: the second subtitle is not a
         * copy of the first with a constant shift, it is a different person's
         * timing of the same speech. Most lines land within a few hundred
         * milliseconds, some are placed badly, some are missing altogether, and
         * the whole thing sits against a different release.
         *
         * Asserted end to end through attach, and on the number rather than on
         * "something happened": an alignment that fires and is a second out is
         * worse than one that does not fire, because the reader now believes it. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const starts = speech(900, 11);
        const reference = starts.map((start) => ({ start, end: start + 1800, text: "en" }));

        const SHIFT = 6500;
        let x = 424242;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const bell = () => (next() + next() + next() + next() - 2) * 0.7;
        const translated = starts
          .filter(() => next() > 0.08)                       // 8% of lines missing
          .map((start) => {
            const jitter = Math.round(bell() * 300);          // most within ~600ms
            const badly = next() < 0.06 ? Math.round((next() - 0.5) * 5000) : 0;
            return { start: start + SHIFT + jitter + badly, end: start + SHIFT + 1800, text: "tr" };
          });

        try {
          await api.attach({ cues: reference, label: "EN · reference", fileId: 6501, language: "en", slot: 0 });
          await sleep(150);
          await api.attach({ cues: translated, label: "TR · a different person's timing", fileId: 6502, language: "tr", slot: 1 });
          await sleep(250);

          const moved = api.status().tracks[1].offsetMs;
          if (moved === 0) throw new Error("the second subtitle was left where it was");
          /* The display offset is the negative of the gap between the files:
           * a subtitle whose lines sit 6.5s later has to be brought forward. */
          if (Math.abs(moved + SHIFT) > 120)
            throw new Error(`lined up ${moved}ms against a real gap of ${-SHIFT}ms`);
          if (api.status().tracks[0].offsetMs !== 0)
            throw new Error("it moved the first subtitle, which is the reference");
        } finally {
          for (const slot of [0, 1]) {
            if (wasAttached[slot]) {
              await api.attach({
                cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
                language: slot ? "tr" : "en", slot,
              });
            } else {
              api.detach(slot);
            }
          }
          api.updateSettings({ tracks: wasGeometry });
          await sleep(150);
        }
      });

      check("attaching a second subtitle lines it up on its own", async () => {
        /* End to end, through attach: the thing the reader actually does.
         *
         * Both slots are replaced, because this harness's own cue list is five
         * lines and the aligner declines to have an opinion below twelve - and
         * quite right. Everything is put back afterwards, geometry included:
         * attach() arranges two subtitles side by side the first time neither
         * has been placed by hand, and later cases assert on that. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const long = speech(600, 47).map((start) => ({ start, end: start + 1800, text: "line" }));
        const late = long.map((cue) => ({ start: cue.start + 8000, end: cue.end + 8000, text: cue.text }));
        await api.attach({ cues: long, label: "reference", fileId: 4241, language: "en", slot: 0 });
        await sleep(120);
        await api.attach({ cues: late, label: "mistimed", fileId: 4242, language: "tr", slot: 1 });
        await sleep(200);

        const after = api.status().tracks[1];
        if (!after.attached) throw new Error("it did not attach");
        /* Minus eight seconds, and the sign is the point. This subtitle's cues
         * start eight seconds later than the reference's, so to put the same
         * words on screen at the same moment it has to be brought forward -
         * film time is stream time minus the offset. Getting this backwards is
         * the single easiest mistake in the whole feature and it doubles the
         * error rather than fixing it. */
        if (Math.abs(after.offsetMs + 8000) > 250)
          throw new Error(`offset came out at ${after.offsetMs}, want about -8000`);

        // And a subtitle for a different film is left exactly as it arrived.
        const unrelated = speech(600, 913).map((start) => ({ start, end: start + 1800, text: "x" }));
        await api.attach({ cues: unrelated, label: "elsewhere", fileId: 4243, language: "tr", slot: 1 });
        await sleep(200);
        if (api.status().tracks[1].offsetMs !== 0)
          throw new Error(`a different film was shifted by ${api.status().tracks[1].offsetMs}ms`);

        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      /* Pairing a spoken line with the other subtitle, when a sign is held
       * across the dialogue under it.
       *
       * The other subtitle is searched by bisection, and what is bisected has
       * to be how far the file has REACHED by each line rather than the line's
       * own end. The ends do not run in order: a caption held for two hundred
       * seconds ends after every short line that starts inside it, so a search
       * over the ends steps past the caption and the study card for the line
       * being read comes back with nothing beside it. The same defect the
       * subtitle map had, in a second place.
       *
       * It was invisible because of the slack: the search starts 45 seconds
       * early, and across the 182 subtitles in this repository the worst that
       * the ends run backwards by is 2,602ms. A four-minute caption over
       * dialogue is what it takes, and a 231,680ms cue is already in the
       * corpus. */
      check("a line under a held sign is still paired with it", async () => {
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const spoken = [{ start: 100000, end: 102000, text: "the line being read" }];
        // The sign first, then short lines all ending long before the moment
        // asked about, which is what makes the ends run backwards.
        const held = [{ start: 0, end: 200000, text: "HELD SIGN" }];
        for (let at = 10000; at <= 60000; at += 10000) {
          held.push({ start: at, end: at + 2000, text: `short at ${at}` });
        }

        api.clearAdDrift();
        try {
          await api.attach({ cues: spoken, label: "spoken", fileId: 4251, language: "en", slot: 0 });
          await api.attach({ cues: held, label: "signs", fileId: 4252, language: "tr", slot: 1 });
          // Both files are already in the film's own clock here; the aligner
          // has nothing to say about seven lines and must not be left a guess.
          api.setOffset(0, { slot: 0, quiet: true });
          api.setOffset(0, { slot: 1, quiet: true });
          await sleep(120);

          const paired = api.pairedCues(0, spoken[0]);
          if (!paired.some((each) => (each.text || "").includes("HELD SIGN")))
            throw new Error(`the held sign was not paired: ${JSON.stringify(paired)}`);
        } finally {
          /* Put back even when the assertion above throws. Without this the
           * harness's own subtitles stay replaced for every check that runs
           * after, and one failure is reported as three - which cost a run to
           * work out the first time it happened. */
          for (const slot of [0, 1]) {
            if (wasAttached[slot]) {
              await api.attach({
                cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
                language: slot ? "tr" : "en", slot,
              });
            } else {
              api.detach(slot);
            }
          }
          api.updateSettings({ tracks: wasGeometry });
          await sleep(150);
        }
      });

      /* The obstruction probe in the diagnostic report.
       *
       * Asked through the message the worker actually sends, so what is under
       * test is the whole path rather than a function lifted out of it. These
       * exist because the thing they describe cannot be seen from the harness
       * at all: a page whose player is a cross-origin iframe covers the panel
       * from a document this one has no equivalent of. What can be checked
       * here is that the probe reports the surfaces truthfully - so that when
       * it is read on such a page, the reading means something. */
      const askDiagnose = async () => {
        for (const listener of [...window.__listeners].reverse()) {
          let answer = null;
          const returned = listener({ type: "sso:diagnose" }, {}, (value) => { answer = value; });
          if (answer) return answer;
          if (returned && typeof returned.then === "function") await returned;
        }
        throw new Error("no listener answered sso:diagnose");
      };

      check("the diagnostic reports the surfaces the extension drew", async () => {
        const report = await askDiagnose();
        if (!Array.isArray(report.surfaces)) throw new Error("no surfaces in the report");
        if (!report.surfaces.length) throw new Error("nothing reported, with an overlay on screen");
        const names = report.surfaces.map((s) => s.surface).join(" ");
        if (!/sso-/.test(names)) throw new Error(`surfaces are not ours: ${names}`);
      });

      check("it reports each surface's geometry and stacking", async () => {
        const [first] = (await askDiagnose()).surfaces;
        if (first.rect.length !== 4) throw new Error("no rect");
        if (typeof first.zIndex !== "string") throw new Error("no z-index");
        if (typeof first.pointerEvents !== "string") throw new Error("no pointer-events");
        if (typeof first.inTopLayer !== "boolean") throw new Error("no top-layer state");
      });

      check("an unobstructed button is reported reachable, naming nothing", async () => {
        const targets = (await askDiagnose()).surfaces.flatMap((s) => s.targets || []);
        const drawn = targets.filter((t) => t.rendered !== false);
        if (!drawn.length) throw new Error("no button was sampled");
        const stuck = drawn.filter((t) => !t.reachable);
        if (stuck.length) {
          throw new Error(`${stuck.length} unreachable on a page with nothing over them: ` +
            JSON.stringify(stuck[0]));
        }
        if (drawn.some((t) => t.coveredBy.length)) throw new Error("named an obstruction that is not there");
      });

      check("a button under something names what took the click", async () => {
        /* The page's own overlay, at the z-index the measured ones use. It has
         * to out-rank the top layer to cover anything, which nothing in one
         * document can - so the surface is taken out of the top layer first,
         * which is also the state it is in whenever promotion failed. */
        const hosts = [...document.querySelectorAll("div")]
          .filter((d) => (d.shadowRoot?.firstElementChild?.className || "").startsWith("sso-"));
        // Every one of them, not the first: a surface left in the top layer
        // stays reachable and would read as a page with nothing wrong.
        const wereOpen = hosts.filter((h) => h.matches(":popover-open"));
        for (const h of wereOpen) h.hidePopover();

        const lid = document.createElement("div");
        lid.id = "harness-lid";
        for (const [p, v] of Object.entries({
          position: "fixed", inset: "0", "z-index": "2147483647", "pointer-events": "auto",
        })) lid.style.setProperty(p, v, "important");
        document.documentElement.append(lid);

        try {
          const targets = (await askDiagnose()).surfaces.flatMap((s) => s.targets || []);
          const drawn = targets.filter((t) => t.rendered !== false);
          if (!drawn.length) throw new Error("no button was sampled");
          const named = drawn.filter((t) => t.coveredBy.some((c) => /harness-lid/.test(c)));
          if (!named.length) {
            throw new Error(`the lid was not named: ${JSON.stringify(drawn.map((t) => t.coveredBy))}`);
          }
          if (named.some((t) => t.reachable)) throw new Error("covered and still called reachable");
          if (!named[0].coveredBy.some((c) => /z=2147483647/.test(c))) {
            throw new Error(`the winning z-index is missing: ${named[0].coveredBy}`);
          }
        } finally {
          lid.remove();
          for (const h of wereOpen) h.showPopover();
        }
      });

      check("re-injection leaves exactly one overlay", async () => {
        window.__ssoApi.detach(1);
        const count = () => [...document.querySelectorAll("div")].filter((d) => d.shadowRoot).length;
        const load = (src) => new Promise((ok, no) => {
          const s = document.createElement("script");
          s.src = src + "?v=" + cases.length; s.onload = ok; s.onerror = no;
          document.body.append(s);
        });
        await load("../src/content.js");
        await load("../src/panel.js");
        await load("../src/study.js");
        await sleep(150);
        if (count() > 2) throw new Error(`${count()} shadow hosts after re-injection`);
      });

      check("an extension reloaded under the tab stops this copy, quietly", async () => {
        /* The other half of re-injection, and the one nobody sees.
         *
         * Reloading an extension orphans the content scripts still running in
         * open tabs. Every chrome.* call then throws "Extension context
         * invalidated" - SYNCHRONOUSLY, which is the whole defect: every call
         * site is written chrome.something(...).catch(...), and a synchronous
         * throw happens before there is a promise for that catch to attach to.
         *
         * Reported from the extension's own error page as "Uncaught Error:
         * Extension context invalidated. src/content.js:4326", which was the
         * sendMessage inside trace(). trace() is reached from the tick, so one
         * orphaned frame threw it twenty times a second for as long as its tab
         * stayed open. It could only ever be seen there, because the daemon is
         * precisely what an invalidated context can no longer reach.
         *
         * Two assertions, because going quiet is the remedy and swallowing is
         * not: nothing may throw, AND the copy has to stop. A frame that merely
         * caught its failures would hold a video observer and a document full
         * of listeners for the life of the tab. */
        const runtime = window.chrome.runtime;
        const storage = window.chrome.storage.local;
        const keep = { id: runtime.id, send: runtime.sendMessage, set: storage.set, get: storage.get };
        const invalidated = () => { throw new Error("Extension context invalidated."); };
        const thrown = [];
        const onError = (event) => thrown.push(String(event.message || ""));
        window.addEventListener("error", onError);
        try {
          delete runtime.id;
          runtime.sendMessage = invalidated;
          storage.set = invalidated;
          storage.get = invalidated;

          /* Drive the reported path rather than waiting to see whether anything
           * happens to take it. trace() is event-driven, so a first version of
           * this case that only slept proved nothing: the mutation that puts
           * the defect back still passed, because in 300 quiet milliseconds
           * nothing called trace at all.
           *
           * An error of the extension's own is the honest driver, and it is
           * also the worst case. The extension listens for window errors in
           * order to record its own (a page's are not written down, so one
           * from the page's script would not reach trace() at all), so an
           * orphaned frame answers by reaching for the worker, throwing a
           * SECOND error from inside the error handler. */
          window.dispatchEvent(new ErrorEvent("error", {
            message: "the page itself blew up - sso-harness raised this on purpose",
            filename: chrome.runtime.getURL("src/content.js"),
            lineno: 1,
          }));
          // And several ticks besides, for whatever the timers would have done.
          await sleep(300);
          const loud = thrown.filter((m) => /invalidated/i.test(m));
          if (loud.length) throw new Error(`${loud.length} uncaught, first: ${loud[0]}`);
          if (shadowOf()) throw new Error("still drawing an overlay after being orphaned");
        } finally {
          window.removeEventListener("error", onError);
          Object.assign(runtime, { id: keep.id, sendMessage: keep.send });
          Object.assign(storage, { set: keep.set, get: keep.get });
          // Put a live copy back, or anything after this reports on a corpse.
          const load = (src) => new Promise((ok, no) => {
            const s = document.createElement("script");
            s.src = src + "?v=orphan"; s.onload = ok; s.onerror = no;
            document.body.append(s);
          });
          await load("../src/content.js");
          await load("../src/panel.js");
          await load("../src/study.js");
          await sleep(150);
        }
      });

      // --- run ------------------------------------------------------------
      /* An error nobody caught is a failure even when every assertion holds.
       * Rejected promises count too: most of this code reports failure by
       * rejecting inside a .catch() that discards it. */
      /* A case that raises an error ON PURPOSE says so, or the collector reports
       * the suite's own driver as a failure of the code under test. Exactly one
       * case does this: the orphaned-context one has to hand the extension a
       * page error to answer, because answering it is what used to throw. */
      const DELIBERATE = "sso-harness raised this on purpose";
      const loose = [];
      window.addEventListener("error", (e) => {
        if (String(e.message || "").includes(DELIBERATE)) return;
        loose.push(e.message);
      });
      window.addEventListener("unhandledrejection", (e) => loose.push(String(e.reason?.message ?? e.reason)));

      /* Which case is running, readable from outside.
       *
       * A row is appended only when a case FINISHES, so a run that stops part
       * way says nothing about where it stopped - the stalled case is the one
       * after the last row, and until now the only way to find it was to count.
       * Driven headless, this is the difference between "it stalls" and a name. */
      window.__caseNames = cases.map((c) => c.name);
      window.__running = null;

      /* Opened with ?manual, the page is set up and left alone: the subtitle
       * attached, nothing running. That is for tests/realinput.mjs, which
       * drives the page with a real mouse and keyboard from outside - the
       * one kind of input the cases here cannot produce. A dispatched
       * dblclick reaches a button whatever pointer capture did to the real
       * one, so the case that "proved" the name could be double-clicked
       * passed for a year while a real double-click did nothing. */
      const manual = new URLSearchParams(location.search).has("manual");
      /* Opened with ?only=<phrase|phrase>, only the cases whose name carries
       * one of the phrases run. The whole suite is twenty minutes on a busy
       * machine, and a case being written is run twenty times before it
       * passes. A case that leans on the one before it - the panel left
       * open, a subtitle left attached - fails alone; that is the case's
       * shape, not a finding. */
      const only = (new URLSearchParams(location.search).get("only") || "").split("|").map((s) => s.trim()).filter(Boolean);
      const chosen = only.length ? cases.filter((c) => only.some((phrase) => c.name.includes(phrase))) : cases;

      (async () => {
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);
        if (manual) {
          document.getElementById("summary").textContent = "manual";
          return;
        }

        /* The panel is built the first time it is shown, and the cases take
         * it as built and open: run on their own they would find no panel,
         * and a hidden one does not refresh its screens. Shown, and left so,
         * which is where the full run has it by the time most cases start. */
        if (only.length && window.__ssoPanel?.show) {
          window.__ssoPanel.show();
          await sleep(200);
        }

        const out = document.getElementById("results");
        let passed = 0;
        for (const { name, fn } of chosen) {
          window.__running = name;
          const row = document.createElement("div");
          row.className = "case";
          try {
            await fn();
            row.classList.add("pass");
            row.textContent = name;
            passed++;
          } catch (err) {
            row.classList.add("fail");
            row.textContent = name;
            const why = document.createElement("div");
            why.className = "why";
            why.textContent = err.message;
            row.append(why);
          }
          out.append(row);
        }
        for (const message of [...new Set(loose)]) {
          const row = document.createElement("div");
          row.className = "case fail";
          row.textContent = "nothing caught this error";
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = message;
          row.append(why);
          out.append(row);
        }

        const total = chosen.length + new Set(loose).size;
        const summary = document.getElementById("summary");
        summary.textContent = `${passed}/${total} passed`;
        summary.style.color = passed === total ? "#59c27f" : "#e8705f";
        window.__harness = { passed, total, loose: [...new Set(loose)] };
      })();
    </script>
  </body>
</html>
