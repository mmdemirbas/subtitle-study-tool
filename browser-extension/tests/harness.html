         * current one again) is not working correctly. It looks like rewinding
         * to the beginning or end of the previous one, not the current one."
         *
         * A seek settles on a keyframe, and on a stream the nearest one can be
         * seconds before the moment asked for. Counting the next press from
         * where the film came to REST then reads the previous line as the
         * current one. With lines every two seconds and a two-second
         * undershoot, a press asking for the line at 13s leaves the playhead
         * at 10.85s, and the press after it reaches 9s - a line further back
         * than the music-player rule promises. Counting from the mark the
         * press ASKED FOR is what fixes it. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const own = Object.getOwnPropertyDescriptor(video, "currentTime");

        const cues = [1000, 3000, 5000, 7000, 9000, 11000, 13000].map((start) => ({
          start,
          end: start + 1800,
          text: `at ${start}`,
        }));
        await api.attach({ cues, label: "keyframes", fileId: 6130, language: "en", slot: 0 });
        api.detach(1);
        api.setKeyTrack(0);

        let held = 14;
        Object.defineProperty(video, "currentTime", {
          get: () => held,
          set: (seconds) => {
            held = Math.max(0, seconds - 2);
          },
          configurable: true,
        });

        api.stepLine(-1); // asks for 12.85s, comes to rest at 10.85s
        const first = Math.round(held * 1000);
        api.stepLine(-1); // has to ask for 10.85s, not for 8.85s
        const second = Math.round(held * 1000);
        Object.defineProperty(video, "currentTime", own);

        if (Math.abs(first - 10850) > 50)
          throw new Error(`the first press came to rest at ${first}ms, not where the stub puts it`);
        if (Math.abs(second - 8850) > 50)
          throw new Error(
            `the second press reached ${second}ms rather than 8850ms: it was counted from where the film stopped, not from the line it asked for`,

        await restoreTracks(wasAttached);
      });

      check("a phrase is found in the tense the line used, and whole", async () => {
        /* Two ways the phrase index missed, both of them silent - a phrase that
         * is not found is indistinguishable from a line that has none.
         *
         * The index is built from the head verb's surface forms, and the
         * -ing/-ed rule never doubled a final consonant. So it held "puting"
         * and "stoped", which appear in no subtitle, and "she is putting up
         * with it" carried no phrase at all. The same rule dropped the e in
         * "lie", "see" and "agree", giving "liing", "seing" and "agreing".
         *
         * And the longest phrase did not reliably win. The tie-break on span
         * sat beside the rule on length rather than inside its equal case, so
         * "stand in for" was found and then replaced by "stand in" - two words
         * being fewer than three and the shorter span winning on its own. Which
         * of the two came out depended on the order the table listed them in,
         * which is why both orders are asked here. */
        const phrases = await import("../src/study/phrases.js");

        for (const [verb, form] of [
          ["put", "putting"], ["stop", "stopped"], ["plan", "planning"],
          ["begin", "beginning"], ["lie", "lying"], ["die", "dying"],
          ["see", "seeing"], ["agree", "agreeing"], ["move", "moving"],
        ]) {
          const forms = phrases.surfaceForms(verb);
          if (!forms.includes(form))
            throw new Error(`"${verb}" has no "${form}": ${forms.join(" ")}`);
        }

        const said = "she is putting up with it".split(" ");
        const found = phrases.findPhrases(said, phrases.buildIndex(["put up with", "put up"]));
        if (found.map((f) => f.phrase).join() !== "put up with")
          throw new Error(`"putting up with" came out as ${JSON.stringify(found)}`);

        for (const table of [["stand in", "stand in for"], ["stand in for", "stand in"]]) {
          const hits = phrases.findPhrases(
            "he stood in for me".split(" "), phrases.buildIndex(table),
          );
          if (hits.map((f) => f.phrase).join() !== "stand in for")
            throw new Error(
              `listed as ${JSON.stringify(table)} it marked ${JSON.stringify(hits.map((f) => f.phrase))}`);
        }
      });

      check("a phrasal verb is marked as one thing, and only the first time", async () => {
        /* The question the rarity table cannot answer. "Put up with" is three
         * of the hundred commonest words in English and means nothing any of
         * them mean, so every part of it ranks far inside any threshold and
         * nothing is ever marked - the reader is left to work out that the
         * three words are one word.
         *
         * Three things are asserted and each was a decision. The phrase's own
         * words are marked and the object between them is not, because a reader
         * shown "pick it up" as one mark learns that the pronoun belongs to it.
         * The card arrives once per film, because a phrasal verb is common by
         * nature - "come on" is said 1305 times in the corpus this was measured
         * over - and the underline still appears every time, because "these
         * words are one thing" stays true. And a phrase inside the commonest
         * band is left alone. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;
        const LINES = [
          { start: 3000, end: 6000, text: "You should back off." },
          { start: 7000, end: 10000, text: "He picked it up again." },
          { start: 11000, end: 14000, text: "Back off, both of you." },
          { start: 15000, end: 18000, text: "Come on, look at me." },
        ];
        const at = async (seconds) => {
          video.currentTime = seconds;
          await sleep(400);
        };
        const words = () => [...shadowOf().querySelectorAll(".sso-w")];
        const chips = () =>
          [...shadowOf().querySelectorAll(".sso-trail__term")].map((n) => n.textContent);

        const wasStudy = { ...window.__ssoStudy.settings() };
        try {
          api.detach(1);
          window.__ssoStudy.updateSettings({
            enabled: true, auto: true, maxPerCue: 2, phraseRank: PHRASE_RANK,
          });
          await api.attach({ cues: LINES, label: "EN · Harness.Phrases", fileId: 7301, language: "en", slot: 0 });
          await sleep(200);

          await at(4);
          const marked = words().filter((w) => w.dataset.phrase === "true").map((w) => w.dataset.w);
          if (marked.join(" ") !== "back off")
            throw new Error(`marked ${JSON.stringify(marked)} rather than the phrase`);
          if (!chips().includes("back off"))
            throw new Error(`the trail holds ${JSON.stringify(chips())}`);

          /* Separable: the particle sits two words from its verb and the
           * pronoun between them is not part of the phrase. */
          await at(8);
          const split = words().filter((w) => w.dataset.phrase === "true").map((w) => w.dataset.w);
          if (split.join(" ") !== "picked up")
            throw new Error(`"picked it up" marked ${JSON.stringify(split)}`);

          // Said again: still underlined, no second card.
          const before = chips().filter((term) => term === "back off").length;
          await at(12);
          const again = words().filter((w) => w.dataset.phrase === "true").map((w) => w.dataset.w);
          if (again.join(" ") !== "back off")
            throw new Error("the second time it was said it was not marked at all");
          if (chips().filter((term) => term === "back off").length !== before)
            throw new Error("the same phrase was taught twice");

          // Inside the commonest band, so not marked at all.
          await at(16);
          const common = words().filter((w) => w.dataset.phrase === "true").map((w) => w.dataset.w);
          if (common.length)
            throw new Error(`"come on" and "look at" were marked: ${JSON.stringify(common)}`);

          /* And the prefetch asks about the same phrases the marking will,
           * once each, with the line they were said in. A prefetch that
           * disagreed with the marking would file every answer where nothing
           * looks for it and the whole of it would silently do nothing. */
          glossAsks.length = 0;

          await api.attach({ cues: LINES, label: "TR · Harness.Phrases", fileId: 7302, language: "tr", slot: 1 });
          await at(4);
          await sleep(600);
          const sent = glossAsks.flatMap((ask) => ask.items || []);
          const ahead = sent.filter((item) => item.term === "back off");
          if (ahead.length !== 1)
            throw new Error(`the prefetch asked about "back off" ${ahead.length} times, want once`);
          if (ahead[0].sentence !== "You should back off.")
            throw new Error(`it was asked with "${ahead[0].sentence}" rather than its own line`);
          if (sent.some((item) => item.term === "come on"))
            throw new Error("a phrase inside the commonest band was sent ahead");
        } finally {
          /* Everything this touched, including which subtitles are being
           * learnt: attaching over a slot is what changes that, and a later
           * case asserts on exactly it. */
          window.__ssoStudy.updateSettings({
            enabled: wasStudy.enabled,
            auto: wasStudy.auto,
            maxPerCue: wasStudy.maxPerCue,
            phraseRank: wasStudy.phraseRank,
            studySlots: wasStudy.studySlots,
            trailOff: wasStudy.trailOff,
          });
          video.currentTime = wasTime;
          await sleep(400);
          for (const fileId of [7301, 7302]) {
            await chrome.storage.local.remove(`sso:offset:${fileId}`);
          }
          for (const slot of [0, 1]) {
            if (wasAttached[slot]) {

                cues: CUES, label: slot ? "second" : "first", fileId: slot + 1, language: "en", slot,
              });
            } else {
              api.detach(slot);
            }
          }
          await sleep(200);
        }
      });

         * and "go on" is the only part that needs a hand. The whole difficulty
         * is doing it once: a pause is a state, not a moment, so when play is
         * pressed the playhead is still inside the same line's end, and a naive
         * check pauses again on the very next tick and the film never moves.
         *

         * stopped at - and that line's end has to stop the film a second time
         * or repeating a line silently turns the feature off for it. */
        const api = window.__ssoApi;

        const realPause = video.pause;
        const realPlay = video.play;
        Object.defineProperty(video, "paused", { get: () => paused, configurable: true });
        video.pause = () => { paused = true; };
        video.play = () => { paused = false; };

          await api.attach({
            cues: [
              { start: 1000, end: 3000, text: "one" },
              { start: 5000, end: 7000, text: "two" },

            label: "EN · pause", fileId: 8200, language: "en", slot: 0,

          api.updateSettings({ pauseAtLineEnd: true });
          await sleep(250);

          const at = async (seconds) => { video.currentTime = seconds; await sleep(260); };

          await at(2);
          if (paused) throw new Error("it stopped in the middle of a line");

          await at(2.98);
          if (!paused) throw new Error("the line ended and it did not stop");

          video.play();
          await sleep(320);
          if (paused) throw new Error("pressing play stopped it again - the film cannot move");

          await at(6.98);

          await sleep(150);
          api.stepLine(-1);
          await sleep(260);
          if (paused) throw new Error("going back a line left it stopped");
          await at(6.98);
          if (!paused) throw new Error("a repeated line does not stop at its end");

          api.updateSettings({ pauseAtLineEnd: false });
          video.play();
          await at(2.99);
          if (paused) throw new Error("it stopped with the setting off");
        } finally {
          api.updateSettings({ pauseAtLineEnd: false });
          video.pause = realPause;
          video.play = realPlay;

      /* The same feature, against a clock that really runs, at the speeds a
       * learner uses.
       *
       * The case above teleports the playhead to 2.98s, which lands inside the
       * stop window by construction - which is why it passed while the feature
       * was broken above 1x. The window is one tick of FILM wide, and film
       * advances at the playback rate, so a single tick steps over it: at 2x a
       * tick is 100ms of film, at 4x 200ms. Measured before the fix, over four
       * lines: 1x stopped at all four, 2x at one, 4x at none. Nothing recovers
       * a missed stop, so from the reader's side the mode had switched itself
       * off.
       *
       * A clock local to this case, so the other cases keep the static
       * playhead they were written against. */
      check("stops at the end of every line at 1x, 2x and 4x", async () => {
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;
        const hadPaused = Object.getOwnPropertyDescriptor(video, "paused");
        const hadCurrent = Object.getOwnPropertyDescriptor(video, "currentTime");
        const realPause = video.pause;
        const realPlay = video.play;

        let at = 0;
        let since = 0;
        let rate = 1;
        let paused = true;
        const read = () => (paused ? at : at + ((performance.now() - since) / 1000) * rate);
        Object.defineProperty(video, "currentTime", {
          get: read,
          set: (x) => { at = x; since = performance.now(); },
          configurable: true,
        });
        Object.defineProperty(video, "paused", { get: () => paused, configurable: true });
        video.pause = () => { at = read(); paused = true; };
        video.play = () => { since = performance.now(); paused = false; };

        // Four one-second lines with one-second gaps, so the whole sweep takes
        // seconds rather than minutes at 1x.
        const cues = [0, 1, 2, 3].map((n) => ({
          start: 1000 + n * 2000, end: 2000 + n * 2000, text: `line ${n}`,
        }));

        try {
          await api.attach({ cues, label: "EN · rate", fileId: 8300, language: "en", slot: 0 });
          api.setKeyTrack(0);
          api.updateSettings({ pauseAtLineEnd: true });
          await sleep(250);

          for (const speed of [1, 2, 4]) {
            rate = speed;
            const stops = [];
            video.currentTime = 0.4;
            video.play();
            const deadline = performance.now() + 3000 + 9000 / speed;
            while (stops.length < cues.length && performance.now() < deadline) {
              await sleep(20);
              if (paused) {
                stops.push(Number(read().toFixed(2)));
                video.play();
              }
            }
            video.pause();
            if (stops.length < cues.length) {
              throw new Error(
                `at ${speed}x it stopped ${stops.length} of ${cues.length} times (at ${stops})`,
              );
            }
            /* And it has to stop while the line is still on screen. Stopping
             * past the end leaves a stopped film with an empty subtitle, which
             * is the opposite of what the mode is for. The early bound is one
             * step, 200ms of film at 4x. */
            stops.forEach((stop, n) => {
              const end = cues[n].end / 1000;
              if (stop > end + 0.05 || stop < end - 0.3) {
                throw new Error(
                  `at ${speed}x it stopped at ${stop}s for a line ending at ${end}s`,
                );
              }
            });
          }
        } finally {
          api.updateSettings({ pauseAtLineEnd: false });
          video.pause = realPause;
          video.play = realPlay;
          if (hadPaused) Object.defineProperty(video, "paused", hadPaused);
          if (hadCurrent) Object.defineProperty(video, "currentTime", hadCurrent);
          video.currentTime = wasTime;
          if (wasAttached[0]) {
            await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
          } else {
            api.detach(0);
          }
          await sleep(150);
        }
      });

         * both rendered 0x0 while reporting themselves open, so the CC button
         * toggled a panel nobody could see and leaving fullscreen revealed one

         * The 0x0 only happens in real fullscreen, which needs a user gesture
         * this page cannot make - outside it a `position: fixed` child escapes
         * its parent's layout and paints anyway. So what is asserted here is
         * the invariant that keeps the bug from happening at all: asked to
         * follow something into a <video>, a surface does not go, and it ends
         * up in the top layer, where the question never arises. */

        const hostFor = (sel) =>
          [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));

        const overlay = hostFor(".sso-root");

        try {

            node.removeAttribute("popover");

          if (overlay.parentElement === video)
