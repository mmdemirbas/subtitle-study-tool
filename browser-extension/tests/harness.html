<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Overlay — test harness</title>
    <style>
      /* --- The page under test ------------------------------------------
       *
       * These are not arbitrary. Every rule here reproduces something a real
       * streaming site does that has broken this extension at least once:
       *
       *   button { ... !important }   made the CC handle invisible
       *   span   { font-style: normal } cancelled subtitle italics
       *   div    { line-height: 3 }   pulled the control panel apart
       *   #later { z-index: max }     player chrome painted over the overlay
       *   stopPropagation on the player  killed the pointermove listener
       *
       * If a change to the extension survives this page, it survives Prime.
       */
      body { margin: 0; background: #0b0d10; font-family: serif; color: #fff; }
      div { position: relative; line-height: 3; letter-spacing: 2px; }
      span { font-style: normal !important; color: #ff00ff !important; }
      button { position: relative !important; opacity: 0 !important;
               visibility: hidden !important; display: inline !important;
               transform: scale(0) !important; font-size: 40px !important; }
      #player { position: fixed; inset: 0;
        background: radial-gradient(60% 50% at 30% 35%, #48586b, #12161c 70%); }
      video { width: 100%; height: 100%; display: block; }
      /* Player chrome appended AFTER the overlay, same z-index. */
      #later { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; }

      /* --- Results panel (not under test) ------------------------------- */
      #results { position: fixed; right: 0; top: 0; bottom: 0; width: 430px;
        overflow: auto; z-index: 2147483646; padding: 14px 16px;
        background: #0f1116; border-left: 1px solid #262b33;
        font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        line-height: 1.5 !important; letter-spacing: 0 !important; }
      #results h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0 !important; }
      #summary { margin: 0 0 12px; font-size: 12px; }
      .case { padding: 5px 0; border-top: 1px solid #1c212a; letter-spacing: 0 !important; }
      .pass::before { content: "PASS "; color: #59c27f; }
      .fail::before { content: "FAIL "; color: #e8705f; }
      .why { color: #8b929d; padding-left: 42px; }
    </style>
  </head>
  <body>
    <div id="player"><video id="v"></video></div>
    <div id="later"></div>
    <div id="ad-slot"></div>
    <aside id="results"><h1>Subtitle Overlay — harness</h1><p id="summary">running…</p></aside>

    <script>
      // --- chrome API stub ------------------------------------------------
      const store = {};

      /* Writes announce themselves, the way Chrome's do.
       *
       * Asynchronously, and that is the faithful part: a listener that ran
       * inside set() would let a writer see its own event before its own next
       * statement, which Chrome never does and which is exactly the ordering a
       * settings listener has to survive. */
      const storageListeners = new Set();
      const fireStorageChange = (changes) => {
        if (!storageListeners.size || !Object.keys(changes).length) return;
        setTimeout(() => {
          for (const fn of storageListeners) {
            try {
              fn(changes, "local");
            } catch {
              // One broken listener must not stop the others, as in Chrome.
            }
          }
        }, 0);
      };
      const EXT = "../src/";
      // Everything the page reported to the worker, in order.
      /* A phrase table the size of the cases that use it, in rank order the
       * way the shipped one is: commonest first, so "come on" at 0 is inside
       * any threshold and "put up with" at 5 is outside a threshold of 3. */
      const PHRASE_TABLE = [
        "come on", "look at", "find out", "back off", "pick up", "put up with", "give in",
      ];
      // Rank 3 and 4 are "back off" and "pick up", so a threshold of 3 puts
      // them outside the commonest band and leaves "come on" inside it.
      const PHRASE_RANK = 3;
      let phraseIndex = null;
      async function matchPhrases(words) {
        if (!phraseIndex) {
          const phrases = await import("../src/study/phrases.js");
          phraseIndex = { at: phrases.buildIndex(PHRASE_TABLE), find: phrases.findPhrases };
        }
        return phraseIndex.find(words, phraseIndex.at);
      }

      window.__sent = [];
      // The message listeners the page registered, so a test can ask them.
      window.__listeners = [];
      // Per-op replacements for the daemon stub below. Null unless a test is
      // standing something else in its place.
      window.__stubDaemon = null;
      window.chrome = {
        runtime: {
          /* Chrome always has one, and its DISAPPEARANCE is the documented
             signal that the extension has been reloaded under this tab. The
             stub had no `id` at all, which is the stub being less faithful than
             the API rather than more: content.js reads it to decide whether it
             is still attached to a live extension, so an absent one means every
             copy here would correctly conclude it had been orphaned. */
          id: "ssoharnessextensionid",
          getManifest: () => ({ version: "0.1.0" }),
          getURL: (p) => EXT + p.split("/").pop(),
          /* Recorded rather than discarded. The worker's half of this is not
             loaded here, but the page's half is the thing under test, and a
             listener that is thrown away cannot be asked anything. */
          onMessage: {
            addListener(fn) { window.__listeners.push(fn); },
            removeListener(fn) {
              const at = window.__listeners.indexOf(fn);
              if (at !== -1) window.__listeners.splice(at, 1);
            },
          },
          sendMessage: async (msg) => {
            /* The two the page sends to the worker about what is playing, kept
             * so a test can assert what was reported and when. The worker's own
             * half of this is not loaded here. */
            if (
              msg?.type === "sso:programme"
              || msg?.type === "sso:attached"
              // What the page says comes NEXT, which is a different question
              // from what it is playing and is answered on its own schedule.
              || msg?.type === "sso:warmNext"
            ) {
              window.__sent.push({ ...msg, at: performance.now() });
              return { ok: true };
            }
            if (msg?.type !== "sso:daemon") return {};
            /* An override, so a test that needs several results and a different
             * file behind each of them can say so without every other test
             * having to know about it. Set it, use it, set it back to null. */
            if (window.__stubDaemon?.[msg.op]) return window.__stubDaemon[msg.op](msg.args || {});
            if (msg.op === "search") {
              return {
                used: { query: "Mercy" },
                auto_attach_threshold: 0.75,
                resolved: { title: "mercy", year: 2026, imdb_id: "31050594" },
                results: [{
                  file_id: 1, language: "en", movie_name: "Mercy",
                  release: "Mercy.2026.1080p.AMZN.WEB-DL", year: 2026,
                  download_count: 812, match_score: 1.0, cached: false,
                  from_trusted: true, hearing_impaired: true,
                }],
              };
            }
            if (msg.op === "fetch") return { cues: CUES };

            /* Study mode's three questions. Stubbed rather than reaching the
             * real tables and the real dictionary, because what is under test
             * here is what the overlay does with the answers - which word gets
             * marked, what lands in the rail, what a save keeps. The tables
             * themselves are generated data with their own generator. */
            if (msg.op === "rank") {
              /* Switched on by the check for a helper that is not answering.
               * The worker turns a transport failure into this shape rather
               * than rejecting, so this is what study mode really sees. */
              if (rankFails) return { transportError: "Daemon returned HTTP 501" };
              const ranks = {};
              for (const word of msg.args.words) {
                ranks[word] = RANKS[word] === undefined ? null : RANKS[word];
              }
              return { ranks };
            }
            /* The real matcher against a small table, which is the same
             * split the rank op uses: the extension's own code decides what a
             * line contains, and the page decides what the table holds. A
             * stubbed matcher would test the wiring and nothing else. */
            if (msg.op === "phrases") {
              // Two shapes: one line as the film plays, the whole file at
              // attach. The extension asks for the second so the meanings are
              // on disk before anybody reads them.
              if (Array.isArray(msg.args.lines)) {
                const lines = [];
                for (const words of msg.args.lines) lines.push(await matchPhrases(words));
                return { lines };
              }
              return { phrases: await matchPhrases(msg.args.words || []) };
            }
            if (msg.op === "gloss") {
              glossAsks.push(msg.args);
              /* `from` as well as the answers. The daemon says which of its
               * tiers answered, because from the overlay a slow model, a
               * missing key and an untranslatable word are the same empty
               * chip - see the marks record. */
              const many = (msg.args.items || []).length;
              return { glosses: (msg.args.items || []).map(() => ""), from: { none: many } };
            }
            if (msg.op === "lookup") {
              lookupCalls.push(msg.args.query);
              lookupTargets.push(msg.args.target);
              lookupSentences.push(msg.args.sentence);
              return {
                query: msg.args.query,
                definitions: [{ partOfSpeech: "verb", sense: `to ${msg.args.query}, in a way` }],
                phonetic: "/stub/",
                translation: `${msg.args.query}-in-${msg.args.target || "nothing"}`,
                source: "harness",
              };
            }
            if (msg.op === "deckSave") {
              deckSaves.push(msg.args.entry);
              return { added: true, entry: msg.args.entry, size: deckSaves.length };
            }
            if (msg.op === "deckTerms") {
              return { terms: deckSaves.map((entry) => `${entry.language}:${entry.term}`) };
            }
            return {};
          },
        },
        /* Matches chrome.storage.local's actual surface, not just the calls
         * that happened to exist when this was written. A missing method
         * throws inside a .catch()-ed promise, which passes silently: the
         * suite reported 62/62 green while three real calls were failing. */
        /* onChanged is not optional in this stub, and leaving it out cost a
         * whole file. study.js registers a listener at load - that is how the
         * frames come to agree about whether study is on - and a stub without
         * it threw before __ssoStudy was installed, so every study case failed
         * with "Cannot read properties of undefined". A stub that offers less
         * than Chrome does is the same defect as one that forgives more. */
        storage: {
          local: {
            get: async (k) => {
              const keys = typeof k === "string" ? [k] : Array.isArray(k) ? k : Object.keys(k ?? store);
              const out = {};
              for (const key of keys) if (key in store) out[key] = store[key];
              return out;
            },
            set: async (o) => {
              const changes = {};
              for (const [key, value] of Object.entries(o)) {
                changes[key] = { oldValue: store[key], newValue: value };
              }
              Object.assign(store, o);
              fireStorageChange(changes);
            },
            remove: async (k) => {
              const changes = {};
              for (const key of typeof k === "string" ? [k] : k) {
                changes[key] = { oldValue: store[key], newValue: undefined };
                delete store[key];
              }
              fireStorageChange(changes);
            },
            clear: async () => {
              const changes = {};
              for (const key of Object.keys(store)) {
                changes[key] = { oldValue: store[key], newValue: undefined };
                delete store[key];
              }
              fireStorageChange(changes);
            },
          },
          onChanged: {
            addListener: (fn) => storageListeners.add(fn),
            removeListener: (fn) => storageListeners.delete(fn),
          },
        },
      };

      /* Ranks for the words in the cues below. "frankly" is deliberately far
       * down the list and "about" near the top, so one line contains both a
       * word that must be marked and several that must not - which is the
       * actual claim, rather than "something got underlined". */
      const RANKS = {
        i: 5, have: 60, no: 30, idea: 900, what: 12, you: 0, are: 25,
        talking: 700, about: 90, and: 8, do: 40, not: 15, care: 400,
        frankly: 14200, get: 55, down: 120, fine: 500, did: 45, see: 70,
        that: 5, saw: 300, nothing: 250, at: 20, all: 35, ormon: null,
        sighs: 8800,
        /* Only the pairing case uses this one, and that is the point: a lookup
         * is cached for the session, so a check that hovers a word another
         * check hovers later leaves that one with nothing to observe. */
        reckoning: 16400, is: 18, upon: 2200, us: 90,
        /* Turkish, and the point of these three is that they are COMMON. A
         * lowercasing that leaves a combining dot behind, or that turns a
         * dotless capital into a dotted i, produces a word this table has never
         * heard of - and never heard of is the rarest thing there is. */
        iyi: 25, iki: 113, "ışık": 2400, yandı: 5200,
      };
      // See "a helper that is not answering ...": the one case where the stub
      // has to fail the way the real worker fails.
      let rankFails = false;
      const lookupCalls = [];
      const lookupTargets = [];
      /* The line a word was said in. Recorded because it is the difference
       * between "spare a minute" and "a spare tyre", and because it is half of
       * the key an answer is filed under - a call that drops it does not fail,
       * it quietly fetches a different word's meaning. */
      const lookupSentences = [];
      const glossAsks = [];
      const deckSaves = [];

      // Cue payloads in the exact shape the daemon emits.
      const CUES = [
        { start: 0, end: 600000, text: "[Ormon] Get down!",
          runs: [{ text: "[Ormon]", color: "#ffc857", kind: "speaker" },
                 { text: " Get down!" }] },
        { start: 600000, end: 900000, text: "[sighs] Fine.",
          runs: [{ text: "[sighs]", styles: ["i"], kind: "sound", symbol: "\u{1F62E}‍\u{1F4A8}" },
                 { text: " Fine.", styles: ["i"] }] },
        // Wrapped the way subtitle files really are: two short lines broken
        // for a 4:3 television, not for the screen this will be shown on.
        { start: 1200000, end: 1500000,
          text: "I have no idea what you are talking\nabout, and frankly I do not care.",
          runs: [{ text: "I have no idea what you are talking\n" },
                 { text: "about, and frankly I do not care." }] },
        // Two speakers in one cue. Here the break is meaning, not wrapping,
        // and it sits at the boundary between two runs.
        { start: 1500000, end: 1800000,
          text: "- Did you see that?\n- I saw nothing at all.",
          runs: [{ text: "- Did you see that?\n" },
                 { text: "- I saw nothing at all." }] },
        /* A line of a song, in the shape markup.js produces for it. The marks
         * and the words between them are two different kinds on purpose: the
         * marks are punctuation and recede when non-speech is dimmed, and what
         * they bracket is words to read. */
        { start: 1800000, end: 2100000, text: "\u266a Round and round \u266a",
          runs: [{ text: "\u266a", color: "#c0a9e6", kind: "music" },
                 { text: " " },
                 { text: "Round and round", color: "#c0a9e6", kind: "lyric" },
                 { text: " " },
                 { text: "\u266a", color: "#c0a9e6", kind: "music" }] },
      ];

      const video = document.getElementById("v");
      // Configurable, so a case can swap the stream for a different one - which
      // is what starting the next episode looks like from in here.
      Object.defineProperty(video, "duration", { get: () => 7200, configurable: true });
      /* A two-hour film can always be seeked over, and that is now the
       * difference between a length the extension can trust and one that is
       * only what has arrived so far. A stub that claims the duration and not
       * the range claims something no real player does - the case below is the
       * one where they come apart. */
      Object.defineProperty(video, "seekable", {
        get: () => ({ length: 1, start: () => 0, end: () => video.duration }),
        configurable: true,
      });
      Object.defineProperty(video, "readyState", { get: () => 4, configurable: true });
      // Configurable, so a case can make pausing real - the overlay can stop
      // the film now, and a stub that is always playing cannot show that.
      Object.defineProperty(video, "paused", { get: () => false, configurable: true });
      let t = 1;
      /* Configurable, so a case can put a clock that really RUNS in its place.
       * A plain variable is right for every case that wants the playhead at a
       * known moment, and blind to everything about how the film moves between
       * ticks - which is the whole of what "stop at the end of each line" and
       * playback rate are about. */
      Object.defineProperty(video, "currentTime", {
        get: () => t,
        set: (x) => (t = x),
        configurable: true,
      });

      // Players own pointer events inside the player surface.
      for (const type of ["pointermove", "mousemove"]) {
        document.getElementById("player")
          .addEventListener(type, (e) => e.stopPropagation());
      }
    </script>

    <script>
      /* The sources, with a cache-buster, because the browser's memory cache
       * does not revalidate a URL it has already seen this session - and the
       * page URL is not the script URL, so reloading the harness reloaded the
       * page and kept the previous `content.js`.
       *
       * That is not a nuisance, it is a suite reporting on code that is no
       * longer on disk. Caught by adding a counter to a function and finding it
       * undefined while the suite ran and defined the moment it finished - the
       * last case re-injects with its own cache-buster, so only the very end of
       * the run was testing the current file. Everything before it had spent
       * the whole run agreeing with the previous version.
       *
       * document.write rather than appended elements: these are classic scripts
       * whose order matters, and this is the one construct that keeps a static
       * page's parse-order guarantee. */
      /* The Prime Video ear first, as the page's own script - which is what it
       * is in the manifest (world: MAIN, document_start). It wraps fetch and
       * XMLHttpRequest transparently, so every other case runs through the
       * wrapped pair and would notice if they were not. */
      for (const src of ["sites/primevideo", "sites/netflix", "sites/survey", "sites/streams", "sites/youtube", "align", "content", "panel", "study"]) {
        document.write(`<script src="../src/${src}.js?t=${Date.now()}"><\/script>`);
      }
    </script>

    <script>
      // --- assertions -----------------------------------------------------
      const cases = [];
      const check = (name, fn) => cases.push({ name, fn });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // Cue 2 carries the italics, the sound run and the symbol. It is only
      // rendered while the playhead is inside it, so checks about it have to
      // move the clock first.
      const showSoundCue = async () => { video.currentTime = 700; await sleep(120); };
      const showLyricCue = async () => { video.currentTime = 1900; await sleep(120); };
      const showSpeakerCue = async () => { video.currentTime = 1; await sleep(120); };
      const shadowOf = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-root"))?.shadowRoot;
      const panelShadow = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-panel"))?.shadowRoot;

      /* Settings and Style are windows of their own, not screens in the panel,
       * so they are looked for in the document rather than inside it - and by
       * TITLE, because there can now be two of them open at once and the first
       * `.sso-sheet` in the document is whichever was created first. A helper
       * that returned "a window" was fine while there was only one; with two it
       * would quietly assert against the wrong surface. */
      const sheetNamed = (word) =>
        [...document.querySelectorAll("div")]
          .map((d) => d.shadowRoot)
          .find((s) => s?.querySelector(".sso-sheet") &&
            new RegExp(word, "i").test(s.querySelector(".sso-win__title")?.textContent || ""));
      const sheetShadow = () => sheetNamed("settings");
      /* The gear is a toggle, so this asks rather than presses blindly: a case
       * that opened the settings and did not close them would otherwise have
       * the next one SHUT them and then look for a window that is not there. */
      const openSettings = async () => {
        const gear = panelShadow().querySelector(".sso-icon--gear");
        if (gear?.dataset.on !== "true") gear?.click();
        await sleep(220);
        return sheetShadow();
      };

      check("overlay lives in a shadow root, out of reach of page CSS", () => {
        if (!shadowOf()) throw new Error("no shadow root holding .sso-root");
      });

      check("cue text is not recoloured by the page's span rule", async () => {
        await showSpeakerCue();
        const run = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-speaker"));
        const color = getComputedStyle(run).color;
        if (color.includes("255, 0, 255")) throw new Error("page span colour leaked in: " + color);
      });

      check("italic survives the page's font-style reset", async () => {
        await showSoundCue();
        const italic = [...shadowOf().querySelectorAll(".sso-i")][0];
        if (!italic) throw new Error("no italic run rendered");
        if (getComputedStyle(italic).fontStyle !== "italic")
          throw new Error("font-style is " + getComputedStyle(italic).fontStyle);
      });

      check("speaker run keeps its identity colour", async () => {
        await showSpeakerCue();
        const speaker = shadowOf().querySelector(".sso-speaker");
        if (!speaker) throw new Error("no speaker run");
        const c = getComputedStyle(speaker).color;
        if (!c.includes("255, 200, 87")) throw new Error("speaker colour is " + c);
      });

      check("sound run is dimmed relative to dialogue", async () => {
        await showSoundCue();
        const sound = shadowOf().querySelector(".sso-sound");
        const dialogue = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-sound") && !r.classList.contains("sso-speaker"));
        if (!sound || !dialogue) throw new Error("expected a sound run and a dialogue run");
        if (Number(getComputedStyle(sound).opacity) >= Number(getComputedStyle(dialogue).opacity))
          throw new Error("sound is not dimmer than speech");
      });

      check("a lyric is set apart from the dialogue, and not dimmed away with the marks", async () => {
        /* Reported as: the note symbols are coloured and the words between them
         * are not. They are usually a song, and a song is not a line somebody
         * said - very often it is a second voice over dialogue that is also on
         * screen, which is the case colour has to answer.
         *
         * The marks are punctuation and go quiet under dimNonSpeech; the words
         * are the content and must not, or the reader is asked to read the one
         * thing on screen at 72%. */
        const was = window.__ssoApi.status().settings.dimNonSpeech;
        try {
          window.__ssoApi.updateSettings({ dimNonSpeech: true });
          await showLyricCue();
          const lyric = shadowOf().querySelector(".sso-lyric");
          const mark = shadowOf().querySelector(".sso-music");
          if (!lyric || !mark) throw new Error("expected a lyric run and a mark run");
          if (!lyric.textContent.includes("Round and round"))
            throw new Error(`the lyric run reads ${JSON.stringify(lyric.textContent)}`);

          if (getComputedStyle(lyric).fontStyle !== "italic")
            throw new Error("a lyric is not italic, so it reads as dialogue");
          const colour = getComputedStyle(lyric).color;
          if (colour !== getComputedStyle(mark).color)
            throw new Error(`the lyric is ${colour} and its own marks are ${getComputedStyle(mark).color}`);

          const lyricOpacity = Number(getComputedStyle(lyric).opacity);
          const markOpacity = Number(getComputedStyle(mark).opacity);
          if (!(markOpacity < lyricOpacity))
            throw new Error(`marks at ${markOpacity} are not quieter than the words at ${lyricOpacity}`);
        } finally {
          window.__ssoApi.updateSettings({ dimNonSpeech: was });
        }
      });

      check("sound symbol is rendered beside the words", async () => {
        await showSoundCue();
        const symbol = shadowOf().querySelector(".sso-symbol");
        if (!symbol || !symbol.textContent.trim()) throw new Error("no symbol");
        if (!shadowOf().querySelector(".sso-sound").textContent.includes("sighs"))
          throw new Error("symbol replaced the word instead of joining it");
      });

      check("CC handle appears despite the player swallowing pointer events", async () => {
        document.getElementById("player")
          .dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
        await sleep(80);
        const h = shadowOf().querySelector(".sso-handle");
        if (!h) throw new Error("handle missing");
        const cs = getComputedStyle(h);
        if (cs.visibility === "hidden" || Number(cs.opacity) === 0)
          throw new Error(`hidden: visibility=${cs.visibility} opacity=${cs.opacity}`);
      });

      /* A feed page: the page's own player is gone and the only video is one a
       * row plays while the pointer is over it. Sizes are the ones measured on
       * YouTube's results page - 504x211 in a 1440x900 window, duration 464s -
       * expressed as fractions of the window so the case does not depend on
       * the size of the browser running it. */
      async function onFeedPage(shape, run) {
        const player = document.getElementById("player");
        const handle = shadowOf().querySelector(".sso-handle");
        const preview = document.createElement("video");
        preview.style.display = "block";
        preview.style.width = `${Math.round(shape.width * window.innerWidth)}px`;
        preview.style.height = `${Math.round(shape.height * window.innerHeight)}px`;
        Object.defineProperty(preview, "duration", { get: () => 464 });
        Object.defineProperty(preview, "seekable", {
          get: () => ({ length: 1, start: () => 0, end: () => 464 }),
        });
        Object.defineProperty(preview, "readyState", { get: () => 4 });
        Object.defineProperty(preview, "paused", { get: () => false });

        let holder = preview;
        if (shape.inLink) {
          holder = document.createElement("a");
          holder.href = "#watch";
          holder.style.display = "block";
          holder.append(preview);
        }
        document.body.append(holder);
        player.style.display = "none";     // no player on this page, only rows
        handle.dataset.visible = "false";
        try {
          preview.dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
          await sleep(80);
          return await run(handle, preview);
        } finally {
          holder.remove();
          player.style.display = "";
        }
      }

      const handleShowing = (handle) =>
        handle.dataset.visible === "true" && Number(getComputedStyle(handle).opacity) > 0;

      check("CC handle stays away from a feed row's hover preview", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("the handle appeared over a thumbnail - this page has nothing to subtitle");
        }));

      check("CC handle stays away from a video too small to be the page's subject", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: false }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a video covering 8% of the window was treated as the page's subject");
        }));

      /* Size alone does not settle it. The preview keeps roughly its share of
       * the row, so in a narrower window it grows against the window: the same
       * tile that covers 7% of a maximised screen covers about 18% of a
       * 1000x600 one, which clears the floor. Being inside the link that opens
       * it is what still identifies it. */
      check("CC handle stays away from a hover preview large enough to clear the floor", () =>
        onFeedPage({ width: 0.55, height: 0.4, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a link-wrapped preview got the handle once it was big enough");
        }));

      /* The control for the two above: the rule has to admit a player that is
       * merely large, not only one that fills the window, or an article with a
       * video in it would lose the handle. This is the watch page's 32%. */
      check("CC handle appears for a player that is large without filling the window", () =>
        onFeedPage({ width: 0.7, height: 0.46, inLink: false }, (handle) => {
          if (!handleShowing(handle))
            throw new Error("a player covering a third of the window did not get the handle");
        }));

      check("CC handle keeps its size against the page's button reset", () => {
        const box = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        if (box.width < 20 || box.height < 14)
          throw new Error(`collapsed to ${Math.round(box.width)}x${Math.round(box.height)}`);
      });

      check("overlay stays above chrome appended later at equal z-index", () => {
        const host = shadowOf().host;
        const later = document.getElementById("later");
        if (host.compareDocumentPosition(later) & Node.DOCUMENT_POSITION_FOLLOWING)
          throw new Error("player chrome is after the overlay in document order");
      });

      /* Poll to a deadline, never a fixed sleep.
       *
       * Anything that builds a surface fetches two stylesheets first, so how
       * long it takes is a property of the machine rather than of the code. A
       * fixed wait passes on a quiet one and fails on a loaded one, which is a
       * flaky case rather than a slow one: this suite failed "CC handle opens
       * the panel" intermittently, and the panel was fine every time. */
      const until = async (what, describe, ms = 4000) => {
        const deadline = performance.now() + ms;
        for (;;) {
          const value = what();
          if (value) return value;
          if (performance.now() > deadline) throw new Error(describe);
          await sleep(25);
        }
      };

      check("CC handle opens the panel", async () => {
        shadowOf().querySelector(".sso-handle").click();
        await until(panelShadow, "panel did not open");
      });

      /* Prime stitches ads into the same stream, so currentTime keeps running
       * through the break while the film stands still. Simulate exactly that:
       * show an ad marker, advance the clock, hide it again. */
      const adBreak = async (seconds) => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);                       // detector polls at 400ms
        video.currentTime += seconds;           // stream advances, film does not
        await sleep(200);
        slot.innerHTML = "";
        await sleep(500);
      };

      check("an ad break is detected and its time removed", async () => {
        await showSpeakerCue();
        const before = window.__ssoApi.status().adDriftMs || 0;
        await adBreak(90);
        const after = window.__ssoApi.status().adDriftMs;
        if (Math.abs(after - before - 90000) > 1500)
          throw new Error(`measured ${Math.round((after - before) / 1000)}s of ad, expected ~90s`);
      });

      check("the same cue is still showing after the ad break", async () => {
        video.currentTime = 1;
        window.__ssoApi.clearAdDrift();
        await sleep(150);
        const before = shadowOf().querySelector(".sso-cue").textContent;
        await adBreak(90);
        // Film time is unchanged: stream moved 90s, all of it advertising.
        const after = shadowOf().querySelector(".sso-cue").textContent;
        if (before !== after)
          throw new Error(`cue changed across the ad break: "${before}" -> "${after}"`);
      });

      check("subtitles are hidden while the ad plays", async () => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);
        const text = shadowOf().querySelector(".sso-cue").textContent.trim();
        slot.innerHTML = "";
        await sleep(500);
        if (text) throw new Error("cue still rendered during the ad: " + text);
      });

      /* An advert interrupts the video, not one of the subtitle files - so the
       * measured time has to survive a second subtitle arriving.
       *
       * attach() used to clear it, which quietly broke the subtitle that was
       * already correct. Measured before the fix: 90000ms of ad time held, then
       * 0 the moment a second subtitle landed in the empty slot, leaving the
       * first one ninety seconds out with nothing on screen saying why. On a
       * stream with server-side ads and a dual-language setup that is the
       * ordinary path - attach one, watch, add the other. */
      check("ad time survives a second subtitle being attached", async () => {
        window.__ssoApi.detach();
        window.__ssoApi.clearAdDrift();
        await window.__ssoApi.attach({ cues: CUES, label: "EN", fileId: 8801, language: "en", slot: 0 });
        await adBreak(90);
        const measured = window.__ssoApi.status().adDriftMs;
        if (Math.abs(measured - 90000) > 1500)
          throw new Error(`the ad break was not measured: ${measured}ms`);

        await window.__ssoApi.attach({ cues: CUES, label: "TR", fileId: 8802, language: "tr", slot: 1 });
        await sleep(150);
        const after = window.__ssoApi.status().adDriftMs;
        if (after !== measured)
          throw new Error(`attaching a second subtitle changed the ad time: ${measured} -> ${after}`);
      });

      /* ...and must NOT survive the next episode, which is a different
       * playback. The stamp is the same settled programme mark the worker is
       * told about, so a title flicker does not throw the correction away. */
      check("ad time does not carry into the next programme", async () => {
        const was = document.title;
        try {
          if (!window.__ssoApi.status().adDriftMs)
            throw new Error("the previous case should have left ad time measured");
          document.title = "The Americans S02E03";
          // Longer than PROGRAMME_SETTLE_MS, so the mark is committed.
          await sleep(1900);
          const after = window.__ssoApi.status().adDriftMs;
          if (after !== 0)
            throw new Error(`the last programme's ad time was kept: ${after}ms`);
        } finally {
          document.title = was;
          await sleep(1900);
          window.__ssoApi.detach();
          await window.__ssoApi.attach({ cues: CUES, label: "EN", fileId: 1, language: "en", slot: 0 });
        }
      });

      check("a marker that flickers is not counted as an ad", async () => {
        window.__ssoApi.clearAdDrift();
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="ad-timer" style="position:fixed;width:20px;height:10px"></div>';
        await sleep(500);
        video.currentTime += 0.5;   // far below the two-second floor
        slot.innerHTML = "";
        await sleep(500);
        if ((window.__ssoApi.status().adDriftMs || 0) !== 0)
          throw new Error("a sub-second flicker was counted as an ad break");
      });

      // How long the arrived length sits still between steps, on the model
      // above. The real one was about two seconds.
      const STEP_MS = 1500;

      /* A stream the server is making as it sends it.
       *
       * Every part of this is the measurement rather than an invention. The
       * duration is only what has arrived, so it GROWS - about 2.2 seconds of
       * length per second of playing, which is what the real one did: 3.878,
       * 9.675, 18.476, 33.408 over the first fifteen seconds. And `seekable`
       * covers what has arrived rather than being empty, which is the part that
       * looks wrong and is not: a stream ten seconds in reports exactly what a
       * ten-second file that can be seeked reports. That is why the growth is
       * the thing watched. */
      async function whileStillArriving(arrivedSeconds, run) {
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const wasSeekable = Object.getOwnPropertyDescriptor(video, "seekable");
        const from = performance.now();
        /* In STEPS, because that is what it does. A smooth ramp was the model
         * here first, and a smooth ramp hides everything about how long the
         * extension waits: the real one sat at 6.5 seconds, went to 15, sat
         * there, went on. Measured at 500ms intervals on the catalogue app. */
        Object.defineProperty(video, "duration", {
          get: () => arrivedSeconds + Math.floor((performance.now() - from) / STEP_MS) * 3.3,
          configurable: true,
        });
        Object.defineProperty(video, "seekable", {
          get: () => ({ length: 1, start: () => 0, end: () => video.duration }),
          configurable: true,
        });
        // Which video this page is about is cached for 250ms, and a length is
        // not distrusted until a step has been seen.
        await sleep(STEP_MS + 700);
        try {
          return await run();
        } finally {
          Object.defineProperty(video, "duration", wasDuration);
          Object.defineProperty(video, "seekable", wasSeekable);
          delete video.dataset.ssoTimeOffset;
          /* Putting the old stream back IS a new resource, and that is the
           * only thing that makes the extension forget it was watching one
           * being produced. Without this the element stays a stream for the
           * rest of the run, which is right on a real page and wrong here. */
          video.dispatchEvent(new Event("loadstart"));
          await sleep(300);
        }
      }

      /* Reported as "this address can play my local video, but the subtitle
       * overlay is not shown in this page somehow". The page was serving a
       * Matroska file repackaged as it was sent - no byte ranges, no length -
       * so the duration was whatever had arrived and grew as it played:
       * 3.878, 9.675, 18.476, 33.408 over the first fifteen seconds, measured
       * in Chrome. Tested against sixty seconds that is not a film, so there
       * was no CC handle and nowhere to attach anything, for the first minute
       * of every playback. */
      check("a film being repackaged as it plays is still the film", () =>
        whileStillArriving(3.878, () => {
          if (!window.__ssoApi.status().hasVideo)
            throw new Error("4s of a two-hour episode was refused as too short to subtitle");
        }));

      /* ...and the number it grew from is not a length. A growing one is worse
       * than none: it is what the map would draw, what the programme mark would
       * key on - so every tick would look like the next episode starting - and
       * what the drift estimator would divide by. Every reader of it already
       * handles not knowing. */
      check("a length that is only what has arrived is not reported as the film's", () =>
        whileStillArriving(3.878, async () => {
          const said = window.__ssoApi.status().duration;
          if (said !== null)
            throw new Error(`reported ${said}s as the length of a two-hour episode`);
        }));

      /* ...and it stays not a length while the stream pauses.
       *
       * A server writing into a pipe stops whenever the player has buffered
       * enough, so growth comes in bursts with gaps of seconds between them.
       * Read as "grew recently" the reported length flips between the page's
       * and the arrived-so-far one - ten times in twenty-four seconds on the
       * real page - and since the programme mark is keyed on the length, each
       * flip took both subtitles off and put them back. */
      check("a stream that pauses between bursts is not a film that just ended", () =>
        /* Started past the minute mark on purpose: a stream only six seconds in
         * is refused for being short whatever this decides, so the arrived-so-
         * far number has to be a plausible film length for the check to have
         * anything to catch. */
        whileStillArriving(120, async () => {
          const wasArriving = Object.getOwnPropertyDescriptor(video, "duration");
          const stuck = video.duration;
          Object.defineProperty(video, "duration", { get: () => stuck, configurable: true });
          await sleep(2400);   // longer than any window worth watching for
          const said = window.__ssoApi.status().duration;
          Object.defineProperty(video, "duration", wasArriving);
          if (said !== null)
            throw new Error(`a pause in the stream made ${said}s look like the film's length`);
        }));

      /* The control. A length arriving from nothing is not a length growing,
       * and a player that sets its duration once and late must keep its map
       * for the rest of the film. This is why one step is enough to distrust
       * the number: the case that looks like it needs two is this one, and it
       * never reaches the count at all. */
      check("a player that states its length once, late, is believed", async () => {
        video.dispatchEvent(new Event("loadstart"));   // nothing known about it yet
        const was = Object.getOwnPropertyDescriptor(video, "duration");
        Object.defineProperty(video, "duration", { get: () => NaN, configurable: true });
        await sleep(600);
        Object.defineProperty(video, "duration", { get: () => 7200, configurable: true });
        await sleep(600);
        const said = window.__ssoApi.status().duration;
        Object.defineProperty(video, "duration", was);
        video.dispatchEvent(new Event("loadstart"));
        await sleep(300);
        if (said !== 7200)
          throw new Error(`a length that arrived once was treated as a stream: ${said}`);
      });

      /* ...and the film is taken at the FIRST step, not the third.
       *
       * Waiting for a second step was a guard against the check above, which
       * turned out never to be at risk. What it cost was measured on the
       * catalogue app: twenty consecutive samples at 500ms with no video
       * detected - ten seconds of every playback with no overlay, no CC handle
       * and nothing to attach to. Reported as "sometimes it says that there is
       * no video playing", on a page that plays every time. */
      check("a stream whose length arrives in steps is the film at the first step", async () => {
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        const wasSeekable = Object.getOwnPropertyDescriptor(video, "seekable");
        video.dispatchEvent(new Event("loadstart"));
        const from = performance.now();
        Object.defineProperty(video, "duration", {
          get: () => 6.5 + Math.floor((performance.now() - from) / STEP_MS) * 8,
          configurable: true,
        });
        Object.defineProperty(video, "seekable", {
          get: () => ({ length: 1, start: () => 0, end: () => video.duration }),
          configurable: true,
        });
        try {
          // Six seconds of film is refused for being short, and should be.
          await sleep(400);
          if (window.__ssoApi.status().hasVideo)
            throw new Error("six seconds of arrived stream was taken for the film");
          const waitingFrom = performance.now();
          let took = null;
          for (let i = 0; i < 60 && took === null; i++) {
            await sleep(100);
            if (window.__ssoApi.status().hasVideo) took = Math.round(performance.now() - waitingFrom);
          }
          if (took === null || took > 2500)
            throw new Error(`the film was refused for ${took === null ? "six whole seconds" : took + "ms"}`);
        } finally {
          Object.defineProperty(video, "duration", wasDuration);
          Object.defineProperty(video, "seekable", wasSeekable);
          video.dispatchEvent(new Event("loadstart"));
          await sleep(300);
        }
      });

      /* ...and a page that KNOWS the length is believed, through the standard
       * vocabulary rather than through anything invented here. A `VideoObject`
       * describes the encode on the page, so its duration can carry the
       * fractional seconds the work's own published runtime rounds away - half
       * a minute of error would be visible on the map this feeds. */
      check("a length the page states is used when the element's own cannot be", () => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "VideoObject",
          name: "Baggage",
          duration: "PT46M13.162S",
        });
        document.head.append(script);
        return whileStillArriving(3.878, async () => {
          await sleep(150);
          const said = window.__ssoApi.status().duration;
          if (Math.abs(said - 2773.162) > 0.01)
            throw new Error(`the page said PT46M13.162S and the extension reports ${said}`);
        }).finally(() => script.remove());
      });

      /* The other half of that page, and the one that would have looked like a
       * sync bug instead of a missing overlay. A stream that cannot be seeked
       * is seeked by fetching a new one that starts at the moment asked for, so
       * resuming 25 minutes in gives an element whose clock starts at zero
       * while the picture is 25 minutes in. Nothing about the element says so;
       * the page does, and everything here is on the film's clock. */
      check("a player that streams from an offset is read on the film's clock", () =>
        whileStillArriving(3.878, async () => {
          video.dataset.ssoTimeOffset = "1500";
          video.currentTime = 1;
          await sleep(200);
          const status = window.__ssoApi.status();
          if (Math.abs(status.currentTime - 1501) > 0.01)
            throw new Error(`the film is 25:01 in and the extension reads ${status.currentTime}s`);
          const drawn = shadowOf().querySelector(".sso-cue")?.textContent || "";
          if (!drawn.includes("I saw nothing at all"))
            throw new Error(`the line at 25:01 was not the one drawn: "${drawn.trim().slice(0, 40)}"`);
        }));

      /* ...and the same page again once somebody uses the scrubber.
       *
       * Reported as "when I rewind or forward the movie, subtitle position
       * becomes conflated and drifted - it is not true to the movie time".
       *
       * A stream that cannot be seeked is seeked by throwing it away and
       * fetching another one that begins at the new moment, so a seek is three
       * separate changes to the element and the player cannot make them in one
       * go: the source is replaced straight away, and the offset it states is
       * written by the framework on its next flush. In between, the element
       * reads zero on the clock with the PREVIOUS stream's offset still on it -
       * which is the old position exactly, and the reason this is written as a
       * sequence rather than as one assignment.
       *
       * What is asserted is where it settles. A frame or two of the outgoing
       * line is not what was reported; a film that stays half an hour out is.
       */
      check("a seek to a new stream is read on the film's clock, not the old one's", () =>
        whileStillArriving(3.878, async () => {
          // Resumed 25 minutes in: the stream starts there, the clock at zero.
          video.dataset.ssoTimeOffset = "1500";
          video.currentTime = 100;
          await sleep(200);
          const at = window.__ssoApi.status().currentTime;
          if (Math.abs(at - 1600) > 0.01)
            throw new Error(`the film is 26:40 in and the extension reads ${at}s`);

          // Now rewind to 11 minutes, in the order the player really does it.
          video.currentTime = 0;
          video.dispatchEvent(new Event("loadstart"));
          await sleep(120);
          video.dataset.ssoTimeOffset = "660";
          await sleep(400);

          const back = window.__ssoApi.status().currentTime;
          if (Math.abs(back - 660) > 0.01)
            throw new Error(`rewound to 11:00 and the extension reads ${back}s`);
          const drawn = shadowOf().querySelector(".sso-cue")?.textContent || "";
          if (!drawn.includes("Fine."))
            throw new Error(`the line at 11:00 was not the one drawn: "${drawn.trim().slice(0, 40)}"`);
        }));

      /* A film still arriving, told apart from a page with no film.
       *
       * The worker waits for one and refuses the other, and `hasVideo` is
       * false for both - so this is the whole basis of that decision. Reported
       * as "it fails to find subtitles, and even video for a while - I need to
       * try multiple times": the search used to read hasVideo once and give
       * up, and on a stream produced as it is sent that reading is false for
       * anywhere between a fraction of a second and several seconds.
       *
       * The size test is what says "somebody's player"; the length test is
       * what says "enough of it has arrived". Only the second may be false
       * while the extension waits. */
      check("a film that has not arrived yet says it is on its way", async () => {
        const was = Object.getOwnPropertyDescriptor(video, "duration");
        // Eight seconds of a film is a player with hardly any film in it.
        Object.defineProperty(video, "duration", { get: () => 8, configurable: true });
        try {
          await sleep(400);
          const status = window.__ssoApi.status();
          if (status.hasVideo)
            throw new Error("eight seconds of arrived stream was taken for the whole film");
          if (!status.videoComing)
            throw new Error("the player is there and the right size, and it said nothing is coming");
        } finally {
          Object.defineProperty(video, "duration", was);
          video.dispatchEvent(new Event("loadstart"));
          await sleep(400);
        }
      });

      check("a page with no player says so, so the search is refused at once", async () => {
        const wasWidth = video.style.width;
        const wasHeight = video.style.height;
        // Too small to be anybody's player, which is the one signal that means
        // "there is nothing here to wait for".
        video.style.width = "80px";
        video.style.height = "40px";
        try {
          await sleep(400);
          const status = window.__ssoApi.status();
          if (status.videoComing)
            throw new Error("an 80x40 video was reported as a film on its way");
        } finally {
          video.style.width = wasWidth;
          video.style.height = wasHeight;
          await sleep(400);
        }
      });

      /* What the page says it is showing, asked for the way the worker asks.
       *
       * The worker sends `sso:pageInfo` to every frame and chooses between the
       * answers; this is the answering half, which is where the reading of the
       * page happens. The listeners are kept by the chrome stub for exactly
       * this - the worker's own half is not loaded here. */
      const askPage = () => {
        let answer;
        for (const listener of window.__listeners) {
          listener({ type: "sso:pageInfo" }, {}, (reply) => { answer = reply; });
        }
        return answer;
      };

      /* Reported on a local catalogue app: an episode page whose every visible
       * title is the episode's own name, so the search went out as "Baggage"
       * and found nothing. OpenSubtitles indexes an episode under its SERIES
       * with the numbers beside it, and the page had all three in schema.org -
       * inside `@graph`, which is how most site generators emit it, and in
       * `episodeNumber`, which nothing here was reading. */
      check("an episode page's series and numbers are read out of its metadata", async () => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@graph": [
            { "@type": "WebPage", name: "Catalogue" },
            {
              "@type": ["TVEpisode", "CreativeWork"],
              name: "Baggage",
              episodeNumber: 2,
              partOfSeason: { "@type": "TVSeason", seasonNumber: 3 },
              partOfSeries: { "@type": "TVSeries", name: "The Americans" },
              datePublished: "2015-01-28",
            },
          ],
        });
        document.head.append(script);
        try {
          const info = askPage();
          if (!info) throw new Error("nothing answered sso:pageInfo");
          const series = info.candidates.find((c) => c.source === "json-ld-series");
          if (series?.text !== "The Americans")
            throw new Error(`the series was not offered: ${JSON.stringify(info.candidates)}`);
          const stated = info.episode?.fromMetadata;
          if (stated?.season !== 3 || stated?.episode !== 2)
            throw new Error(`the stated episode was not read: ${JSON.stringify(info.episode)}`);
          if (info.year !== 2015)
            throw new Error(`the year was not read: ${info.year}`);
        } finally {
          script.remove();
        }
      });

      /* Reported: "some movies have alternative names in other languages, so
       * searching for 'Once Upon a Crime' to find Turkish subtitles reveals
       * far fewer results than searching by the original Turkish name. I'd
       * prefer standard means, so any third-party movie app and any
       * third-party subtitle app could work together."
       *
       * schema.org already has the words for both halves and neither was being
       * read. `alternateName` is the vocabulary term for "also called", and
       * `sameAs` is how a page links to the thing's entry somewhere
       * authoritative - which for a film is IMDb, and an id ends the question
       * outright because the language of the title stops mattering.
       */
      check("a page's other names and its IMDb link are read, because both are standard", async () => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Movie",
          name: "Once Upon a Crime",
          alternateName: ["Suclu Bir Zamanlar", "Il etait une fois le crime"],
          sameAs: ["https://www.imdb.com/title/tt0105130/", "https://example.invalid/x"],
          datePublished: "1992-03-06",
        });
        document.head.append(script);
        try {
          const info = askPage();
          if (!info) throw new Error("nothing answered sso:pageInfo");
          if (!info.altTitles?.includes("Suclu Bir Zamanlar"))
            throw new Error(`the other names were not read: ${JSON.stringify(info.altTitles)}`);
          if (info.altTitles.length !== 2)
            throw new Error(`expected both other names, got ${JSON.stringify(info.altTitles)}`);
          if (info.statedImdb !== "tt0105130")
            throw new Error(`the IMDb link was not read: ${info.statedImdb}`);
          /* And they stay out of the candidate list. They are not competing
           * guesses at the one right title - they are the same programme's
           * other names, and ranking them against it would let a foreign name
           * win the search the page's own name should have made. */
          if (info.candidates.some((c) => c.text === "Suclu Bir Zamanlar"))
            throw new Error("an alternative name was offered as a title guess");
        } finally {
          script.remove();
        }
      });

      /* The other standard statement a page makes about what it is playing, and
       * the one that covers sites with no structured data at all. Measured
       * first: an isolated world can read what the page set, which is the only
       * reason this is worth reading. */
      check("what the page told the browser it is playing is offered too", async () => {
        const was = navigator.mediaSession.metadata;
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Baggage", artist: "The Americans", album: "Season 3, Episode 2",
        });
        try {
          const sources = askPage().candidates.reduce((all, c) => ({ ...all, [c.source]: c.text }), {});
          if (sources["mediaSession.title"] !== "Baggage")
            throw new Error(`the title was not offered: ${JSON.stringify(sources)}`);
          if (sources["mediaSession.artist"] !== "The Americans")
            throw new Error(`the artist was not offered: ${JSON.stringify(sources)}`);
          if (sources["mediaSession.album"] !== "Season 3, Episode 2")
            throw new Error(`the album was not offered: ${JSON.stringify(sources)}`);
        } finally {
          navigator.mediaSession.metadata = was;
        }
      });

      /* The control. A film has no series and no episode number, and inventing
       * either would send a search for something that does not exist. */
      check("a film's metadata states no episode, and none is invented", async () => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Movie",
          name: "Mercy",
          datePublished: "2016-01-01",
        });
        document.head.append(script);
        try {
          const info = askPage();
          if (info.episode?.fromMetadata)
            throw new Error(`a film was given an episode: ${JSON.stringify(info.episode.fromMetadata)}`);
          if (!info.candidates.some((c) => c.source === "json-ld" && c.text === "Mercy"))
            throw new Error(`the film's name was not offered: ${JSON.stringify(info.candidates)}`);
        } finally {
          script.remove();
        }
      });

      /* A number in a title is not a year, and `titles.js` already says so:
       * "a bare trailing number is left alone, because Blade Runner 2049 is a
       * real title". The scrape here did not, so a page with no structured date
       * reported 2049 - and the year is a hard filter on the search, so the
       * answer is nothing found for a film that has subtitles in every
       * language. A bracketed one is the year: "(2017)" beside the title is how
       * every site prints it, and a bare chip near the heading is scraped
       * separately, where bare IS the signal. */
      check("a number in the title is not read as the film's year", async () => {
        const was = document.title;
        try {
          document.title = "Blade Runner 2049";
          if (askPage().year !== null)
            throw new Error(`the title's own number was read as a year: ${askPage().year}`);
          document.title = "Blade Runner 2049 (2017)";
          if (askPage().year !== 2017)
            throw new Error(`the bracketed year was not read: ${askPage().year}`);
        } finally {
          document.title = was;
        }
      });

      /* A field that is present and empty has not been stated.
       *
       * Site generators emit the whole vocabulary and leave the parts they have
       * no value for as empty strings - it is the ordinary output of every SEO
       * plugin. `Number("")` is 0, so an empty episodeNumber reads as episode
       * zero of season zero, and because a stated episode outranks one scraped
       * out of a title or an address, that invented pair wins over the real
       * one and the search goes out for something that does not exist. */
      check("a page that states an empty episode number has not stated one", async () => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "TVEpisode",
          name: "Baggage",
          episodeNumber: "",
          partOfSeason: { "@type": "TVSeason", seasonNumber: "" },
          partOfSeries: { "@type": "TVSeries", name: "The Americans" },
        });
        document.head.append(script);
        try {
          const stated = askPage().episode?.fromMetadata;
          if (stated)
            throw new Error(`two empty fields became S${stated.season}E${stated.episode}`);
        } finally {
          script.remove();
        }
      });

      /* Prime Video, watching Monk: the film plays in place on the series page,
       * so the address and the tab title never change, and while the video was
       * live the page offered h1 "Monk" and title "Prime Video: Monk" and
       * nothing else - no mediaSession, no schema.org, no Open Graph, measured
       * on four snapshots. The one string on such a page that names what is on
       * screen is the player's own overlay, and it carries no "selected"
       * marker because it is not a choice among several. Below it, the series
       * page lists every episode in the same notation, fifteen times over. */
      const primeLike = (overlayText) => {
        const overlay = document.createElement("div");
        overlay.className = "fake-overlay";
        overlay.textContent = overlayText;
        overlay.style.cssText = "position:absolute;top:8px;left:8px;color:#fff";
        document.getElementById("player").append(overlay);
        const list = document.createElement("ul");
        list.className = "fake-episodes";
        list.style.cssText = "position:relative;min-height:200vh";
        for (let n = 1; n <= 15; n++) {
          const item = document.createElement("li");
          item.textContent = `S1 E${n} - Mr. Monk and episode ${n}`;
          if (n === 1) item.className = "selected";
          list.append(item);
        }
        document.body.append(list);
        return () => { overlay.remove(); list.remove(); };
      };

      check("the episode written inside the player is read, and the list outside it is not", async () => {
        const done = primeLike("S1 E7 Mr. Monk and the Billionaire Mugger");
        try {
          const info = askPage();
          const seen = info.episode?.fromPlayer;
          if (!seen || seen.season !== 1 || seen.episode !== 7)
            throw new Error(`the overlay says S1 E7; fromPlayer was ${JSON.stringify(seen)}`);
          if (info.playerText?.length)
            throw new Error("evidence was kept although the player named the episode");
        } finally {
          done();
        }
      });

      check("a player that names no episode leaves its words in the log", async () => {
        const done = primeLike("Mr. Monk and the Billionaire Mugger");
        try {
          const info = askPage();
          if (info.episode?.fromPlayer)
            throw new Error(`nothing in the player says which episode; fromPlayer was ${JSON.stringify(info.episode.fromPlayer)}`);
          const kept = info.playerText || [];
          if (!kept.some((text) => text.includes("Billionaire Mugger")))
            throw new Error(`the overlay's words were not kept: ${JSON.stringify(kept)}`);
          if (kept.some((text) => /S1 E\d/.test(text)))
            throw new Error(`the episode list outside the player leaked into the sample: ${JSON.stringify(kept)}`);
        } finally {
          done();
        }
      });

      /* A stated length is only worth having while it is a length a film could
       * have. The page is the last word once the element's own duration cannot
       * be trusted, so an impossible one goes straight onto the map, into the
       * programme mark and into the drift estimator's divisor with nothing
       * downstream to catch it. The two shapes are a wrong unit - the local
       * catalogue app writes `PT${seconds}S`, and milliseconds there is 32 days
       * - and a placeholder short enough to make a film look like an advert. */
      const statingLength = async (iso, run) => {
        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.textContent = JSON.stringify({
          "@context": "https://schema.org", "@type": "VideoObject", name: "x", duration: iso,
        });
        document.head.append(script);
        try {
          return await whileStillArriving(120, async () => {
            await sleep(1100);   // the stated length is re-read once a second
            return run(window.__ssoApi.status());
          });
        } finally {
          script.remove();
        }
      };

      check("a length no film has is not believed because a page stated it", () =>
        statingLength("PT2773162S", (status) => {
          if (status.duration !== null)
            throw new Error(`32 days was taken as the length of the film: ${status.duration}`);
        }));

      check("a film is not refused because its page states an advert's length", () =>
        statingLength("PT30S", (status) => {
          if (status.duration !== null)
            throw new Error(`30s was taken as the length of the film: ${status.duration}`);
          if (!status.hasVideo)
            throw new Error("a page stating 30s took the film away from the overlay");
        }));

      /* Dragging the cue. The overlay is click-through apart from the cue
       * itself, which sits where people click to pause - so a press that does
       * not move must reach the player, and one that moves must not. */
      /* `buttons` matters and used to be omitted.
       *
       * A real pointermove during a drag reports the button still held; only
       * once it is released does it read zero. The overlay uses exactly that to
       * notice a drag whose release went missing - a player that stops
       * propagation on pointer events loses it routinely - so a helper that
       * never sets `buttons` describes a gesture no mouse performs, and would
       * make that guard look broken while the real bug it fixes went untested. */
      const dragCue = async (fromX, fromY, toX, toY) => {
        const cue = shadowOf().querySelector(".sso-cue");
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cue.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        cue.dispatchEvent(ev("pointermove", toX, toY, 1));
        cue.dispatchEvent(ev("pointerup", toX, toY, 0));
        await sleep(120);
      };

      check("dragging the subtitle moves it", async () => {
        await showSpeakerCue();
        const before = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        await dragCue(before.left + 20, before.top + 8, 300, 260);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (Math.abs(after.top - before.top) < 40)
          throw new Error(`barely moved: ${Math.round(before.top)} -> ${Math.round(after.top)}`);
      });

      check("the dragged position is remembered in settings", () => {
        const s = window.__ssoApi.status().settings.tracks[0];
        if (!s.placed) throw new Error("placed flag not set");
        if (s.posY > 60) throw new Error(`posY still near the bottom: ${s.posY}`);
      });

      check("subtitle size follows the picture, not the window", async () => {
        /* Reported as the subtitles rendering bigger on entering fullscreen.
         * They were 2.6vh - a fraction of the *viewport* - so going fullscreen
         * resized the text for a reason that has nothing to do with the film.
         * A subtitle belongs to the picture, so it is the picture it is
         * measured against, and this holds it to that. */
        const cue = shadowOf().querySelector(".sso-cue");
        const ratio = () => {
          const size = parseFloat(getComputedStyle(cue).fontSize);
          return size / video.getBoundingClientRect().height;
        };
        await showSpeakerCue();
        const full = ratio();
        video.style.height = "300px";
        await sleep(200);
        const small = ratio();
        video.style.height = "";
        await sleep(200);

        if (Math.abs(small - full) / full > 0.05) {
          throw new Error(
            `text was ${full.toFixed(4)} of the picture at full size and ` +
            `${small.toFixed(4)} at 300px - it is tracking the window`);
        }
      });

      check("a lost release does not leave the subtitle following the pointer", async () => {
        /* Reported as "I don't even drag, I just hover over the subtitle and it
         * jumps somewhere else".
         *
         * A press captures the pointer, so while the capture is held every
         * pointer event in the page retargets to the cue box - which is what
         * makes dragging work at all. Lose the release and that never ends, so
         * the next movement anywhere teleports the subtitle to it. Players do
         * lose it: they call stopPropagation on pointer events inside the
         * player surface.
         */
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = () => shadowOf().querySelector(".sso-cue");
        cue().setPointerCapture = () => {};
        cue().releasePointerCapture = () => {};
        const box = cue().getBoundingClientRect();

        // Press and move, then let go without the cue box ever hearing about it.
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 11, clientX: x, clientY: y, buttons, button: 0, bubbles: true });
        cue().dispatchEvent(ev("pointerdown", box.left + 30, box.top + 8, 1));
        cue().dispatchEvent(ev("pointermove", 320, 300, 1));
        await sleep(80);
        const afterDrag = window.__ssoApi.status().settings.tracks[0];

        // Now merely hover, with nothing pressed.
        cue().dispatchEvent(ev("pointermove", 700, 120, 0));
        await sleep(80);
        cue().dispatchEvent(ev("pointermove", 250, 500, 0));
        await sleep(120);
        const afterHover = window.__ssoApi.status().settings.tracks[0];

        if (afterHover.posX !== afterDrag.posX || afterHover.posY !== afterDrag.posY) {
          throw new Error(
            `hovering moved it from ${afterDrag.posX},${afterDrag.posY}` +
            ` to ${afterHover.posX},${afterHover.posY}`);
        }
      });

      /* The two tests above pass whether or not the box keeps hold of the point
       * you grabbed, because they only ask that it moved a lot. These ask that
       * it moved the RIGHT amount, which is the whole complaint: the anchor is
       * the box's bottom edge, so writing the pointer straight into it threw
       * away where inside the box the press had landed. */
      const grabAndDrag = async (grabDX, grabDY, byX, byY) => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = shadowOf().querySelector(".sso-cue");
        const before = cue.getBoundingClientRect();
        const fromX = before.left + grabDX;
        const fromY = before.top + grabDY;
        // Several moves, as a real pointer sends - one big jump would hide an
        // error that accumulates per move.
        const cueEl = shadowOf().querySelector(".sso-cue");
        cueEl.setPointerCapture = () => {};
        cueEl.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cueEl.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        for (let step = 1; step <= 4; step++) {
          cueEl.dispatchEvent(ev("pointermove", fromX + (byX * step) / 4, fromY + (byY * step) / 4, 1));
        }
        cueEl.dispatchEvent(ev("pointerup", fromX + byX, fromY + byY, 0));
        await sleep(120);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        return { movedX: after.left - before.left, movedY: after.top - before.top };
      };

      check("the box moves exactly as far as the pointer, not further", async () => {
        await showSpeakerCue();
        /* From the middle of the picture, so there is room to move in every
         * direction. The case before this one drops the box at x=300, which
         * on a picture this wide puts it against the left edge - and a box at
         * the edge cannot move further left, which is a fact about the clamp
         * and not about the arithmetic under test. It used to have a few
         * pixels of slack there because the width was in vw and the position
         * in %, which disagree by the scrollbar; they are measured against the
         * same picture now. */
        window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 50 });
        await sleep(120);
        // Grabbed near the TOP of the box, which is where the old bug was worst:
        // the bottom anchor jumped to the pointer and the box gained its own
        // height on the way.
        const { movedX, movedY } = await grabAndDrag(24, 4, -70, -120);
        if (Math.abs(movedX - -70) > 3 || Math.abs(movedY - -120) > 3) {
          const s = window.__ssoApi.status().settings.tracks[0];
          const v = video.getBoundingClientRect();
          const root = shadowOf().querySelector(".sso-root");
          const others = [...document.querySelectorAll("div")]
            .filter((d) => d.shadowRoot)
            .map((d) => d.shadowRoot.firstElementChild?.className || "?")
            .filter((c) => /sso-win|sso-strip|sso-root/.test(c));
          throw new Error(
            `dragged by -70,-120 but the box moved ${Math.round(movedX)},${Math.round(movedY)}` +
            ` [viewport ${innerWidth}x${innerHeight}, video ${Math.round(v.left)},${Math.round(v.top)} ${Math.round(v.width)}x${Math.round(v.height)},` +
            ` pos ${s.posX},${s.posY} w ${s.widthPercent}, --sso-x ${root.style.getPropertyValue("--sso-x")},` +
            ` surfaces ${others.join(" | ")}]`);
        }
      });

      check("a small drag downwards moves it downwards", async () => {
        await showSpeakerCue();
        // The "once I move it up I cannot bring it down" report: a nudge down
        // shorter than the box's own height used to move it UP.
        const { movedY } = await grabAndDrag(24, 4, 0, 18);
        if (movedY < 12) throw new Error(`nudged down 18px, box moved ${Math.round(movedY)}`);
      });

      check("the subtitle cannot be dragged off screen", async () => {
        await dragCue(300, 260, -800, -800);
        const box = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (box.left < -1 || box.top < -1)
          throw new Error(`escaped the viewport at ${Math.round(box.left)},${Math.round(box.top)}`);
      });

      check("a click on the subtitle still reaches the player", async () => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        let reached = 0;
        const player = document.getElementById("player");
        const count = () => reached++;
        player.addEventListener("click", count);
        const cue = shadowOf().querySelector(".sso-cue");
        const box = cue.getBoundingClientRect();
        // Press and release without moving: that is a click, not a drag.
        await dragCue(box.left + 10, box.top + 6, box.left + 10, box.top + 6);
        player.removeEventListener("click", count);
        if (reached === 0) throw new Error("the click was swallowed by the subtitle");
      });

      check("reset puts the subtitle back at the bottom centre", async () => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        const s = window.__ssoApi.status().settings.tracks[0];
        if (s.posX !== 50 || s.posY !== 92 || s.placed)
          throw new Error(`reset left it at ${s.posX},${s.posY} placed=${s.placed}`);
      });

      check("a position is a fraction of the picture, not of the window", async () => {
        /* Reported: leave fullscreen and the subtitles stay where the
         * fullscreen picture had them, hanging in the page beside a player a
         * third of the size; and in a window they could be dragged off the
         * film onto the page around it. Both are one fact - the percentages
         * were of the viewport, which only agrees with the picture in
         * fullscreen. Here the player is shrunk to a box on the page, which is
         * what every windowed streaming page looks like, and the subtitle has
         * to be measured against THAT box: centred on it, its bottom edge at
         * 92% of its height, and not draggable off it. */
