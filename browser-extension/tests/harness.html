          if (ids !== `page:${titleId}:en:subtitle/dash,page:${titleId}:tr:subtitle/dash,page:${titleId}:en:forced/dash`) throw new Error(ids);
          if (JSON.stringify(own()).includes("SECRET")) throw new Error("a signed URL got into status()");
          const dash = await askEar((data) => data.tracks?.[0]?.format === "dash");
          if (dash.tracks[0].dash?.representation !== "t-en" || dash.tracks[1].dash?.representation !== "t-tr" || !dash.shape.includes("mpd")) throw new Error(JSON.stringify([dash.tracks.map((t) => t.dash), dash.shape]));
          if (dash.tracks[0].url !== new URL("../tests/fixtures/tabii/master.mpd?token=SECRET", location.href).href) throw new Error(`the MPD's URL is ${dash.tracks[0].url}`);

          // An API answer naming sidecar files, by fetch.
          const answer = await (await fetch("../tests/fixtures/tabii/apigateway/play.json")).json();
          if (!answer.data.subtitles) throw new Error("the wrapped fetch did not hand the body back");
          for (let i = 0; i < 40 && own()?.tracks?.[0]?.format !== "vtt"; i++) await sleep(25);
          ids = (own()?.tracks || []).map((t) => `${t.id}/${t.format}`).join();

      /* The standard way, which needs no ear: <track> elements under the
       * video, and text tracks with cues in them. Asked for as "a standard
       * protocol ... so it would extend to other third party web players",
       * with the local catalogue app first - its player writes a <track> per
       * subtitle of the file, at `/subtitle?path=...` with no extension. */
      check("a <track> element under the video is the page's own subtitle, read by the standard and not by an ear", async () => {
        const own = () => window.__ssoApi.status().own;
        const titleId = location.pathname.split("/").filter(Boolean).pop();
        const askOwn = () => {
          let answer;
          for (const listener of window.__listeners) listener({ type: "sso:pageSubtitles" }, {}, (reply) => { answer = reply; });
          return answer;
        };
        const track = document.createElement("track");
        track.setAttribute("kind", "subtitles");
        track.setAttribute("srclang", "de");
        track.setAttribute("label", "Deutsch");
        track.setAttribute("src", "../tests/fixtures/youtube/api/timedtext?path=SECRET-PATH");
        const chapters = document.createElement("track");
        chapters.setAttribute("kind", "chapters");
        chapters.setAttribute("src", "../tests/fixtures/youtube/api/timedtext");
        video.append(track, chapters);
        try {
          for (let i = 0; i < 80 && own()?.tracks?.[0]?.language !== "de"; i++) await sleep(25);
          const ids = (own()?.tracks || []).map((t) => `${t.id}/${t.format}`).join();
          // No extension on the URL, so the bytes decide; the chapters track is not a subtitle.
          if (ids !== `page:${titleId}:de:subtitle/auto`) throw new Error(ids);
          if (own().site !== location.hostname || own().tracks[0].displayName !== "Deutsch") throw new Error(JSON.stringify(own()));
          if (JSON.stringify(own()).includes("SECRET")) throw new Error("the track's URL got into status()");

          // The worker gets the URL, and no shift on a player whose clock is the film's.
          let asked = askOwn();
          if (asked?.tracks?.[0]?.url !== new URL("../tests/fixtures/youtube/api/timedtext?path=SECRET-PATH", location.href).href) throw new Error(`the worker was handed ${asked?.tracks?.[0]?.url}`);
          if (asked.tracks[0].shiftMs) throw new Error(`a shift of ${asked.tracks[0].shiftMs} with no offset`);

          /* A player streaming from an offset: its <track> cues are on the
           * element's clock, which is the film's less the offset. The shift
           * travels with the URL, read at the moment the worker asks. */
          video.dataset.ssoTimeOffset = "1500";
          asked = askOwn();
          if (asked?.tracks?.[0]?.shiftMs !== 1500000) throw new Error(`shift ${asked?.tracks?.[0]?.shiftMs}, want 1500000`);
          delete video.dataset.ssoTimeOffset;
          asked = askOwn();
          if (asked.tracks[0].shiftMs) throw new Error("the shift outlived the offset");

          // Gone from the document, gone from the list.
          track.remove();
          chapters.remove();
          for (let i = 0; i < 80 && own()?.tracks?.length; i++) await sleep(25);
          if (own()?.tracks?.length) throw new Error(`still listed after removal: ${JSON.stringify(own())}`);

          chapters.remove();
          delete video.dataset.ssoTimeOffset;
          await sleep(1100);
        }

      check("cues a player hands to the browser's own text track are read off it, whatever it fetched them as", async () => {
        const own = () => window.__ssoApi.status().own;

            source: "sso-ear", type: "tracks", titleId: "P2", shape: ["timedTextUrls"],

      /* The survey: what the player did, as shapes, written to the log so a

       * checked is that shape is all that leaves the page - no query value, no
       * string value - and that each kind of body gets the digest that names

      check("the survey writes the shape of what the page fetched, and none of the values", async () => {
        const seen = await tracing(async (traced) => {
          await (await fetch("../tests/fixtures/tabii/apigateway/play.json?sessionToken=SECRET-VALUE&profile=12345")).json();
          await new Promise((resolve, reject) => {

      /* --- a subtitle nobody has made, made here ---------------------------------
       *
       * The daemon does the making; what is under test is the extension's side
       * of it - the offer on the Find screen, the confirmation that spends
       * nothing until pressed, the file attached as it arrives under the id it
       * will finish with, and the toast that offers it when study wants a
       * second language. The daemon is stubbed as a job that advances one
       * chunk per status call.
       */
      const GENERATED = 90_000_000_000_000 + 424242;
      const makeJob = (total, { kept = [] } = {}) => {
        // `kept` are 1-based lines the model leaves in English; a resume
        // asks for them one per poll and lands "tekrar N" for each.
        const state = { done: 0, total, status: "running", polls: 0, kept: [...kept], landed: [], retry: null, resumed: 0 };
        const cuesNow = () => Array.from({ length: total }, (_, i) => ({
          start: i * 1000, end: i * 1000 + 900,
          text: state.landed.includes(i + 1) ? `tekrar ${i + 1}` : state.kept.includes(i + 1) ? `line ${i + 1}` : i < state.done ? `satır ${i + 1}` : `line ${i + 1}`,
        }));
        const status = () => ({
          job: "13-abc-tr", status: state.status, source_language: "en", target: "tr", model: "gemma3:4b",
          generated_file_id: GENERATED, unrepaired: 0, missing: state.kept.length, retrying: Boolean(state.retry),
          ...(state.retry
            ? { total: state.retry.total, done: state.landed.length, eta_seconds: state.retry.total - state.landed.length }
            : { total, done: state.done, eta_seconds: (total - state.done) / 2 }),
        });
        return {
          state,
          status,
          ops: {
            languages: () => ({ languages: ["en", "tr"] }),
            health: () => ({ ok: true, daemon_running: true, default_languages: ["en", "tr"], translate_model: "gemma3:4b", translate_seconds_per_cue: 0.5 }),
            translations: () => ({ jobs: [], languages: { en: "English", tr: "Turkish", de: "German", fr: "French" } }),
            pageContext: () => ({ title: "Mercy", imdbId: "31050594" }),
            search: () => ({
              used: { query: "Mercy", languages: ["en", "tr"] }, auto_attach_threshold: 0.75,
              resolved: { title: "mercy", year: 2026, imdb_id: "31050594" },
              results: [{ file_id: 1, language: "en", movie_name: "Mercy", release: "Mercy.2026.WEB", match_score: 1.0 }],
              missing_languages: ["tr"], available_languages: ["en", "de"],
            }),
            translate: (args) => { state.started = args.body; return status(); },
            translateStatus: (args) => {
              state.polls += 1;
              if (state.retry) {
                // The follower's first look is not a poll: nothing lands on it,
                // so the panel is seen mid-retry before the second poll ends it.
                if (!args.cues && state.retry.asked++ >= 1 && state.kept.length) state.landed.push(state.kept.shift());
                if (!state.kept.length) { state.status = "done"; state.retry = null; }
              } else {
                if (!args.cues) state.done = Math.min(total, state.done + 4);
                if (state.done >= total) state.status = "done";
              }
              const out = status();
              if (args.cues) {
                out.cues = cuesNow();
                out.translated_indexes = Array.from({ length: state.done }, (_, i) => i);
                // The lines no chunk has reached, as the daemon reports them.
                out.pending_indexes = state.status === "done" ? [] : Array.from({ length: total - state.done }, (_, i) => state.done + i);
              }
              return out;
            },
            translateResume: (args) => {
              state.resumed += 1;
              if (args.job !== "13-abc-tr") return { error: "no such translation" };
              if (state.status === "done" && state.kept.length) state.retry = { total: state.kept.length, asked: 0 };
              state.status = "running";
              return status();
            },
            translateCancel: () => { state.status = "cancelled"; return status(); },
          },
        };
      };

         * and this window's writer clamps its argument to the screen, so the
         * two probes came out 92px apart and the solver called it a page
         * scaled to 0.92. The probe is the raw writer now. */
        const sheet = await openSettings();
        const host = sheet.host;
        const body = sheet.querySelector(".sso-sheet__body");
        /* Alt held: this is about the coordinate system, and the window is now
         * held to the same lines everything else is - a snap on the way would
         * be a correct placement and a failed measurement. */
        const pev = (type, x, y, buttons) =>
          new PointerEvent(type,
            { pointerId: 44, clientX: x, clientY: y, button: 0, buttons, bubbles: true,
              altKey: true });

        const start = host.getBoundingClientRect();
        body.dispatchEvent(pev("pointerdown", start.left + 30, start.top + 60, 1));
        await sleep(20);
        const grabbed = host.getBoundingClientRect();
        if (Math.abs(grabbed.left - start.left) > 1 || Math.abs(grabbed.top - start.top) > 1)
          throw new Error(
            `taking hold of it moved it ${Math.round(grabbed.left - start.left)},` +
            `${Math.round(grabbed.top - start.top)}`);

        body.dispatchEvent(pev("pointermove", start.left + 130, start.top + 120, 1));
        body.dispatchEvent(pev("pointerup", start.left + 130, start.top + 120, 0));
        await sleep(60);
        const after = host.getBoundingClientRect();
        if (Math.abs(after.left - start.left - 100) > 1 || Math.abs(after.top - start.top - 60) > 1)
          throw new Error(
            `dragged 100,60 and it went ${Math.round(after.left - start.left)},` +
            `${Math.round(after.top - start.top)}`);

        sheetShadow().querySelector(".sso-icon--close").click();
        await sleep(120);

        const sheet = await openSettings();

         * these settings underneath a running feature: nothing changes until
         * somebody changes it. If a fallback drifts from the value it replaced,
         * every existing installation silently restyles itself. */
        window.__ssoApi.updateTrackSettings(0, {
          color: undefined, font: undefined, weight: undefined, outline: undefined, backdrop: null,

         * overlay.css are load-bearing, so it is the only way to check they
         * still match the literals they replaced. */
        const root = window.__ssoApi.overlayRoots()[0];
        const written = ["--sso-color", "--sso-weight", "--sso-outline", "--sso-family"];
        const kept = written.map((name) => root.style.getPropertyValue(name));
        for (const name of written) root.style.removeProperty(name);

        const drift = [];
        if (bare.color !== "rgb(255, 255, 255)") drift.push(`colour ${bare.color}`);

        if (!/0px 0px 4px/.test(bare.textShadow)) drift.push(`outline ${bare.textShadow}`);
        if (!/Helvetica/.test(bare.fontFamily)) drift.push(`font ${bare.fontFamily}`);

      /* --- lining two subtitles up ---------------------------------------------
       *
       * Pure arithmetic on two lists of cue start times, so these need no video,
       * no attach and no timing. The cue lists are synthetic and deliberately
       * irregular: a regular grid self-correlates at every lag and would make
       * even unrelated files look like a perfect match.
       */
      const speech = (count, seed) => {
        // A cheap deterministic generator - gaps around 2.8s, log-normal-ish,
        // which is what real dialogue looks like.
        let x = seed;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const out = [];
        let t = 30000;
        for (let i = 0; i < count; i++) {
          t += 600 + Math.round(4200 * next() * next() * 3);
          out.push(t);
        }
        return out;
      };

      check("two subtitles for the same film are lined up exactly", async () => {
        const align = window.__ssoAlign;
        if (!align) throw new Error("the aligner did not load");
        const a = speech(900, 7);
        for (const gap of [0, 4400, -12800, 42000, -120000]) {
          const answer = align.align(a, a.map((t) => t + gap));
          if (!answer.ok) throw new Error(`refused a ${gap}ms shift (conf ${answer.confidence})`);
          if (answer.shiftMs !== gap)
            throw new Error(`said ${answer.shiftMs} for a ${gap}ms shift`);
          if (answer.rate !== 1) throw new Error(`invented a rate of ${answer.rate}`);
        }
      });

      check("a framerate mismatch is recognised as one of the real ratios", async () => {
        /* A subtitle timed for 25fps against a 23.976 encode starts right and
         * drifts by minutes. The rate is picked from a closed set rather than
         * fitted: a free fit needs a constant-offset peak to seed it, and a 4%
         * stretch is exactly what destroys that peak. */
        const align = window.__ssoAlign;
        const a = speech(1100, 11);
        for (const rate of align.RATES) {
          if (rate === 1) continue;
          const answer = align.align(a, a.map((t) => Math.round(t * rate)));
          if (!answer.ok) throw new Error(`refused a ${rate} stretch`);
          if (Math.abs(answer.rate - rate) > 1e-9)
            throw new Error(`said ${answer.rate} for a stretch of ${rate}`);
        }
      });

        /* The whole design. An aligner that always returns a number is worse
         * than none: the number it gives for two unrelated films is confident
         * and wrong, and a subtitle silently shifted is harder to diagnose than
         * one nobody touched. */
        const align = window.__ssoAlign;
        for (const seed of [3, 19, 101, 777]) {
          const answer = align.align(speech(1000, seed), speech(1000, seed + 5000));
          if (answer.ok)
            throw new Error(`accepted two unrelated films at ${answer.confidence}`);
          if (answer.verdict !== "no") throw new Error(`verdict was ${answer.verdict}`);
        }

        const align = window.__ssoAlign;

        const forced = a.filter((_, i) => i % 10 === 0).map((t) => t + 6500);
        const partial = align.align(a, forced);
        if (!partial.ok) throw new Error(`refused a forced-subtitle track (${partial.confidence})`);
        if (partial.shiftMs !== 6500) throw new Error(`said ${partial.shiftMs}, want 6500`);

        // Below what any honest answer can be given for.
        const tiny = align.align(a, a.slice(0, 6).map((t) => t + 1000));
        if (tiny.ok) throw new Error("gave an answer from six cues");
        if (tiny.reason !== "too-few-cues") throw new Error(`reason was ${tiny.reason}`);

      check("a search window the caller got wrong still gets an answer", async () => {
        /* The window sizes an array inside vote(), so every wrong shape used to
         * fail a long way from the caller: a negative number or Infinity threw
         * a RangeError out of the middle of the search, 1e12 asked for twenty
         * billion bins and took the tab with it, and NaN sized it to NaN -
         * which allocates nothing, matches nothing, and reports two copies of
         * the same film as different ones. */
        const align = window.__ssoAlign;
        const a = speech(600, 41);
        const b = a.map((t) => t + 4200);
        for (const bad of [-5000, 0, Infinity, NaN, 1e12]) {
          let answer;
          try {
            answer = align.align(a, b, { maxOffsetMs: bad });
          } catch (err) {
            throw new Error(`${bad} threw ${err.name}: ${err.message}`);
          }
          if (!answer.ok || answer.shiftMs !== 4200) {
            throw new Error(`${bad} answered ok=${answer.ok} shift=${answer.shiftMs}`);
          }
        }

      check("two cues that start together are one line, not two", async () => {
        /* snapNear needs four lines before it will move anything, and two
         * speakers talking over each other are two cues with the same start.
         * Counted separately, three moments looked like four - and the repeated
         * start went into the median twice as well, so one moment carried half
         * the answer. */
        const align = window.__ssoAlign;
        const at = 600000;
        const moments = [0, 8000, 16000, 24000].map((d) => at + d);
        const other = moments.map((t) => t + 400);

        const four = align.snapNear(moments, other, { atMs: at });
        if (!four || four.deltaMs !== 400 || four.lines !== 4) {
          throw new Error(`four distinct starts answered ${JSON.stringify(four)}`);
        }
        const three = align.snapNear(moments.slice(0, 3), other, { atMs: at });
        if (three) throw new Error(`three starts answered ${JSON.stringify(three)}`);

        // The same three moments, with the first one carrying two cues.
        const repeated = [moments[0], moments[0], moments[1], moments[2]];
        const answer = align.snapNear(repeated, other, { atMs: at });
        if (answer) throw new Error(`a repeated start made a fourth line: ${JSON.stringify(answer)}`);
      });

      check("a confidence survives being written down", async () => {
        /* The number the whole accept-or-refuse decision rests on could be
         * Infinity, and Infinity does not survive being written down: trace.js
         * and report.js both put an answer through JSON, where it becomes null
         * - and null against the accept threshold is false, so an answer that
         * had just been applied read back as one that was refused.
         *
         * The chances counted and the hits counted came from different sets.
         * `n` is the smaller trimmed window; the pairing is not restricted to
         * those windows, and below rate 1 it works to a wider tolerance than
         * the one that chose them, so a cue at the boundary can pair without
         * having been counted. Then the hits exceed the chances, the binomial
         * tail is -Infinity, and the coverage passes 1.
         *
         * The construction below is the smallest one found that reaches it:
         * 2000 cues, rate 0.959041, and one cue moved a quarter of a second.
         * Nothing in the 6448-pair corpus does, which is why it survived. */
        const align = window.__ssoAlign;
        let x = 1;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const a = [];
        let t = 30000;
        for (let i = 0; i < 2000; i++) { t += 400 + Math.round(1200 * next()); a.push(t); }
        const b = a.map((each) => Math.round(0.959041 * each) + 12345);
        b[100] -= 250;

        const answer = align.align(a, b);
        if (!Number.isFinite(answer.confidence))
          throw new Error(`the confidence came back ${answer.confidence}`);
        if (answer.coverage > 1)
          throw new Error(`coverage ${answer.coverage} - more cues matched than there were chances`);
        if (JSON.parse(JSON.stringify(answer)).confidence !== answer.confidence)
          throw new Error("the confidence did not survive being written down");
        /* And it is still the right answer, not merely a finite one. The rate
         * is chosen from a ladder rather than fitted, so it is compared to the
         * tolerance the ladder is spaced by rather than for equality. */
        if (!answer.ok) throw new Error("the pair was refused");
        if (Math.abs(answer.rate - 0.959041) > 0.001)
          throw new Error(`rate ${answer.rate}, want about 0.959041`);
      });

        /* This used to assert that anything past MAX_OFFSET_MS was refused,
         * which was the behaviour and was the bug: a subtitle timed for a cut
         * carrying a recap the other file does not have lands out there, and
         * the reader was told the two files were different programmes. Measured
         * on the repo's own pair, a 240s gap came back refused at confidence
         * 0.53 with a nonsense shift, and a 185s gap came back ACCEPTED with the
         * shift 5.18s wrong.

         * What must still hold is that nothing is mis-fitted: inside the wide
         * window the answer is right, and past it there is no answer at all. */
        const align = window.__ssoAlign;
        const a = speech(900, 31);
        const near = align.MAX_OFFSET_MS + 60000;
        const found = align.align(a, a.map((t) => t + near));
        if (!found.ok) throw new Error(`a ${near}ms gap was refused (${found.confidence})`);
        if (Math.abs(found.shiftMs - near) > 100)
          throw new Error(`a ${near}ms gap was reported as ${found.shiftMs}ms`);
        if (found.searchedMs <= align.MAX_OFFSET_MS)
          throw new Error("the wide pass never ran");

        const far = 4_000_000; // past the wide window too
        const refused = align.align(a, a.map((t) => t + far));
        if (refused.ok) throw new Error(`claimed a ${refused.shiftMs}ms answer past every range`);

         * and no way at all to add a subtitle for the thirty seconds the offer
         * lasts. Reported as "how am I supposed to add new subtitles in that
         * state", with a screenshot of a panel that had nothing else in it. */
        const shadow = panelShadow();
        const had = window.__ssoApi.status().tracks.map((t) => t.attached);
        if (had[1]) {
          window.__ssoApi.detach(1);
          await sleep(80);
        }
        window.__ssoApi.detach(0);
        await sleep(120);

        if (window.__ssoApi.status().attached) throw new Error("something is still attached");
        if (!window.__ssoApi.removedTrack())
          throw new Error("nothing to put back, so this is not the state being tested");
        if (shadow.querySelector(".sso-undo").hidden) throw new Error("no undo row to crowd it out");
        if (!shadow.querySelector(".sso-empty").hidden)
          throw new Error("both statements of absence are on screen at once");

        const add = shadow.querySelector(".sso-add");
        if (add.hidden || add.getBoundingClientRect().height === 0)
          throw new Error("nothing on the panel adds a subtitle while the undo is offered");
        add.click();
        await sleep(80);
        const said = shadow.querySelector(".sso-find__for").textContent;
        if (!/subtitle 1\b/i.test(said)) throw new Error(`the plus went to "${said}"`);
        shadow.querySelector(".sso-panel__back").click();
        await sleep(60);

        // Put back exactly what was there: the undo restores slot 0 as it was,
        // and slot 1 goes back the way the check above rebuilds it.
        window.__ssoApi.undoRemove();
        await sleep(80);
        if (had[1]) {
          await window.__ssoApi.attach({ cues: CUES, label: "second", fileId: 99, language: "tr", slot: 1 });
          await sleep(80);
        }
      });

      const toastEl = () =>
        [...document.querySelectorAll("div")]
          .find((d) => d.shadowRoot?.querySelector(".sso-toast"))
          ?.shadowRoot.querySelector(".sso-toast");

      check("an ordinary toast still lets a click through to the film", async () => {
        /* The toast is pointer-events:none so that it never eats a click meant
         * for the player. Giving it a button had to open exactly one hole. */
        window.__ssoApi.showToast("first, so the layer exists");
        await sleep(30);
        const toast = toastEl();
        if (!toast) throw new Error("no toast anywhere in the document");
        window.__ssoApi.showToast("plain");
        await sleep(30);
        if (getComputedStyle(toast).pointerEvents !== "none")
          throw new Error("a plain toast is standing in front of the film");

        window.__ssoApi.showToast("with a way back", { action: { label: "Undo", onClick: () => {} } });
        await sleep(30);
        if (getComputedStyle(toast).pointerEvents !== "auto")
          throw new Error("the undo button cannot be clicked");
        if (!toast.querySelector(".sso-toast__action"))
          throw new Error("no button in an action toast");
        window.__ssoApi.showToast("plain again");
        await sleep(30);
      });

      check("a long offer keeps its button inside the toast", async () => {
        /* `flex: none` on the button is right - a way back squeezed until its
         * label wraps is worse than one on a second line - but with only one
         * line to sit on it meant the button left the toast instead. Measured
         * at 360px wide before the fix, the drift offer's button sat 3px past
         * the toast's own right edge. The shorter offers already in use have
         * 14px to spare, which is why nothing caught it until a longer one
         * arrived. */
        window.__ssoApi.showToast(
          "Subtitle running 4.3% fast — a framerate mismatch across the whole "
            + "film, not a delay you can nudge away",
          { action: { label: "Fix the drift", onClick: () => {} } });
        await sleep(60);
        const toast = toastEl();
        const box = toast.getBoundingClientRect();
        const button = toast.querySelector(".sso-toast__action").getBoundingClientRect();
        const out = Math.round(Math.max(
          button.right - box.right, box.left - button.left,
          button.bottom - box.bottom, box.top - button.top));
        if (out > 0) throw new Error(`the button is ${out}px outside the toast`);
        window.__ssoApi.showToast("plain again");
        await sleep(30);
      });

      check("the way back offered by a toast is not buried under the panel", async () => {
        /* The toast used to live in the overlay's shadow root, which carries the
         * same z-index as the control panel - and a tie there is settled by
         * document order, which the panel wins by being created second.
         * Measured, with the panel where it opens: the Undo offered when a
         * second subtitle is lined up sat under the panel's left edge, and
         * elementFromPoint at the middle of that button returned the panel. The
         * button was drawn, described, and could not be pressed.
         *
         * Asked of the document rather than of the button, because "what would
         * a click at this point hit" is a question only the document answers -
         * the button's own box reads the same either way, which is why this was
         * invisible to every test that existed. */
        try {
          await window.__ssoPanel.show();
          await sleep(200);

          const panelHost = [...document.querySelectorAll("div")]
            .find((d) => d.shadowRoot?.querySelector(".sso-panel"));
          const toastHost = () =>
            [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(".sso-toast"));

          let taken = false;
          window.__ssoApi.showToast(
            "Subtitle 2 on - 1154 lines · TR · a release name long enough to reach across the picture",
            { action: { label: "Undo", onClick: () => { taken = true; } } },
          );
          await sleep(80);

          const button = toastEl().querySelector(".sso-toast__action");
          const box = button.getBoundingClientRect();
          const x = (box.left + box.right) / 2;
          const y = (box.top + box.bottom) / 2;
          const panel = panelHost.getBoundingClientRect();
          const covered =
            box.left < panel.right && box.right > panel.left &&
            box.top < panel.bottom && box.bottom > panel.top;

          const hit = document.elementFromPoint(x, y);
          if (hit !== toastHost()) {
            throw new Error(
              `a click at the button lands on ${hit === panelHost ? "the panel" : hit?.tagName}` +
              `${covered ? " (the panel is over it)" : ""}`);
          }

          // And the button still does what it says once reached.
          button.click();
          await sleep(60);
          if (!taken) throw new Error("the button did not run its action");
        } finally {
          window.__ssoPanel.hide();
          await sleep(120);
        }
      });

      check("a line still on screen is found when another one starts under it", async () => {
        /* Cue lookup was a binary search over start AND end together, which is
         * exact only while lines do not overlap. A sign or a lyric held across
         * the dialogue under it puts a start out of order with the ends, so the
         * search follows the wrong half and the held line disappears for the
         * part of its life the short ones do not cover. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;

        await api.attach({
          cues: [
            { start: 1000, end: 20000, text: "HELD across everything" },
            { start: 2000, end: 4000, text: "under it A" },
            { start: 5000, end: 7000, text: "under it B" },
            { start: 21000, end: 23000, text: "after" },
          ],
          label: "overlapping", fileId: 6400, language: "en", slot: 0,
        });
        await sleep(200);

        try {
          const showing = async (seconds) => {
            video.currentTime = seconds;
            await sleep(220);
            return shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue').textContent;
          };

          // Inside the long line and nothing else: it showed nothing here.
          for (const at of [9, 15]) {
            const text = await showing(at);
            if (!text.includes("HELD")) {
              throw new Error(
                `at ${at}s the held line read "${text}" ` +
                `(film ${Math.round(api.filmTimeMs())}ms, showing ${JSON.stringify(api.cueAt(0))})`);
            }
          }
          // Where two cover the moment, the one that started last is the one
          // being said.
          const both = await showing(6);
          if (!both.includes("under it B"))
            throw new Error(`at 6s, with two lines covering it, showed "${both}"`);
          // And a genuine gap is still a gap.
          const gap = await showing(20.5);
          if (gap.trim() !== "") throw new Error(`the gap at 20.5s showed "${gap}"`);
        } finally {
          /* Put slot 0 back whatever happened. A test that leaves the wrong
           * cues attached does not fail alone - everything after it that reads
           * the line on screen fails too, and the first failure is then the
           * only real one in a screen of them. */
          video.currentTime = wasTime;
          if (wasAttached[0]) {
            await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
          } else {
            api.detach(0);
          }
          await sleep(150);
        }
      });

      check("two lines covering the same moment are both shown", async () => {
        /* Finding the held line was only half of it: the renderer still drew
         * one line per track, so the one it did not draw was dropped from the
         * screen anyway. A sign, a lyric or a caption held across the dialogue
         * under it has to stay readable while the dialogue runs. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;

        await api.attach({
          cues: [
            { start: 1000, end: 20000, text: "HELD across everything" },
            { start: 5000, end: 7000, text: "under it B" },
          ],
          label: "overlapping", fileId: 6401, language: "en", slot: 0,
        });
        await sleep(200);

        try {
          const linesAt = async (seconds) => {
            video.currentTime = seconds;
            await sleep(220);
            const box = shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue');
            return [...box.querySelectorAll(".sso-line")].map((el) => el.textContent);
          };

          const both = await linesAt(6);
          if (both.length !== 2)
            throw new Error(`two lines cover 6s but ${both.length} were drawn: ${JSON.stringify(both)}`);
          // Document order, so the held line is context above the line being
          // said rather than jumping over it when the dialogue arrives.
          if (!both[0].includes("HELD") || !both[1].includes("under it B"))
            throw new Error(`drawn out of order: ${JSON.stringify(both)}`);

          // One line covering the moment is still one box with one line in it.
          const alone = await linesAt(9);
          if (alone.length !== 1 || !alone[0].includes("HELD"))
            throw new Error(`at 9s, with one line covering it, drew ${JSON.stringify(alone)}`);

          /* The keys, the pause and the saved sentence all follow one line, and
           * it is the one that started last - stopping at the end of a sign
           * held over the dialogue would stop mid-sentence. */
          video.currentTime = 6;
          await sleep(220);
          if (!api.cueAt(0)?.text.includes("under it B"))
            throw new Error(`the followed line at 6s was ${JSON.stringify(api.cueAt(0))}`);
        } finally {
          video.currentTime = wasTime;
          if (wasAttached[0]) {
            await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
          } else {
            api.detach(0);
          }
          await sleep(150);
        }
      });

      /* --- drift ------------------------------------------------------------
       *
       * A subtitle that is late is fixed by one nudge. One that is running at
       * the wrong speed is not, and the reader finds that out by nudging it
       * again twenty minutes later. Those two nudges are a measurement: the
       * slope between them is the rate.
       *
       * The film here is stubbed at 7200s, and currentTime is a plain variable,
       * so a correction can be placed anywhere in it. */
      const FRAMERATE = 25 / (24000 / 1001); // 1.042708 - PAL against NTSC film

      async function correctionsAt(pairs) {
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        await api.attach({ cues: CUES, label: "drift", fileId: 7300, language: "en", slot: 0 });
        // Clears any correction history and any offer already made, so each
        // case starts from a subtitle nobody has touched.
        api.setRate(1, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true, byHand: false });
        // Ad drift shifts file time by a constant, which cancels out of the
        // slope but not out of the positions this case asserts against.
        api.clearAdDrift();
        api.showToast("nothing to report");
        await sleep(40);

        for (const [fileMs, offsetMs] of pairs) {
          // filmTimeMs is currentTime less the offset, so this puts the
          // correction at the file position the case names.
          video.currentTime = (fileMs + offsetMs) / 1000;
          api.setOffset(offsetMs, { slot: 0, quiet: true });
          await sleep(40);
        }
        return toastEl();
      }

      async function undoDrift() {
        const api = window.__ssoApi;
        document.getElementById("v").currentTime = 1;
        api.setRate(1, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true, byHand: false });
        await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
        await sleep(80);
      }

      check("a subtitle nudged twice across the film is offered the speed that explains it", async () => {
        /* The aligner can already find a framerate mismatch, but only by
         * comparing two subtitles - so it has nothing to say to a reader
         * watching in one language, which is the case this covers. */
        try {
          // 4.27% fast: the correction needed grows with the film.
          const toast = await correctionsAt([
            [400000, Math.round((FRAMERATE - 1) * 400000)],
            [2400000, Math.round((FRAMERATE - 1) * 2400000)],
          ]);
          const said = toast?.textContent || "";
          if (!/framerate/i.test(said) || !/4\.3%/.test(said))
            throw new Error(`the drift went unreported: "${said}"`);

          const button = toast.querySelector(".sso-toast__action");
          if (!button) throw new Error("the drift was named with no way to fix it");
          button.click();
          await sleep(60);

          const track = window.__ssoApi.status().tracks[0];
          if (Math.abs(track.rate - FRAMERATE) > 0.0005)
            throw new Error(`it applied a rate of ${track.rate}`);
          /* The line the reader last lined up by ear has to stay where they put
           * it. A speed applied on its own moves every line including that one,
           * so the button offering to help would undo the correction that
           * summoned it. */
          const wasAt = 2400000 + Math.round((FRAMERATE - 1) * 2400000);
          const nowAt = track.rate * 2400000 + track.offsetMs;
          if (Math.abs(nowAt - wasAt) > 50)
            throw new Error(`the line the reader lined up moved by ${Math.round(nowAt - wasAt)}ms`);
        } finally {
          await undoDrift();
        }
      });

      check("two nudges a few minutes apart are not a drift", async () => {
        /* The same slope over four minutes extrapolates to nonsense by the end
         * of the film. It is also what an ordinary reader does when they are
         * still finding the right offset. */
        try {
          const toast = await correctionsAt([
            [400000, Math.round((FRAMERATE - 1) * 400000)],
            [640000, Math.round((FRAMERATE - 1) * 640000)],
          ]);
          if (/drift|framerate/i.test(toast?.textContent || ""))
            throw new Error(`it called two close nudges a drift: "${toast.textContent}"`);
        } finally {
          await undoDrift();
        }
      });

      check("two nudges that disagree by a little are not a drift", async () => {
        /* 60ms apart over 33 minutes is 216ms across the 2-hour film - real,
         * and under the bar for interrupting somebody watching. */
        try {
          const toast = await correctionsAt([[400000, 0], [2400000, 60]]);
          if (/drift|framerate/i.test(toast?.textContent || ""))
            throw new Error(`it called 60ms a drift: "${toast.textContent}"`);
        } finally {
          await undoDrift();
        }
      });

      check("resetting the keys resets only the keys", async () => {
        /* It called resetSettings(), which resets every setting there is. A
         * reader who had spent a while placing the boxes and then rebound one
         * key by mistake lost the lot, from a button naming one thing. */
        window.__ssoApi.updateTrackSettings(0, { fontScale: 1.6, widthPercent: 44 });
        window.__ssoApi.updateSettings({ background: 0.2, keys: { reset: "KeyQ" } });
        await sleep(40);

        /* Through the button, not through the api. The defect was never in
         * what resetKeys does - it was that the button was wired to the wrong
         * function, and a test calling the api directly passes either way. */
        const reset = [...((await openSettings())?.querySelectorAll("button") || [])]
          .find((b) => b.textContent === "Reset keys");
        if (!reset) throw new Error("no way to reset the bindings");
        reset.click();
        await sleep(40);
        const after = window.__ssoApi.status().settings;
        if (after.keys.reset !== window.__ssoApi.defaults.keys.reset)
          throw new Error(`the binding survived as ${after.keys.reset}`);
        if (after.tracks[0].fontScale !== 1.6)
          throw new Error(`it also reset the size to ${after.tracks[0].fontScale}`);
        if (after.tracks[0].widthPercent !== 44)
          throw new Error(`it also reset the width to ${after.tracks[0].widthPercent}`);
        if (after.background !== 0.2)
          throw new Error(`it also reset the backdrop to ${after.background}`);
        sheetShadow()?.querySelector(".sso-icon--close").click();
        await sleep(100);

        window.__ssoApi.updateTrackSettings(0, { fontScale: 1, widthPercent: 80 });
        window.__ssoApi.updateSettings({ background: 0.55 });
        await sleep(40);
      });

      check("the shortcuts do nothing until they are turned on", async () => {
        /* Seven unmodified letters on somebody else's page. Players bind
         * letters of their own and a search field that has not taken focus
         * turns each one into a surprise, so they are a convenience a reader
         * asks for rather than a default they discover. */
        window.__ssoApi.updateSettings({ keysEnabled: false });
        await sleep(30);
        const before = window.__ssoApi.status().offsetMs;
        const later = window.__ssoApi.defaults.keys.later;
        document.dispatchEvent(new KeyboardEvent("keydown",
          { key: later, code: "KeyH", bubbles: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs !== before)
          throw new Error("a key fired with the shortcuts switched off");
        if (window.__ssoApi.defaults.keysEnabled !== false)
          throw new Error("they are on out of the box");

        /* And every default is a plain letter. Measured on this machine's
         * layout - Turkish Q - the key beside P types ğ, so a default of "["
         * would need a modifier the handler refuses on purpose. */
        for (const [name, key] of Object.entries(window.__ssoApi.defaults.keys)) {
          if (!/^[a-z]$/.test(key))
            throw new Error(`the default for ${name} is "${key}", which is not a plain letter`);
        }
      });

      check("a binding is the key the layout types, not the key under it", async () => {
        /* It matched KeyboardEvent.code, which names the physical switch. That
         * keeps a binding in the same place on every layout, and the place is
         * the one thing about it nobody can see: on a Turkish Q layout the key
         * right of P types ğ, and "the shortcut is BracketRight" tells a reader
         * nothing about what to press. */
        window.__ssoApi.resetKeys();
        window.__ssoApi.updateSettings({ keysEnabled: true });
        await sleep(30);
        const start = window.__ssoApi.status().offsetMs;
        document.dispatchEvent(new KeyboardEvent("keydown",
          { key: "ğ", code: "BracketLeft", bubbles: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs !== start)
          throw new Error("ğ nudged a subtitle bound to h");

        // The key that types h, wherever it happens to sit.
        document.dispatchEvent(new KeyboardEvent("keydown",
          { key: "h", code: "Semicolon", bubbles: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs === start)
          throw new Error("h did not nudge, whatever key it came from");

        // An old binding stored as a code is translated rather than left dead.
        window.__ssoApi.updateSettings({ keys: { later: "BracketRight" } });
        await sleep(30);
        if (window.__ssoApi.status().settings.keys.later !== "]")
          throw new Error(`a stored code became ${window.__ssoApi.status().settings.keys.later}`);
      });

      check("a shortcut can be switched off on its own", async () => {
        window.__ssoApi.updateSettings({ keysEnabled: true, keys: { later: "" } });
        await sleep(30);
        const before = window.__ssoApi.status().offsetMs;
        document.dispatchEvent(new KeyboardEvent("keydown",
          { key: "h", code: "KeyH", bubbles: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs !== before)
          throw new Error("the binding was unset and still fired");

        /* And nothing takes an unset binding's place. It is stored as an empty
         * string, and a keystroke that types nothing at all - which is what a
         * malformed or synthetic event looks like - would otherwise match
         * every shortcut that had been switched off. */
        document.dispatchEvent(new KeyboardEvent("keydown", { code: "Backquote", bubbles: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs !== before)
          throw new Error("a dead key fired the shortcut that was switched off");

        window.__ssoApi.resetKeys();
        await sleep(30);
        if (window.__ssoApi.status().settings.keys.later !== window.__ssoApi.defaults.keys.later)
          throw new Error("reset did not put the binding back");
        if (window.__ssoApi.status().settings.keysEnabled !== true)
          throw new Error("resetting the bindings also switched the shortcuts off");
      });

      check("typing in the panel search box does not nudge", async () => {
        const input = panelShadow().querySelector('input[type="text"]');
        input.focus();
        const before = window.__ssoApi.status().offsetMs;
        input.dispatchEvent(new KeyboardEvent("keydown",
          { key: "h", code: "KeyH", bubbles: true, composed: true }));
        await sleep(50);
        if (window.__ssoApi.status().offsetMs !== before) throw new Error("typing changed the offset");
      });

      /* --- two subtitles at once -------------------------------------------
       *
       * The claim is that the second subtitle is a second subtitle and not a
       * second view of the first: its own box, its own place on screen, its own
       * offset, its own detach. Every case below is one of those independences,
       * because a shared value is exactly how a dual display goes wrong - one
       * that renders both and then moves them together is the bug that looks
       * like the feature.
       */
      const CUES_TR = [
        { start: 0, end: 600000, text: "[Ormon] Yere yat!" },
        { start: 600000, end: 900000, text: "[iç çeker] Peki." },
        { start: 1200000, end: 1500000, text: "Neden bahsettiğini bilmiyorum ve açıkçası umurumda değil." },
        // Both halves of the Turkish casing problem in one line: a dotted
        // capital İ that must fold to plain "i", and a dotless capital I that
        // must fold to "ı".
        { start: 1500000, end: 1800000, text: "İyi. Işık yandı, iki dakika kaldı." },
      ];
      const roots = () => [...shadowOf().querySelectorAll(".sso-root")];
      const cueOf = (slot) => roots()[slot].querySelector(".sso-cue");
      /* The strip of studied words is a surface of its own now, with its own
       * position and width - not a row inside the subtitle's box. */
      const stripOf = (slot) => [...shadowOf().querySelectorAll(".sso-strip")][slot];
      /* Pointer capture is stubbed for the same reason dragCue stubs it: a
       * synthetic PointerEvent has no active pointer behind it, so the real
       * call throws and the gesture never starts. */
      const dragStrip = async (slot, fromX, fromY, toX, toY) => {
        const box = stripOf(slot).querySelector(".sso-strip__box");
        box.setPointerCapture = () => {};
        box.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 9, clientX: x, clientY: y, button: 0, buttons, bubbles: true, composed: true });
        box.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        box.dispatchEvent(ev("pointermove", toX, toY, 1));
        box.dispatchEvent(ev("pointerup", toX, toY, 0));
        await sleep(140);
      };
      const attachSecond = () =>
        window.__ssoApi.attach({ cues: CUES_TR, label: "TR · harness", fileId: 2, language: "tr", slot: 1 });
      /* Putting both slots back the way a case found them. A case that steps by
       * line has to say exactly which subtitles are attached while it runs -
       * the answer changes what a line boundary is - so it detaches and
       * re-attaches freely, and the case after it is entitled to the panel it
       * expected. */
      const restoreTracks = async (wasAttached) => {
        const api = window.__ssoApi;
        if (wasAttached[0]) {
          await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
        } else {
          api.detach(0);
        }
        if (wasAttached[1]) {
          await attachSecond();
        } else {
          api.detach(1);
        }
        await sleep(120);
      };
      /* Both subtitles back to their files' own timing, lead first.
       *
       * The order is the whole reason this is a helper. The first subtitle
       * carries the second, so zeroing it AFTER the second puts the second
       * back wherever the first happened to be - which is how a case that
       * zeroed only slot 0 and assumed slot 1 was already there came out 250ms
       * short. */
      const zeroBoth = async () => {
        window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        await sleep(60);

      check("a second subtitle renders in its own box, beside the first", async () => {

         *

         * itself, so a name rule eating half the film, or a per-cue cap costing
         * the reader the line they needed, cannot appear in its own output.

          throw new Error(`the mark carries rank ${rare.r} rather than ${RANKS.frankly}`);

          [...document.querySelectorAll("div")]
            .find((d) => d.shadowRoot?.querySelector(".sso-toast"))
            ?.shadowRoot.querySelector(".sso-toast").textContent || "";
        // What Chrome does to every in-flight call once the extension reloads.
        chrome.runtime.sendMessage = async () => {
          throw new Error("Extension context invalidated.");
        };
        try {
          const panel = panelShadow();
          panel.querySelector(".sso-panel__back")?.click();
          await sleep(120);
          // The search, which is the longest chain: pageContext, then search.
          window.__ssoApi.detached(Promise.reject(new Error("probe")), "A probe");
          await sleep(120);
          const probeSaid = toastText();
          const add = panel.querySelector(".sso-add");
          if (add && !add.hidden) { add.click(); await sleep(150); }
          const search = [...panel.querySelectorAll("button")].find(
            (b) => b.textContent === "Search",
          );
          if (search) { search.click(); await sleep(400); }
          const diagnose = [...panel.querySelectorAll("button")].find(
            (b) => /Diagnose/.test(b.textContent),
          );
          if (diagnose) { diagnose.click(); await sleep(400); }
          await sleep(400);

          if (seen.length)
            throw new Error(`unhandled rejection(s): ${seen.join(" | ")}`);
          if (!/A probe did not work/.test(probeSaid))
            throw new Error(`detached() said nothing; the toast read "${probeSaid}"`);
        } finally {
          chrome.runtime.sendMessage = realSend;
          window.removeEventListener("unhandledrejection", onLoose);
          // Back to the subtitles, which is where the cases after this expect
          // the panel to be.
          panelShadow()?.querySelector(".sso-panel__back")?.click();
          await sleep(250);
        }
      });

      /* ...and a tap on a WORD must not, which is the other half of the same
       * rule and was doing both.
       *
       * A press on a word cannot be judged when it arrives - it is a tap only
       * if it does not move, and until then the box has to stay draggable by
       * its words. So claimPointerDown declines and watches the pointer to its
       * end, and nothing told content.js the press had been consumed: the word
       * was pinned AND the click was handed to the player, so the film played
       * or paused because a word was looked at. It also made "pause when a word
       * is clicked" meaningless - with it off the film paused anyway, and if it
       * was already paused, looking at a word started it. */
      check("tapping a word does not also play or pause the film", async () => {
        await showWordyCue();
        await sleep(200);
        const word = wordEl("frankly");
        if (!word) throw new Error("no word to tap");

        let reached = 0;
        const player = document.getElementById("player");
        const count = () => reached++;
        player.addEventListener("click", count);

        const cue = cueOf(0);
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const box = word.getBoundingClientRect();
        const x = box.left + box.width / 2;
        const y = box.top + box.height / 2;
        const ev = (type, buttons) => new PointerEvent(type, {
          pointerId: 11, clientX: x, clientY: y, button: 0, buttons,
          bubbles: true, composed: true,
        });
        word.dispatchEvent(ev("pointerdown", 1));
        word.dispatchEvent(ev("pointerup", 0));
        await sleep(250);
        player.removeEventListener("click", count);

        if (reached !== 0)
          throw new Error(`the tap reached the player ${reached} time(s)`);
        const pinned = [...focusShadow().querySelectorAll(".sso-card")].find(
          (node) => node.querySelector(".sso-card__term")?.textContent === "frankly",
        );
        if (!pinned) throw new Error("the word was not pinned, so nothing was claimed");
        if (pinned.dataset.pinned !== "true")
          throw new Error("the card is in the rail but was not pinned by the tap");
      });

      check("dragging the subtitle still moves it with study mode on", async () => {
        const before = window.__ssoApi.status().settings.tracks[0].posY;
        const box = cueOf(0).getBoundingClientRect();
        await dragCue(box.left + box.width / 2, box.top + 6, 300, 180);
        const after = window.__ssoApi.status().settings.tracks[0].posY;
        if (Math.abs(after - before) < 5)
          throw new Error(`dragging a word did not move the box: ${before}% -> ${after}%`);
      });

      check("turning study mode off takes the rail and the marks away", async () => {
        await window.__ssoStudy.setEnabled(false);
        await showWordyCue();
        await sleep(200);
        if (focusShadow()) throw new Error("the rail is still in the page");
        if (wordsIn(0).some((w) => w.dataset.rare === "true"))
          throw new Error("words are still marked");
      });

      /* --- the controls behave like controls ---------------------------------
       *
       * Every floating surface should move, resize and fold the same way, and
       * do nothing surprising at the edges. These run over both of them from
       * one table, so a behaviour added to one and forgotten on the other is a
       * failure rather than an inconsistency nobody notices.
       */
      const SURFACES = [
        { name: "panel", sel: ".sso-panel", head: ".sso-win__head", grip: ".sso-grip", folds: true },
        /* No grips and no fold. The focus box holds one dictionary entry, so it
         * has one size; folding a box that is already the smallest thing on
         * screen is a control with nothing to do. Both are the same decision,
         * and this table is where a shared check learns about it. */
        { name: "focus box", sel: ".sso-focus", head: ".sso-win__head", grip: null, folds: false },
      ];

      const hostFor = (sel) =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));

      const openBoth = async () => {
        await window.__ssoStudy.setEnabled(true);
        window.__ssoStudy.updateSettings({ showFocus: true, trailOff: [] });
        await window.__ssoPanel.show();
        await sleep(250);
      };

      const pev = (type, x, y, buttons) =>
        new PointerEvent(type,
          { pointerId: 31, clientX: x, clientY: y, button: 0, buttons, bubbles: true });

      for (const s of SURFACES) {
        check(`the ${s.name} does not run away when a release goes missing`, async () => {
          // The subtitle had this bug, then the panel was fixed, and the rail
          // was not - it teleported 500px on the next mouse move. One shared
          // drag now, so there is one place for the guard to live.
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};

          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", from.left + 90, from.top + 40, 1));
          head.dispatchEvent(pev("pointermove", 420, 480, 0)); // the release is lost
          await sleep(40);
          const parked = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointermove", 950, 130, 0)); // just moving the mouse
          await sleep(60);
          const after = host.getBoundingClientRect();
          if (Math.abs(after.left - parked.left) > 2 || Math.abs(after.top - parked.top) > 2) {
            throw new Error(
              `it followed the pointer with no button held: ` +
              `${Math.round(parked.left)},${Math.round(parked.top)} -> ` +
              `${Math.round(after.left)},${Math.round(after.top)}`);
          }
        });

        check(`the ${s.name} cannot be dragged out of reach`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 9000, 9000, 1));
          head.dispatchEvent(pev("pointerup", 9000, 9000, 0));
          await sleep(80);
          const box = head.getBoundingClientRect();
          if (box.top > window.innerHeight - 10 || box.left > window.innerWidth - 30)
            throw new Error(`the handle ended at ${Math.round(box.left)},${Math.round(box.top)}`);

          // And back, so the surface that follows is not left in the corner.
          head.dispatchEvent(pev("pointerdown", box.left + 40, box.top + 8, 1));
          head.dispatchEvent(pev("pointermove", 300, 150, 1));
          head.dispatchEvent(pev("pointerup", 300, 150, 0));
          await sleep(60);
        });

        check(`the ${s.name} moves when dragged by an empty part of it`, async () => {
          /* Only the title bar was a handle, which on a window that is mostly
           * empty means aiming at a 22px strip to move it. Anything with no
           * words of its own is a handle now - and anything with words is not,
           * because a surface you can drag by its own text is a surface whose
           * text cannot be selected, and the rail is there to be read. */
          await openBoth();
          const host = hostFor(s.sel);
          const shadow = host.shadowRoot;
          const off = "button, input, select, textarea, label, .sso-win__head, .sso-grip";

          const empty = [...shadow.querySelectorAll("div")].find((n) =>
            !n.closest(off) &&
            [...n.childNodes].every((c) => c.nodeType !== 3 || !c.textContent.trim()) &&
            n.getBoundingClientRect().height > 20);
          if (!empty) throw new Error("no empty part of the window to grab");

          /* Alt held, as the settings window's own drag check holds it: what is
           * under test is that an empty part of the window is a handle, not
           * where the window ends up. Both windows are held to the same lines
           * now and the focus box parks level with the panel, so an unheld drag
           * of exactly 70px down came to rest 7px further on - a correct snap
           * and a failed measurement. */
          const free = (type, x, y, buttons) =>
            new PointerEvent(type,
              { pointerId: 31, clientX: x, clientY: y, button: 0, buttons, bubbles: true,
                altKey: true });

          const start = host.getBoundingClientRect();
          empty.dispatchEvent(free("pointerdown", start.left + 40, start.top + 60, 1));
          empty.dispatchEvent(free("pointermove", start.left + 140, start.top + 130, 1));
          empty.dispatchEvent(free("pointerup", start.left + 140, start.top + 130, 0));
          await sleep(60);
          const moved = host.getBoundingClientRect();
          if (Math.abs(moved.left - start.left - 100) > 3 || Math.abs(moved.top - start.top - 70) > 3)
            throw new Error(
              `dragged 100,70 and it went ${Math.round(moved.left - start.left)},` +
              `${Math.round(moved.top - start.top)}`);

          /* And a press on its own words is not a grab.
           *
           * Text inside a control counts as a specimen here, which it did not
           * before: the panel's root screen is very nearly all controls now
           * that the subtitle's name is the selection button, and there was no
           * wordy element left outside one to press. Widening the search does
           * not weaken the assertion - it is still "the window did not move" -
           * and a press on a button's label must not drag the window either. */
          const wordy = [...shadow.querySelectorAll("*")].find((n) =>
            !n.closest(".sso-win__head, .sso-grip") &&
            [...n.childNodes].some((c) => c.nodeType === 3 && c.textContent.trim()) &&
            n.getBoundingClientRect().width > 10);
          if (!wordy) throw new Error("the window says nothing at all");
          const held = host.getBoundingClientRect();
          wordy.dispatchEvent(pev("pointerdown", held.left + 40, held.top + 60, 1));
          wordy.dispatchEvent(pev("pointermove", held.left + 240, held.top + 200, 1));
          wordy.dispatchEvent(pev("pointerup", held.left + 240, held.top + 200, 0));
          await sleep(60);
          const after = host.getBoundingClientRect();
          if (Math.abs(after.left - held.left) > 2 || Math.abs(after.top - held.top) > 2)
            throw new Error(
              `dragging "${wordy.textContent.trim().slice(0, 20)}" moved the window ` +
              `${Math.round(after.left - held.left)},${Math.round(after.top - held.top)}`);

          // Back where it started, so what follows is not testing a corner.
          const head = shadow.querySelector(s.head);
          head.dispatchEvent(pev("pointerdown", after.left + 40, after.top + 8, 1));
          head.dispatchEvent(pev("pointermove", start.left + 40, start.top + 8, 1));
          head.dispatchEvent(pev("pointerup", start.left + 40, start.top + 8, 0));
          await sleep(60);
        });

        if (s.folds) check(`the ${s.name} folds to its title bar and unfolds again`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const shadow = host.shadowRoot;
          const head = shadow.querySelector(s.head);
          const fold = [...head.querySelectorAll("button")].find((b) => /^[▾▸]$/.test(b.textContent));
          if (!fold) throw new Error("no fold control on the title bar");

          const open = host.getBoundingClientRect().height;
          fold.click();
          await sleep(150);
          const shut = host.getBoundingClientRect().height;
          if (shut >= open) throw new Error(`folding changed the height ${open} -> ${shut}`);
          if (shut < 10) throw new Error("folding took the title bar too, so there is no way back");

          // Resizing something that is not on screen would apply numbers that
          // only appear on unfolding, which is a surprise rather than a size.
          for (const grip of shadow.querySelectorAll(s.grip)) {
            if (getComputedStyle(grip).display !== "none")
              throw new Error("a resize grip is still live while folded");
          }

          fold.click();
          await sleep(150);
          const again = host.getBoundingClientRect().height;
          if (Math.abs(again - open) > 4) throw new Error(`unfolded to ${again}, was ${open}`);
        });

        check(`double-clicking the ${s.name}'s title bar parks it`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 240, 320, 1));
          head.dispatchEvent(pev("pointerup", 240, 320, 0));
          await sleep(80);
          const moved = host.getBoundingClientRect();

          /* On the name where there is one. The panel's bar now folds on a
           * double-click and parks on a double-click of its title; the rail
           * still parks from anywhere on the bar, and dispatching on an
           * element inside it bubbles there either way. */
          (head.querySelector(".sso-win__title") ?? head)
            .dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          await sleep(150);
          const parked = host.getBoundingClientRect();
          if (Math.abs(parked.left - moved.left) < 20 && Math.abs(parked.top - moved.top) < 20)
            throw new Error("it stayed where it had been dragged");
          if (parked.right > window.innerWidth + 1 || parked.top < 0)
            throw new Error(`parked off screen at ${Math.round(parked.left)},${Math.round(parked.top)}`);
        });
      }

      check("the rail stays off a page with nothing attached", async () => {
        // Reported as the rail appearing on unrelated pages while a film played
        // in another tab: study mode is one setting for every tab, so the rail
        // was built wherever the content script loaded with it on.
        await openBoth();
        if (!hostFor(".sso-focus")) throw new Error("no rail to begin with");

        window.__ssoApi.detach(0);
        window.__ssoApi.detach(1);
        await sleep(200);
        if (hostFor(".sso-focus"))
          throw new Error("the rail is still there with no subtitle attached");
        if (!window.__ssoStudy.settings().enabled)
          throw new Error("it turned study mode off rather than leaving the page alone");

        // Attaching is what brings it back, without touching the switch.
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);
        if (!hostFor(".sso-focus")) throw new Error("attaching did not bring it back");
      });

      check("a stretched subtitle shows the right line at the right moment", async () => {
        /* The display model is `stream = rate * fileTime + offset + adDrift`.
         * Every one of these assertions is invisible while rate is 1, which is
         * exactly why they are here: a sign or an order-of-operations mistake
         * in that expression would pass every other test in this file. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const cues = [
          { start: 60000, end: 62000, text: "early line" },
          { start: 600000, end: 602000, text: "late line" },
        ];
        await api.attach({ cues, label: "stretched", fileId: 5150, language: "en", slot: 0 });
        await sleep(120);

        const showing = () => shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue').textContent;
        const at = async (seconds) => { video.currentTime = seconds; await sleep(140); return showing(); };

        // Rate 1 first: the baseline this must not disturb.
        if (!(await at(601)).includes("late")) throw new Error("the plain case is already wrong");

        /* A subtitle timed for 25fps against a 23.976 encode: its clock runs
         * fast, so a line the file puts at ten minutes is spoken later. */
        const rate = 25 / (24000 / 1001);
        api.setRate(rate, { slot: 0, quiet: true });
        await sleep(120);
        // 600s of file time lands at 600 * rate of stream time.
        const late = await at(600 * rate + 1);
        if (!late.includes("late"))
          throw new Error(`at ${(600 * rate + 1).toFixed(1)}s a stretched subtitle showed "${late}"`);
        // And the unstretched moment is now too early for it.
        const early = await at(601);
        if (early.includes("late"))
          throw new Error("the stretch did not move the later line at all");

        /* Ad drift comes off before the division, because it is measured in
         * stream seconds - an advert takes the same real time whatever the film
         * is encoded at. Dividing it too would be invisible at rate 1. */
        api.setRate(1, { slot: 0, quiet: true });
        await sleep(100);

        /* And a nudge is a constant shift in display time whatever the rate,
         * which is the reason the offset is applied outside the division rather
         * than inside it. */
        api.setRate(rate, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true });
        await sleep(100);
        const before = video.currentTime;
        const shownAt = 600 * rate;
        video.currentTime = shownAt + 1;
        await sleep(120);
        api.nudge(2000, { slot: 0 });
        await sleep(120);
        video.currentTime = shownAt + 3;
        await sleep(140);
        if (!showing().includes("late"))
          throw new Error("a 2s nudge did not move the line by 2s of stream time");
        video.currentTime = before;

        api.setRate(1, { slot: 0, quiet: true });
        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      check("what you watched with is remembered, in the order you chose it", async () => {
        /* Reported: "if I added 2 subtitles, EN + TR, then the next video
         * should load double subtitles in the same languages and same
         * arrangement". The shortcut already filled both slots - it filled them
         * from a list nobody had told about this evening's viewing.
         *
         * Slot order is the whole point, not just the set: slot 0 is the
         * language being learnt and slot 1 is the one it is learnt from. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        await api.attach({ cues: CUES, label: "one", fileId: 8801, language: "de", slot: 0 });
        await api.attach({ cues: CUES, label: "two", fileId: 8802, language: "fr", slot: 1 });
        await sleep(200);
        const stored = (await chrome.storage.local.get("sso:usedLanguages"))["sso:usedLanguages"];
        if (!Array.isArray(stored)) throw new Error("nothing was remembered");
        if (stored[0] !== "de" || stored[1] !== "fr")
          throw new Error(`remembered ${JSON.stringify(stored)}, want ["de","fr"]`);

        /* Reported: "I had 1=TR and 2=EN, dragged 2 to 1, and the next movie
         * still gave me 1=TR and 2=EN". A move is the reader choosing the
         * order, and the memory has to follow it as it follows an attach. */
        api.reorderTracks(1, 0);
        await sleep(200);
        const moved = (await chrome.storage.local.get("sso:usedLanguages"))["sso:usedLanguages"];
        if (moved?.[0] !== "fr" || moved?.[1] !== "de")
          throw new Error(`after the move remembered ${JSON.stringify(moved)}, want ["fr","de"]`);
        api.reorderTracks(1, 0);
        await sleep(200);

        /* And the arrangement needs no help - it lives in the settings, so a
         * new video keeps it. Worth asserting, because the thing that would
         * break it is attach() re-arranging over a layout already chosen. */
        api.arrange("stacked");
        await sleep(120);
        const arranged = api.status().settings.tracks.map((t) => ({ ...t }));
        await api.attach({ cues: CUES, label: "next film", fileId: 8803, language: "de", slot: 0 });
        await sleep(200);
        const after = api.status().settings.tracks;
        for (const slot of [0, 1]) {
          if (after[slot].posY !== arranged[slot].posY || after[slot].widthPercent !== arranged[slot].widthPercent)
            throw new Error(
              `attaching moved subtitle ${slot + 1}: ` +
              `${arranged[slot].posY}%/${arranged[slot].widthPercent}% -> ` +
              `${after[slot].posY}%/${after[slot].widthPercent}%`);
        }

        await chrome.storage.local.remove("sso:usedLanguages");
        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      check("a timing saved before rates existed still loads", async () => {
        /* The stored value went from a bare number to an object. Reading has to
         * accept both, or the first thing this change does to an existing
         * reader is forget every offset they ever set. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        await chrome.storage.local.set({ "sso:offset:7777": -3500 });
        await api.attach({ cues: CUES, label: "old", fileId: 7777, language: "en", slot: 1 });
        await sleep(150);
        const track = api.status().tracks[1];
        if (track.offsetMs !== -3500)
          throw new Error(`an old bare-number offset loaded as ${track.offsetMs}`);
        if (track.rate !== 1) throw new Error(`it invented a rate of ${track.rate}`);

        // And what it writes back is readable next time.
        api.setRate(1.0427, { slot: 1, quiet: true });
        await sleep(100);
        await api.attach({ cues: CUES, label: "again", fileId: 7777, language: "en", slot: 1 });
        await sleep(150);
        if (Math.abs(api.status().tracks[1].rate - 1.0427) > 1e-9)
          throw new Error(`the rate did not survive a round trip: ${api.status().tracks[1].rate}`);

        api.setRate(1, { slot: 1, quiet: true });
        await chrome.storage.local.remove("sso:offset:7777");
        if (wasAttached[1]) {
          await api.attach({ cues: CUES, label: "second", fileId: 2, language: "tr", slot: 1 });
        } else {
          api.detach(1);
        }
        await sleep(120);
      });

      check("stepping by line lands on the line, and moves every press", async () => {
        /* Repeating a line you missed is the ordinary event of watching a film
         * in a language you are learning, so the two keys have to be exact
         * about where they land - and, more easily got wrong, they have to move
         * on every press. The seek lands a little BEFORE the line, which is
         * deliberate; the trap is that "next" then finds the line it is already
         * sitting in front of and does nothing at all. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;

        const cues = [
          { start: 1000, end: 3000, text: "one" },
          { start: 5000, end: 7000, text: "two" },
          { start: 9000, end: 11000, text: "three" },
        ];
        await api.attach({ cues, label: "stepping", fileId: 6100, language: "en", slot: 0 });
        /* On its own, because "nothing after the last line" is only true of a
         * panel with one subtitle on it. A second one carries its own lines
         * into the silence after this file's last, which is the case below. */
        api.detach(1);
        api.setKeyTrack(0);
        await sleep(120);

        const at = () => Math.round(video.currentTime * 1000);
        // Inside a line, back means that line's own start: "say that again".
        video.currentTime = 10;
        api.stepLine(-1);
        const again = at();
        if (Math.abs(again - 9000) > 300)
          throw new Error(`going back from inside line 3 landed at ${again}ms, not on its start`);

        // A second press is what reaches the line before it.
