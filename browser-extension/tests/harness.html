        const want = moved * msPerPixel;
        // Dragging right is later, which is a larger offset - the direction the
        // "Late" button pushes.
        if (Math.abs(got - want) > msPerPixel)
          throw new Error(`dragged ${moved}px and the offset moved ${got}ms, want about ${Math.round(want)}ms`);

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      /* Collect what the frame told the worker about, for the two checks below.
       * The daemon stub is the only place a trace can be seen from here - the
       * worker's half is not loaded in this page. */
      const tracing = async (body) => {
        const seen = [];
        const was = window.__stubDaemon;
        window.__stubDaemon = {
          trace: (args) => { seen.push(args); return { ok: true }; },
        };
        try {
          await body(seen);
        } finally {
          window.__stubDaemon = was ?? null;
        }
        return seen;
      };
      const syncTraces = (seen) => seen.filter((a) => a.kind === "sync").map((a) => a.detail);

      check("a correction is recorded with the line it was made against", async () => {
        /* Reported after an episode: "I needed to correct the sync multiple
         * times". Nothing recorded where, by how much, or against what - so the
         * one measurement the reader makes with their own ears, which is the
         * only ground truth this extension ever gets, was thrown away each time
         * the next correction overwrote the offset. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · sync", fileId: 601, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);

        const seen = await tracing(async () => {
          window.__ssoApi.nudge(-1500, { slot: 1, quiet: true, how: "key" });
          await sleep(80);
        });

        const [made, ...extra] = syncTraces(seen);
        if (!made) throw new Error("a correction by hand traced nothing");
        if (extra.length) throw new Error(`one correction traced ${extra.length + 1} times`);
        if (made.how !== "key") throw new Error(`recorded as "${made.how}", not the way it was made`);
        if (made.byMs !== -1500) throw new Error(`recorded a move of ${made.byMs}ms, not -1500`);
        if (made.fromMs !== 0 || made.toMs !== -1500)
          throw new Error(`recorded ${made.fromMs} to ${made.toMs}, not 0 to -1500`);
        if (!Number.isFinite(made.streamMs) || !Number.isFinite(made.fileMs))
          throw new Error("recorded no position in the film");
        const moved = made.tracks.find((t) => t.slot === 1);
        if (!moved) throw new Error("the subtitle that moved is not in the record");
        if (!moved.cue || !moved.cue.text)
          throw new Error("recorded no line - the number alone cannot be checked afterwards");
        if (!Number.isFinite(moved.cue.startMs) || !Number.isFinite(moved.cue.i))
          throw new Error("the line has no place in its own file");

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("one drag is one correction, however many moves it took", async () => {
        /* A drag calls setOffset on every pointermove. Each of those used to
         * count as a correction: sixty of them for one deliberate aim, filling
         * the drift estimator's eight-deep memory with points at a single
         * instant and - once corrections were traced - writing the same line
         * sixty times. The gesture is the correction, not its samples. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · sync", fileId: 602, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);
        await zoomToFilm();

        const plot = mapStrips()[1].querySelector(".sso-map__plot");
        const box = plot.getBoundingClientRect();
        const at = (x) => ({
          pointerId: 93, button: 0, buttons: 1, clientX: x,
          clientY: box.top + box.height / 2, bubbles: true, cancelable: true,
        });
        plot.setPointerCapture = () => {};
        plot.releasePointerCapture = () => {};
        plot.hasPointerCapture = () => false;

        const seen = await tracing(async () => {
          plot.dispatchEvent(new PointerEvent("pointerdown", at(box.left + 20)));
          for (let x = 22; x <= 60; x += 2) {
            plot.dispatchEvent(new PointerEvent("pointermove", at(box.left + x)));
          }
          plot.dispatchEvent(new PointerEvent("pointerup", at(box.left + 60)));
          await sleep(120);
        });

        const made = syncTraces(seen);
        if (made.length !== 1) throw new Error(`a drag of 20 moves traced ${made.length} corrections`);
        if (made[0].how !== "drag") throw new Error(`recorded as "${made[0].how}", not a drag`);
        // From where the gesture started, not from where its last move left it.
        if (made[0].fromMs !== 0) throw new Error(`the drag says it started at ${made[0].fromMs}ms, not 0`);
        if (made[0].byMs !== made[0].toMs)
          throw new Error(`moved by ${made[0].byMs} but landed on ${made[0].toMs}`);

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("the map says which line is under the pointer, and covers nothing", async () => {
        /* Asked for: "to make the identification of the subtitle blocks on the
         * subtitle map, we can add a small tooltip to the blocks so we can know
         * which blocks we are dragging and we can easily find the block we are
         * looking for. Do not block the UI with tooltips, though."
         *
         * The blocks are painted into a canvas, so there is no node to hang a
         * title on: the pointer is hit-tested against the same arithmetic that
         * drew them, and the answer is fetched from the frame holding the cues,
         * which on a nested player is not the one drawing the panel. */
        const NAMED = [
          { start: 720000, end: 723000, text: "the first thing anybody says" },
          { start: 3600000, end: 3604000, text: "halfway through, and quieter" },
          { start: 6480000, end: 6483000, text: "and the last of it" },
        ];
        await window.__ssoApi.attach({ cues: NAMED, label: "TR \u00b7 named", fileId: 603, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        await sleep(150);
        await zoomToFilm();

        const strip = mapStrips()[1];
        const plot = strip.querySelector(".sso-map__plot");
        const tip = strip.querySelector(".sso-map__tip");
        if (!tip) throw new Error("the map carries no label at all");
        const box = plot.getBoundingClientRect();
        const move = (x) => plot.dispatchEvent(new PointerEvent("pointermove", {
          pointerId: 94, buttons: 0, clientX: box.left + x,
          clientY: box.top + box.height / 2, bubbles: true, cancelable: true,
        }));

        /* Swept rather than aimed at one pixel. A block at the whole-film scale
         * is two or three pixels wide, and the point of the label is that it is
         * findable by hand - a case that only passes on the exact centre would
         * be asserting something no reader can do. */
        const seen = new Map();
        for (let x = 0; x < box.width; x += 1) {
          move(x);
          await sleep(6);
          if (!tip.hidden && tip.textContent) seen.set(tip.textContent, x);
        }
        for (const cue of NAMED) {
          if (!seen.has(cue.text))
            throw new Error(`"${cue.text}" was never named: got ${[...seen.keys()].join(" | ") || "nothing"}`);
        }
        /* In the right order along the strip, which is what says the label is
         * reading the block under the hand rather than any block at all. */
        const order = NAMED.map((cue) => seen.get(cue.text));
        if (!(order[0] < order[1] && order[1] < order[2]))
          throw new Error(`named at ${order.join(", ")}px, which is not the order they are in`);

        // Over empty axis it says nothing rather than the last thing it said.
        move(Math.round((seen.get(NAMED[0].text) + seen.get(NAMED[1].text)) / 2));
        await sleep(40);
        if (!tip.hidden) throw new Error(`over silence it still reads "${tip.textContent}"`);

        // And it blocks nothing: no clicks, and clear of the strip it names.
        move(seen.get(NAMED[1].text));
        await sleep(40);
        const label = tip.getBoundingClientRect();
        if (getComputedStyle(tip).pointerEvents !== "none")
          throw new Error("the label takes the pointer, so the strip under it cannot be dragged");
        if (label.bottom > box.top + 1)
          throw new Error(`the label overlaps the strip by ${Math.round(label.bottom - box.top)}px`);
        if (label.width > box.width + 1)
          throw new Error(`the label is ${Math.round(label.width)}px over a ${Math.round(box.width)}px strip`);

        plot.dispatchEvent(new PointerEvent("pointerleave", { pointerId: 94, bubbles: true }));
        await sleep(40);
        if (!tip.hidden) throw new Error("the label stayed behind after the pointer left");

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("a drifting subtitle is measured through the reader's wobble, not one point of it", async () => {
        /* Read out of the running log: 880 by-hand corrections across 63
         * sittings, and every one of the ten most-corrected sittings has a
         * systematic slope - 0.02% to 0.86% of the clock, which is 100 to 520ms
         * of drift per minute and 4.6 to 23 seconds by the end of an episode.
         * In all 880 the rate was changed six times.
         *
         * The reason is what the estimate was made of. A line through the first
         * correction and the latest takes one point out of the reader's scatter
         * as gospel, and the log's scatter is wide: seven corrections inside one
         * minute running 13.4, 13.5, 12.9, 10.5, 10.6, 10.2 and 10.5 seconds,
         * and first corrections of +105.4s and -47.1s made while somebody was
         * hunting. The first one is kept forever by the eviction rule, so one
         * bad opening guess set the slope for the whole film.
         *
         * This drives the real path - setOffset, at real film times - and reads
         * what the card reads. The wobble and the wild opening are the fixture:
         * without them a two-point line would pass too. */
        const TRUE_RATE = 1.004;             // 240ms of drift a minute
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR \u00b7 drifting", fileId: 604, slot: 1 });
        window.__ssoApi.setRate(1, { slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        await sleep(120);

        /* The opening guess, a long way out, at the start of the film. This is
         * the point the old estimator could never let go of. */
        const nudge = async (minute, offsetMs) => {
          video.currentTime = minute * 60;
          await sleep(30);
          window.__ssoApi.setOffset(Math.round(offsetMs), { slot: 1, quiet: true });
          await sleep(30);
        };
        await nudge(2, -21000);

        /* And then the reader settles down: a correction every few minutes,
         * each aimed at the true drift and each missing it by up to 400ms in
         * either direction. The wobble is deterministic so a failure is
         * reproducible. */
        let seed = 11;
        const wobble = () => {
          seed = (seed * 1103515245 + 12345) % 2147483648;
          return (seed / 2147483648 - 0.5) * 800;
        };
        for (let minute = 4; minute <= 44; minute += 4) {
          await nudge(minute, (TRUE_RATE - 1) * minute * 60000 + wobble());
        }

        const drift = window.__ssoApi.status().tracks[1].drift;
        if (!drift) throw new Error("40 minutes of one-way correction was not read as drift");
        if (!drift.fast) throw new Error("it read a subtitle falling behind as running slow");
        /* Within a tenth of a percent of the truth, which over a 2-hour film is
         * about 7 seconds - inside what one offset can mop up afterwards. */
        if (Math.abs(drift.rate - TRUE_RATE) > 0.001)
          throw new Error(`measured ${drift.rate.toFixed(5)} against a real ${TRUE_RATE}`);

        // And applying it leaves the line the reader last aimed at where it is.
        const was = window.__ssoApi.status().tracks[1];
        const atMs = 44 * 60000;
        const before = was.offsetMs + was.rate * atMs;
        window.__ssoApi.applyTrackDrift(1);
        await sleep(120);
        const now = window.__ssoApi.status().tracks[1];
        const after = now.offsetMs + now.rate * atMs;
        if (Math.abs(after - before) > 250)
          throw new Error(`fixing the drift moved the line last aimed at by ${Math.round(after - before)}ms`);

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("the map carries a clock, evenly spaced, at every scale", async () => {
        /* Two patterns matched by eye need something to be matched against. The
         * only landmark either strip carried was the playhead, which is in the
         * same place on both cards and therefore says nothing about whether the
         * bar under it here is the bar under it there. Asked for: "subtitle
         * maps should show time ticks. That would make it easier to match
         * multiple points by eye."
         *
         * A tick is a full-height column - a cue bar can reach at most
         * height-2, so nothing else in the picture spans the whole well - and
         * the playhead is told apart from a tick by being opaque where the grid
         * is faint. Even spacing is the property worth asserting: a grid that
         * is not evenly spaced is not a clock. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · map", fileId: 506, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);

        const strip = mapStrips()[1];
        const canvas = strip.querySelector(".sso-map__canvas");
        const zoom = strip.querySelector(".sso-map__zoom");
        const panelHost = panelShadow().host;
        const panelBody = panelShadow().querySelector(".sso-panel__body");
        const wasWidth = panelHost.getBoundingClientRect().width;
        const wasBody = panelBody.getBoundingClientRect().height;

        /* Widened first, because how many marks there are is a fact about the
         * strip's width and not about the clock.
         *
         * paintTicks picks the first step on its ladder that leaves 58px per
         * label, so the number of marks is `span / (58 * span / stripWidth)` -
         * the span cancels and only the width is left. Measured at the width
         * the panel opens at: 202px of strip, a 30-second step across the
         * minute, two marks 100px apart. Two marks is a defensible clock and it
         * makes "evenly spaced" vacuous, so this asks the question at a width
         * where a grid has to exist. */
        window.__ssoPanel.applySize(640, wasBody);
        await sleep(220);

        try {
          for (let scale = 0; scale < 3; scale++) {
            const label = zoom.textContent;
            // The same rounding paintTicks uses, so a mark's width in columns
            // is known rather than assumed.
            const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
            const context = canvas.getContext("2d");
            const cssWidth = canvas.getBoundingClientRect().width;
            if (cssWidth < 240)
              throw new Error(`the strip is ${Math.round(cssWidth)}px wide, too narrow to owe a grid`);

            const top = context.getImageData(0, 0, canvas.width, 1).data;
            const bottom = context.getImageData(0, canvas.height - 1, canvas.width, 1).data;

            /* Columns are grouped into marks before anything is counted.
             *
             * A mark is drawn `ratio()` device pixels wide, so a column count
             * counts one thing on a 1x display and two on a 2x one. That is how
             * this check came to pass on a laptop and fail headless: the same
             * two marks read as 4 columns at 2x and 2 at 1x, and the threshold
             * was written in columns. */
            const marks = [];
            for (let x = 0; x < canvas.width; x++) {
              const a = top[x * 4 + 3];
              const b = bottom[x * 4 + 3];
              // Ink at both ends of the column, and faint - the playhead is
              // opaque, and a cue bar never reaches the top.
              if (!(a > 8 && b > 8 && a < 200)) continue;
              if (marks.length && x - marks[marks.length - 1].last <= 1) marks[marks.length - 1].last = x;
              else marks.push({ first: x, last: x });
            }
            if (marks.length < 3)
              throw new Error(
                `the ${label} scale draws ${marks.length} time marks across ${Math.round(cssWidth)}px`);

            /* A lattice, not a list of equal gaps.
             *
             * Anything opaque standing on a mark hides it from the reading
             * above - the playhead does, and at the film scale so does a
             * density bar tall enough to reach the top row. Demanding that
             * every gap be identical calls that an uneven clock. Measured at 1x
             * on the film scale: marks at 0, 101, 151 and 201 device pixels
             * with the one at 50 hidden, so the gaps are 101, 50, 50 and only a
             * multiples rule reads them as the even grid they are. */
            const gaps = marks.slice(1).map((mark, i) => (mark.first - marks[i].first) / dpr);
            const unit = Math.min(...gaps);
            for (const gap of gaps) {
              const steps = Math.round(gap / unit);
              if (Math.abs(gap - steps * unit) > 1)
                throw new Error(
                  `the ${label} scale has a ${gap.toFixed(1)}px gap in a ${unit.toFixed(1)}px grid`);
            }
            // Far enough apart to carry a legible label, in the units the label
            // is drawn in.
            if (unit < 40)
              throw new Error(`the ${label} scale's marks are ${unit.toFixed(1)}px apart, too close to label`);

            zoom.click();
            await sleep(180);
          }
        } finally {
          window.__ssoPanel.applySize(wasWidth, wasBody);
          window.__ssoApi.detach(1);
          await sleep(120);
        }
      });

      check("a subtitle moved to another number takes its lines and leaves its place", async () => {
        /* The ask: "I normally add EN as #1 and TR as #2. But I added TR as #1
         * by mistake ... add EN as #2 and then move it to the position #1."
         *
         * Which half goes and which half stays is the whole of it. The file
         * travels - its lines, its offset, its language, the keys pointed at
         * it. The place stays - where the box is, how wide, what size. A move
         * that carried the geometry with the file would be a no-op with extra
         * steps: the reader wants what is in box one to be read in box one. */
        const api = window.__ssoApi;
        try {
          await api.attach({ cues: [{ start: 0, end: 600000, text: "first box" }],
            label: "TR · wrong way round", fileId: 4401, language: "tr", slot: 0 });
          await api.attach({ cues: [{ start: 0, end: 600000, text: "second box" }],
            label: "EN · wanted first", fileId: 4402, language: "en", slot: 1 });
          api.updateTrackSettings(0, { posY: 92, fontScale: 1.4 });
          api.updateTrackSettings(1, { posY: 40, fontScale: 0.7 });
          api.setKeyTrack(1);
          await showSpeakerCue();

          const moved = api.reorderTracks(1, 0);
          if (!moved?.ok) throw new Error(`the move was refused: ${JSON.stringify(moved)}`);
          await sleep(200);

          const status = api.status();
          if (status.tracks[0].fileId !== 4402 || status.tracks[1].fileId !== 4401)
            throw new Error(`the files ended up ${status.tracks.map((t) => t.fileId).join(" and ")}`);
          if (status.keyTrack !== 0)
            throw new Error(`the keys stayed on subtitle ${status.keyTrack + 1} instead of following the file`);

          const place = status.settings.tracks;
          if (place[0].posY !== 92 || place[0].fontScale !== 1.4)
            throw new Error(`number one's place moved with the file: ${JSON.stringify(place[0])}`);
          if (place[1].posY !== 40 || place[1].fontScale !== 0.7)
            throw new Error(`number two's place moved with the file: ${JSON.stringify(place[1])}`);

          const drawn = shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue')?.textContent || "";
          if (!drawn.includes("second box"))
            throw new Error(`box one is still reading "${drawn.trim().slice(0, 30)}"`);
        } finally {
          api.detach(1);
          api.detach(0);
          api.setKeyTrack(0);
          api.updateTrackSettings(0, { posY: 92, fontScale: 1 });
          api.updateTrackSettings(1, { posY: 92, fontScale: 0.88 });
          await sleep(150);
        }
      });

      check("the playhead is not pinned to the end of a strip by a part-loaded stream", async () => {
        /* A stream that cannot be seeked is seeked by fetching another one that
         * starts at the moment asked for, so the element holds the film from
         * there on and `duration` is what is LEFT of it - a few seconds, while
         * it is still arriving. Read as the film's length that put the playhead
         * hard against the right-hand edge of both strips, where it then stayed
         * because the clamped position is what the repaint check compares.
         * Reported as "the play marker becomes frozen at the right edge". */
        const api = window.__ssoApi;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        try {
          await api.attach({ cues: burstyCues(0), label: "TR · offset", fileId: 4403, slot: 1 });
          await sleep(150);
          // Resumed 25 minutes in, with three seconds of the rest arrived.
          Object.defineProperty(video, "duration", { get: () => 3, configurable: true });
          video.dataset.ssoTimeOffset = "1500";
          video.currentTime = 8;
          await sleep(400);

          // The length of the film, not the length of the slice on the element.
          const status = api.status();
          if (!(status.duration > 1400))
            throw new Error(`the stream starts 25:00 in and the film is reported ${status.duration}s long`);

          const strip = mapStrips()[1];
          const zoom = strip.querySelector(".sso-map__zoom");
          for (let i = 0; i < 3 && zoom.textContent !== "60s"; i++) {
            zoom.click();
            await sleep(180);
          }
          const canvas = strip.querySelector(".sso-map__canvas");
          // The playhead is the opaque full-height column; a cue bar never
          // reaches the top and a time tick is faint.
          const top = canvas.getContext("2d").getImageData(0, 0, canvas.width, 1).data;
          let head = -1;
          for (let x = canvas.width - 1; x >= 0; x--) if (top[x * 4 + 3] > 200) { head = x; break; }
          if (head < 0) throw new Error("no playhead was drawn on the strip");
          if (head > canvas.width - 5)
            throw new Error(`the playhead is pinned ${canvas.width - head} device pixels from the right edge`);
        } finally {
          Object.defineProperty(video, "duration", wasDuration);
          delete video.dataset.ssoTimeOffset;
          video.dispatchEvent(new Event("loadstart"));
          api.detach(1);
          await sleep(300);
        }
      });

      /* A caption held across the dialogue under it.
       *
       * A sign, a song lyric or a note stays up for half a minute while short
       * lines run beneath it - which puts the cue ENDS out of order, because
       * the banner ends long after the four lines that started later. The strip
       * found its first visible line by bisecting those ends, and a bisection
       * is only defined on a sorted list: on the shape below it answered
       * "nothing from here on", so no bars were drawn and the strip marked
       * itself empty, which is the one signal that means this subtitle needs
       * moving. */
      check("a caption held across the lines under it is still drawn", async () => {
        const at = 600000;
        const cues = [
          { start: at, end: at + 40000, text: "[the sign reads KEEP OUT]" },
          { start: at + 5000, end: at + 7000, text: "Did you see that?" },
          { start: at + 8000, end: at + 10000, text: "I saw nothing." },
          { start: at + 11000, end: at + 13000, text: "Keep walking." },
        ];
        await window.__ssoApi.attach({ cues, label: "TR - held", fileId: 611, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        const was = video.currentTime;
        /* Inside the banner and past every line under it, at a scale whose
         * window STARTS after those lines ended - which is the whole of the
         * shape. A wider window reaches back far enough to include them, the
         * search lands on one of them by luck, and nothing looks wrong. */
        video.currentTime = (at + 30000) / 1000;
        await sleep(300);
        const strip = mapStrips()[1];
        const plot = strip.querySelector(".sso-map__plot");
        const canvas = strip.querySelector(".sso-map__canvas");
        const zoom = strip.querySelector(".sso-map__zoom");
        try {
          // Fifteen seconds around the playhead, whatever the last case left.
          for (let i = 0; i < 3 && zoom.textContent !== "15s"; i++) {
            zoom.click();
            await sleep(180);
          }
          await sleep(200);
          const context = canvas.getContext("2d");
          const top = context.getImageData(0, 0, canvas.width, 1).data;
          const low = context.getImageData(0, canvas.height - 1, canvas.width, 1).data;
          /* A bar reaches the bottom and never the top; a tick and the playhead
           * run the whole height. So a column with ink only at the bottom is
           * dialogue, which is what this is counting. */
          let bars = 0;
          for (let x = 0; x < canvas.width; x++) {
            if (low[x * 4 + 3] > 8 && top[x * 4 + 3] <= 8) bars += 1;
          }
          if (plot.dataset.empty === "true")
            throw new Error("a strip showing a forty-second caption reported itself empty");
          if (bars < canvas.width / 4)
            throw new Error(`a caption covering most of the window drew ${bars} of ${canvas.width} columns`
              + ` (scale ${zoom.textContent}, empty ${plot.dataset.empty}, at ${video.currentTime}s,`
              + ` duration ${window.__ssoApi.status().duration})`);
        } finally {
          video.currentTime = was;
          window.__ssoApi.detach(1);
          await sleep(120);
        }
      });

      check("a correction is snapped to where the two subtitles agree", async () => {
        /* Asked for: "some level of smart snapping could be a great help while
         * syncing subtitles". A hand on a 180px strip showing a minute of film
         * is accurate to about a fifth of a second; the right answer is usually
         * a few tens of milliseconds away and can be looked up rather than
         * guessed.
         *
         * The second half is the one that keeps it usable: a correction the
         * reader aimed somewhere else entirely must be left alone. A snap that
         * reaches far enough to "fix" a deliberate two-second move is not help,
         * it is the extension taking the wheel - and the measurement behind all
         * of this says two releases of one episode really can be six seconds
         * apart in one act and twelve in the next, so a large move is often the
         * correct one. */
        /* The same dialogue in both slots, so the two agree exactly at zero and
         * any offset put on one of them is an error of a known size. The page's
         * own fixture is nine lines across two hours, which is not a stretch of
         * dialogue anything could snap against. */
        const cues = burstyCues(0);
        const was = video.currentTime;
        await window.__ssoApi.attach({ cues, label: "EN · snap", fileId: 510, slot: 0 });
        await window.__ssoApi.attach({ cues, label: "TR · snap", fileId: 509, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
        video.currentTime = 2600;
        await sleep(250);

        try {
          // The same file in both slots, so they agree exactly at zero and any
          // offset put on one of them is a known error.
          window.__ssoApi.setOffset(140, { slot: 1, quiet: true });
          const near = window.__ssoApi.snapTiming(1);
          if (!near) throw new Error("a 140ms error was not snapped out");
          if (Math.abs(near.deltaMs + 140) > 20)
            throw new Error(`snapped by ${near.deltaMs}ms, want about -140`);
          const landed = window.__ssoApi.status().tracks[1].offsetMs;
          if (Math.abs(landed) > 20) throw new Error(`landed on ${landed}ms, want 0`);

          window.__ssoApi.setOffset(2000, { slot: 1, quiet: true });
          const far = window.__ssoApi.snapTiming(1);
          if (far) throw new Error(`a deliberate 2s move was pulled back by ${far.deltaMs}ms`);
          if (window.__ssoApi.status().tracks[1].offsetMs !== 2000)
            throw new Error("a correction outside the snap's reach was moved anyway");

          /* And it steadies a move without reversing it.
           *
           * Reported as the drag "fighting back": the search is a fixed point,
           * so a reader who moves away from it by less than its reach is moved
           * straight back by the same amount and their gesture buys nothing.
           * The first of these is a refinement of a one-second drag and stands;
           * the second is the same 140ms with the drag itself being that 140ms,
           * where taking it back would land the reader exactly where they
           * started. */
          window.__ssoApi.setOffset(140, { slot: 1, quiet: true });
          const refined = window.__ssoApi.snapTiming(1, { fromMs: -1000 });
          if (!refined) throw new Error("a refinement of a one-second drag was refused");

          window.__ssoApi.setOffset(140, { slot: 1, quiet: true });
          const reversed = window.__ssoApi.snapTiming(1, { fromMs: 0 });
          if (reversed)
            throw new Error(`a 140ms drag was given back by ${reversed.deltaMs}ms`);
          if (window.__ssoApi.status().tracks[1].offsetMs !== 140)
            throw new Error("the drag was reversed anyway");

          // And with nothing to agree with, it says nothing rather than
          // inventing an answer from one file.
          window.__ssoApi.detach(1);
          await sleep(120);
          if (window.__ssoApi.snapTiming(0))
            throw new Error("it snapped a lone subtitle against nothing");
        } finally {
          window.__ssoApi.detach(1);
          await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1, slot: 0 });
          window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
          video.currentTime = was;
          await sleep(150);
        }
      });

      check("moving the mouse over the strip without pressing changes nothing", async () => {
        /* Reported: "I'm not clicking and dragging over a timeline bar but it
         * still behaves like I'm adjusting it to sync." The drag state was only
         * cleared by a pointerup, so a press that ended somewhere this never
         * heard about - swallowed by the page, capture lost, alt-tab - left it
         * live, and every later mouse move over the strip re-timed the
         * subtitle. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · map", fileId: 504, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);

        const plot = mapStrips()[1].querySelector(".sso-map__plot");
        const box = plot.getBoundingClientRect();
        const ev = (type, x, buttons) => new PointerEvent(type, {
          pointerId: 92, button: 0, buttons, clientX: x,
          clientY: box.top + box.height / 2, bubbles: true, cancelable: true,
        });
        plot.setPointerCapture = () => {};
        plot.releasePointerCapture = () => {};
        plot.hasPointerCapture = () => false;

        // A press that starts and is then lost: the pointerup never arrives.
        plot.dispatchEvent(ev("pointerdown", box.left + 30, 1));
        plot.dispatchEvent(ev("pointermove", box.left + 60, 1));
        await sleep(40);
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        await sleep(40);

        // Now just move across it with nothing held down.
        for (const x of [90, 140, 200]) plot.dispatchEvent(ev("pointermove", box.left + x, 0));
        await sleep(60);
        const after = window.__ssoApi.status().tracks[1].offsetMs;
        if (after !== 0)
          throw new Error(`a mouse move with no button down moved the subtitle to ${after}ms`);

        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("moving a subtitle a long way does not flatten its map", async () => {
        /* Reported: "when I move the bar left or right too far, they become
         * shorter." Lines pushed off the end of the film were being pinned into
         * the edge column, so that column became the tallest, and every real bar
         * was then divided by a pile of off-screen cues. The height means "how
         * much dialogue is here" and cannot mean that if something off-screen
         * sets the scale. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · map", fileId: 505, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);
        await zoomToFilm();

        const canvas = mapStrips()[1].querySelector(".sso-map__canvas");
        const tallest = () => {
          const d = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
          let best = 0;
          for (let x = 0; x < canvas.width; x++) {
            let top = canvas.height;
            for (let y = 0; y < canvas.height; y++) {
              if (d[(y * canvas.width + x) * 4 + 3] > 0) { top = y; break; }
            }
            best = Math.max(best, canvas.height - top);
          }
          return best;
        };

        const before = tallest();
        // A quarter of the film, which pushes a large share of the lines off it.
        window.__ssoApi.setOffset(Math.round(video.duration * 1000 * 0.25), { slot: 1, quiet: true });
        await sleep(200);
        const after = tallest();
        if (after < before * 0.8)
          throw new Error(`the tallest bar went from ${before}px to ${after}px when the subtitle was moved`);

        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        window.__ssoApi.detach(1);
        await sleep(100);
      });

      check("a click on our chrome never reaches the player behind it", async () => {
        /* Reported: "I cannot click even the close button of the settings pane.
         * It is captured by the player as pause/play event." The click was not
         * being stolen before it arrived - it arrived, did its job, and then
         * kept bubbling into the element a player binds play/pause to, which is
         * an ancestor of everything this extension draws, because the UI is
         * built in the frame that owns the <video>.
         *
         * Asserted on every shadow host the extension has put in the document
         * rather than on the one control that was reported. The guard belongs to
         * the host, so this fails the moment a new floating surface is added
         * without it - which is the way this class of bug comes back.
         *
         * Dispatched on the hosts themselves, not on the controls inside them:
         * pressing real buttons here leaves the panel mid-drag, and six checks
         * after this one then failed for reasons that had nothing to do with
         * what it is testing. */
        await window.__ssoPanel.show();
        await sleep(120);

        const heard = [];
        const listener = (event) => heard.push(event.type);
        const types = ["pointerdown", "pointerup", "click", "dblclick", "mousedown", "mouseup"];
        for (const type of types) document.addEventListener(type, listener);
        try {
          const hosts = [...document.querySelectorAll("div")].filter((d) => d.shadowRoot);
          if (hosts.length < 2)
            throw new Error(`only ${hosts.length} of our surfaces are in the document`);
          // Named, so the failure says which surface is missing the guard
          // rather than only that one of them is.
          const leaked = [];
          for (const host of hosts) {
            const before = heard.length;
            for (const type of types) {
              host.dispatchEvent(new PointerEvent(type, {
                pointerId: 77, button: 0, buttons: 0, bubbles: true, cancelable: true,
              }));
            }
            if (heard.length > before) {
              leaked.push(host.shadowRoot.firstElementChild?.className || "(empty host)");
            }
          }
          if (leaked.length)
            throw new Error(`these surfaces let a click through to the page: ${leaked.join(" | ")}`);
        } finally {
          for (const type of types) document.removeEventListener(type, listener);
        }
      });

      check("nothing is drawn on top of a control in a window's title bar", async () => {
        /* Reported as "I cannot click even the close button of the settings
         * pane. It is captured by the player as pause/play event." The player
         * never saw it. The window's own north-east resize grip sits above the
         * head, and the head's rightmost control is Close: measured, the grip
         * covered 169 of the button's 576 square pixels INCLUDING ITS CENTRE,
         * so a hit test at the middle of the x returned the grip.
         *
         * Asserted by hit-testing every control in every head we draw, rather
         * than by measuring the one that was reported - the grips are on all
         * four corners and the panel and the rail both have heads. */
        await window.__ssoPanel.show();
        await sleep(150);
        // The settings window is a host of its own, and it is the surface the
        // report actually named. Walking every shadow root rather than the two
        // remembered by name is the difference between fixing this and fixing
        // the instance of it that was reported.
        panelShadow().querySelector(".sso-icon[title='Settings']")?.click();
        await sleep(250);

        const covered = [];
        const surfaces = [...document.querySelectorAll("div")]
          .map((d) => d.shadowRoot)
          .filter((r) => r && r.querySelector(".sso-win__head"));
        if (surfaces.length < 2)
          throw new Error(`only ${surfaces.length} window(s) on screen to check`);
        for (const shadow of surfaces) {
          for (const head of shadow.querySelectorAll(".sso-win__head")) {
            for (const control of head.querySelectorAll("button")) {
              if (control.hidden || control.offsetParent === null) continue;
              const b = control.getBoundingClientRect();
              if (b.width === 0) continue;
              const at = shadow.elementFromPoint(b.x + b.width / 2, b.y + b.height / 2);
              // The control itself, or something inside it, must be what a
              // click at its middle would reach.
              if (at !== control && !control.contains(at)) {
                covered.push(`${control.title || control.textContent} <- ${at?.className || at?.tagName}`);
              }
            }
          }
        }
        if (covered.length)
          throw new Error(`controls that cannot be clicked at their centre: ${covered.join(", ")}`);
        /* Put the settings window away, and ONLY that: closing every window
         * with a close button in it shut the panel too, and six checks after
         * this one then failed for reasons that had nothing to do with it. */
        for (const shadow of surfaces) {
          if (shadow === panelShadow()) continue;
          shadow.querySelector(".sso-icon--close")?.click();
        }
        await sleep(150);
      });

      check("a player that fullscreens the video is moved off it", async () => {
        /* The harness cannot enter real fullscreen - that needs a gesture no
         * script can make - so what is asserted here is the DECISION, and the
         * behaviour it produces was verified by hand in a real fullscreen
         * session with Playwright driving a real click.
         *
         * What was measured there: with the <video> as the fullscreen element,
         * the browser hit-tests only inside that element's subtree, so every
         * surface this extension draws is painted over the film and receives
         * none of the presses aimed at it. elementsFromPoint at the centre of
         * the panel's own close button returned VIDEO then HTML; out of
         * fullscreen the same point returned our host first. A <video> cannot
         * hold children, so the way back into the subtree is to move the
         * fullscreen session onto something that can. */
        const player = document.getElementById("player");
        const video = document.getElementById("v");
        let asked = null;
        const realRequest = player.requestFullscreen;
        const realGet = Object.getOwnPropertyDescriptor(Document.prototype, "fullscreenElement");
        Object.defineProperty(document, "fullscreenElement", {
          configurable: true,
          get: () => video,
        });
        player.requestFullscreen = function () { asked = this; return Promise.resolve(); };
        try {
          document.dispatchEvent(new Event("fullscreenchange"));
          await sleep(150);
          if (asked !== player)
            throw new Error("the fullscreen session was left on the <video>, where nothing can be clicked");
        } finally {
          player.requestFullscreen = realRequest;
          delete document.fullscreenElement;
          if (realGet) Object.defineProperty(Document.prototype, "fullscreenElement", realGet);
          document.dispatchEvent(new Event("fullscreenchange"));
          await sleep(150);
        }
      });

      check("an answer names its subtitle, and nothing on the card moves to make room", async () => {
        /* Two reports, and the second one is why this moved.
         *
         * "The message can be easily missed since it is printed on top of the
         * screen, very far from the button I've clicked" put every message that
         * names a slot onto that slot's card. Then: "the messages should have a
         * single fixed place, they shouldn't appear on card face, this causes
         * UI drift" - and it did, because a card that grows by a line when a
         * message arrives moves the map and the timing field under the hand
         * that is aiming at them.
         *
         * So the line is at the foot of the window, its height is paid for
         * whether or not it holds anything, and it says which subtitle. Both
         * halves are asserted: the message arrives AND the card is the same
         * height before and after. */
        await window.__ssoApi.attach({ cues: CUES, label: "EN · said", fileId: 910, slot: 0 });
        await window.__ssoPanel.show();
        await sleep(200);
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const status = panelShadow().querySelector(".sso-panel__status");
        if (!status) throw new Error("the panel has no status line");
        if (card.querySelector(".sso-track__said"))
          throw new Error("a card still carries a message of its own");

        /* Height and vertical position, which is what a line appearing inside
         * a card moves. The field's x belongs to the other check - it is moved
         * by the clear arriving, not by the message. */
        const geometry = () => ({
          card: Math.round(card.getBoundingClientRect().height),
          fieldY: Math.round(card.querySelector(".sso-sync__field").getBoundingClientRect().y),
          mapY: Math.round(card.querySelector(".sso-track__map, canvas").getBoundingClientRect().y),
        });
        const before = geometry();

        window.__ssoApi.setOffset(1500, { slot: 0 });
        await sleep(150);
        if (!status.textContent.trim())
          throw new Error("with the panel open, the answer was not said in the panel");
        if (status.querySelector(".sso-panel__status-slot").textContent !== "1")
          throw new Error(`the line does not say which subtitle: "${status.textContent}"`);
        const during = geometry();
        if (JSON.stringify(before) !== JSON.stringify(during))
          throw new Error(
            `the card moved to make room: ${JSON.stringify(before)} then ${JSON.stringify(during)}`,
          );

        // Shut, the same message still has to reach the reader somewhere.
        window.__ssoPanel.hide();
        await sleep(150);
        window.__ssoApi.setOffset(3000, { slot: 0 });
        await sleep(150);
        const toast = [...document.querySelectorAll("div")]
          .map((d) => d.shadowRoot?.querySelector(".sso-toast"))
          .find(Boolean);
        if (!toast || !toast.textContent.trim())
          throw new Error("with the panel shut, the answer was not said at all");

        window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
        await window.__ssoPanel.show();
        await sleep(150);
      });

      check("the learn chip and the clear keep their place in both states", async () => {
        /* Reported as "buttons shouldn't drift as well; learn/learning change
         * drifts the sync amount input box and backspace symbol". They share a
         * right-aligned group with the timing field, so any of them changing
         * width - or leaving the layout when there is nothing to clear - moves
         * the field the reader is reading. */
        await window.__ssoPanel.show();
        /* Above the width where the card gives up its words. Under 400px the
         * chip is a dot and the clear leaves the row entirely, because there
         * the name needs those pixels more than the row needs to hold still -
         * so measuring drift there would be measuring the other decision. */
        const wasWidth = Math.round(
          panelShadow().querySelector(".sso-panel").getBoundingClientRect().width,
        );
        window.__ssoPanel.applySize(460);
        await sleep(200);
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const field = () => Math.round(card.querySelector(".sso-sync__field").getBoundingClientRect().x);
        const chip = card.querySelector(".sso-track__learn");
        const chipWidth = () => Math.round(chip.getBoundingClientRect().width);

        const was = window.__ssoStudy.settings().studySlots;
        const wasOffset = window.__ssoApi.status().tracks[0].offsetMs;
        try {
          window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
          await sleep(150);
          const flat = { field: field(), chip: chipWidth() };

          window.__ssoApi.setOffset(2500, { slot: 0, quiet: true });
          await sleep(150);
          const moved = { field: field(), chip: chipWidth() };
          if (flat.field !== moved.field)
            throw new Error(
              `the clear appearing moved the field from ${flat.field} to ${moved.field}`,
            );

          await window.__ssoStudy.toggleStudySlot(0);
          await sleep(200);
          const learning = { field: field(), chip: chipWidth() };
          if (moved.chip !== learning.chip)
            throw new Error(`the chip went from ${moved.chip}px to ${learning.chip}px`);
          if (moved.field !== learning.field)
            throw new Error(
              `learn/learning moved the field from ${moved.field} to ${learning.field}`,
            );
        } finally {
          window.__ssoStudy.updateSettings({ studySlots: was });
          window.__ssoApi.setOffset(wasOffset, { slot: 0, quiet: true });
          window.__ssoPanel.applySize(wasWidth);
          await sleep(150);
        }
      });

      check("the title bar's own controls stay quiet until they are wanted", async () => {
        /* None of them is what a window is for, so none of them carries a fill
         * at rest - and they sit on the one strip that is always visible when
         * the window is folded.
         *
         * Asserted because it was lost to a specificity slip rather than a
         * decision: the shared button base was written as `.sso-win button`,
         * which is (0,1,1) and outranks `.sso-icon` at (0,1,0), so every glyph
         * in every title bar grew a box. Nothing failed; it was caught by
         * looking at a screenshot, which is not a thing that happens reliably. */
        await window.__ssoPanel.show();
        await sleep(150);
        const clear = (value) =>
          !value || value === "transparent" || /rgba\(0, 0, 0, 0\)/.test(value);
        const loud = [];
        for (const shadow of [panelShadow(), focusShadow()].filter(Boolean)) {
          for (const icon of shadow.querySelectorAll(".sso-win__head .sso-icon")) {
            // The one word button is deliberately filled: an unbordered word in
            // a title bar reads as a second title rather than as a control.
            if (icon.classList.contains("sso-icon--word")) continue;
            const background = getComputedStyle(icon).backgroundColor;
            if (!clear(background)) loud.push(`${icon.title || icon.textContent}: ${background}`);
          }
        }
        if (loud.length)
          throw new Error(`title-bar controls carrying a fill at rest: ${loud.join(", ")}`);
      });

      check("a control with a key on it says which key", async () => {
        /* The two playback buttons have keyboard bindings that work while the
         * panel is shut and while the film is fullscreen - which is most of the
         * time anybody wants them - and the only place that said so was a grid
         * inside Settings. A shortcut nobody is told about is a shortcut nobody
         * has. Asked for directly: "if something has a keyboard shortcut, it
         * should be shown on the button with a smaller dimmed text".
         *
         * And the hint is the BINDING, not a printed constant: rebinding the
         * key has to change what the button says, or it is decoration that goes
         * stale the first time somebody uses the settings screen. */
        /* On the quick row, not on a card. They move the PICTURE by a line
         * boundary and there is one picture, so drawing them per card drew the
         * same control twice and made the reader choose a card before they
         * could press either. */
        const steps = [...panelShadow().querySelectorAll(".sso-quick__play .sso-line-step")];
        if (steps.length !== 2) throw new Error(`${steps.length} playback buttons, want 2`);
        if (panelShadow().querySelector(".sso-track .sso-line-step"))
          throw new Error("a card is still drawing its own copy of the playback buttons");

        const keys = window.__ssoApi.status().settings.keys;
        window.__ssoApi.updateSettings({ keysEnabled: true, keys: { ...keys, nextLine: "m" } });
        await sleep(150);

        const next = steps.find((b) => /Next/.test(b.textContent));
        const hint = next.querySelector(".sso-key-hint");
        if (!hint || hint.hidden) throw new Error("Next carries no key hint");
        if (hint.textContent !== "M")
          throw new Error(`the hint reads "${hint.textContent}" after binding m`);
        // Smaller and quieter than the label it sits beside, or it competes
        // with the word that says what the button does.
        const label = getComputedStyle(next);
        const mark = getComputedStyle(hint);
        if (parseFloat(mark.fontSize) >= parseFloat(label.fontSize))
          throw new Error(`the hint is ${mark.fontSize} against a ${label.fontSize} label`);

        // Unbound means nothing to advertise, and "off" beside a working
        // control invites the reading that the control is off.
        window.__ssoApi.updateSettings({ keys: { ...keys, nextLine: "" } });
        await sleep(150);
        if (!hint.hidden || hint.textContent)
          throw new Error(`an unbound control still shows "${hint.textContent}"`);
        window.__ssoApi.updateSettings({ keys });
        await sleep(120);
      });

      check("every verb a subtitle has is on its own card face", async () => {
        /* The "\u22ef" menu is gone and each of its three items sits where its
         * own question is asked. What has to be true of all three is that they
         * are REAL targets on the face - a verb moved out of a menu and drawn
         * as a 2px sliver is worse than the menu was. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        if (card.querySelector(".sso-track__more"))
          throw new Error("the menu opener is still on the card");

        const face = {
          learn: card.querySelector(".sso-track__learn"),
          style: card.querySelector(".sso-track__style"),
          eye: card.querySelector(".sso-track__eye"),
          remove: card.querySelector(".sso-track__remove"),
        };
        for (const [name, node] of Object.entries(face)) {
          if (!node) throw new Error(`no ${name} on the card face`);
          const box = node.getBoundingClientRect();
          // 22px is what the head's controls are drawn at; anything under 20
          // means it is being squeezed out by the name beside it.
          if (box.width < 20 || box.height < 20)
            throw new Error(`${name} is ${Math.round(box.width)}\u00d7${Math.round(box.height)}`);
          if (!node.title) throw new Error(`${name} says nothing about what it does`);
        }

        /* The learn chip shows with study OFF, which is the change that let the
         * row's Study button go. It used to need study.enabled AND a second
         * subtitle, so it was invisible in both states it is reached for. */
        /* The state is set here rather than inherited: an earlier case leaves
         * study on, and a case that asserts against whatever the one before it
         * happened to leave passes or fails by running order. */
        await window.__ssoStudy.setEnabled(false);
        await until(() => !window.__ssoStudy.settings().enabled, "study would not switch off");
        if (face.learn.hidden) throw new Error("the learn chip is hidden");
        if (face.learn.dataset.on !== "false")
          throw new Error(`with study off the chip reads ${face.learn.dataset.on}`);
        if ([...panelShadow().querySelectorAll("button")].some((b) => b.textContent === "Study"))
          throw new Error("the row still carries a Study button");
      });

      check("marking a subtitle to learn is what switches study on", async () => {
        /* One control, both directions. The rule lives in study.js
         * (slotsAndSwitchAgree) and the panel must not carry a second copy of
         * it: marking turns study on, unmarking the last turns it off. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const learn = card.querySelector(".sso-track__learn");
        const on = () => Boolean(window.__ssoStudy?.settings?.().enabled);
        // From a known off, whatever the case before this one left behind.
        await window.__ssoStudy.setEnabled(false);
        await until(() => !on(), "study would not switch off");

        learn.click();
        await until(on, "pressing learn did not switch study on");
        if (learn.dataset.on !== "true")
          throw new Error("study is on and the chip still reads off");
        /* And it built something. A switch that changes a setting without
         * building the rail is the reported failure - "I cannot see the study
         * panel" - so the assertion is the box, not the flag.
         *
         * Polled, because building the rail fetches two stylesheets: a fixed
         * wait passes on a quiet run and fails on a loaded one, which is the
         * flaky case this helper exists for. It cost three failures on one run
         * and none on the next, which is worse than a failure. */
        const railBox = await until(
          () => {
            const host = [...document.querySelectorAll("div")]
              .find((d) => d.shadowRoot?.querySelector(".sso-focus"));
            const box = host?.getBoundingClientRect();
            return box && box.width > 0 && box.height > 0 ? box : null;
          },
          "study is on and no rail with a box was built",
        );
        if (railBox.width < 100)
          throw new Error(`the rail is only ${Math.round(railBox.width)}px wide`);

        learn.click();
        await until(() => !on(), "unmarking the last subtitle did not switch study off");
        /* And left off, with the rail actually gone, so the cases after this
         * one start where they expect to. Returning before the teardown has
         * finished is what left "15 word elements with study mode off". */
        await window.__ssoStudy.setEnabled(false);
        await until(
          () => ![...document.querySelectorAll("div")].some((d) => d.shadowRoot?.querySelector(".sso-focus")),
          "the rail outlived study being switched off",
        );
      });

      check("Remove asks twice, and forgets it was asked", async () => {
        /* A menu item was safe by being hard to reach, which costs every
         * deliberate removal two clicks to guard against a mis-click. Asking on
         * the spot costs the same and shows the state in between.
         *
         * The expiry is the half that matters: a button left armed is a mine.
         * The reader looks away, comes back, presses what they take to be the
         * ordinary control, and the subtitle is gone. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const remove = card.querySelector(".sso-track__remove");
        const attached = () => window.__ssoApi.status().tracks.filter((t) => t.attached).length;
        const before = attached();

        remove.click();
        await sleep(40);
        if (remove.dataset.armed !== "true") throw new Error("one press did not arm it");
        if (attached() !== before) throw new Error("one press removed the subtitle");
        // Armed, it must say so in words as well as in colour.
        if (!/remove/i.test(remove.textContent))
          throw new Error(`armed, it reads "${remove.textContent}"`);

        // Leaving the button is the clearest "I have changed my mind" there is.
        remove.dispatchEvent(new PointerEvent("pointerleave", { bubbles: true }));
        await sleep(40);
        if (remove.dataset.armed !== "false") throw new Error("leaving it did not disarm it");
        if (attached() !== before) throw new Error("the subtitle went anyway");

        // And the second press, when it is the second press, does the thing.
        remove.click();
        await sleep(40);
        remove.click();
        await sleep(120);
        if (attached() !== before - 1)
          throw new Error(`two presses left ${attached()} attached, was ${before}`);
        window.__ssoApi.undoRemove();
        await sleep(160);
        if (attached() !== before) throw new Error("undo did not put it back");
      });

      check("Style opens beside the subtitles rather than instead of them", async () => {
        /* It was a screen, so changing how one subtitle looks hid the other one
         * - and the only way to judge a colour or a size is against the subtitle
         * it has to sit beside. Both stay on screen now. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        card.querySelector(".sso-track__style").click();
        await sleep(240);

        const style = sheetNamed("style");
        if (!style) throw new Error("no Style window opened");
        const box = style.querySelector(".sso-sheet").getBoundingClientRect();
        if (box.width === 0 || box.height === 0) throw new Error("the Style window has no size");

        // The panel is still there, and still showing the subtitles.
        const tracks = [...panelShadow().querySelectorAll(".sso-track")].filter((c) => !c.hidden);
        if (!tracks.length) throw new Error("opening Style hid the subtitles");
        const panelBox = panelShadow().querySelector(".sso-panel").getBoundingClientRect();
        if (panelBox.width === 0) throw new Error("opening Style collapsed the panel");

        // It says which subtitle it is about, because two windows can be open.
        const title = style.querySelector(".sso-win__title").textContent;
        if (!/subtitle\s*\d/i.test(title)) throw new Error(`the title reads "${title}"`);

        /* And the button that opened it closes it. A control that opens
         * something and then does nothing when pressed again has stopped
         * answering, and the reader's next move is to press it harder. */
        const aa = card.querySelector(".sso-track__style");
        if (aa.dataset.on !== "true")
          throw new Error("the window is open and its button does not look pressed");
        aa.click();
        await sleep(200);
        const shut = sheetNamed("style");
        if (shut && shut.querySelector(".sso-sheet").getBoundingClientRect().width > 0)
          throw new Error("pressing Aa again did not close the Style window");
        if (aa.dataset.on !== "false")
          throw new Error("it closed and the button still looks pressed");

        /* Two cards, and the second one's Aa is a request to see THAT subtitle
         * rather than a request to close - otherwise comparing the two means a
         * trip through the close button every time. */
        const other = [...panelShadow().querySelectorAll(".sso-track")].filter((c) => !c.hidden)[1];
        if (other) {
          aa.click();
          await sleep(200);
          other.querySelector(".sso-track__style").click();
          await sleep(200);
          const now = sheetNamed("style");
          if (!now || now.querySelector(".sso-sheet").getBoundingClientRect().width === 0)
            throw new Error("the other card's Aa closed the window instead of switching it");
          if (!/subtitle\s*2/i.test(now.querySelector(".sso-win__title").textContent))
            throw new Error("it switched to the wrong subtitle");
          now.querySelector(".sso-icon--close").click();
          await sleep(120);
        }
      });

      check("every button that opens a window closes it, twice pressed", async () => {
        /* Asked for on the gear, after the same fix landed on Aa: "convert it
         * to toggle, so one click opens the settings panel, and second click
         * closes it". Written against every window-opening button we draw
         * rather than against the one that was reported, because that is what
         * makes it a rule instead of a patch - the rail's own gear had the
         * defect too and nobody had pressed it twice yet. */
        await window.__ssoPanel.show();
        /* Study on, so the rail's own gear exists to be pressed. An earlier
         * version of this skipped that arm when the rail was not up, which is
         * how it passed against a rail gear that did not toggle at all -
         * measured, by reverting only that half. A check that quietly covers
         * less than it claims is worse than one that fails. */
        const studyWas = Boolean(window.__ssoStudy?.settings?.().enabled);
        await window.__ssoStudy.setEnabled(true);
        await until(() => Boolean(focusShadow()), "the study focus box never appeared");
        await sleep(150);

        const openers = [
          ["the panel's settings", () => panelShadow().querySelector(".sso-icon--gear"), "settings"],
          ["study's settings", () => focusShadow().querySelector(".sso-icon--gear"), "study"],
        ];
        try {
        for (const [name, find, word] of openers) {
          const button = find();
          if (!button) throw new Error(`${name} has no button to press`);
          button.click();
          await sleep(280);
          const sheet = sheetNamed(word);
          if (!sheet || sheet.querySelector(".sso-sheet").getBoundingClientRect().width === 0)
            throw new Error(`${name} did not open`);
          if (button.dataset.on !== "true")
            throw new Error(`${name} is open and its button does not look pressed`);

          button.click();
          await sleep(220);
          const after = sheetNamed(word);
          if (after && after.querySelector(".sso-sheet").getBoundingClientRect().width > 0)
            throw new Error(`pressing ${name} again did not close it`);
          if (button.dataset.on !== "false")

        }
        } finally {
          await window.__ssoStudy.setEnabled(studyWas);
          await sleep(120);
        }
      });

      check("two presses in the same turn do not open two of anything", async () => {
        /* Reported as a suspicion and it was right: "there are async
         * programming problems that would cause to create multiple study panes
         * for example". makeWindow.show() set `open` only AFTER awaiting
         * chrome.storage for its remembered size, so isOpen() answered "shut"
         * for the whole round trip - and every one of these buttons is a toggle
         * that asks isOpen() to decide what a press means. Two presses inside
         * that window both read "shut" and both opened.
         *
         * Pressed with no await between them, which is the only way to be
         * inside that window on purpose. Two presses is open-then-close, so the
         * window must end up SHUT - and there must be exactly one of it. */
        await window.__ssoPanel.show();
        await sleep(150);
        const gear = panelShadow().querySelector(".sso-icon--gear");
        gear.click();
        gear.click();
        await sleep(320);

        const sheets = [...document.querySelectorAll("div")]
          .map((d) => d.shadowRoot?.querySelector(".sso-sheet"))
          .filter(Boolean)
          .filter((s) => /settings/i.test(s.querySelector(".sso-win__title")?.textContent || ""));
        if (sheets.length > 1) throw new Error(`${sheets.length} settings windows exist`);
        const shown = sheets.filter((s) => s.getBoundingClientRect().width > 0);
        if (shown.length) throw new Error("open-then-close in one turn left the window open");
        if (gear.dataset.on !== "false") throw new Error("the button still looks pressed");
      });

      check("a double-click on the name asks for a different subtitle", async () => {
        /* Replacing one is a question about WHICH FILE this is, and the name is
         * that answer already on the card. Double, not single: a single click
         * already means "select this card", and the cheap reversible gesture
         * keeps the single. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const name = card.querySelector(".sso-track__label");

        name.click();
        await sleep(80);
        const title = () => panelShadow().querySelector(".sso-win__title").textContent;
        if (/find/i.test(title())) throw new Error("a single click left the subtitles");

        name.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, composed: true }));
        await sleep(160);
        if (!/find/i.test(title()))
          throw new Error(`a double-click left the panel on "${title()}"`);
        panelShadow().querySelector(".sso-panel__back").click();
        await sleep(120);
      });

      check("hiding a subtitle says so on its card", async () => {
        /* Hide moved into the menu, so the control that used to carry this
         * state is not on screen. A subtitle gone from the picture with nothing
         * saying why reads as a fault rather than as something you did. */
        /* A button on the card, not a menu item. Taking a subtitle off the
         * picture for ten seconds because it covers something worth seeing is
         * one of the two things done mid-scene, and two clicks deep is where
         * the menu started feeling like a filing cabinet. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const eye = card.querySelector(".sso-track__eye");
        if (!eye) throw new Error("no way to hide it");
        const box = eye.getBoundingClientRect();
        if (box.width < 22 || box.height < 22)
          throw new Error(`the hide button is ${Math.round(box.width)}×${Math.round(box.height)}`);

        eye.click();
        await sleep(120);
        if (card.dataset.hidden !== "true") throw new Error("the card does not say it is hidden");
        if (window.__ssoApi.status().tracks[0].visible)
          throw new Error("the subtitle is still on the picture");
        if (eye.dataset.on !== "false") throw new Error("the button does not say what it did");

        eye.click();
        await sleep(120);
        if (card.dataset.hidden !== "false") throw new Error("it would not come back");
      });

      check("undoing the timing is next to the timing", async () => {
        /* It was a menu item: open the menu, find it, click it - three actions
         * for the thing readers do most after over-shooting a nudge. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const clear = card.querySelector(".sso-sync__clear");
        if (!clear) throw new Error("no way to undo the timing from the card");

        window.__ssoApi.setOffset(0, { slot: 0, quiet: true });
        await sleep(80);
        /* Not `hidden` any more: on a wide card it keeps its box and only stops
         * being paintable, so that the timing field beside it does not move the
         * moment a subtitle comes back to its own timing. Either way it must be
         * impossible to press what there is nothing to undo with. */
        const reachable = (el) =>
          el.dataset.idle !== "true" &&
          getComputedStyle(el).visibility !== "hidden" &&
          el.getBoundingClientRect().width > 0;
        if (reachable(clear)) throw new Error("it offers to undo a timing that is already the file's");

        window.__ssoApi.setOffset(-4250, { slot: 0, quiet: true });
        await sleep(100);
        if (!reachable(clear)) throw new Error("there is something to undo and no way to undo it");
        if (clear.getBoundingClientRect().width < 24)
          throw new Error(`the undo is ${Math.round(clear.getBoundingClientRect().width)}px wide`);

        // It clears the stretch too: a stretched subtitle is not back to the
        // file's own timing until the stretch goes with the offset.
        window.__ssoApi.setRate(1.0427, { slot: 0, quiet: true });
        await sleep(80);
        clear.click();
        await sleep(120);
        const track = window.__ssoApi.status().tracks[0];
        if (track.offsetMs !== 0) throw new Error(`offset left at ${track.offsetMs}`);
        if (track.rate !== 1) throw new Error(`rate left at ${track.rate}`);
      });

      check("the reading is rounded to hundredths, whatever the offset is", async () => {
        /* Reported: "sync diff decimals should be limited, it shouldn't show
         * something like 1,66666666". The field printed
         * `String(Math.round(offsetMs) / 1000)` - exact, and therefore ragged:
         * a drag lands on 8958ms and the card reads 8.958, which in a locale
         * whose decimal mark is a comma renders as "8,958" and looks like eight
         * thousand.
         *
         * Two places is what content.js already says everywhere else, and a
         * FIXED two is what stops a tabular figure shuffling sideways under a
         * drag that rewrites it several times a second - so the check is on the
         * shape of the string, not merely on its length. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const field = card.querySelector(".sso-sync__field");
        for (const [ms, want] of [[8958, "8.96"], [1667, "1.67"], [-12500, "-12.50"], [0, "0.00"]]) {
          window.__ssoApi.setOffset(ms, { slot: 0, quiet: true });
          await sleep(60);
          if (field.value !== want)
            throw new Error(`${ms}ms reads "${field.value}", want "${want}"`);

      /* The ear itself: the player's playback answer, fetched the two ways a
       * player fetches, is overheard and handed across. The fixture has the
       * shape read in the userscript's source (see src/sites/primevideo.js);
       * a live answer's shape is what the running log will say. */
      check("the player's playback answer is overheard, by fetch and by XHR", async () => {
        const url = (title) => `../tests/fixtures/prime/GetVodPlaybackResources.json?deviceID=browser&titleId=${title}`;

        await fetch("../tests/fixtures/prime/GetVodPlaybackResources.json".replace("GetVod", "Other"), { cache: "no-store" }).catch(() => {});
        await sleep(40);
        if (own()?.titleId !== "X2") throw new Error("an unrelated fetch changed the list");

        window.postMessage({ source: "sso-ear", type: "tracks", titleId: "none", shape: [], tracks: [] }, "*");
        await sleep(40);

      /* Netflix: the manifest never crosses the network as JSON, so the ear is
       * on JSON.parse, and the one for the title on screen is the one shown.
       * Shape read in Subadub's and Tithen-Firion's sources (see
       * src/sites/netflix.js); a live manifest's shape is what the running log
       * will say. */
      check("Netflix's manifest is overheard in JSON.parse, for the title the page shows", async () => {
        const own = () => window.__ssoApi.status().own;

          const parsed = JSON.parse(text);
          if (parsed.result.movieId !== 81000001) throw new Error("the wrapped parse did not hand the value back");
          for (let i = 0; i < 40 && own()?.titleId !== "81000001"; i++) await sleep(25);
          if (own()?.titleId !== "81000001") throw new Error(`after parse: ${JSON.stringify(own())}`);
          const ids = own().tracks.map((t) => `${t.id}/${t.format}`).join();
          if (ids !== "page:81000001:en:subtitle/ttml,page:81000001:en:sdh/ttml,page:81000001:tr:subtitle/ttml,page:81000001:es:forced/ttml")
            throw new Error(ids);
          if (JSON.stringify(own()).includes("SECRET")) throw new Error("a signed URL got into status()");

          // The player moves on to the next episode: its manifest is already known.
          player.dataset.videoid = "81000002";
          for (let i = 0; i < 80 && own()?.titleId !== "81000002"; i++) await sleep(25);

      /* Disney+: HLS. The master playlist names every subtitle rendition,
       * and each is a playlist of WebVTT segments the worker joins (tested in
       * tests/worker.mjs). Shape read in the "Disney+ Subtitles Downloader
       * Improved" source (see src/sites/streams.js). */
      check("Disney+'s master playlist is overheard by XHR, its subtitle renditions resolved against it", async () => {

      /* YouTube: the caption list is in the player response, inlined on the

      check("YouTube's caption list is read from the player response, and the player's proof is put on every track", async () => {
        const own = () => window.__ssoApi.status().own;
        const askEar = () => new Promise((resolve) => {
          const onMessage = (event) => {
            if (event.data?.source !== "sso-ear" || event.data.type !== "tracks" || !/timedtext/.test(event.data.tracks?.[0]?.url || "")) return;

          // The first page: the response is a global, found by the once-a-second look.

          for (let i = 0; i < 80 && own()?.titleId !== "dQw4w9WgXcQ"; i++) await sleep(25);

          const ids = own().tracks.map((t) => `${t.id}/${t.format}`).join();

          const before = await askEar();

          // The player asks for a track itself, with its proof: every track gets it.
          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "../tests/fixtures/youtube/api/timedtext?v=dQw4w9WgXcQ&lang=en&fmt=vtt&pot=PROOF-TOKEN&potc=1&c=WEB");
            xhr.onload = resolve;
            xhr.onerror = () => reject(new Error("xhr failed"));

          if (!after.tracks.every((t) => /[?&]pot=PROOF-TOKEN(&|$)/.test(t.url) && /potc=1/.test(t.url) && /c=WEB/.test(t.url) && /fmt=vtt/.test(t.url))) throw new Error(`after the proof: ${after.tracks.map((t) => t.url).join(" ")}`);
          if (!after.shape.includes("pot") || !after.shape.includes("exp=xpe")) throw new Error(`shape ${after.shape}`);

          const second = await (await fetch("../tests/fixtures/youtube/youtubei/v1/player-next?prettyPrint=false")).json();
          if (second.videoDetails.videoId !== "aaaaaaaaaaa") throw new Error("the wrapped fetch did not hand the body back");
          await sleep(60);
          if (own()?.titleId !== "dQw4w9WgXcQ") throw new Error("a prefetched response replaced the video on screen");
          flexy.setAttribute("video-id", "aaaaaaaaaaa");
          for (let i = 0; i < 80 && own()?.titleId !== "aaaaaaaaaaa"; i++) await sleep(25);
          if (own()?.titleId !== "aaaaaaaaaaa" || own().tracks.length !== 3) throw new Error(`after the navigation: ${JSON.stringify(own())}`);
        } finally {
          flexy.remove();
          delete window.ytInitialPlayerResponse;
          window.postMessage({ source: "sso-ear", type: "tracks", titleId: "none", shape: [], tracks: [] }, "*");
          await sleep(40);
        }

      /* tabii, or any player handed a DASH manifest or an API answer naming
       * subtitle files. Written from the spec and from tabii's public home
       * page (see src/sites/streams.js), then observed on one playback

      check("a DASH manifest and an API answer are each read as the page's own subtitles", async () => {

          const onMessage = (event) => {
            if (event.data?.source !== "sso-ear" || event.data.type !== "tracks" || !test(event.data)) return;
            window.removeEventListener("message", onMessage);
            resolve(event.data);
          };
          window.addEventListener("message", onMessage);
          window.postMessage({ source: "sso-ear", type: "ask" }, "*");

        const xhr = (url) => new Promise((resolve, reject) => {
