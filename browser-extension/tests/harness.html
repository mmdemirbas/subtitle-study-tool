        if (words.join(",") !== "Early,Late")
          throw new Error(`the buttons read ${words.join(", ") || "nothing"}`);
        for (const b of card.querySelectorAll(".sso-nudge")) {
          if (!b.querySelector(".sso-nudge__step")) throw new Error("a nudge button has no step mark");
          // The full sentence stays reachable even where the word is hidden.
          if (!/spoken/.test(b.title)) throw new Error(`no plain-language title on "${b.textContent}"`);
        }
      });

      check("the menu of verbs opens inside the panel and closes on anything", async () => {
        /* It is a child of .sso-panel rather than a floating host, which only
         * works because the panel is `overflow: hidden auto` - so the thing to
         * assert is that it is actually reachable, not merely present. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const opener = card.querySelector(".sso-track__more");
        opener.click();
        await sleep(60);
        const open = menuShadow()?.querySelector(".sso-menu");
        if (!open) throw new Error("nothing opened");

        const menuBox = open.getBoundingClientRect();
        if (menuBox.width === 0 || menuBox.height === 0) throw new Error("the menu has no size");
        /* Fully on screen, and free to leave the panel.
         *
         * Reported: the menu was cut off at the panel's edge. It was a child of
         * the panel, which scrolls, so the panel's overflow clipped it - fine
         * for content and wrong for a menu. It has its own host now, and the
         * only thing it has to stay inside is the window. */
        if (menuBox.left < 0 || menuBox.top < 0 ||
            menuBox.right > window.innerWidth || menuBox.bottom > window.innerHeight)
          throw new Error(
            `off screen: menu at ${Math.round(menuBox.left)},${Math.round(menuBox.top)} ` +
            `${Math.round(menuBox.width)}×${Math.round(menuBox.height)} ` +
            `in a ${window.innerWidth}×${window.innerHeight} window`);
        // Nothing may clip it: every item is where the box says it is.
        const last = [...open.querySelectorAll(".sso-menu__item")].pop();
        if (last.getBoundingClientRect().bottom > menuBox.bottom + 1)
          throw new Error("the last item is outside the menu box");
        // Every item must be a real target, not a 2px sliver behind an edge.
        for (const item of open.querySelectorAll(".sso-menu__item")) {
          const box = item.getBoundingClientRect();
          if (box.height < 24) throw new Error(`a menu item is ${Math.round(box.height)}px tall`);
        }

        // Escape closes it, and one press of the opener does not leave two.
        open.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
        if (menuShadow()?.querySelector(".sso-menu")) throw new Error("Escape did not close it");
        opener.click();
        await sleep(40);
        opener.click();
        await sleep(40);
        if ([...document.querySelectorAll("div")].filter((d) => d.shadowRoot?.querySelector(".sso-menu")).length > 1)
          throw new Error("two menus at once");
        /* And it survives the panel scrolling under it.
         *
         * The menu is a child of the scrolling container, so it travels with
         * the row it is anchored to. A scroll dismissal closed menus by itself:
         * re-fitting the panel to the viewport emits a scroll no reader caused,
         * and because the listener was registered `{ once: true }` and never
         * removed, it was the *previous* menu's handler that closed the next
         * one. Consistently the second menu of a session, which is exactly the
         * shape of bug that survives a manual check. */
        panelShadow().querySelector(".sso-panel").dispatchEvent(new Event("scroll"));
        await sleep(60);
        if (!menuShadow()?.querySelector(".sso-menu"))
          throw new Error("a scroll closed the menu");

        menuShadow()?.querySelector(".sso-menu")
          ?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
        // A third opening, after two dismissals, still works.
        opener.click();
        await sleep(60);
        if (!menuShadow()?.querySelector(".sso-menu"))
          throw new Error("a menu dismissed twice cannot be opened a third time");
        menuShadow()?.querySelector(".sso-menu")
          .dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
      });

      check("hiding a subtitle says so on its card", async () => {
        /* Hide moved into the menu, so the control that used to carry this
         * state is not on screen. A subtitle gone from the picture with nothing
         * saying why reads as a fault rather than as something you did. */
        /* A button on the card, not a menu item. Taking a subtitle off the

        if (eye.dataset.on !== "false") throw new Error("the button does not say what it did");

      check("the settings window goes exactly where it is dragged", async () => {

         * writing 0, writing 100 and reading back where the element landed -
         * and this window's writer clamps its argument to the screen, so the
         * two probes came out 92px apart and the solver called it a page
         * scaled to 0.92. The probe is the raw writer now. */
        const sheet = await openSettings();
        const host = sheet.host;
        const body = sheet.querySelector(".sso-sheet__body");
        const pev = (type, x, y, buttons) =>
          new PointerEvent(type,

        body.dispatchEvent(pev("pointerdown", start.left + 30, start.top + 60, 1));

            `taking hold of it moved it ${Math.round(grabbed.left - start.left)},` +
            `${Math.round(grabbed.top - start.top)}`);

        body.dispatchEvent(pev("pointerup", start.left + 130, start.top + 120, 0));

        if (Math.abs(after.left - start.left - 100) > 1 || Math.abs(after.top - start.top - 60) > 1)

            `${Math.round(after.top - start.top)}`);

         * somebody changes it. If a fallback drifts from the value it replaced,
         * every existing installation silently restyles itself. */
        window.__ssoApi.updateTrackSettings(0, {
          color: undefined, font: undefined, weight: undefined, outline: undefined, backdrop: null,

        if (seen.color !== "rgb(255, 255, 255)") throw new Error(`colour is ${seen.color}`);
        if (seen.fontWeight !== "600") throw new Error(`weight is ${seen.fontWeight}`);
        if (seen.backgroundColor !== "rgba(0, 0, 0, 0.55)")

        if (!/0px 0px 4px/.test(seen.textShadow))
          throw new Error(`outline is ${seen.textShadow}`);

         * the very first paint - before settings have loaded and applySettings
         * has written anything. That is the only moment the var() fallbacks in
         * overlay.css are load-bearing, so it is the only way to check they
         * still match the literals they replaced. */
        const root = window.__ssoApi.overlayRoots()[0];

        for (const name of written) root.style.removeProperty(name);

        const drift = [];
        if (bare.color !== "rgb(255, 255, 255)") drift.push(`colour ${bare.color}`);
        if (bare.fontWeight !== "600") drift.push(`weight ${bare.fontWeight}`);
        if (!/0px 0px 4px/.test(bare.textShadow)) drift.push(`outline ${bare.textShadow}`);
        if (!/Helvetica/.test(bare.fontFamily)) drift.push(`font ${bare.fontFamily}`);
        written.forEach((name, i) => kept[i] && root.style.setProperty(name, kept[i]));

      /* --- lining two subtitles up ---------------------------------------------
       *
       * Pure arithmetic on two lists of cue start times, so these need no video,
       * no attach and no timing. The cue lists are synthetic and deliberately
       * irregular: a regular grid self-correlates at every lag and would make
       * even unrelated files look like a perfect match.
       */
      const speech = (count, seed) => {
        // A cheap deterministic generator - gaps around 2.8s, log-normal-ish,
        // which is what real dialogue looks like.
        let x = seed;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const out = [];
        let t = 30000;
        for (let i = 0; i < count; i++) {
          t += 600 + Math.round(4200 * next() * next() * 3);
          out.push(t);
        }
        return out;
      };

      check("two subtitles for the same film are lined up exactly", async () => {
        const align = window.__ssoAlign;
        if (!align) throw new Error("the aligner did not load");
        const a = speech(900, 7);
        for (const gap of [0, 4400, -12800, 42000, -120000]) {
          const answer = align.align(a, a.map((t) => t + gap));
          if (!answer.ok) throw new Error(`refused a ${gap}ms shift (conf ${answer.confidence})`);
          if (answer.shiftMs !== gap)
            throw new Error(`said ${answer.shiftMs} for a ${gap}ms shift`);
          if (answer.rate !== 1) throw new Error(`invented a rate of ${answer.rate}`);
        }
      });

      check("a framerate mismatch is recognised as one of the real ratios", async () => {
        /* A subtitle timed for 25fps against a 23.976 encode starts right and
         * drifts by minutes. The rate is picked from a closed set rather than
         * fitted: a free fit needs a constant-offset peak to seed it, and a 4%
         * stretch is exactly what destroys that peak. */
        const align = window.__ssoAlign;
        const a = speech(1100, 11);
        for (const rate of align.RATES) {
          if (rate === 1) continue;
          const answer = align.align(a, a.map((t) => Math.round(t * rate)));
          if (!answer.ok) throw new Error(`refused a ${rate} stretch`);
          if (Math.abs(answer.rate - rate) > 1e-9)
            throw new Error(`said ${answer.rate} for a stretch of ${rate}`);
        }
      });

      check("two different films are refused, not shifted by the best of a bad lot", async () => {
        /* The whole design. An aligner that always returns a number is worse
         * than none: the number it gives for two unrelated films is confident
         * and wrong, and a subtitle silently shifted is harder to diagnose than
         * one nobody touched. */
        const align = window.__ssoAlign;
        for (const seed of [3, 19, 101, 777]) {
          const answer = align.align(speech(1000, seed), speech(1000, seed + 5000));
          if (answer.ok)
            throw new Error(`accepted two unrelated films at ${answer.confidence}`);
          if (answer.verdict !== "no") throw new Error(`verdict was ${answer.verdict}`);
        }
      });

        const align = window.__ssoAlign;
        const a = speech(1200, 23);
        // Forced subtitles: a tenth of the film, scattered through it.
        const forced = a.filter((_, i) => i % 10 === 0).map((t) => t + 6500);
        const partial = align.align(a, forced);
        if (!partial.ok) throw new Error(`refused a forced-subtitle track (${partial.confidence})`);
        if (partial.shiftMs !== 6500) throw new Error(`said ${partial.shiftMs}, want 6500`);

        // Below what any honest answer can be given for.
        const tiny = align.align(a, a.slice(0, 6).map((t) => t + 1000));
        if (tiny.ok) throw new Error("gave an answer from six cues");
        if (tiny.reason !== "too-few-cues") throw new Error(`reason was ${tiny.reason}`);

      check("a gap past the first window is found by the second, not mis-fitted", async () => {
        /* This used to assert that anything past MAX_OFFSET_MS was refused,
         * which was the behaviour and was the bug: a subtitle timed for a cut
         * carrying a recap the other file does not have lands out there, and
         * the reader was told the two files were different programmes. Measured
         * on the repo's own pair, a 240s gap came back refused at confidence
         * 0.53 with a nonsense shift, and a 185s gap came back ACCEPTED with the
         * shift 5.18s wrong.
         *
         * What must still hold is that nothing is mis-fitted: inside the wide
         * window the answer is right, and past it there is no answer at all. */
        const align = window.__ssoAlign;
        const a = speech(900, 31);
        const near = align.MAX_OFFSET_MS + 60000;
        const found = align.align(a, a.map((t) => t + near));
        if (!found.ok) throw new Error(`a ${near}ms gap was refused (${found.confidence})`);
        if (Math.abs(found.shiftMs - near) > 100)
          throw new Error(`a ${near}ms gap was reported as ${found.shiftMs}ms`);
        if (found.searchedMs <= align.MAX_OFFSET_MS)
          throw new Error("the wide pass never ran");

        const far = 4_000_000; // past the wide window too
        const refused = align.align(a, a.map((t) => t + far));

         * exact only while lines do not overlap. A sign or a lyric held across

         * search follows the wrong half and the held line disappears for the

        const wasTime = video.currentTime;

            { start: 1000, end: 20000, text: "HELD across everything" },
            { start: 2000, end: 4000, text: "under it A" },
            { start: 5000, end: 7000, text: "under it B" },
            { start: 21000, end: 23000, text: "after" },

          label: "overlapping", fileId: 6400, language: "en", slot: 0,

            video.currentTime = seconds;

      /* --- drift ------------------------------------------------------------
       *
       * A subtitle that is late is fixed by one nudge. One that is running at
       * the wrong speed is not, and the reader finds that out by nudging it
       * again twenty minutes later. Those two nudges are a measurement: the
       * slope between them is the rate.
       *
       * The film here is stubbed at 7200s, and currentTime is a plain variable,
       * so a correction can be placed anywhere in it. */
      const FRAMERATE = 25 / (24000 / 1001); // 1.042708 - PAL against NTSC film

      async function correctionsAt(pairs) {
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        await api.attach({ cues: CUES, label: "drift", fileId: 7300, language: "en", slot: 0 });
        // Clears any correction history and any offer already made, so each
        // case starts from a subtitle nobody has touched.
        api.setRate(1, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true, byHand: false });
        // Ad drift shifts file time by a constant, which cancels out of the
        // slope but not out of the positions this case asserts against.
        api.clearAdDrift();
        api.showToast("nothing to report");
        await sleep(40);

        for (const [fileMs, offsetMs] of pairs) {
          // filmTimeMs is currentTime less the offset, so this puts the
          // correction at the file position the case names.
          video.currentTime = (fileMs + offsetMs) / 1000;
          api.setOffset(offsetMs, { slot: 0, quiet: true });
          await sleep(40);
        }
        return toastEl();
      }

      async function undoDrift() {
        const api = window.__ssoApi;
        document.getElementById("v").currentTime = 1;
        api.setRate(1, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true, byHand: false });
        await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
        await sleep(80);
      }

      check("a subtitle nudged twice across the film is offered the speed that explains it", async () => {
        /* The aligner can already find a framerate mismatch, but only by
         * comparing two subtitles - so it has nothing to say to a reader
         * watching in one language, which is the case this covers. */
        try {
          // 4.27% fast: the correction needed grows with the film.
          const toast = await correctionsAt([
            [400000, Math.round((FRAMERATE - 1) * 400000)],
            [2400000, Math.round((FRAMERATE - 1) * 2400000)],
          ]);
          const said = toast?.textContent || "";
          if (!/framerate/i.test(said) || !/4\.3%/.test(said))
            throw new Error(`the drift went unreported: "${said}"`);

          const button = toast.querySelector(".sso-toast__action");
          if (!button) throw new Error("the drift was named with no way to fix it");
          button.click();
          await sleep(60);

          const track = window.__ssoApi.status().tracks[0];
          if (Math.abs(track.rate - FRAMERATE) > 0.0005)
            throw new Error(`it applied a rate of ${track.rate}`);
          /* The line the reader last lined up by ear has to stay where they put
           * it. A speed applied on its own moves every line including that one,
           * so the button offering to help would undo the correction that
           * summoned it. */
          const wasAt = 2400000 + Math.round((FRAMERATE - 1) * 2400000);
          const nowAt = track.rate * 2400000 + track.offsetMs;
          if (Math.abs(nowAt - wasAt) > 50)
            throw new Error(`the line the reader lined up moved by ${Math.round(nowAt - wasAt)}ms`);
        } finally {
          await undoDrift();
        }
      });

      check("a stretched subtitle shows the right line at the right moment", async () => {
        /* The display model is `stream = rate * fileTime + offset + adDrift`.
         * Every one of these assertions is invisible while rate is 1, which is
         * exactly why they are here: a sign or an order-of-operations mistake
         * in that expression would pass every other test in this file. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const cues = [
          { start: 60000, end: 62000, text: "early line" },
          { start: 600000, end: 602000, text: "late line" },
        ];
        await api.attach({ cues, label: "stretched", fileId: 5150, language: "en", slot: 0 });
        await sleep(120);

        const showing = () => shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue').textContent;
        const at = async (seconds) => { video.currentTime = seconds; await sleep(140); return showing(); };

        // Rate 1 first: the baseline this must not disturb.
        if (!(await at(601)).includes("late")) throw new Error("the plain case is already wrong");

        /* A subtitle timed for 25fps against a 23.976 encode: its clock runs
         * fast, so a line the file puts at ten minutes is spoken later. */
        const rate = 25 / (24000 / 1001);
        api.setRate(rate, { slot: 0, quiet: true });
        await sleep(120);
        // 600s of file time lands at 600 * rate of stream time.
        const late = await at(600 * rate + 1);
        if (!late.includes("late"))
          throw new Error(`at ${(600 * rate + 1).toFixed(1)}s a stretched subtitle showed "${late}"`);
        // And the unstretched moment is now too early for it.
        const early = await at(601);
        if (early.includes("late"))
          throw new Error("the stretch did not move the later line at all");

        /* Ad drift comes off before the division, because it is measured in
         * stream seconds - an advert takes the same real time whatever the film
         * is encoded at. Dividing it too would be invisible at rate 1. */
        api.setRate(1, { slot: 0, quiet: true });
        await sleep(100);

        /* And a nudge is a constant shift in display time whatever the rate,
         * which is the reason the offset is applied outside the division rather
         * than inside it. */
        api.setRate(rate, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true });
        await sleep(100);
        const before = video.currentTime;
        const shownAt = 600 * rate;
        video.currentTime = shownAt + 1;
        await sleep(120);
        api.nudge(2000, { slot: 0 });
        await sleep(120);
        video.currentTime = shownAt + 3;
        await sleep(140);
        if (!showing().includes("late"))
          throw new Error("a 2s nudge did not move the line by 2s of stream time");
        video.currentTime = before;

        api.setRate(1, { slot: 0, quiet: true });
        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {

              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

         * and "go on" is the only part that needs a hand. The whole difficulty
         * is doing it once: a pause is a state, not a moment, so when play is
         * pressed the playhead is still inside the same line's end, and a naive
         * check pauses again on the very next tick and the film never moves.
         *
         * The other half is the Again key, which goes back over a line already
         * stopped at - and that line's end has to stop the film a second time
         * or repeating a line silently turns the feature off for it. */

        const realPause = video.pause;
        const realPlay = video.play;

        video.pause = () => { paused = true; };
        video.play = () => { paused = false; };

            cues: [
              { start: 1000, end: 3000, text: "one" },
              { start: 5000, end: 7000, text: "two" },

          await at(2.98);
          if (!paused) throw new Error("the line ended and it did not stop");

          await sleep(320);
          if (paused) throw new Error("pressing play stopped it again - the film cannot move");

          await sleep(150);
          api.stepLine(-1);
          await sleep(260);
          if (paused) throw new Error("going back a line left it stopped");
          await at(6.98);
          if (!paused) throw new Error("a repeated line does not stop at its end");

          api.updateSettings({ pauseAtLineEnd: false });
          video.play();
          await at(2.99);
          if (paused) throw new Error("it stopped with the setting off");
        } finally {
          api.updateSettings({ pauseAtLineEnd: false });
          video.pause = realPause;
          video.play = realPlay;

      /* The same feature, against a clock that really runs, at the speeds a
       * learner uses.
       *
       * The case above teleports the playhead to 2.98s, which lands inside the
       * stop window by construction - which is why it passed while the feature
       * was broken above 1x. The window is one tick of FILM wide, and film
       * advances at the playback rate, so a single tick steps over it: at 2x a
       * tick is 100ms of film, at 4x 200ms. Measured before the fix, over four
       * lines: 1x stopped at all four, 2x at one, 4x at none. Nothing recovers
       * a missed stop, so from the reader's side the mode had switched itself
       * off.
       *
       * A clock local to this case, so the other cases keep the static
       * playhead they were written against. */
      check("stops at the end of every line at 1x, 2x and 4x", async () => {
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;
        const hadPaused = Object.getOwnPropertyDescriptor(video, "paused");
        const hadCurrent = Object.getOwnPropertyDescriptor(video, "currentTime");
        const realPause = video.pause;
        const realPlay = video.play;

        let at = 0;
        let since = 0;
        let rate = 1;
        let paused = true;
        const read = () => (paused ? at : at + ((performance.now() - since) / 1000) * rate);
        Object.defineProperty(video, "currentTime", {
          get: read,
          set: (x) => { at = x; since = performance.now(); },
          configurable: true,
        });
        Object.defineProperty(video, "paused", { get: () => paused, configurable: true });
        video.pause = () => { at = read(); paused = true; };
        video.play = () => { since = performance.now(); paused = false; };

        // Four one-second lines with one-second gaps, so the whole sweep takes
        // seconds rather than minutes at 1x.
        const cues = [0, 1, 2, 3].map((n) => ({
          start: 1000 + n * 2000, end: 2000 + n * 2000, text: `line ${n}`,
        }));

        try {
          await api.attach({ cues, label: "EN · rate", fileId: 8300, language: "en", slot: 0 });
          api.setKeyTrack(0);
          api.updateSettings({ pauseAtLineEnd: true });
          await sleep(250);

          for (const speed of [1, 2, 4]) {
            rate = speed;
            const stops = [];
            video.currentTime = 0.4;
            video.play();
            const deadline = performance.now() + 3000 + 9000 / speed;
            while (stops.length < cues.length && performance.now() < deadline) {
              await sleep(20);
              if (paused) {
                stops.push(Number(read().toFixed(2)));
                video.play();
              }
            }
            video.pause();
            if (stops.length < cues.length) {
              throw new Error(
                `at ${speed}x it stopped ${stops.length} of ${cues.length} times (at ${stops})`,
              );
            }
            /* And it has to stop while the line is still on screen. Stopping
             * past the end leaves a stopped film with an empty subtitle, which
             * is the opposite of what the mode is for. The early bound is one
             * step, 200ms of film at 4x. */
            stops.forEach((stop, n) => {
              const end = cues[n].end / 1000;
              if (stop > end + 0.05 || stop < end - 0.3) {
                throw new Error(
                  `at ${speed}x it stopped at ${stop}s for a line ending at ${end}s`,
                );
              }
            });
          }
        } finally {
          api.updateSettings({ pauseAtLineEnd: false });
          video.pause = realPause;
          video.play = realPlay;
          if (hadPaused) Object.defineProperty(video, "paused", hadPaused);
          if (hadCurrent) Object.defineProperty(video, "currentTime", hadCurrent);
          video.currentTime = wasTime;
          if (wasAttached[0]) {
            await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
          } else {
            api.detach(0);
          }
          await sleep(150);
        }
      });

      check("the rail can be made taller than what is in it, and still folds", async () => {
        /* The height was applied as a cap and never a floor, so the rail sprang
         * back to its contents and could not be made bigger than them - which
         * is not a resize. The cap is still right for a rail nobody has dragged:
         * one card should not be a tall empty rectangle over the film. So a
         * height that came from a corner is a height, and only that one. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const study = window.__ssoStudy;
        const wasStudy = { ...study.settings() };
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasTime = video.currentTime;

        try {
          study.updateSettings({ auto: true, rarityRank: 1, showRail: true, folded: false, height: 0 });
          await api.attach({
            cues: [{ start: 0, end: 600000, text: "frankly the corvette was decommissioned" }],
            label: "EN · study", fileId: 7100, language: "en", slot: 0,
          });
          video.currentTime = 5;
          await sleep(900);

          const rail = [...document.querySelectorAll("div")]
            .find((d) => d.shadowRoot?.querySelector(".sso-rail"))
            ?.shadowRoot.querySelector(".sso-rail");
          if (!rail) throw new Error("no rail on screen to resize");
          const height = () => Math.round(rail.getBoundingClientRect().height);

          const content = height();
          study.updateSettings({ height: content + 260 });
          await sleep(250);
          const asked = content + 260;
          if (Math.abs(height() - asked) > 6)
            throw new Error(`asked for ${asked}px and got ${height()}px`);

          // Folded is a height of its own and has to outrank a dragged one.
          study.updateSettings({ folded: true });
          await sleep(250);
          if (height() > 90) throw new Error(`folded to ${height()}px, which is not folded`);

          // And back to nothing chosen is back to hugging the contents.
          study.updateSettings({ folded: false, height: 0 });
          await sleep(250);
          if (Math.abs(height() - content) > 6)
            throw new Error(`cleared the height and got ${height()}px, not ${content}px`);
        } finally {
          study.updateSettings(wasStudy);
          video.currentTime = wasTime;
          if (wasAttached[0]) {
            await api.attach({ cues: CUES, label: "first", fileId: 1, language: "en", slot: 0 });
          } else {
            api.detach(0);
          }
          await sleep(200);
        }
      });

      check("no surface is left inside an element that cannot paint it", async () => {
        /* `requestFullscreen` can be called on any element, and several players
         * - and Chrome's own "fullscreen the video" - call it on the <video>.
         * Everything used to be moved into the fullscreen element, because only
         * that subtree renders. Inside a <video> nothing renders at all: a
         * child of a replaced element never generates a box.
         *
         * Measured on that path before the fix: the panel and the whole overlay
         * both rendered 0x0 while reporting themselves open, so the CC button
         * toggled a panel nobody could see and leaving fullscreen revealed one
         * that had been open the whole time.
         *
         * The 0x0 only happens in real fullscreen, which needs a user gesture
         * this page cannot make - outside it a `position: fixed` child escapes
         * its parent's layout and paints anyway. So what is asserted here is
         * the invariant that keeps the bug from happening at all: asked to
         * follow something into a <video>, a surface does not go, and it ends
         * up in the top layer, where the question never arises. */
        const video = document.getElementById("v");
        const hostFor = (sel) =>
          [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));

        await window.__ssoPanel.show();
        await sleep(250);
        const panel = hostFor(".sso-panel");
        const overlay = hostFor(".sso-root");

        try {
          // What the old code did, done by hand: bury them in the video.
          for (const node of [overlay, panel]) {
            if (node.matches(":popover-open")) node.hidePopover();
            node.removeAttribute("popover");
            video.appendChild(node);
          }
          await sleep(60);

          window.__ssoApi.toTopLayer(overlay, { again: true });
          window.__ssoPanel.reparent(video, { raise: true });
          await sleep(120);

          if (panel.parentElement === video)
            throw new Error("the panel stayed inside the video");
          if (overlay.parentElement === video)
            throw new Error("the overlay stayed inside the video");
          if (!panel.matches(":popover-open"))
            throw new Error("the panel is not in the top layer, so fullscreen will bury it");
          if (!overlay.matches(":popover-open"))
            throw new Error("the subtitles are not in the top layer");
        } finally {
          window.__ssoPanel.hide();
          await sleep(120);
        }
      });

      check("the floating surfaces sit in the top layer", async () => {
        /* Which is what makes the case above a non-event rather than a fix that
         * has to be maintained: the top layer paints above the fullscreen
         * element wherever the host sits in the document, so nothing has to be
         * moved and no z-index has to win. */
        const hostFor = (sel) =>
          [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));
        window.__ssoApi.showToast("putting the toast on screen");
        await sleep(120);
        window.__ssoApi.toTopLayer(hostFor(".sso-root"));
        await sleep(60);

        for (const [what, sel] of [["the overlay", ".sso-root"], ["the toast", ".sso-toast"]]) {
          const node = hostFor(sel);
          if (!node) throw new Error(`${what} has no host`);
          if (!node.matches(":popover-open"))
            throw new Error(`${what} is not in the top layer`);
        }
      });

      check("the next episode is noticed without a page load", async () => {
        /* Streaming sites are single pages: the next episode swaps the stream
         * and leaves the tab, the frame and the <video> element where they
         * were. Nothing else in the extension would ever hear about it.
         *
         * What is asserted is the report, not the attach - the worker's half is
         * not loaded in this page. Three rules, and the last two are the ones
         * worth having: it settles before speaking, it says nothing at all
         * while an ad is playing, and it speaks once per programme however many
         * times the tick runs. */
        const video = document.getElementById("v");
        const wasTitle = document.title;
        const wasDuration = video.duration;
        const setDuration = (seconds) =>
          Object.defineProperty(video, "duration", { get: () => seconds, configurable: true });

        try {
          window.__sent.length = 0;
          document.title = "Harness — S01E04";
          setDuration(2400);
          await sleep(400);
          const early = window.__sent.filter((m) => m.type === "sso:programme").length;
          if (early !== 0) throw new Error("it spoke before the player had settled");

          await sleep(1800);
          const said = window.__sent.filter((m) => m.type === "sso:programme");
          if (said.length !== 1)
            throw new Error(`reported ${said.length} times for one episode`);
          if (!said[0].mark.includes("S01E04") || !said[0].mark.startsWith("2400"))
            throw new Error(`reported the wrong programme: ${said[0].mark}`);

          // The tick keeps running; the same programme must not be reported again.
          await sleep(1200);
          if (window.__sent.filter((m) => m.type === "sso:programme").length !== 1)
            throw new Error("it kept reporting the same episode");

          /* An unread count in front of the title is not a new episode. Several
           * players write one, and a title is half the mark. */
          document.title = `(2) ${wasTitle === document.title ? document.title : "Harness — S01E04"}`;
          await sleep(2000);
          if (window.__sent.filter((m) => m.type === "sso:programme").length !== 1)
            throw new Error("a notification count was read as a new episode");

          /* An advert is not a new programme, and on the players that swap the
           * element for one it is exactly what this would otherwise fire on. */
          window.__sent.length = 0;
          const slot = document.getElementById("ad-slot");
          slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
            'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
          await sleep(600);
          document.title = "Harness — S01E05";
          setDuration(2401);
          await sleep(2000);
          const duringAd = window.__sent.filter((m) => m.type === "sso:programme").length;
          slot.innerHTML = "";
          if (duringAd !== 0) throw new Error("an ad break was reported as a new episode");
        } finally {
          document.title = wasTitle;
          setDuration(wasDuration);
          document.getElementById("ad-slot").innerHTML = "";
          await sleep(1800);
          window.__sent.length = 0;
        }
      });

      check("a translation timed by somebody else still needs no click", async () => {
        /* The reason the pair is worth anything: the second subtitle is not a
         * copy of the first with a constant shift, it is a different person's
         * timing of the same speech. Most lines land within a few hundred
         * milliseconds, some are placed badly, some are missing altogether, and
         * the whole thing sits against a different release.
         *
         * Asserted end to end through attach, and on the number rather than on
         * "something happened": an alignment that fires and is a second out is
         * worse than one that does not fire, because the reader now believes it. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const starts = speech(900, 11);
        const reference = starts.map((start) => ({ start, end: start + 1800, text: "en" }));

        const SHIFT = 6500;
        let x = 424242;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const bell = () => (next() + next() + next() + next() - 2) * 0.7;
        const translated = starts
          .filter(() => next() > 0.08)                       // 8% of lines missing
          .map((start) => {
            const jitter = Math.round(bell() * 300);          // most within ~600ms
            const badly = next() < 0.06 ? Math.round((next() - 0.5) * 5000) : 0;
            return { start: start + SHIFT + jitter + badly, end: start + SHIFT + 1800, text: "tr" };
          });

        try {
          await api.attach({ cues: reference, label: "EN · reference", fileId: 6501, language: "en", slot: 0 });
          await sleep(150);
          await api.attach({ cues: translated, label: "TR · a different person's timing", fileId: 6502, language: "tr", slot: 1 });
          await sleep(250);

          const moved = api.status().tracks[1].offsetMs;
          if (moved === 0) throw new Error("the second subtitle was left where it was");
          /* The display offset is the negative of the gap between the files:
           * a subtitle whose lines sit 6.5s later has to be brought forward. */
          if (Math.abs(moved + SHIFT) > 120)
            throw new Error(`lined up ${moved}ms against a real gap of ${-SHIFT}ms`);
          if (api.status().tracks[0].offsetMs !== 0)
            throw new Error("it moved the first subtitle, which is the reference");
        } finally {
          for (const slot of [0, 1]) {
            if (wasAttached[slot]) {
              await api.attach({
                cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
                language: slot ? "tr" : "en", slot,
              });
            } else {
              api.detach(slot);
            }
          }
          api.updateSettings({ tracks: wasGeometry });
          await sleep(150);
        }
      });

      check("attaching a second subtitle lines it up on its own", async () => {
        /* End to end, through attach: the thing the reader actually does.
         *
         * Both slots are replaced, because this harness's own cue list is five
         * lines and the aligner declines to have an opinion below twelve - and
         * quite right. Everything is put back afterwards, geometry included:
         * attach() arranges two subtitles side by side the first time neither
         * has been placed by hand, and later cases assert on that. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const long = speech(600, 47).map((start) => ({ start, end: start + 1800, text: "line" }));
        const late = long.map((cue) => ({ start: cue.start + 8000, end: cue.end + 8000, text: cue.text }));
        await api.attach({ cues: long, label: "reference", fileId: 4241, language: "en", slot: 0 });
        await sleep(120);
        await api.attach({ cues: late, label: "mistimed", fileId: 4242, language: "tr", slot: 1 });
        await sleep(200);

        const after = api.status().tracks[1];
        if (!after.attached) throw new Error("it did not attach");
        /* Minus eight seconds, and the sign is the point. This subtitle's cues
         * start eight seconds later than the reference's, so to put the same
         * words on screen at the same moment it has to be brought forward -
         * film time is stream time minus the offset. Getting this backwards is
         * the single easiest mistake in the whole feature and it doubles the
         * error rather than fixing it. */
        if (Math.abs(after.offsetMs + 8000) > 250)
          throw new Error(`offset came out at ${after.offsetMs}, want about -8000`);

        // And a subtitle for a different film is left exactly as it arrived.
        const unrelated = speech(600, 913).map((start) => ({ start, end: start + 1800, text: "x" }));
        await api.attach({ cues: unrelated, label: "elsewhere", fileId: 4243, language: "tr", slot: 1 });
        await sleep(200);
        if (api.status().tracks[1].offsetMs !== 0)
          throw new Error(`a different film was shifted by ${api.status().tracks[1].offsetMs}ms`);

        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      /* The obstruction probe in the diagnostic report.
       *
       * Asked through the message the worker actually sends, so what is under
       * test is the whole path rather than a function lifted out of it. These
       * exist because the thing they describe cannot be seen from the harness
       * at all: a page whose player is a cross-origin iframe covers the panel
       * from a document this one has no equivalent of. What can be checked
       * here is that the probe reports the surfaces truthfully - so that when
       * it is read on such a page, the reading means something. */
      const askDiagnose = async () => {
        for (const listener of [...window.__listeners].reverse()) {
          let answer = null;
          const returned = listener({ type: "sso:diagnose" }, {}, (value) => { answer = value; });
          if (answer) return answer;
          if (returned && typeof returned.then === "function") await returned;
        }
        throw new Error("no listener answered sso:diagnose");
      };

      check("the diagnostic reports the surfaces the extension drew", async () => {
        const report = await askDiagnose();
        if (!Array.isArray(report.surfaces)) throw new Error("no surfaces in the report");
        if (!report.surfaces.length) throw new Error("nothing reported, with an overlay on screen");
        const names = report.surfaces.map((s) => s.surface).join(" ");
        if (!/sso-/.test(names)) throw new Error(`surfaces are not ours: ${names}`);
      });

      check("it reports each surface's geometry and stacking", async () => {
        const [first] = (await askDiagnose()).surfaces;
        if (first.rect.length !== 4) throw new Error("no rect");
        if (typeof first.zIndex !== "string") throw new Error("no z-index");
        if (typeof first.pointerEvents !== "string") throw new Error("no pointer-events");
        if (typeof first.inTopLayer !== "boolean") throw new Error("no top-layer state");
      });

      check("an unobstructed button is reported reachable, naming nothing", async () => {
        const targets = (await askDiagnose()).surfaces.flatMap((s) => s.targets || []);
        const drawn = targets.filter((t) => t.rendered !== false);
        if (!drawn.length) throw new Error("no button was sampled");
        const stuck = drawn.filter((t) => !t.reachable);
        if (stuck.length) {
          throw new Error(`${stuck.length} unreachable on a page with nothing over them: ` +
            JSON.stringify(stuck[0]));
        }
        if (drawn.some((t) => t.coveredBy.length)) throw new Error("named an obstruction that is not there");
      });

      check("a button under something names what took the click", async () => {
        /* The page's own overlay, at the z-index the measured ones use. It has
         * to out-rank the top layer to cover anything, which nothing in one
         * document can - so the surface is taken out of the top layer first,
         * which is also the state it is in whenever promotion failed. */
        const hosts = [...document.querySelectorAll("div")]
          .filter((d) => (d.shadowRoot?.firstElementChild?.className || "").startsWith("sso-"));
        // Every one of them, not the first: a surface left in the top layer
        // stays reachable and would read as a page with nothing wrong.
        const wereOpen = hosts.filter((h) => h.matches(":popover-open"));
        for (const h of wereOpen) h.hidePopover();

        const lid = document.createElement("div");
        lid.id = "harness-lid";
        for (const [p, v] of Object.entries({
          position: "fixed", inset: "0", "z-index": "2147483647", "pointer-events": "auto",
        })) lid.style.setProperty(p, v, "important");
        document.documentElement.append(lid);

        try {
          const targets = (await askDiagnose()).surfaces.flatMap((s) => s.targets || []);
          const drawn = targets.filter((t) => t.rendered !== false);
          if (!drawn.length) throw new Error("no button was sampled");
          const named = drawn.filter((t) => t.coveredBy.some((c) => /harness-lid/.test(c)));
          if (!named.length) {
            throw new Error(`the lid was not named: ${JSON.stringify(drawn.map((t) => t.coveredBy))}`);
          }
          if (named.some((t) => t.reachable)) throw new Error("covered and still called reachable");
          if (!named[0].coveredBy.some((c) => /z=2147483647/.test(c))) {
            throw new Error(`the winning z-index is missing: ${named[0].coveredBy}`);
          }
        } finally {
          lid.remove();
          for (const h of wereOpen) h.showPopover();
        }
      });

      check("re-injection leaves exactly one overlay", async () => {
        window.__ssoApi.detach(1);
        const count = () => [...document.querySelectorAll("div")].filter((d) => d.shadowRoot).length;
        const load = (src) => new Promise((ok, no) => {
          const s = document.createElement("script");
          s.src = src + "?v=" + cases.length; s.onload = ok; s.onerror = no;
          document.body.append(s);
        });
        await load("../src/content.js");
        await load("../src/panel.js");
        await load("../src/study.js");
        await sleep(150);
        if (count() > 2) throw new Error(`${count()} shadow hosts after re-injection`);
      });

      // --- run ------------------------------------------------------------
      /* An error nobody caught is a failure even when every assertion holds.
       * Rejected promises count too: most of this code reports failure by
       * rejecting inside a .catch() that discards it. */
      const loose = [];
      window.addEventListener("error", (e) => loose.push(e.message));
      window.addEventListener("unhandledrejection", (e) => loose.push(String(e.reason?.message ?? e.reason)));

      (async () => {
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);

        const out = document.getElementById("results");
        let passed = 0;
        for (const { name, fn } of cases) {
          const row = document.createElement("div");
          row.className = "case";
          try {
            await fn();
            row.classList.add("pass");
            row.textContent = name;
            passed++;
          } catch (err) {
            row.classList.add("fail");
            row.textContent = name;
            const why = document.createElement("div");
            why.className = "why";
            why.textContent = err.message;
            row.append(why);
          }
          out.append(row);
        }
        for (const message of [...new Set(loose)]) {
          const row = document.createElement("div");
          row.className = "case fail";
          row.textContent = "nothing caught this error";
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = message;
          row.append(why);
          out.append(row);
        }

        const total = cases.length + new Set(loose).size;
        const summary = document.getElementById("summary");
        summary.textContent = `${passed}/${total} passed`;
        summary.style.color = passed === total ? "#59c27f" : "#e8705f";
        window.__harness = { passed, total, loose: [...new Set(loose)] };
      })();
    </script>
  </body>
</html>
