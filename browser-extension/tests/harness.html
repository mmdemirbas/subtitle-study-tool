<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Overlay — test harness</title>
    <style>
      /* --- The page under test ------------------------------------------
       *
       * These are not arbitrary. Every rule here reproduces something a real
       * streaming site does that has broken this extension at least once:
       *
       *   button { ... !important }   made the CC handle invisible
       *   span   { font-style: normal } cancelled subtitle italics
       *   div    { line-height: 3 }   pulled the control panel apart
       *   #later { z-index: max }     player chrome painted over the overlay
       *   stopPropagation on the player  killed the pointermove listener
       *
       * If a change to the extension survives this page, it survives Prime.
       */
      body { margin: 0; background: #0b0d10; font-family: serif; color: #fff; }
      div { position: relative; line-height: 3; letter-spacing: 2px; }
      span { font-style: normal !important; color: #ff00ff !important; }
      button { position: relative !important; opacity: 0 !important;
               visibility: hidden !important; display: inline !important;
               transform: scale(0) !important; font-size: 40px !important; }
      #player { position: fixed; inset: 0;
        background: radial-gradient(60% 50% at 30% 35%, #48586b, #12161c 70%); }
      video { width: 100%; height: 100%; display: block; }
      /* Player chrome appended AFTER the overlay, same z-index. */
      #later { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; }

      /* --- Results panel (not under test) ------------------------------- */
      #results { position: fixed; right: 0; top: 0; bottom: 0; width: 430px;
        overflow: auto; z-index: 2147483646; padding: 14px 16px;
        background: #0f1116; border-left: 1px solid #262b33;
        font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        line-height: 1.5 !important; letter-spacing: 0 !important; }
      #results h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0 !important; }
      #summary { margin: 0 0 12px; font-size: 12px; }
      .case { padding: 5px 0; border-top: 1px solid #1c212a; letter-spacing: 0 !important; }
      .pass::before { content: "PASS "; color: #59c27f; }
      .fail::before { content: "FAIL "; color: #e8705f; }
      .why { color: #8b929d; padding-left: 42px; }
    </style>
  </head>
  <body>
    <div id="player"><video id="v"></video></div>
    <div id="later"></div>
    <div id="ad-slot"></div>
    <aside id="results"><h1>Subtitle Overlay — harness</h1><p id="summary">running…</p></aside>

    <script>
      // --- chrome API stub ------------------------------------------------
      const store = {};
      const EXT = "../src/";
      window.chrome = {
        runtime: {
          getManifest: () => ({ version: "0.1.0" }),
          getURL: (p) => EXT + p.split("/").pop(),
          onMessage: { addListener() {}, removeListener() {} },
          sendMessage: async (msg) => {
            if (msg?.type !== "sso:daemon") return {};
            if (msg.op === "search") {
              return {
                used: { query: "Mercy" },
                auto_attach_threshold: 0.75,
                resolved: { title: "mercy", year: 2026, imdb_id: "31050594" },
                results: [{
                  file_id: 1, language: "en", movie_name: "Mercy",
                  release: "Mercy.2026.1080p.AMZN.WEB-DL", year: 2026,
                  download_count: 812, match_score: 1.0, cached: false,
                  from_trusted: true, hearing_impaired: true,
                }],
              };
            }
            if (msg.op === "fetch") return { cues: CUES };

            /* Study mode's three questions. Stubbed rather than reaching the
             * real tables and the real dictionary, because what is under test
             * here is what the overlay does with the answers - which word gets
             * marked, what lands in the rail, what a save keeps. The tables
             * themselves are generated data with their own generator. */
            if (msg.op === "rank") {
              const ranks = {};
              for (const word of msg.args.words) {
                ranks[word] = RANKS[word] === undefined ? null : RANKS[word];
              }
              return { ranks };
            }
            if (msg.op === "lookup") {
              lookupCalls.push(msg.args.query);
              lookupTargets.push(msg.args.target);
              return {
                query: msg.args.query,
                definitions: [{ partOfSpeech: "verb", sense: `to ${msg.args.query}, in a way` }],
                phonetic: "/stub/",
                translation: `${msg.args.query}-in-${msg.args.target || "nothing"}`,
                source: "harness",
              };
            }
            if (msg.op === "deckSave") {
              deckSaves.push(msg.args.entry);
              return { added: true, entry: msg.args.entry, size: deckSaves.length };
            }
            if (msg.op === "deckTerms") {
              return { terms: deckSaves.map((entry) => `${entry.language}:${entry.term}`) };
            }
            return {};
          },
        },
        /* Matches chrome.storage.local's actual surface, not just the calls
         * that happened to exist when this was written. A missing method
         * throws inside a .catch()-ed promise, which passes silently: the
         * suite reported 62/62 green while three real calls were failing. */
        storage: { local: {
          get: async (k) => {
            const keys = typeof k === "string" ? [k] : Array.isArray(k) ? k : Object.keys(k ?? store);
            const out = {};
            for (const key of keys) if (key in store) out[key] = store[key];
            return out;
          },
          set: async (o) => Object.assign(store, o),
          remove: async (k) => {
            for (const key of typeof k === "string" ? [k] : k) delete store[key];
          },
          clear: async () => {
            for (const key of Object.keys(store)) delete store[key];
          },
        } },
      };

      /* Ranks for the words in the cues below. "frankly" is deliberately far
       * down the list and "about" near the top, so one line contains both a
       * word that must be marked and several that must not - which is the
       * actual claim, rather than "something got underlined". */
      const RANKS = {
        i: 5, have: 60, no: 30, idea: 900, what: 12, you: 0, are: 25,
        talking: 700, about: 90, and: 8, do: 40, not: 15, care: 400,
        frankly: 14200, get: 55, down: 120, fine: 500, did: 45, see: 70,
        that: 5, saw: 300, nothing: 250, at: 20, all: 35, ormon: null,
        sighs: 8800,
      };
      const lookupCalls = [];
      const lookupTargets = [];
      const deckSaves = [];

      // Cue payloads in the exact shape the daemon emits.
      const CUES = [
        { start: 0, end: 600000, text: "[Ormon] Get down!",
          runs: [{ text: "[Ormon]", color: "#ffc857", kind: "speaker" },
                 { text: " Get down!" }] },
        { start: 600000, end: 900000, text: "[sighs] Fine.",
          runs: [{ text: "[sighs]", styles: ["i"], kind: "sound", symbol: "\u{1F62E}‍\u{1F4A8}" },
                 { text: " Fine.", styles: ["i"] }] },
        // Wrapped the way subtitle files really are: two short lines broken
        // for a 4:3 television, not for the screen this will be shown on.
        { start: 1200000, end: 1500000,
          text: "I have no idea what you are talking\nabout, and frankly I do not care.",
          runs: [{ text: "I have no idea what you are talking\n" },
                 { text: "about, and frankly I do not care." }] },
        // Two speakers in one cue. Here the break is meaning, not wrapping,
        // and it sits at the boundary between two runs.
        { start: 1500000, end: 1800000,
          text: "- Did you see that?\n- I saw nothing at all.",
          runs: [{ text: "- Did you see that?\n" },
                 { text: "- I saw nothing at all." }] },
      ];

      const video = document.getElementById("v");
      Object.defineProperty(video, "duration", { get: () => 7200 });
      Object.defineProperty(video, "paused", { get: () => false });
      let t = 1;
      Object.defineProperty(video, "currentTime", { get: () => t, set: (x) => (t = x) });

      // Players own pointer events inside the player surface.
      for (const type of ["pointermove", "mousemove"]) {
        document.getElementById("player")
          .addEventListener(type, (e) => e.stopPropagation());
      }
    </script>

    <script src="../src/content.js"></script>
    <script src="../src/panel.js"></script>
    <script src="../src/study.js"></script>

    <script>
      // --- assertions -----------------------------------------------------
      const cases = [];
      const check = (name, fn) => cases.push({ name, fn });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // Cue 2 carries the italics, the sound run and the symbol. It is only
      // rendered while the playhead is inside it, so checks about it have to
      // move the clock first.
      const showSoundCue = async () => { video.currentTime = 700; await sleep(120); };
      const showSpeakerCue = async () => { video.currentTime = 1; await sleep(120); };
      const shadowOf = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-root"))?.shadowRoot;
      const panelShadow = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-panel"))?.shadowRoot;

      check("overlay lives in a shadow root, out of reach of page CSS", () => {
        if (!shadowOf()) throw new Error("no shadow root holding .sso-root");
      });

      check("cue text is not recoloured by the page's span rule", async () => {
        await showSpeakerCue();
        const run = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-speaker"));
        const color = getComputedStyle(run).color;
        if (color.includes("255, 0, 255")) throw new Error("page span colour leaked in: " + color);
      });

      check("italic survives the page's font-style reset", async () => {
        await showSoundCue();
        const italic = [...shadowOf().querySelectorAll(".sso-i")][0];
        if (!italic) throw new Error("no italic run rendered");
        if (getComputedStyle(italic).fontStyle !== "italic")
          throw new Error("font-style is " + getComputedStyle(italic).fontStyle);
      });

      check("speaker run keeps its identity colour", async () => {
        await showSpeakerCue();
        const speaker = shadowOf().querySelector(".sso-speaker");
        if (!speaker) throw new Error("no speaker run");
        const c = getComputedStyle(speaker).color;
        if (!c.includes("255, 200, 87")) throw new Error("speaker colour is " + c);
      });

      check("sound run is dimmed relative to dialogue", async () => {
        await showSoundCue();
        const sound = shadowOf().querySelector(".sso-sound");
        const dialogue = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-sound") && !r.classList.contains("sso-speaker"));
        if (!sound || !dialogue) throw new Error("expected a sound run and a dialogue run");
        if (Number(getComputedStyle(sound).opacity) >= Number(getComputedStyle(dialogue).opacity))
          throw new Error("sound is not dimmer than speech");
      });

      check("sound symbol is rendered beside the words", async () => {
        await showSoundCue();
        const symbol = shadowOf().querySelector(".sso-symbol");
        if (!symbol || !symbol.textContent.trim()) throw new Error("no symbol");
        if (!shadowOf().querySelector(".sso-sound").textContent.includes("sighs"))
          throw new Error("symbol replaced the word instead of joining it");
      });

      check("CC handle appears despite the player swallowing pointer events", async () => {
        document.getElementById("player")
          .dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
        await sleep(80);
        const h = shadowOf().querySelector(".sso-handle");
        if (!h) throw new Error("handle missing");
        const cs = getComputedStyle(h);
        if (cs.visibility === "hidden" || Number(cs.opacity) === 0)
          throw new Error(`hidden: visibility=${cs.visibility} opacity=${cs.opacity}`);
      });

      /* A feed page: the page's own player is gone and the only video is one a
       * row plays while the pointer is over it. Sizes are the ones measured on
       * YouTube's results page - 504x211 in a 1440x900 window, duration 464s -
       * expressed as fractions of the window so the case does not depend on
       * the size of the browser running it. */
      async function onFeedPage(shape, run) {
        const player = document.getElementById("player");
        const handle = shadowOf().querySelector(".sso-handle");
        const preview = document.createElement("video");
        preview.style.display = "block";
        preview.style.width = `${Math.round(shape.width * window.innerWidth)}px`;
        preview.style.height = `${Math.round(shape.height * window.innerHeight)}px`;
        Object.defineProperty(preview, "duration", { get: () => 464 });
        Object.defineProperty(preview, "paused", { get: () => false });

        let holder = preview;
        if (shape.inLink) {
          holder = document.createElement("a");
          holder.href = "#watch";
          holder.style.display = "block";
          holder.append(preview);
        }
        document.body.append(holder);
        player.style.display = "none";     // no player on this page, only rows
        handle.dataset.visible = "false";
        try {
          preview.dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
          await sleep(80);
          return await run(handle, preview);
        } finally {
          holder.remove();
          player.style.display = "";
        }
      }

      const handleShowing = (handle) =>
        handle.dataset.visible === "true" && Number(getComputedStyle(handle).opacity) > 0;

      check("CC handle stays away from a feed row's hover preview", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("the handle appeared over a thumbnail - this page has nothing to subtitle");
        }));

      check("CC handle stays away from a video too small to be the page's subject", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: false }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a video covering 8% of the window was treated as the page's subject");
        }));

      /* Size alone does not settle it. The preview keeps roughly its share of
       * the row, so in a narrower window it grows against the window: the same
       * tile that covers 7% of a maximised screen covers about 18% of a
       * 1000x600 one, which clears the floor. Being inside the link that opens
       * it is what still identifies it. */
      check("CC handle stays away from a hover preview large enough to clear the floor", () =>
        onFeedPage({ width: 0.55, height: 0.4, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a link-wrapped preview got the handle once it was big enough");
        }));

      /* The control for the two above: the rule has to admit a player that is
       * merely large, not only one that fills the window, or an article with a
       * video in it would lose the handle. This is the watch page's 32%. */
      check("CC handle appears for a player that is large without filling the window", () =>
        onFeedPage({ width: 0.7, height: 0.46, inLink: false }, (handle) => {
          if (!handleShowing(handle))
            throw new Error("a player covering a third of the window did not get the handle");
        }));

      check("CC handle keeps its size against the page's button reset", () => {
        const box = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        if (box.width < 20 || box.height < 14)
          throw new Error(`collapsed to ${Math.round(box.width)}x${Math.round(box.height)}`);
      });

      check("overlay stays above chrome appended later at equal z-index", () => {
        const host = shadowOf().host;
        const later = document.getElementById("later");
        if (host.compareDocumentPosition(later) & Node.DOCUMENT_POSITION_FOLLOWING)
          throw new Error("player chrome is after the overlay in document order");
      });

      check("CC handle opens the panel", async () => {
        shadowOf().querySelector(".sso-handle").click();
        await sleep(250);
        if (!panelShadow()) throw new Error("panel did not open");
      });

      /* Prime stitches ads into the same stream, so currentTime keeps running
       * through the break while the film stands still. Simulate exactly that:
       * show an ad marker, advance the clock, hide it again. */
      const adBreak = async (seconds) => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);                       // detector polls at 400ms
        video.currentTime += seconds;           // stream advances, film does not
        await sleep(200);
        slot.innerHTML = "";
        await sleep(500);
      };

      check("an ad break is detected and its time removed", async () => {
        await showSpeakerCue();
        const before = window.__ssoApi.status().adDriftMs || 0;
        await adBreak(90);
        const after = window.__ssoApi.status().adDriftMs;
        if (Math.abs(after - before - 90000) > 1500)
          throw new Error(`measured ${Math.round((after - before) / 1000)}s of ad, expected ~90s`);
      });

      check("the same cue is still showing after the ad break", async () => {
        video.currentTime = 1;
        window.__ssoApi.clearAdDrift();
        await sleep(150);
        const before = shadowOf().querySelector(".sso-cue").textContent;
        await adBreak(90);
        // Film time is unchanged: stream moved 90s, all of it advertising.
        const after = shadowOf().querySelector(".sso-cue").textContent;
        if (before !== after)
          throw new Error(`cue changed across the ad break: "${before}" -> "${after}"`);
      });

      check("subtitles are hidden while the ad plays", async () => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);
        const text = shadowOf().querySelector(".sso-cue").textContent.trim();
        slot.innerHTML = "";
        await sleep(500);
        if (text) throw new Error("cue still rendered during the ad: " + text);
      });

      check("a marker that flickers is not counted as an ad", async () => {
        window.__ssoApi.clearAdDrift();
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="ad-timer" style="position:fixed;width:20px;height:10px"></div>';
        await sleep(500);
        video.currentTime += 0.5;   // far below the two-second floor
        slot.innerHTML = "";
        await sleep(500);
        if ((window.__ssoApi.status().adDriftMs || 0) !== 0)
          throw new Error("a sub-second flicker was counted as an ad break");
      });

      /* Dragging the cue. The overlay is click-through apart from the cue
       * itself, which sits where people click to pause - so a press that does
       * not move must reach the player, and one that moves must not. */
      /* `buttons` matters and used to be omitted.
       *
       * A real pointermove during a drag reports the button still held; only
       * once it is released does it read zero. The overlay uses exactly that to
       * notice a drag whose release went missing - a player that stops
       * propagation on pointer events loses it routinely - so a helper that
       * never sets `buttons` describes a gesture no mouse performs, and would
       * make that guard look broken while the real bug it fixes went untested. */
      const dragCue = async (fromX, fromY, toX, toY) => {
        const cue = shadowOf().querySelector(".sso-cue");
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cue.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        cue.dispatchEvent(ev("pointermove", toX, toY, 1));
        cue.dispatchEvent(ev("pointerup", toX, toY, 0));
        await sleep(120);
      };

      check("dragging the subtitle moves it", async () => {
        await showSpeakerCue();
        const before = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        await dragCue(before.left + 20, before.top + 8, 300, 260);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (Math.abs(after.top - before.top) < 40)
          throw new Error(`barely moved: ${Math.round(before.top)} -> ${Math.round(after.top)}`);
      });

      check("the dragged position is remembered in settings", () => {
        const s = window.__ssoApi.status().settings.tracks[0];
        if (!s.placed) throw new Error("placed flag not set");
        if (s.posY > 60) throw new Error(`posY still near the bottom: ${s.posY}`);
      });

      check("subtitle size follows the picture, not the window", async () => {
        /* Reported as the subtitles rendering bigger on entering fullscreen.
         * They were 2.6vh - a fraction of the *viewport* - so going fullscreen
         * resized the text for a reason that has nothing to do with the film.
         * A subtitle belongs to the picture, so it is the picture it is
         * measured against, and this holds it to that. */
        const cue = shadowOf().querySelector(".sso-cue");
        const ratio = () => {
          const size = parseFloat(getComputedStyle(cue).fontSize);
          return size / video.getBoundingClientRect().height;
        };
        await showSpeakerCue();
        const full = ratio();
        video.style.height = "300px";
        await sleep(200);
        const small = ratio();
        video.style.height = "";
        await sleep(200);

        if (Math.abs(small - full) / full > 0.05) {
          throw new Error(
            `text was ${full.toFixed(4)} of the picture at full size and ` +
            `${small.toFixed(4)} at 300px - it is tracking the window`);
        }
      });

      check("a lost release does not leave the subtitle following the pointer", async () => {
        /* Reported as "I don't even drag, I just hover over the subtitle and it
         * jumps somewhere else".
         *
         * A press captures the pointer, so while the capture is held every
         * pointer event in the page retargets to the cue box - which is what
         * makes dragging work at all. Lose the release and that never ends, so
         * the next movement anywhere teleports the subtitle to it. Players do
         * lose it: they call stopPropagation on pointer events inside the
         * player surface.
         */
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = () => shadowOf().querySelector(".sso-cue");
        cue().setPointerCapture = () => {};
        cue().releasePointerCapture = () => {};
        const box = cue().getBoundingClientRect();

        // Press and move, then let go without the cue box ever hearing about it.
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 11, clientX: x, clientY: y, buttons, button: 0, bubbles: true });
        cue().dispatchEvent(ev("pointerdown", box.left + 30, box.top + 8, 1));
        cue().dispatchEvent(ev("pointermove", 320, 300, 1));
        await sleep(80);
        const afterDrag = window.__ssoApi.status().settings.tracks[0];

        // Now merely hover, with nothing pressed.
        cue().dispatchEvent(ev("pointermove", 700, 120, 0));
        await sleep(80);
        cue().dispatchEvent(ev("pointermove", 250, 500, 0));
        await sleep(120);
        const afterHover = window.__ssoApi.status().settings.tracks[0];

        if (afterHover.posX !== afterDrag.posX || afterHover.posY !== afterDrag.posY) {
          throw new Error(
            `hovering moved it from ${afterDrag.posX},${afterDrag.posY}` +
            ` to ${afterHover.posX},${afterHover.posY}`);
        }
      });

      /* The two tests above pass whether or not the box keeps hold of the point
       * you grabbed, because they only ask that it moved a lot. These ask that
       * it moved the RIGHT amount, which is the whole complaint: the anchor is
       * the box's bottom edge, so writing the pointer straight into it threw
       * away where inside the box the press had landed. */
      const grabAndDrag = async (grabDX, grabDY, byX, byY) => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = shadowOf().querySelector(".sso-cue");
        const before = cue.getBoundingClientRect();
        const fromX = before.left + grabDX;
        const fromY = before.top + grabDY;
        // Several moves, as a real pointer sends - one big jump would hide an
        // error that accumulates per move.
        const cueEl = shadowOf().querySelector(".sso-cue");
        cueEl.setPointerCapture = () => {};
        cueEl.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cueEl.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        for (let step = 1; step <= 4; step++) {
          cueEl.dispatchEvent(ev("pointermove", fromX + (byX * step) / 4, fromY + (byY * step) / 4, 1));
        }
        cueEl.dispatchEvent(ev("pointerup", fromX + byX, fromY + byY, 0));
        await sleep(120);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        return { movedX: after.left - before.left, movedY: after.top - before.top };
      };

      check("the box moves exactly as far as the pointer, not further", async () => {
        await showSpeakerCue();
        // Grabbed near the TOP of the box, which is where the old bug was worst:
        // the bottom anchor jumped to the pointer and the box gained its own
        // height on the way.
        const { movedX, movedY } = await grabAndDrag(24, 4, -70, -120);
        if (Math.abs(movedX - -70) > 3 || Math.abs(movedY - -120) > 3) {
          throw new Error(`dragged by -70,-120 but the box moved ${Math.round(movedX)},${Math.round(movedY)}`);
        }
      });

      check("a small drag downwards moves it downwards", async () => {
        await showSpeakerCue();
        // The "once I move it up I cannot bring it down" report: a nudge down
        // shorter than the box's own height used to move it UP.

        window.__ssoApi.updateTrackSettings(0, { widthPercent: 100 });

      /* Dragging the panel on a page that has moved the coordinate system.
       *
       * `position: fixed` stops being relative to the viewport as soon as an
       * ancestor has a transform, and streaming pages do that routinely. A
       * translated ancestor puts the panel somewhere else; a *scaled* one makes
       * it drift out from under the pointer as you drag, which is what "it
       * doesn't move at the same speed as the mouse" is.
       *
       * Both are checked, because they are one mapping with two failure shapes
       * and a fix for the first alone leaves the second exactly as it was.
       */
      const dragPanelTo = async (targetX, targetY) => {
        const host = panelShadow().host;
        const head = panelShadow().querySelector(".sso-panel__head");
        // A synthetic PointerEvent has no live pointer behind it, so the real
        // capture calls throw. Same stub the cue drag uses.
        head.setPointerCapture = () => {};
        head.releasePointerCapture = () => {};
        const before = host.getBoundingClientRect();
        const startX = before.left + 60;
        const startY = before.top + 10;
        const send = (type, x, y, buttons) =>
          head.dispatchEvent(new PointerEvent(type,
            { bubbles: true, composed: true, pointerId: 7, clientX: x, clientY: y, buttons }));
        send("pointerdown", startX, startY, 1);
        await sleep(20);
        send("pointermove", targetX, targetY, 1);
        await sleep(40);
        send("pointerup", targetX, targetY, 0);
        const after = host.getBoundingClientRect();
        // The point that was grabbed should still be under the pointer.
        return {
          driftX: after.left - (targetX - (startX - before.left)),
          driftY: after.top - (targetY - (startY - before.top)),
        };
      };

      /* Both of these move the panel and must put it back. Later cases press
       * the middle of the screen expecting to reach the player, and a panel
       * left where it was dragged is over that point - which cost a run and
       * presented as study mode eating a click it never saw. */
      const parkPanel = () => {
        panelShadow()
          .querySelector(".sso-panel__head")
          .dispatchEvent(new MouseEvent("dblclick", { bubbles: true, composed: true }));
      };

          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)
            throw new Error(`drifted ${Math.round(driftX)},${Math.round(driftY)}px from the pointer`);
        } finally {
          document.body.style.transform = "";
          parkPanel();
        }
      });

      check("the panel follows the pointer inside a scaled container", async () => {
        // The reported symptom: it moves, but not at the pointer's speed.
        document.body.style.transform = "scale(0.8)";
        try {

          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)

        await hover("care");
        await hover("frankly");
        const cards = () => [...railShadow().querySelectorAll(".sso-card")];
        const of = (term) =>
          cards().find((c) => c.querySelector(".sso-card__term")?.textContent === term);

        const collapsed = of("care");
        if (collapsed?.dataset.focused !== "false") throw new Error("nothing was collapsed to open");
        collapsed.querySelector(".sso-card__head").click();
        await sleep(80);
        if (of("care")?.dataset.focused !== "true") throw new Error("it did not open");

        of("care").querySelector(".sso-card__head").click();
        await sleep(80);
        if (of("care")?.dataset.focused !== "false") throw new Error("it would not close again");
      });

      check("a word held open stays open when the next one arrives", async () => {
        // An explicit choice outranks the "newest is open" default, or the
        // reader's decision would be undone by the next line of the film.
        const of = (term) =>
          [...railShadow().querySelectorAll(".sso-card")].find(
            (c) => c.querySelector(".sso-card__term")?.textContent === term,
          );
        // "care" is collapsed after the test above; open it by hand.
        of("care").querySelector(".sso-card__head").click();
        await sleep(80);
        if (of("care")?.dataset.focused !== "true") throw new Error("it did not open");

        await hover("talking");
        if (of("care")?.dataset.focused !== "true")
          throw new Error("a word held open was closed by the next arrival");
      });

      check("one word can be taken off the rail", async () => {
        const before = railShadow().querySelectorAll(".sso-card").length;
        railShadow().querySelector(".sso-card__drop").click();
        await sleep(80);
        const after = railShadow().querySelectorAll(".sso-card").length;
        if (after !== before - 1) throw new Error(`${before} cards became ${after}`);
      });

      check("the rail can be emptied", async () => {
        const clear = [...railShadow().querySelectorAll(".sso-rail__act")].find(
          (b) => b.textContent === "Clear",
        );
        if (!clear) throw new Error("no way to empty it");
        clear.click();
        await sleep(80);
        const left = railShadow().querySelectorAll(".sso-card").length;
        if (left !== 0) throw new Error(`${left} cards survived`);
        if (!clear.hidden) throw new Error("an empty rail still offers to be emptied");
      });

      check("the rail folds to its title bar and back", async () => {
        await hover("frankly");
        window.__ssoStudy.updateSettings({ folded: true });
        await sleep(120);
        const list = railShadow().querySelector(".sso-rail__list");
        if (getComputedStyle(list).display !== "none")
          throw new Error("the words are still standing on the frame");
        const head = railShadow().querySelector(".sso-rail__head");
        if (head.getBoundingClientRect().height < 10)
          throw new Error("folding took the title bar with it, so there is no way back");

        window.__ssoStudy.updateSettings({ folded: false });
        await sleep(120);
        if (getComputedStyle(railShadow().querySelector(".sso-rail__list")).display === "none")
          throw new Error("it would not unfold");
      });

      check("the background setting reaches what is painted", async () => {
        const rail = railShadow().querySelector(".sso-rail");
        const solid = getComputedStyle(rail).backgroundColor;
        window.__ssoStudy.updateSettings({ opacity: 0.3 });
        await sleep(120);
        const sheer = getComputedStyle(rail).backgroundColor;
        if (solid === sheer) throw new Error(`the rail stayed ${solid}`);

        // The cards paint on top of it, so an opaque card would leave the
        // setting doing visibly nothing.
        const card = railShadow().querySelector(".sso-card");
        const behind = card && getComputedStyle(card).backgroundColor;
        if (behind && !/rgba\(0, 0, 0, 0\)|transparent/.test(behind))
          throw new Error(`a card paints ${behind} over the rail`);
        window.__ssoStudy.updateSettings({ opacity: 0.93 });
        await sleep(120);
      });

      check("the rail can be resized from any corner", async () => {
        const grips = railShadow().querySelectorAll(".sso-rail__grip");
        if (grips.length !== 4) throw new Error(`${grips.length} grips, want one per corner`);
        const before = window.__ssoStudy.settings();
        const grip = railShadow().querySelector(".sso-rail__grip--sw");
        grip.setPointerCapture = () => {};
        grip.releasePointerCapture = () => {};
        const box = grip.getBoundingClientRect();
        const ev = (type, x, y, buttons) =>
          new PointerEvent(type, { pointerId: 9, clientX: x, clientY: y, buttons, bubbles: true });
        grip.dispatchEvent(ev("pointerdown", box.left, box.top, 1));
        grip.dispatchEvent(ev("pointermove", box.left - 60, box.top + 50, 1));
        grip.dispatchEvent(ev("pointerup", box.left - 60, box.top + 50, 0));
        await sleep(120);
        const after = window.__ssoStudy.settings();
        if (after.width <= before.width)
          throw new Error(`width went ${before.width} -> ${after.width}`);
        if (!(after.height > 0)) throw new Error("the corner set no height");
      });

      check("the text size is one setting the whole rail follows", async () => {
        const term = railShadow().querySelector(".sso-card__term");
        const before = parseFloat(getComputedStyle(term).fontSize);
        window.__ssoStudy.updateSettings({ textPx: 22 });
        await sleep(120);
        const after = parseFloat(getComputedStyle(railShadow().querySelector(".sso-card__term")).fontSize);
        if (!(after > before + 3))
          throw new Error(`the word went ${before}px -> ${after}px with the setting at 22`);
        window.__ssoStudy.updateSettings({ textPx: 15 });
        await sleep(120);
      });

      check("saving keeps the word with its line, its film and its timestamp", async () => {
        deckSaves.length = 0;
        railShadow().querySelector(".sso-card__save").click();
        await sleep(200);
        const [entry] = deckSaves;
        if (!entry) throw new Error("nothing was saved");
        if (entry.term !== "frankly") throw new Error(`saved "${entry.term}"`);
        if (!entry.sentence.includes("frankly")) throw new Error("saved without its line");
        if (entry.timeMs == null) throw new Error("saved without a timestamp");
      });

      check("a saved word is marked as met before, not as new", async () => {
        await showWordyCue();
        await sleep(250);
        if (wordEl("frankly")?.dataset.saved !== "true")
          throw new Error("the word is not marked as already saved");
      });

      check("shift-dragging across words keeps the phrase, not one word", async () => {
        await showWordyCue();
        await sleep(200);
        const from = wordEl("do");
        const to = wordEl("care");
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        from.dispatchEvent(new PointerEvent("pointerdown", {
          bubbles: true, composed: true, shiftKey: true, pointerId: 9,
          clientX: a.left + 2, clientY: a.top + 2,
        }));
        to.dispatchEvent(new PointerEvent("pointermove", {
          bubbles: true, composed: true, pointerId: 9,
          clientX: b.left + 2, clientY: b.top + 2,
        }));
        document.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 9 }));
        await sleep(400);
        const terms = [...railShadow().querySelectorAll(".sso-card__term")].map((n) => n.textContent);
        if (!terms.includes("do not care"))
          throw new Error(`rail holds ${terms.join(" / ") || "nothing"}, not the phrase`);
      });

      check("a click on the film still reaches the player with study mode on", async () => {
        await showWordyCue();
        await sleep(150);
        let reached = 0;
        const player = document.getElementById("player");
        const count = () => reached++;
        player.addEventListener("click", count);
        /* The box's own padding, which is subtitle but not a word - a press
         * there has always been the player's. Left edge rather than right: the
         * rail docks on the right, and a point underneath a panel legitimately
         * belongs to the panel, which would make this assert the wrong thing. */
        const box = cueOf(0).getBoundingClientRect();
        const x = box.left + 3;
        const y = box.top + 3;
        await dragCue(x, y, x, y);
        player.removeEventListener("click", count);
        if (reached === 0) {
          /* Name what took it. "Swallowed" sends the reader into study mode's
           * pointer handling, and the last two times this failed the cause was
           * something else sitting over the point - which the message can say
           * and a reader cannot guess. */
          const boxes = [...shadowOf().querySelectorAll(".sso-cue")];
          const previous = boxes.map((b) => b.style.pointerEvents);
          boxes.forEach((b) => (b.style.pointerEvents = "none"));
          const hit = document.elementFromPoint(x, y);
          boxes.forEach((b, i) => (b.style.pointerEvents = previous[i]));
          const name = hit
            ? `${hit.tagName.toLowerCase()}#${hit.id || "-"}.${(hit.className || "-").toString().slice(0, 30)}`
            : "nothing";
          throw new Error(`the click at ${Math.round(x)},${Math.round(y)} went to ${name}`);
        }
      });

      check("dragging the subtitle still moves it with study mode on", async () => {
        const before = window.__ssoApi.status().settings.tracks[0].posY;
        const box = cueOf(0).getBoundingClientRect();
        await dragCue(box.left + box.width / 2, box.top + 6, 300, 180);
        const after = window.__ssoApi.status().settings.tracks[0].posY;
        if (Math.abs(after - before) < 5)
          throw new Error(`dragging a word did not move the box: ${before}% -> ${after}%`);
      });

      check("turning study mode off takes the rail and the marks away", async () => {
        await window.__ssoStudy.setEnabled(false);
        await showWordyCue();
        await sleep(200);
        if (railShadow()) throw new Error("the rail is still in the page");
        if (wordsIn(0).some((w) => w.dataset.rare === "true"))
          throw new Error("words are still marked");
      });

      /* --- the controls behave like controls ---------------------------------
       *
       * Every floating surface should move, resize and fold the same way, and
       * do nothing surprising at the edges. These run over both of them from
       * one table, so a behaviour added to one and forgotten on the other is a
       * failure rather than an inconsistency nobody notices.
       */
      const SURFACES = [
        { name: "panel", sel: ".sso-panel", head: ".sso-panel__head", grip: ".sso-grip" },
        { name: "rail", sel: ".sso-rail", head: ".sso-rail__head", grip: ".sso-rail__grip" },
      ];

      const hostFor = (sel) =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));

      const openBoth = async () => {
        await window.__ssoStudy.setEnabled(true);
        window.__ssoStudy.updateSettings({ showRail: true, folded: false });
        await window.__ssoPanel.show();
        await sleep(250);
      };

      const pev = (type, x, y, buttons) =>
        new PointerEvent(type,
          { pointerId: 31, clientX: x, clientY: y, button: 0, buttons, bubbles: true });

      for (const s of SURFACES) {
        check(`the ${s.name} does not run away when a release goes missing`, async () => {
          // The subtitle had this bug, then the panel was fixed, and the rail
          // was not - it teleported 500px on the next mouse move. One shared
          // drag now, so there is one place for the guard to live.
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};

          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", from.left + 90, from.top + 40, 1));
          head.dispatchEvent(pev("pointermove", 420, 480, 0)); // the release is lost
          await sleep(40);
          const parked = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointermove", 950, 130, 0)); // just moving the mouse
          await sleep(60);
          const after = host.getBoundingClientRect();
          if (Math.abs(after.left - parked.left) > 2 || Math.abs(after.top - parked.top) > 2) {
            throw new Error(
              `it followed the pointer with no button held: ` +
              `${Math.round(parked.left)},${Math.round(parked.top)} -> ` +
              `${Math.round(after.left)},${Math.round(after.top)}`);
          }
        });

        check(`the ${s.name} cannot be dragged out of reach`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 9000, 9000, 1));
          head.dispatchEvent(pev("pointerup", 9000, 9000, 0));
          await sleep(80);
          const box = head.getBoundingClientRect();
          if (box.top > window.innerHeight - 10 || box.left > window.innerWidth - 30)
            throw new Error(`the handle ended at ${Math.round(box.left)},${Math.round(box.top)}`);

          // And back, so the surface that follows is not left in the corner.
          head.dispatchEvent(pev("pointerdown", box.left + 40, box.top + 8, 1));
          head.dispatchEvent(pev("pointermove", 300, 150, 1));
          head.dispatchEvent(pev("pointerup", 300, 150, 0));
          await sleep(60);
        });

        check(`the ${s.name} folds to its title bar and unfolds again`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const shadow = host.shadowRoot;
          const head = shadow.querySelector(s.head);
          const fold = [...head.querySelectorAll("button")].find((b) => /^[▾▸]$/.test(b.textContent));
          if (!fold) throw new Error("no fold control on the title bar");

          const open = host.getBoundingClientRect().height;
          fold.click();
          await sleep(150);
          const shut = host.getBoundingClientRect().height;
          if (shut >= open) throw new Error(`folding changed the height ${open} -> ${shut}`);
          if (shut < 10) throw new Error("folding took the title bar too, so there is no way back");

          // Resizing something that is not on screen would apply numbers that
          // only appear on unfolding, which is a surprise rather than a size.
          for (const grip of shadow.querySelectorAll(s.grip)) {
            if (getComputedStyle(grip).display !== "none")
              throw new Error("a resize grip is still live while folded");
          }

          fold.click();
          await sleep(150);
          const again = host.getBoundingClientRect().height;
          if (Math.abs(again - open) > 4) throw new Error(`unfolded to ${again}, was ${open}`);
        });

        check(`double-clicking the ${s.name}'s title bar parks it`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 240, 320, 1));
          head.dispatchEvent(pev("pointerup", 240, 320, 0));
          await sleep(80);
          const moved = host.getBoundingClientRect();

          head.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          await sleep(150);
          const parked = host.getBoundingClientRect();
          if (Math.abs(parked.left - moved.left) < 20 && Math.abs(parked.top - moved.top) < 20)
            throw new Error("it stayed where it had been dragged");
          if (parked.right > window.innerWidth + 1 || parked.top < 0)
            throw new Error(`parked off screen at ${Math.round(parked.left)},${Math.round(parked.top)}`);
        });
      }

      check("the rail stays off a page with nothing attached", async () => {
        // Reported as the rail appearing on unrelated pages while a film played
        // in another tab: study mode is one setting for every tab, so the rail
        // was built wherever the content script loaded with it on.
        await openBoth();
        if (!hostFor(".sso-rail")) throw new Error("no rail to begin with");

        window.__ssoApi.detach(0);
        window.__ssoApi.detach(1);
        await sleep(200);
        if (hostFor(".sso-rail"))
          throw new Error("the rail is still there with no subtitle attached");
        if (!window.__ssoStudy.settings().enabled)
          throw new Error("it turned study mode off rather than leaving the page alone");

        // Attaching is what brings it back, without touching the switch.
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);
        if (!hostFor(".sso-rail")) throw new Error("attaching did not bring it back");
      });

      check("re-injection leaves exactly one overlay", async () => {
        window.__ssoApi.detach(1);
        const count = () => [...document.querySelectorAll("div")].filter((d) => d.shadowRoot).length;
        const load = (src) => new Promise((ok, no) => {
          const s = document.createElement("script");
          s.src = src + "?v=" + cases.length; s.onload = ok; s.onerror = no;
          document.body.append(s);
        });
        await load("../src/content.js");
        await load("../src/panel.js");
        await load("../src/study.js");
        await sleep(150);
        if (count() > 2) throw new Error(`${count()} shadow hosts after re-injection`);
      });

      // --- run ------------------------------------------------------------
      /* An error nobody caught is a failure even when every assertion holds.
       * Rejected promises count too: most of this code reports failure by
       * rejecting inside a .catch() that discards it. */
      const loose = [];
      window.addEventListener("error", (e) => loose.push(e.message));
      window.addEventListener("unhandledrejection", (e) => loose.push(String(e.reason?.message ?? e.reason)));

      (async () => {
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);

        const out = document.getElementById("results");
        let passed = 0;
        for (const { name, fn } of cases) {
          const row = document.createElement("div");
          row.className = "case";
          try {
            await fn();
            row.classList.add("pass");
            row.textContent = name;
            passed++;
          } catch (err) {
            row.classList.add("fail");
            row.textContent = name;
            const why = document.createElement("div");
            why.className = "why";
            why.textContent = err.message;
            row.append(why);
          }
          out.append(row);
        }
        for (const message of [...new Set(loose)]) {
          const row = document.createElement("div");
          row.className = "case fail";
          row.textContent = "nothing caught this error";
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = message;
          row.append(why);
          out.append(row);
        }

        const total = cases.length + new Set(loose).size;
        const summary = document.getElementById("summary");
        summary.textContent = `${passed}/${total} passed`;
        summary.style.color = passed === total ? "#59c27f" : "#e8705f";
        window.__harness = { passed, total, loose: [...new Set(loose)] };
      })();
    </script>
  </body>
</html>
