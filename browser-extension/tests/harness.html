        const player = document.getElementById("player");
        const was = player.style.cssText;
        player.style.cssText = "position:fixed;inset:auto;left:100px;top:150px;width:600px;height:300px";
        try {
          window.dispatchEvent(new Event("resize"));
          await showSpeakerCue();
          await sleep(150);
          window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 92, widthPercent: 80 });
          await sleep(150);
          const root = shadowOf().querySelector(".sso-root");
          const box = root.getBoundingClientRect();
          const centre = (box.left + box.right) / 2;
          if (Math.abs(centre - 400) > 3)
            throw new Error(`centred at ${Math.round(centre)}, want 400 - the middle of the picture, not of the window`);
          if (Math.abs(box.bottom - (150 + 276)) > 3)
            throw new Error(`bottom edge at ${Math.round(box.bottom)}, want 426 - 92% down the picture`);
          if (Math.abs(box.width - 480) > 3)
            throw new Error(`${Math.round(box.width)}px wide, want 480 - 80% of the picture`);

          /* Dragged towards the page's corner, it stops at the picture's edge. */
          const cue = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
          await dragCue(cue.left + 10, cue.top + 6, 1300, 850);
          const after = shadowOf().querySelector(".sso-root").getBoundingClientRect();
          if (after.right > 700 + 2 || after.bottom > 450 + 2)
            throw new Error(`dragged to ${Math.round(after.right)},${Math.round(after.bottom)} - past the picture's 700,450`);
          const s = window.__ssoApi.status().settings.tracks[0];
          if (s.posX > 100 || s.posY > 100)
            throw new Error(`stored as ${s.posX}%,${s.posY}% - outside the picture`);

          /* The picture moves - a scroll, a theatre mode - and the box goes
           * with it, in the same place ON the picture. */
          window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 92 });
          player.style.left = "300px";
          player.style.top = "50px";
          window.dispatchEvent(new Event("resize"));
          await sleep(200);
          const moved = shadowOf().querySelector(".sso-root").getBoundingClientRect();
          if (Math.abs((moved.left + moved.right) / 2 - 600) > 3 || Math.abs(moved.bottom - 326) > 3)
            throw new Error(`after the picture moved the box is at ${Math.round((moved.left + moved.right) / 2)},${Math.round(moved.bottom)}, want 600,326`);
        } finally {
          player.style.cssText = was;
          window.dispatchEvent(new Event("resize"));
          window.__ssoApi.resetPosition();
          await sleep(200);
        }
      });

      /* --- the lines a box is held to ---------------------------------------
       *
       * Placing four boxes - two subtitles and two strips - so that they agree
       * with each other and with the picture is arithmetic a hand cannot do:
       * 50.0% twice, or two left edges at the same pixel. So a gesture offers
       * the positions that mean something and takes the nearest one within
       * SNAP_PX, and draws the line it took so the move has a visible reason.
       *
       * Every check below aims a few pixels OFF a line, because that is the
       * whole question. Aiming at one and landing on it proves nothing: an
       * extension that ignored the feature entirely would pass. */
      const rootBox = (slot = 0) =>
        shadowOf().querySelector(`.sso-root[data-slot="${slot}"]`).getBoundingClientRect();
      const guideLine = (kind) => shadowOf().querySelector(`.sso-guide--${kind}`);

      /* Carry the box by an exact delta, holding the button all the way.
       *
       * `hold` leaves the gesture open, because half of what is being checked
       * only exists while a finger is down - the lines are drawn for the
       * gesture and go with it. `alt` is the escape hatch the feature offers,
       * so both behaviours can be asked for through one helper. */
      const carry = async (byX, byY, { alt = false, hold = false } = {}) => {
        const cue = shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue');
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const from = cue.getBoundingClientRect();
        const atX = from.left + 24;
        const atY = from.top + 6;
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 21, clientX: x, clientY: y, button: 0, buttons, bubbles: true, altKey: alt });
        cue.dispatchEvent(ev("pointerdown", atX, atY, 1));
        // Several moves, the way a pointer actually arrives.
        for (let step = 1; step <= 3; step++) {
          cue.dispatchEvent(ev("pointermove", atX + (byX * step) / 3, atY + (byY * step) / 3, 1));
        }
        const release = async () => {
          cue.dispatchEvent(ev("pointerup", atX + byX, atY + byY, 0));
          await sleep(120);
        };
        await sleep(120);
        if (!hold) await release();
        return release;
      };

      check("a box carried near the middle of the picture is taken by it", async () => {
        window.__ssoApi.resetPosition();
        await showSpeakerCue();
        const film = video.getBoundingClientRect();
        const middle = film.left + film.width / 2;
        const before = rootBox();
        // Five pixels short of the middle: near enough that nobody meant it,
        // far enough that no hand would ever correct it.
        const release = await carry(middle - 5 - (before.left + before.width / 2), 0, { hold: true });
        const held = rootBox();
        const landed = held.left + held.width / 2 - middle;
        if (Math.abs(landed) > 2)
          throw new Error(`aimed 5px off the middle and stopped ${landed.toFixed(1)}px off it`);

        const line = guideLine("v");
        if (line.dataset.on !== "true") throw new Error("nothing said why the box moved on its own");
        const drawn = line.getBoundingClientRect().left - middle;
        if (Math.abs(drawn) > 2)
          throw new Error(`the line is ${drawn.toFixed(1)}px from the middle it claims to be`);

        await release();
        if (guideLine("v").dataset.on !== "false") throw new Error("the line outlived the gesture");
      });

      check("and one put down away from every line is left where it was put", async () => {
        /* The other half of a magnet, and the half that gets lost: a snap that
         * is always on is a grid, and a grid takes away every position between
         * its lines. Twenty pixels off the middle is a position somebody
         * chose. */
        window.__ssoApi.resetPosition();
        await showSpeakerCue();
        const film = video.getBoundingClientRect();
        const middle = film.left + film.width / 2;
        const before = rootBox();
        await carry(middle - 20 - (before.left + before.width / 2), 0);
        const after = rootBox();
        const off = middle - (after.left + after.width / 2);
        if (Math.abs(off - 20) > 2)
          throw new Error(`put down 20px off the middle and it sat ${off.toFixed(1)}px off`);
      });

      check("holding Alt puts it exactly where the hand is", async () => {
        window.__ssoApi.resetPosition();
        await showSpeakerCue();
        const film = video.getBoundingClientRect();
        const middle = film.left + film.width / 2;
        const before = rootBox();
        const release = await carry(middle - 5 - (before.left + before.width / 2), 0,
          { alt: true, hold: true });
        const held = rootBox();
        const off = middle - (held.left + held.width / 2);
        if (Math.abs(off - 5) > 2)
          throw new Error(`Alt was held and it still moved to ${off.toFixed(1)}px off the middle`);
        if (guideLine("v").dataset.on !== "false")
          throw new Error("a line was drawn for a snap that did not happen");
        await release();
      });

      check("two boxes line up with each other, not only with the picture", async () => {
        /* The lines that matter most are not the picture's. Two subtitles read
         * as one thing, and two left edges six pixels apart is the difference
         * between a pair and two subtitles that happen to be near each other. */
        await window.__ssoApi.attach(
          { cues: CUES, label: "second", fileId: 1301, language: "tr", slot: 1 });
        window.__ssoApi.updateTrackSettings(1, { posX: 70, posY: 60, widthPercent: 40 });
        /* Narrower than the default 80%, or this asks something the box cannot
         * do: a box 80% of the screen wide can only have its left edge in the
         * leftmost 20% of it, and the other box's edge is at 50%. The drag's
         * own on-screen clamp would win and the check would be measuring that
         * instead. */
        window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 92, widthPercent: 30 });
        await showSpeakerCue();

        const other = rootBox(1);
        if (other.width < 4 || other.height < 4) throw new Error("no second box to line up with");
        const before = rootBox(0);
        const release = await carry(other.left + 6 - before.left, 0, { hold: true });
        const apart = rootBox(0).left - other.left;
        if (Math.abs(apart) > 2)
          throw new Error(`the two left edges ended ${apart.toFixed(1)}px apart`);
        await release();
      });

      check("an edge dragged near another box's edge is taken by it", async () => {
        /* Resizing is the same question asked of a width. The box grows about
         * its centre, so an edge taken to a line puts the other edge the same
         * distance the other side of it - and the line drawn is the one that
         * was met, which is not always the one under the hand. */
        window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 92, widthPercent: 70 });
        await showSpeakerCue();
        const other = rootBox(1);
        const cue = shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue');
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const ink = cue.getBoundingClientRect();
        if (ink.width < 80) throw new Error("the cue is too narrow to have edges to grab");

        // Pressed ON the edge, which is what makes this a resize and not a move.
        const ev = (type, x, buttons) => new PointerEvent(type,
          { pointerId: 22, clientX: x, clientY: ink.top + ink.height / 2, button: 0, buttons, bubbles: true });
        cue.dispatchEvent(ev("pointerdown", ink.right - 4, 1));
        cue.dispatchEvent(ev("pointermove", other.right - 60, 1));
        cue.dispatchEvent(ev("pointermove", other.right - 5, 1));
        await sleep(120);
        const apart = rootBox(0).right - other.right;
        if (Math.abs(apart) > 2.5)
          throw new Error(`the two right edges ended ${apart.toFixed(1)}px apart`);
        if (guideLine("v").dataset.on !== "true") throw new Error("nothing said why it stopped there");
        cue.dispatchEvent(ev("pointerup", other.right - 5, 0));
        await sleep(120);

        window.__ssoApi.detach(1);
        window.__ssoApi.resetPosition();
        await sleep(120);
      });

      check("placement mode gives something to drag between lines", async () => {
        // Park the playhead past the last cue, where nothing is rendered.
        // (Cue 1 covers 0-600s and cue 2 covers 600-900s, so 500 is not a gap.)
        video.currentTime = 950;
        await sleep(150);
        const empty = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (empty.width > 1) throw new Error("expected no cue in the gap");

        window.__ssoApi.setPlacing(true);
        await sleep(150);
        const standIn = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (standIn.width < 40 || standIn.height < 10)
          throw new Error("no stand-in to grab in placement mode");

        window.__ssoApi.setPlacing(false);
        await sleep(150);
        if (shadowOf().querySelector(".sso-cue").getBoundingClientRect().width > 1)
          throw new Error("stand-in outlived placement mode");
      });

      /* How wide the subtitle is allowed to get, and who decides where a line
       * breaks. The file wraps its own lines for a 4:3 television; obeying
       * that made the box hug the longest line in the file, so a cue used a
       * fraction of the screen and arrived a line longer than it needed. */
      const showLongCue = async () => { video.currentTime = 1300; await sleep(140); };
      const showTurnCue = async () => { video.currentTime = 1600; await sleep(140); };
      const cueBox = () => shadowOf().querySelector(".sso-cue").getBoundingClientRect();

      check("a line break made for a 4:3 television does not survive", async () => {
        window.__ssoApi.updateSettings({ rewrap: true });
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await showLongCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        if (text.includes("\n"))
          throw new Error("the file's own break was still deciding the width");
      });

      check("a turn between two speakers keeps its line break", async () => {
        await showTurnCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        if (!text.includes("\n"))
          throw new Error("two speakers were joined onto one line");
      });

      check("the file's breaks come back when rewrapping is turned off", async () => {
        window.__ssoApi.updateSettings({ rewrap: false });
        await showLongCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        window.__ssoApi.updateSettings({ rewrap: true });
        if (!text.includes("\n")) throw new Error("break lost with rewrap off");
      });

      check("the box may use the whole width it is given", async () => {
        /* The limit is derived from what the line actually needs rather than
         * picked as a percentage. A fixed 60% only forces a wrap while the
         * window is narrow enough for this sentence to overflow it - at 1440px
         * it no longer did, the box correctly hugged its one line, and the test
         * failed for a reason that had nothing to do with what it checks. */
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 100 });
        await showLongCue();
        const natural = cueBox().width;

        const percent = Math.round(((natural * 0.7) / window.innerWidth) * 100);
        window.__ssoApi.updateTrackSettings(0, { widthPercent: percent });
        await sleep(140);

        const allowed = window.innerWidth * (percent / 100);
        const box = cueBox();
        // It used to be held to 92% of the width it had just asked for, so a
        // long line could never reach its limit and wrapped a line early.
        if (box.width < allowed - 2)
          throw new Error(`used ${Math.round(box.width)}px of the ${Math.round(allowed)}px allowed`);
        if (box.width > allowed + 2)
          throw new Error(`overflowed its limit: ${Math.round(box.width)}px`);
      });

      check("narrowing the width pushes the line onto more rows", async () => {
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await showLongCue();
        const wide = cueBox();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 30 });
        await sleep(140);
        const narrow = cueBox();
        if (narrow.width >= wide.width)
          throw new Error(`30% was not narrower than 90%: ${Math.round(narrow.width)} vs ${Math.round(wide.width)}`);
        if (narrow.height <= wide.height)
          throw new Error("the text did not rewrap onto more rows");
      });

      /* Placing the box against an edge while a short line is showing, then
       * letting a long one arrive. The drag can only measure the line in front
       * of it; the limit has to hold for the widest the box may get. */
      check("a long line stays on screen after placing against the edge", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateSettings({ rewrap: true });
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
        await showSpeakerCue();
        const short = cueBox();
        await dragCue(short.left + short.width / 2, short.top + 6, 4, short.top + 6);
        await showLongCue();
        const long = cueBox();
        if (long.left < -1 || long.right > window.innerWidth + 1)
          throw new Error(
            `long line spans ${Math.round(long.left)}..${Math.round(long.right)} in a ${window.innerWidth}px viewport`);
      });

      check("widening the box cannot push it off the screen", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 30 });
        await showLongCue();
        const box = cueBox();
        await dragCue(box.left + box.width / 2, box.top + 6, 4, box.top + 6);
        // Legal at 30% wide; the box is now told to be much wider.
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await sleep(160);
        const after = cueBox();
        if (after.left < -1)
          throw new Error(`widening pushed it ${Math.round(-after.left)}px off the left edge`);
      });

      check("dragging an edge resizes the subtitle", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
        await showLongCue();
        const box = cueBox();
        const centre = window.innerWidth / 2;
        // Take hold of the right edge and pull it in to a quarter-width from
        // the centre, which is a half-width box.
        await dragCue(box.right - 4, box.top + 8, centre + window.innerWidth * 0.25, box.top + 8);
        const width = window.__ssoApi.status().settings.tracks[0].widthPercent;
        if (Math.abs(width - 50) > 3)
          throw new Error(`expected about 50%, got ${width}%`);
      });

      check("dragging the middle still moves rather than resizes", async () => {
        const before = window.__ssoApi.status().settings.tracks[0].widthPercent;
        const box = cueBox();
        await dragCue(box.left + box.width / 2, box.top + 8, 320, 240);
        const after = window.__ssoApi.status().settings.tracks[0];
        if (after.widthPercent !== before)
          throw new Error(`the width changed while moving: ${before}% -> ${after.widthPercent}%`);
        if (!after.placed) throw new Error("the drag did not move it");
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
      });

      check("panel opens beside the handle that opens it, not across the screen", () => {
        const handle = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        const panel = panelShadow().host.getBoundingClientRect();
        const sameSide = Math.abs(handle.right - panel.right) < 8;
        if (!sameSide)
          throw new Error(
            `handle right edge at ${Math.round(handle.right)}, panel right edge at ${Math.round(panel.right)}`);
        if (panel.top < handle.bottom)
          throw new Error("panel overlaps the handle instead of hanging below it");
      });

      /* Dragging the panel on a page that has moved the coordinate system.
       *
       * `position: fixed` stops being relative to the viewport as soon as an
       * ancestor has a transform, and streaming pages do that routinely. A
       * translated ancestor puts the panel somewhere else; a *scaled* one makes
       * it drift out from under the pointer as you drag, which is what "it
       * doesn't move at the same speed as the mouse" is.
       *
       * Both are checked, because they are one mapping with two failure shapes
       * and a fix for the first alone leaves the second exactly as it was.
       */
      /* With Alt held, and that is what makes this a check about the mapping.
       *
       * The panel is held to the same lines the subtitle boxes are, so a drag
       * that ends within eight pixels of one lands ON it - correctly, and up to
       * eight pixels from where the pointer was. That is indistinguishable here
       * from the drift these two checks exist to catch. Alt is the reader's own
       * "no, exactly there", so using it asks the coordinate question with the
       * placement question taken out. The lines have their own checks. */
      const dragPanelTo = async (targetX, targetY, { free = true } = {}) => {
        const host = panelShadow().host;
        const head = panelShadow().querySelector(".sso-win__head");
        // A synthetic PointerEvent has no live pointer behind it, so the real
        // capture calls throw. Same stub the cue drag uses.
        head.setPointerCapture = () => {};
        head.releasePointerCapture = () => {};
        const before = host.getBoundingClientRect();
        const startX = before.left + 60;
        const startY = before.top + 10;
        const send = (type, x, y, buttons) =>
          head.dispatchEvent(new PointerEvent(type,
            { bubbles: true, composed: true, pointerId: 7, clientX: x, clientY: y, buttons,
              altKey: free }));
        send("pointerdown", startX, startY, 1);
        await sleep(20);
        send("pointermove", targetX, targetY, 1);
        await sleep(40);
        send("pointerup", targetX, targetY, 0);
        const after = host.getBoundingClientRect();
        // The point that was grabbed should still be under the pointer.
        return {
          driftX: after.left - (targetX - (startX - before.left)),
          driftY: after.top - (targetY - (startY - before.top)),
        };
      };

      /* Both of these move the panel and must put it back. Later cases press
       * the middle of the screen expecting to reach the player, and a panel
       * left where it was dragged is over that point - which cost a run and
       * presented as study mode eating a click it never saw. */
      /* On the NAME, not on the bar. The bar's double-click folds the panel
       * now - the gesture every window on the machine has - and parking moved
       * onto the one element in that bar that says which window this is. */
      const parkPanel = () => {
        panelShadow()
          .querySelector(".sso-win__title")
          .dispatchEvent(new MouseEvent("dblclick", { bubbles: true, composed: true }));
      };

      check("the panel follows the pointer inside a translated container", async () => {
        document.body.style.transform = "translate(40px, 25px)";
        try {
          const { driftX, driftY } = await dragPanelTo(430, 300);
          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)
            throw new Error(`drifted ${Math.round(driftX)},${Math.round(driftY)}px from the pointer`);
        } finally {
          document.body.style.transform = "";
          parkPanel();
        }
      });

      check("the panel follows the pointer inside a scaled container", async () => {
        // The reported symptom: it moves, but not at the pointer's speed.
        document.body.style.transform = "scale(0.8)";
        try {
          const { driftX, driftY } = await dragPanelTo(380, 260);
          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)
            throw new Error(`drifted ${Math.round(driftX)},${Math.round(driftY)}px from the pointer`);
        } finally {
          document.body.style.transform = "";
          parkPanel();
        }
      });

      /* --- the windows are held to those lines too --------------------------
       *
       * The control panel and the focus box are placed by hand like everything
       * else on the film, and they were the two surfaces that could not be
       * lined up with anything. Not a decision: they move through makeMovable
       * and the lines were wired into the subtitle's own gesture, so which file
       * built a surface decided whether it could be aligned.
       *
       * Both directions are checked, because they are two different pieces of
       * wiring. A window taken to a line is makeMovable asking; a subtitle
       * taken to a window is guidesFor offering.
       */
      const panelPointer = () => {
        const shadow = panelShadow();
        const head = shadow.querySelector(".sso-win__head");
        // Same synthetic-pointer stub as every other drag here.
        head.setPointerCapture = () => {};
        head.releasePointerCapture = () => {};
        return { shadow, host: shadow.host, head };
      };

      /* A picture line this window can actually be taken to, given where it is
       * and how wide it is. Aiming at the middle and finding the panel clamped
       * against the right edge of the window would fail for a reason that has
       * nothing to do with snapping. */
      const reachableLine = (film, box, low, high) =>
        [film.left, film.left + film.width / 2, film.right].find(
          (x) => x - box.left >= low && x - box.left <= high);

      check("the control panel is held to the lines the subtitles are held to", async () => {
        const { host, head } = panelPointer();
        const film = video.getBoundingClientRect();
        const box = host.getBoundingClientRect();
        const want = reachableLine(film, box, -box.left, window.innerWidth - box.left - box.width);
        if (want == null) throw new Error("no picture line this panel can reach in this window");

        const grabY = box.top + 10;
        const send = (type, x, buttons) =>
          head.dispatchEvent(new PointerEvent(type,
            { bubbles: true, composed: true, pointerId: 9, clientX: x, clientY: grabY, buttons }));
        const line = shadowOf().querySelector(".sso-guide--v");

        // Five pixels short of the line: near enough that nobody meant it, far
        // enough that no hand would ever correct it.
        send("pointerdown", box.left + 60, 1);
        await sleep(20);
        send("pointermove", want - 5 + 60, 1);
        await sleep(60);
        try {
          const off = host.getBoundingClientRect().left - want;
          if (Math.abs(off) > 2)
            throw new Error(`aimed 5px off the line and stopped ${off.toFixed(1)}px off it`);
          if (line.dataset.on !== "true")
            throw new Error("nothing said why the panel moved on its own");
        } finally {
          send("pointerup", want - 5 + 60, 0);
          await sleep(60);
        }
        if (line.dataset.on !== "false") throw new Error("the line outlived the gesture");
        parkPanel();
        await sleep(80);
      });

      check("and a corner dragged to make it wider stops on the line too", async () => {
        const { shadow, host } = panelPointer();
        const grip = shadow.querySelector(".sso-grip--se");
        grip.setPointerCapture = () => {};
        grip.releasePointerCapture = () => {};
        const body = shadow.querySelector(".sso-panel__body");
        const film = video.getBoundingClientRect();
        const box = host.getBoundingClientRect();
        const wasWidth = box.width;
        const wasBody = body.getBoundingClientRect().height;
        // Inside the width the grips allow (panel.js clamps to 280-640), with
        // room either side so the clamp is never what decides the answer.
        const want = reachableLine(film, box, 300, 620);
        if (want == null)
          throw new Error(`no line 300-620px right of a panel whose left edge is ${Math.round(box.left)}`);

        const line = shadowOf().querySelector(".sso-guide--v");
        const send = (type, x, buttons) =>
          grip.dispatchEvent(new PointerEvent(type,
            { bubbles: true, composed: true, pointerId: 11, clientX: x, clientY: box.bottom, buttons }));

        // Pressed exactly on the corner, so the pointer and the edge are the
        // same point and five pixels short of the line really is five pixels.
        send("pointerdown", box.right, 1);
        await sleep(20);
        send("pointermove", want - 5, 1);
        await sleep(60);
        try {
          const off = host.getBoundingClientRect().right - want;
          if (Math.abs(off) > 2)
            throw new Error(`aimed 5px short and the edge sat ${off.toFixed(1)}px from the line`);
          if (line.dataset.on !== "true") throw new Error("nothing said why the edge stopped there");
        } finally {
          send("pointerup", want - 5, 0);
          await sleep(60);
          // Put the panel back: later cases measure a card at the widths the
          // grips allow, and starting them from whatever this left behind
          // makes their numbers about this check instead.
          window.__ssoPanel.applySize(wasWidth, wasBody);
          await sleep(80);
        }
      });

      check("and a subtitle can be lined up with the panel, not only with the other subtitle", async () => {
        const film = video.getBoundingClientRect();
        // Somewhere the picture's own lines are not, so a snap here can only
        // have come from the panel.
        await dragPanelTo(film.left + film.width * 0.31 + 60, 120);
        await sleep(60);
        const panel = panelShadow().host.getBoundingClientRect();
        if (panel.width < 4) throw new Error("the panel is not on screen to line up with");

        window.__ssoApi.resetPosition();
        // Narrow, or the box cannot get its left edge that far right - the same
        // reason the two-subtitle check narrows it.
        window.__ssoApi.updateTrackSettings(0, { posX: 50, posY: 92, widthPercent: 30 });
        await showSpeakerCue();
        const before = rootBox(0);
        const release = await carry(panel.left + 6 - before.left, 0, { hold: true });
        try {
          const apart = rootBox(0).left - panel.left;
          if (Math.abs(apart) > 2)
            throw new Error(`the subtitle's edge ended ${apart.toFixed(1)}px from the panel's`);
        } finally {
          await release();
          window.__ssoApi.resetPosition();
          parkPanel();
          await sleep(80);
        }
      });

      check("a subtitle can be put against an edge, text and all", async () => {
        /* Reported as missing: "I cannot place the subtitles aligned to the
         * left or right of the screen." Dragging could always put a BOX near an
         * edge, and that is not the same thing - the text inside stays centred,
         * so a short line sits in the middle of the box and the margin against
         * the frame changes from line to line.
         *
         * So both halves are asserted: the box moved, and the text inside it
         * moved with it. The second is the one a refactor would drop, because
         * the geometry is the visible part and the alignment is one CSS
         * property nobody would miss until they watched something. */
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · edges", fileId: 508, slot: 1 });
        await sleep(200);
        const roots = [...shadowOf().querySelectorAll(".sso-root")];
        if (roots.length < 2) throw new Error(`${roots.length} subtitles drawn, want 2`);

        try {
          for (const [where, want] of [["left", "left"], ["right", "right"]]) {
            window.__ssoApi.arrange(where);
            await sleep(150);
            const tracks = window.__ssoApi.status().settings.tracks;
            for (const [slot, track] of tracks.entries()) {
              if (track.align !== want)
                throw new Error(`${where}: subtitle ${slot + 1} is ranged "${track.align}"`);
              const seen = getComputedStyle(roots[slot]).textAlign;
              if (seen !== want)
                throw new Error(`${where}: subtitle ${slot + 1} renders text-align ${seen}`);
              const edge = where === "left" ? track.posX : 100 - track.posX;
              if (edge > 30)
                throw new Error(`${where}: subtitle ${slot + 1} is ${edge}% from that edge`);
            }
            // Stacked, or they are on top of each other against the edge.
            if (tracks[0].posY === tracks[1].posY)
              throw new Error(`${where}: both subtitles are at the same height`);
          }

          /* And back. An arrangement is a complete statement about where the
           * subtitles are, so going back to side-by-side has to undo the
           * ranging as well as the geometry - a button that moves the box and
           * leaves the text ranged left looks like it half worked. */
          window.__ssoApi.arrange("side");
          await sleep(150);
          for (const [slot, track] of window.__ssoApi.status().settings.tracks.entries()) {
            if (track.align !== "center")
              throw new Error(`back to side by side, subtitle ${slot + 1} is still ranged "${track.align}"`);
            if (getComputedStyle(roots[slot]).textAlign !== "center")
              throw new Error(`back to side by side, subtitle ${slot + 1} still renders ranged`);
          }
        } finally {
          window.__ssoApi.detach(1);
          await sleep(120);
        }
      });

      check("double-clicking the bar folds the panel, and again unfolds it", async () => {
        /* Asked for: "double click on the subtitle panel should collapse /
         * expand it". The button in the corner stays, because a gesture nobody
         * is told about is not a control - this is the one you reach for while
         * a film runs, where the bar is a far larger target than a 26px icon.
         *
         * And the two gestures the bar now carries are checked against each
         * other: the name parks, everything else folds. Getting that backwards
         * is the failure that matters, because parking a folded panel looks
         * like nothing happening. */
        const panel = panelShadow().querySelector(".sso-panel");
        const head = panelShadow().querySelector(".sso-win__head");
        const bar = () => panel.dataset.folded === "true";
        const was = bar();
        try {
          const dbl = (el) => el.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, composed: true }));
          if (was) { dbl(head); await sleep(150); }
          if (bar()) throw new Error("could not get the panel unfolded to begin with");

          dbl(head);
          await sleep(150);
          if (!bar()) throw new Error("a double-click on the bar did not fold it");

          dbl(head);
          await sleep(150);
          if (bar()) throw new Error("a second double-click did not unfold it");

          // The name is the other gesture, and it must not fold.

      /* --- the timeline strip --------------------------------------------------
       *
       * What the strip claims is that the sideways distance between two cards'
       * patterns IS the amount they are out by. That is the whole feature, and
       * it is measurable: render two subtitles that differ by a known amount,
       * read the canvases back, cross-correlate them, and the lag in pixels has
       * to convert to the offset in milliseconds.
       */
      const mapStrips = () => [...panelShadow().querySelectorAll(".sso-map")];

      /* One column of the rendered strip, as ink. Alpha rather than colour, so
       * the test does not break the first time the palette is changed. Rows
       * below the top few, so the playhead - which is drawn full height - is
       * not read as dialogue. */
      const stripSignal = (canvas) => {
        const pixels = canvas.getContext("2d")
          .getImageData(0, 0, canvas.width, canvas.height).data;
        const out = new Float64Array(canvas.width);
        for (let x = 0; x < canvas.width; x++) {
          let sum = 0;
          for (let y = 4; y < canvas.height; y++) sum += pixels[(y * canvas.width + x) * 4 + 3];
          out[x] = sum;
        }
        return out;
      };

      /* Mean-subtracted and normalised by the overlap, which is what a
       * cross-correlation is and what this was not.
       *
       * It multiplied the two signals raw and took the largest sum. On a sparse
       * strip - every line a 2px tick, the picture this suite was written
       * against - that works, because a wrong lag lines ticks up with nothing
       * and scores zero. On a strip where each line is a BLOCK as long as it is
       * on screen, dialogue fills 74% of a fifteen-second window (measured on
       * burstyCues), and the raw sum is then dominated by how much of the two
       * signals overlap at all - which is largest at lag 0 whatever the picture
       * says. It reported 0ms for a subtitle moved 4200ms, and the same signals
       * through the form below report 4209ms, one pixel being 59.
       *
       * So: subtract the mean, so a solid band contributes nothing and only the
       * pattern scores; divide by the number of pairs, so a lag is not punished
       * for the samples that fall off the end; and refuse a lag with less than
       * a third of the signal left to judge on. */
      const bestLag = (a, b) => {
        const mean = (v) => v.reduce((sum, x) => sum + x, 0) / v.length;
        const ma = mean(a);
        const mb = mean(b);
        let best = 0;
        let bestScore = -Infinity;
        for (let lag = -a.length + 1; lag < a.length; lag++) {
          let score = 0;
          let pairs = 0;
          for (let x = 0; x < a.length; x++) {
            const j = x + lag;
            if (j >= 0 && j < b.length) { score += (a[x] - ma) * (b[j] - mb); pairs++; }
          }
          if (pairs < a.length / 3) continue;
          score /= pairs;
          if (score > bestScore) { bestScore = score; best = lag; }
        }
        return best;
      };

      // what gives the correlation something to lock onto. An even comb would
      // correlate equally well at every multiple of its spacing.
      const burstyCues = (shiftMs) => {
        const cues = [];
        let t = 40000;
        let seed = 7;
        const next = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        while (t < 7050000) {
          const burst = 4 + Math.floor(next() * 14);
          for (let i = 0; i < burst && t < 7050000; i++) {
            cues.push({ start: Math.round(t + shiftMs), end: Math.round(t + shiftMs + 1800), text: "line" });
            t += 1800 + next() * 1600;
          }
          t += 8000 + next() * 70000;
        }
        return cues;
      };

        const was = video.currentTime;
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · map", fileId: 502, slot: 1 });

        if (Math.abs(seen - OUT_BY) > Math.ceil(msPerPixel))

         * the same error is a fraction of one pixel, so every sync error worth
         * fixing is invisible at the scale the strip opens on. */
        const acrossFilm = OUT_BY / ((video.duration * 1000) / (canvas.width - 1));

      check("the strip keeps up with the playhead, and repaints only when it must", async () => {

         * on every notify. At the 60s scale a 254px strip is 236ms of film per

         * failure mode of a cache is a picture that stops moving. Nudge the

        const was = video.currentTime;

        video.currentTime = 2600 + (msPerPixel / 5) / 1000;

        if (shot() !== before)
          throw new Error(`a ${Math.round(msPerPixel / 5)}ms step repainted an identical picture`);

        // Three pixels: it has to follow.
        video.currentTime = 2600 + (msPerPixel * 3) / 1000;
        await sleep(250);
        if (shot() === before)
          throw new Error(`a ${Math.round(msPerPixel * 3)}ms step left the strip where it was`);

        // And a timing change must always land, however still the playhead is.
        const held = shot();
        window.__ssoApi.setOffset(3000, { slot: 1, quiet: true });
        await sleep(250);
        if (shot() === held) throw new Error("moving the subtitle left the strip unchanged");

        video.currentTime = was;
        window.__ssoApi.detach(1);
        await sleep(120);
      });

      /* The playhead, off the rendered canvas. `stripSignal` above deliberately
       * skips the top rows so the full-height mark is not read as dialogue;
       * this reads only those rows, so it sees the mark and nothing else. */
      const playheadX = (canvas) => {
        const pixels = canvas.getContext("2d")
          .getImageData(0, 0, canvas.width, 2).data;
        let best = -1;
        let most = 0;
        for (let x = 0; x < canvas.width; x++) {
          const sum = pixels[x * 4 + 3] + pixels[(canvas.width + x) * 4 + 3];
          if (sum > most) { most = sum; best = x; }
        }
        return most ? best : -1;
      };

      check("the map keeps the playhead in the middle, wherever the film thinks it ends", async () => {
        /* Reported as "when I rewind the timeline of the video, the subtitle
         * overlay play markers couldn't stay in the center and in sync".
         *
         * The window was clamped so it could not run past the end of the film,
         * and on a player that fetches a new stream for every seek the believed
         * end is wrong in exactly the way that matters: `filmSeconds` answers
         * "where this stream starts, plus what has arrived", which sits a few
         * seconds ahead of the playhead and climbs with it. The clamp then
         * pinned the window near its right edge for the rest of the film.
         *
         * Set up as the report describes it: a length only a little ahead of
         * the playhead, in the middle of a film that is still running. */
        const wasTime = video.currentTime;
        const wasDuration = Object.getOwnPropertyDescriptor(video, "duration");
        try {
          const strip = mapStrips()[0];
          const canvas = strip.querySelector(".sso-map__canvas");
          const zoom = strip.querySelector(".sso-map__zoom");
          for (let i = 0; i < MAP_STEPS * 2 && zoom.textContent !== "60s"; i++) {
            zoom.click();
            await sleep(40);
          }

          // Nine seconds from an end the player has only just admitted to.
          Object.defineProperty(video, "duration", { get: () => 2692, configurable: true });
          video.currentTime = 2683;
          await sleep(300);

          const middle = (canvas.width - 1) / 2;
          const at = playheadX(canvas);
          if (at < 0) throw new Error("no playhead was drawn");
          /* Two device pixels of slack: the mark is rounded to a whole pixel
           * and the window moves on between the paint and the read. */
          if (Math.abs(at - middle) > 2) {
            throw new Error(
              `the playhead is at ${at} of ${canvas.width - 1}, not the middle at ${Math.round(middle)}`,
            );
          }

          // And it stays there as the film runs past the believed end.
          video.currentTime = 2695;
          await sleep(300);
          const after = playheadX(canvas);
          if (Math.abs(after - middle) > 2) {
            throw new Error(`past the believed end it sits at ${after}, not ${Math.round(middle)}`);
          }
        } finally {
          Object.defineProperty(video, "duration", wasDuration);
          /* And forget that this element's length ever moved. Putting the long
           * duration back is itself a growth, which would leave every check
           * after this one being told the film has no length at all - the
           * same reset the part-loaded-stream checks above use. */
          video.dispatchEvent(new Event("loadstart"));
          video.currentTime = wasTime;
          await sleep(400);
        }
      });

      check("a line is not shown early and then again at an act join", async () => {
        /* Reported as "Turkish subtitle sometimes shown earlier and then shown

         *
         * Where the aligner gives a file two acts and the later one sits
         * further on in the stream, the release inserted material - a recap, a
         * longer scene - and for the length of that insert no moment of this
         * subtitle is on screen. Inverting the mapping by "the later act wins"
         * answered with a file time from inside the next act, so its opening
         * lines were drawn while the insert played and drawn again when the act
         * properly began. Measured over the 26 act plans in the running log, 20
         * have at least one join of this shape: 51 joins, 206 seconds of film,
         * the largest single one 16.1 seconds.
         *
         * One cue, sitting exactly at the join, walked across it. It may appear
         * once and once only. */
        const wasTime = video.currentTime;
        const JOIN = 600000;
        const INSERT = 4000;
        try {
          await window.__ssoApi.attach({
            cues: [{ start: JOIN, end: JOIN + 2000, text: "Only once, please." }],
            label: "TR \u00b7 acts", fileId: 7401, language: "tr", slot: 1,
          });
          window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
          window.__ssoApi.setSteps(
            [{ fromMs: 0, offsetMs: 0 }, { fromMs: JOIN, offsetMs: INSERT }],
            { slot: 1 },
          );

          const boxOf = () => shadowOf().querySelectorAll(".sso-cue")[1];
          const shown = [];
          for (let ms = JOIN - 2000; ms <= JOIN + INSERT + 4000; ms += 250) {
            video.currentTime = ms / 1000;
            await sleep(60);
            shown.push(Boolean(boxOf()?.textContent.trim()));
          }

          // How many separate stretches it was on screen for. One is right;
          // two is the line played, taken away, and played again.
          let runs = 0;
          for (let i = 0; i < shown.length; i++) {
            if (shown[i] && !shown[i - 1]) runs += 1;

          if (runs > 1) throw new Error(`the line was drawn ${runs} separate times across one join`);
        } finally {
          window.__ssoApi.setSteps([], { slot: 1 });
          window.__ssoApi.detach(1);
          video.currentTime = wasTime;
          await sleep(150);
        }

      check("a line's length and how much it says are both in the picture", async () => {
        /* Asked for directly: the strip "shows where a subtitle starts, but it
         * doesn't show where it ends or how many chars/words it have - this
         * could help with syncing". It could, and it is the difference between
         * a matchable picture and an unmatchable one: two subtitlers cutting
         * the same exchange differently produce two unrelated patterns of
         * STARTS from identical dialogue, while the stretch of film each line
         * covers and the amount of text in it survive being cut differently.
         *
         * Two cues in one window, far enough apart to read separately: one long
         * and wordy, one brief and short. The long one has to be wider, and the
         * wordy one taller. Both are measured off the rendered canvas, so this
         * fails if the drawing stops carrying either. */
        const was = video.currentTime;
        video.currentTime = 600;
        await sleep(80);
        await window.__ssoApi.attach({
          cues: [
            { start: 596000, end: 600000, text: "A".repeat(90) },
            { start: 602000, end: 602600, text: "Oh" },
          ],
          label: "TR · shapes", fileId: 505, slot: 1,
        });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        await sleep(200);

        const strip = mapStrips()[1];
        const canvas = strip.querySelector(".sso-map__canvas");
        const zoom = strip.querySelector(".sso-map__zoom");
        for (let i = 0; i < MAP_STEPS * 2 && zoom.textContent !== "15s"; i++) {
          zoom.click();
          await sleep(40);
        }
        await sleep(150);

        /* Per column: is there ink, and how tall is it. The playhead is drawn
         * full height in its own colour, so a column reaching the very top is
         * the playhead and not a line.
         *
         * INK, the threshold, is what separates a line from the clock behind
         * it. The time grid is drawn faint on purpose and spans the full
         * height, so counting any alpha at all counted every gridline as a
         * block - 13 of them for two lines. A cue is drawn at 0.55 alpha and
         * its leading edge at 0.95, both in an opaque ink; the grid lands
         * around 40. Halfway between is a threshold that cannot be reached by
         * the grid and cannot be missed by a line. */
        const INK = 90;
        const px = canvas.getContext("2d")
          .getImageData(0, 0, canvas.width, canvas.height).data;
        const tall = new Array(canvas.width).fill(0);
        for (let x = 0; x < canvas.width; x++) {
          let top = canvas.height;
          for (let y = 0; y < canvas.height; y++) {
            if (px[(y * canvas.width + x) * 4 + 3] > INK) { top = y; break; }
          }
          tall[x] = top === 0 ? 0 : canvas.height - top;
        }

        // The two runs of ink, left to right.
        const runs = [];
        for (let x = 0; x < canvas.width; x++) {
          if (!tall[x]) continue;
          const start = x;
          let peak = 0;
          while (x < canvas.width && tall[x]) { peak = Math.max(peak, tall[x]); x++; }
          runs.push({ width: x - start, height: peak });
        }
        if (runs.length !== 2)
          throw new Error(`${runs.length} blocks drawn for two lines`);

        const [long_, brief] = runs;
        // 4000ms against 600ms in the same window: the wide one has to be
        // visibly wider, not wider by a rounding.
        if (long_.width < brief.width * 3)
          throw new Error(
            `a 4s line is ${long_.width}px and a 0.6s line ${brief.width}px - the end is not drawn`);
        // 90 characters against 2.
        if (long_.height <= brief.height)
          throw new Error(
            `a 90-character line is ${long_.height}px tall and a 2-character one ` +
            `${brief.height}px - how much is said is not drawn`);

        video.currentTime = was;
        window.__ssoApi.detach(1);
        await sleep(120);
      });

      check("dragging the strip moves the subtitle by what it was dragged", async () => {
        await window.__ssoApi.attach({ cues: burstyCues(0), label: "TR · map", fileId: 503, slot: 1 });
        window.__ssoApi.setOffset(0, { slot: 1, quiet: true });
        video.currentTime = 2600;
        await sleep(150);
        await zoomToFilm();

        const plot = mapStrips()[1].querySelector(".sso-map__plot");
        const box = plot.getBoundingClientRect();
        /* buttons: 1 matters. A synthetic PointerEvent reports no buttons held
         * unless told, and the drag now ends the moment it sees that - which is
         * what stops a stale drag re-timing the subtitle on a bare mouse move. */
        const at = (x) => ({
          pointerId: 91, button: 0, buttons: 1, clientX: x,
          clientY: box.top + box.height / 2, bubbles: true, cancelable: true,
        });
        // The whole film is on screen, so a pixel is the film over the width.
        const msPerPixel = (video.duration * 1000) / box.width;
        const moved = 40;

        // Capture is a no-op here: the events are synthetic and there is no
        // real pointer for the browser to hand over.
        plot.setPointerCapture = () => {};
        plot.releasePointerCapture = () => {};
        plot.hasPointerCapture = () => false;
        plot.dispatchEvent(new PointerEvent("pointerdown", at(box.left + 20)));
        plot.dispatchEvent(new PointerEvent("pointermove", at(box.left + 20 + moved)));
        plot.dispatchEvent(new PointerEvent("pointerup", at(box.left + 20 + moved)));
        await sleep(100);
