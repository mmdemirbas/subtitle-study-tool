        const box = grip.getBoundingClientRect();
        const ev = (type, x, y, buttons) =>
          new PointerEvent(type, { pointerId: 9, clientX: x, clientY: y, buttons, bubbles: true });
        grip.dispatchEvent(ev("pointerdown", box.left, box.top, 1));
        grip.dispatchEvent(ev("pointermove", box.left - 60, box.top + 50, 1));
        grip.dispatchEvent(ev("pointerup", box.left - 60, box.top + 50, 0));
        await sleep(120);
        const after = window.__ssoStudy.settings();
        if (after.width <= before.width)
          throw new Error(`width went ${before.width} -> ${after.width}`);
        if (!(after.height > 0)) throw new Error("the corner set no height");
      });

      check("the text size is one setting the whole rail follows", async () => {
        const term = railShadow().querySelector(".sso-card__term");
        const before = parseFloat(getComputedStyle(term).fontSize);
        window.__ssoStudy.updateSettings({ textPx: 22 });
        await sleep(120);
        const after = parseFloat(getComputedStyle(railShadow().querySelector(".sso-card__term")).fontSize);
        if (!(after > before + 3))
          throw new Error(`the word went ${before}px -> ${after}px with the setting at 22`);
        window.__ssoStudy.updateSettings({ textPx: 15 });
        await sleep(120);
      });

      check("saving keeps the word with its line, its film and its timestamp", async () => {
        deckSaves.length = 0;
        railShadow().querySelector(".sso-card__save").click();
        await sleep(200);
        const [entry] = deckSaves;
        if (!entry) throw new Error("nothing was saved");
        if (entry.term !== "frankly") throw new Error(`saved "${entry.term}"`);
        if (!entry.sentence.includes("frankly")) throw new Error("saved without its line");
        if (entry.timeMs == null) throw new Error("saved without a timestamp");
      });

      check("a saved word is marked as met before, not as new", async () => {
        await showWordyCue();
        await sleep(250);
        if (wordEl("frankly")?.dataset.saved !== "true")
          throw new Error("the word is not marked as already saved");
      });

      check("shift-dragging across words keeps the phrase, not one word", async () => {
        await showWordyCue();
        await sleep(200);
        const from = wordEl("do");
        const to = wordEl("care");
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        from.dispatchEvent(new PointerEvent("pointerdown", {
          bubbles: true, composed: true, shiftKey: true, pointerId: 9,
          clientX: a.left + 2, clientY: a.top + 2,
        }));
        to.dispatchEvent(new PointerEvent("pointermove", {
          bubbles: true, composed: true, pointerId: 9,
          clientX: b.left + 2, clientY: b.top + 2,
        }));
        document.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 9 }));
        await sleep(400);
        const terms = [...railShadow().querySelectorAll(".sso-card__term")].map((n) => n.textContent);
        if (!terms.includes("do not care"))
          throw new Error(`rail holds ${terms.join(" / ") || "nothing"}, not the phrase`);
      });

      check("a click on the film still reaches the player with study mode on", async () => {
        await showWordyCue();
        await sleep(150);
        let reached = 0;
        const player = document.getElementById("player");
        const count = () => reached++;
        player.addEventListener("click", count);
        /* The box's own padding, which is subtitle but not a word - a press
         * there has always been the player's. Left edge rather than right: the
         * rail docks on the right, and a point underneath a panel legitimately
         * belongs to the panel, which would make this assert the wrong thing. */
        const box = cueOf(0).getBoundingClientRect();
        const x = box.left + 3;
        const y = box.top + 3;
        await dragCue(x, y, x, y);
        player.removeEventListener("click", count);
        if (reached === 0) {
          /* Name what took it. "Swallowed" sends the reader into study mode's
           * pointer handling, and the last two times this failed the cause was
           * something else sitting over the point - which the message can say
           * and a reader cannot guess. */
          const boxes = [...shadowOf().querySelectorAll(".sso-cue")];
          const previous = boxes.map((b) => b.style.pointerEvents);
          boxes.forEach((b) => (b.style.pointerEvents = "none"));
          const hit = document.elementFromPoint(x, y);
          boxes.forEach((b, i) => (b.style.pointerEvents = previous[i]));
          const name = hit
            ? `${hit.tagName.toLowerCase()}#${hit.id || "-"}.${(hit.className || "-").toString().slice(0, 30)}`
            : "nothing";
          throw new Error(`the click at ${Math.round(x)},${Math.round(y)} went to ${name}`);
        }
      });

      check("dragging the subtitle still moves it with study mode on", async () => {
        const before = window.__ssoApi.status().settings.tracks[0].posY;
        const box = cueOf(0).getBoundingClientRect();
        await dragCue(box.left + box.width / 2, box.top + 6, 300, 180);
        const after = window.__ssoApi.status().settings.tracks[0].posY;
        if (Math.abs(after - before) < 5)
          throw new Error(`dragging a word did not move the box: ${before}% -> ${after}%`);
      });

      check("turning study mode off takes the rail and the marks away", async () => {
        await window.__ssoStudy.setEnabled(false);
        await showWordyCue();
        await sleep(200);
        if (railShadow()) throw new Error("the rail is still in the page");
        if (wordsIn(0).some((w) => w.dataset.rare === "true"))
          throw new Error("words are still marked");
      });

      /* --- the controls behave like controls ---------------------------------
       *
       * Every floating surface should move, resize and fold the same way, and
       * do nothing surprising at the edges. These run over both of them from
       * one table, so a behaviour added to one and forgotten on the other is a
       * failure rather than an inconsistency nobody notices.
       */
      const SURFACES = [
        { name: "panel", sel: ".sso-panel", head: ".sso-win__head", grip: ".sso-grip" },
        { name: "rail", sel: ".sso-rail", head: ".sso-win__head", grip: ".sso-grip" },
      ];

      const hostFor = (sel) =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(sel));

      const openBoth = async () => {
        await window.__ssoStudy.setEnabled(true);
        window.__ssoStudy.updateSettings({ showRail: true, folded: false });
        await window.__ssoPanel.show();
        await sleep(250);
      };

      const pev = (type, x, y, buttons) =>
        new PointerEvent(type,
          { pointerId: 31, clientX: x, clientY: y, button: 0, buttons, bubbles: true });

      for (const s of SURFACES) {
        check(`the ${s.name} does not run away when a release goes missing`, async () => {
          // The subtitle had this bug, then the panel was fixed, and the rail
          // was not - it teleported 500px on the next mouse move. One shared
          // drag now, so there is one place for the guard to live.
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};

          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", from.left + 90, from.top + 40, 1));
          head.dispatchEvent(pev("pointermove", 420, 480, 0)); // the release is lost
          await sleep(40);
          const parked = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointermove", 950, 130, 0)); // just moving the mouse
          await sleep(60);
          const after = host.getBoundingClientRect();
          if (Math.abs(after.left - parked.left) > 2 || Math.abs(after.top - parked.top) > 2) {
            throw new Error(
              `it followed the pointer with no button held: ` +
              `${Math.round(parked.left)},${Math.round(parked.top)} -> ` +
              `${Math.round(after.left)},${Math.round(after.top)}`);
          }
        });

        check(`the ${s.name} cannot be dragged out of reach`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 9000, 9000, 1));
          head.dispatchEvent(pev("pointerup", 9000, 9000, 0));
          await sleep(80);
          const box = head.getBoundingClientRect();
          if (box.top > window.innerHeight - 10 || box.left > window.innerWidth - 30)
            throw new Error(`the handle ended at ${Math.round(box.left)},${Math.round(box.top)}`);

          // And back, so the surface that follows is not left in the corner.
          head.dispatchEvent(pev("pointerdown", box.left + 40, box.top + 8, 1));
          head.dispatchEvent(pev("pointermove", 300, 150, 1));
          head.dispatchEvent(pev("pointerup", 300, 150, 0));
          await sleep(60);
        });

        check(`the ${s.name} folds to its title bar and unfolds again`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const shadow = host.shadowRoot;
          const head = shadow.querySelector(s.head);
          const fold = [...head.querySelectorAll("button")].find((b) => /^[▾▸]$/.test(b.textContent));
          if (!fold) throw new Error("no fold control on the title bar");

          const open = host.getBoundingClientRect().height;
          fold.click();
          await sleep(150);
          const shut = host.getBoundingClientRect().height;
          if (shut >= open) throw new Error(`folding changed the height ${open} -> ${shut}`);
          if (shut < 10) throw new Error("folding took the title bar too, so there is no way back");

          // Resizing something that is not on screen would apply numbers that
          // only appear on unfolding, which is a surprise rather than a size.
          for (const grip of shadow.querySelectorAll(s.grip)) {
            if (getComputedStyle(grip).display !== "none")
              throw new Error("a resize grip is still live while folded");
          }

          fold.click();
          await sleep(150);
          const again = host.getBoundingClientRect().height;
          if (Math.abs(again - open) > 4) throw new Error(`unfolded to ${again}, was ${open}`);
        });

        check(`double-clicking the ${s.name}'s title bar parks it`, async () => {
          await openBoth();
          const host = hostFor(s.sel);
          const head = host.shadowRoot.querySelector(s.head);
          head.setPointerCapture = () => {};
          head.releasePointerCapture = () => {};
          const from = host.getBoundingClientRect();
          head.dispatchEvent(pev("pointerdown", from.left + 60, from.top + 10, 1));
          head.dispatchEvent(pev("pointermove", 240, 320, 1));
          head.dispatchEvent(pev("pointerup", 240, 320, 0));
          await sleep(80);
          const moved = host.getBoundingClientRect();

          head.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          await sleep(150);
          const parked = host.getBoundingClientRect();
          if (Math.abs(parked.left - moved.left) < 20 && Math.abs(parked.top - moved.top) < 20)
            throw new Error("it stayed where it had been dragged");
          if (parked.right > window.innerWidth + 1 || parked.top < 0)
            throw new Error(`parked off screen at ${Math.round(parked.left)},${Math.round(parked.top)}`);
        });
      }

      check("the rail stays off a page with nothing attached", async () => {
        // Reported as the rail appearing on unrelated pages while a film played
        // in another tab: study mode is one setting for every tab, so the rail
        // was built wherever the content script loaded with it on.
        await openBoth();
        if (!hostFor(".sso-rail")) throw new Error("no rail to begin with");

        window.__ssoApi.detach(0);
        window.__ssoApi.detach(1);
        await sleep(200);
        if (hostFor(".sso-rail"))
          throw new Error("the rail is still there with no subtitle attached");
        if (!window.__ssoStudy.settings().enabled)
          throw new Error("it turned study mode off rather than leaving the page alone");

        // Attaching is what brings it back, without touching the switch.
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);
        if (!hostFor(".sso-rail")) throw new Error("attaching did not bring it back");
      });

      check("a stretched subtitle shows the right line at the right moment", async () => {
        /* The display model is `stream = rate * fileTime + offset + adDrift`.
         * Every one of these assertions is invisible while rate is 1, which is
         * exactly why they are here: a sign or an order-of-operations mistake
         * in that expression would pass every other test in this file. */
        const api = window.__ssoApi;
        const video = document.getElementById("v");
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const cues = [
          { start: 60000, end: 62000, text: "early line" },
          { start: 600000, end: 602000, text: "late line" },
        ];
        await api.attach({ cues, label: "stretched", fileId: 5150, language: "en", slot: 0 });
        await sleep(120);

        const showing = () => shadowOf().querySelector('.sso-root[data-slot="0"] .sso-cue').textContent;
        const at = async (seconds) => { video.currentTime = seconds; await sleep(140); return showing(); };

        // Rate 1 first: the baseline this must not disturb.
        if (!(await at(601)).includes("late")) throw new Error("the plain case is already wrong");

        /* A subtitle timed for 25fps against a 23.976 encode: its clock runs
         * fast, so a line the file puts at ten minutes is spoken later. */
        const rate = 25 / (24000 / 1001);
        api.setRate(rate, { slot: 0, quiet: true });
        await sleep(120);
        // 600s of file time lands at 600 * rate of stream time.
        const late = await at(600 * rate + 1);
        if (!late.includes("late"))
          throw new Error(`at ${(600 * rate + 1).toFixed(1)}s a stretched subtitle showed "${late}"`);
        // And the unstretched moment is now too early for it.
        const early = await at(601);
        if (early.includes("late"))
          throw new Error("the stretch did not move the later line at all");

        /* Ad drift comes off before the division, because it is measured in
         * stream seconds - an advert takes the same real time whatever the film
         * is encoded at. Dividing it too would be invisible at rate 1. */
        api.setRate(1, { slot: 0, quiet: true });
        await sleep(100);

        /* And a nudge is a constant shift in display time whatever the rate,
         * which is the reason the offset is applied outside the division rather
         * than inside it. */
        api.setRate(rate, { slot: 0, quiet: true });
        api.setOffset(0, { slot: 0, quiet: true });
        await sleep(100);
        const before = video.currentTime;
        const shownAt = 600 * rate;
        video.currentTime = shownAt + 1;
        await sleep(120);
        api.nudge(2000, { slot: 0 });
        await sleep(120);
        video.currentTime = shownAt + 3;
        await sleep(140);
        if (!showing().includes("late"))
          throw new Error("a 2s nudge did not move the line by 2s of stream time");
        video.currentTime = before;

        api.setRate(1, { slot: 0, quiet: true });
        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      check("what you watched with is remembered, in the order you chose it", async () => {
        /* Reported: "if I added 2 subtitles, EN + TR, then the next video
         * should load double subtitles in the same languages and same
         * arrangement". The shortcut already filled both slots - it filled them
         * from a list nobody had told about this evening's viewing.
         *
         * Slot order is the whole point, not just the set: slot 0 is the
         * language being learnt and slot 1 is the one it is learnt from. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        await api.attach({ cues: CUES, label: "one", fileId: 8801, language: "de", slot: 0 });
        await api.attach({ cues: CUES, label: "two", fileId: 8802, language: "fr", slot: 1 });
        await sleep(200);
        const stored = (await chrome.storage.local.get("sso:usedLanguages"))["sso:usedLanguages"];
        if (!Array.isArray(stored)) throw new Error("nothing was remembered");
        if (stored[0] !== "de" || stored[1] !== "fr")
          throw new Error(`remembered ${JSON.stringify(stored)}, want ["de","fr"]`);

        /* And the arrangement needs no help - it lives in the settings, so a
         * new video keeps it. Worth asserting, because the thing that would
         * break it is attach() re-arranging over a layout already chosen. */
        api.arrange("stacked");
        await sleep(120);
        const arranged = api.status().settings.tracks.map((t) => ({ ...t }));
        await api.attach({ cues: CUES, label: "next film", fileId: 8803, language: "de", slot: 0 });
        await sleep(200);
        const after = api.status().settings.tracks;
        for (const slot of [0, 1]) {
          if (after[slot].posY !== arranged[slot].posY || after[slot].widthPercent !== arranged[slot].widthPercent)
            throw new Error(
              `attaching moved subtitle ${slot + 1}: ` +
              `${arranged[slot].posY}%/${arranged[slot].widthPercent}% -> ` +
              `${after[slot].posY}%/${after[slot].widthPercent}%`);
        }

        await chrome.storage.local.remove("sso:usedLanguages");
        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      check("a timing saved before rates existed still loads", async () => {
        /* The stored value went from a bare number to an object. Reading has to
         * accept both, or the first thing this change does to an existing
         * reader is forget every offset they ever set. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        await chrome.storage.local.set({ "sso:offset:7777": -3500 });
        await api.attach({ cues: CUES, label: "old", fileId: 7777, language: "en", slot: 1 });
        await sleep(150);
        const track = api.status().tracks[1];
        if (track.offsetMs !== -3500)
          throw new Error(`an old bare-number offset loaded as ${track.offsetMs}`);
        if (track.rate !== 1) throw new Error(`it invented a rate of ${track.rate}`);

        // And what it writes back is readable next time.
        api.setRate(1.0427, { slot: 1, quiet: true });
        await sleep(100);
        await api.attach({ cues: CUES, label: "again", fileId: 7777, language: "en", slot: 1 });
        await sleep(150);
        if (Math.abs(api.status().tracks[1].rate - 1.0427) > 1e-9)
          throw new Error(`the rate did not survive a round trip: ${api.status().tracks[1].rate}`);

        api.setRate(1, { slot: 1, quiet: true });
        await chrome.storage.local.remove("sso:offset:7777");
        if (wasAttached[1]) {
          await api.attach({ cues: CUES, label: "second", fileId: 2, language: "tr", slot: 1 });
        } else {
          api.detach(1);
        }
        await sleep(120);
      });

      check("attaching a second subtitle lines it up on its own", async () => {
        /* End to end, through attach: the thing the reader actually does.
         *
         * Both slots are replaced, because this harness's own cue list is five
         * lines and the aligner declines to have an opinion below twelve - and
         * quite right. Everything is put back afterwards, geometry included:
         * attach() arranges two subtitles side by side the first time neither
         * has been placed by hand, and later cases assert on that. */
        const api = window.__ssoApi;
        const wasAttached = api.status().tracks.map((t) => t.attached);
        const wasGeometry = api.status().settings.tracks.map((t) => ({ ...t }));

        const long = speech(600, 47).map((start) => ({ start, end: start + 1800, text: "line" }));
        const late = long.map((cue) => ({ start: cue.start + 8000, end: cue.end + 8000, text: cue.text }));
        await api.attach({ cues: long, label: "reference", fileId: 4241, language: "en", slot: 0 });
        await sleep(120);
        await api.attach({ cues: late, label: "mistimed", fileId: 4242, language: "tr", slot: 1 });
        await sleep(200);

        const after = api.status().tracks[1];
        if (!after.attached) throw new Error("it did not attach");
        /* Minus eight seconds, and the sign is the point. This subtitle's cues
         * start eight seconds later than the reference's, so to put the same
         * words on screen at the same moment it has to be brought forward -
         * film time is stream time minus the offset. Getting this backwards is
         * the single easiest mistake in the whole feature and it doubles the
         * error rather than fixing it. */
        if (Math.abs(after.offsetMs + 8000) > 250)
          throw new Error(`offset came out at ${after.offsetMs}, want about -8000`);

        // And a subtitle for a different film is left exactly as it arrived.
        const unrelated = speech(600, 913).map((start) => ({ start, end: start + 1800, text: "x" }));
        await api.attach({ cues: unrelated, label: "elsewhere", fileId: 4243, language: "tr", slot: 1 });
        await sleep(200);
        if (api.status().tracks[1].offsetMs !== 0)
          throw new Error(`a different film was shifted by ${api.status().tracks[1].offsetMs}ms`);

        for (const slot of [0, 1]) {
          if (wasAttached[slot]) {
            await api.attach({
              cues: CUES, label: slot ? "second" : "first", fileId: slot + 1,
              language: slot ? "tr" : "en", slot,
            });
          } else {
            api.detach(slot);
          }
        }
        api.updateSettings({ tracks: wasGeometry });
        await sleep(150);
      });

      check("re-injection leaves exactly one overlay", async () => {
        window.__ssoApi.detach(1);
        const count = () => [...document.querySelectorAll("div")].filter((d) => d.shadowRoot).length;
        const load = (src) => new Promise((ok, no) => {
          const s = document.createElement("script");
          s.src = src + "?v=" + cases.length; s.onload = ok; s.onerror = no;
          document.body.append(s);
        });
        await load("../src/content.js");
        await load("../src/panel.js");
        await load("../src/study.js");
        await sleep(150);
        if (count() > 2) throw new Error(`${count()} shadow hosts after re-injection`);
      });

      // --- run ------------------------------------------------------------
      /* An error nobody caught is a failure even when every assertion holds.
       * Rejected promises count too: most of this code reports failure by
       * rejecting inside a .catch() that discards it. */
      const loose = [];
      window.addEventListener("error", (e) => loose.push(e.message));
      window.addEventListener("unhandledrejection", (e) => loose.push(String(e.reason?.message ?? e.reason)));

      (async () => {
        await window.__ssoApi.attach({ cues: CUES, label: "EN · harness", fileId: 1 });
        await sleep(250);

        const out = document.getElementById("results");
        let passed = 0;
        for (const { name, fn } of cases) {
          const row = document.createElement("div");
          row.className = "case";
          try {
            await fn();
            row.classList.add("pass");
            row.textContent = name;
            passed++;
          } catch (err) {
            row.classList.add("fail");
            row.textContent = name;
            const why = document.createElement("div");
            why.className = "why";
            why.textContent = err.message;
            row.append(why);
          }
          out.append(row);
        }
        for (const message of [...new Set(loose)]) {
          const row = document.createElement("div");
          row.className = "case fail";
          row.textContent = "nothing caught this error";
          const why = document.createElement("div");
          why.className = "why";
          why.textContent = message;
          row.append(why);
          out.append(row);
        }

        const total = cases.length + new Set(loose).size;
        const summary = document.getElementById("summary");
        summary.textContent = `${passed}/${total} passed`;
        summary.style.color = passed === total ? "#59c27f" : "#e8705f";
        window.__harness = { passed, total, loose: [...new Set(loose)] };
      })();
    </script>
  </body>
</html>
