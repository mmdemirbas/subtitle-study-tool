<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Overlay — test harness</title>
    <style>
      /* --- The page under test ------------------------------------------
       *
       * These are not arbitrary. Every rule here reproduces something a real
       * streaming site does that has broken this extension at least once:
       *
       *   button { ... !important }   made the CC handle invisible
       *   span   { font-style: normal } cancelled subtitle italics
       *   div    { line-height: 3 }   pulled the control panel apart
       *   #later { z-index: max }     player chrome painted over the overlay
       *   stopPropagation on the player  killed the pointermove listener
       *
       * If a change to the extension survives this page, it survives Prime.
       */
      body { margin: 0; background: #0b0d10; font-family: serif; color: #fff; }
      div { position: relative; line-height: 3; letter-spacing: 2px; }
      span { font-style: normal !important; color: #ff00ff !important; }
      button { position: relative !important; opacity: 0 !important;
               visibility: hidden !important; display: inline !important;
               transform: scale(0) !important; font-size: 40px !important; }
      #player { position: fixed; inset: 0;
        background: radial-gradient(60% 50% at 30% 35%, #48586b, #12161c 70%); }
      video { width: 100%; height: 100%; display: block; }
      /* Player chrome appended AFTER the overlay, same z-index. */
      #later { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; }

      /* --- Results panel (not under test) ------------------------------- */
      #results { position: fixed; right: 0; top: 0; bottom: 0; width: 430px;
        overflow: auto; z-index: 2147483646; padding: 14px 16px;
        background: #0f1116; border-left: 1px solid #262b33;
        font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        line-height: 1.5 !important; letter-spacing: 0 !important; }
      #results h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0 !important; }
      #summary { margin: 0 0 12px; font-size: 12px; }
      .case { padding: 5px 0; border-top: 1px solid #1c212a; letter-spacing: 0 !important; }
      .pass::before { content: "PASS "; color: #59c27f; }
      .fail::before { content: "FAIL "; color: #e8705f; }
      .why { color: #8b929d; padding-left: 42px; }
    </style>
  </head>
  <body>
    <div id="player"><video id="v"></video></div>
    <div id="later"></div>
    <div id="ad-slot"></div>
    <aside id="results"><h1>Subtitle Overlay — harness</h1><p id="summary">running…</p></aside>

    <script>
      // --- chrome API stub ------------------------------------------------
      const store = {};
      const EXT = "../src/";
      window.chrome = {
        runtime: {
          getManifest: () => ({ version: "0.1.0" }),
          getURL: (p) => EXT + p.split("/").pop(),
          onMessage: { addListener() {}, removeListener() {} },
          sendMessage: async (msg) => {
            if (msg?.type !== "sso:daemon") return {};
            if (msg.op === "search") {
              return {
                used: { query: "Mercy" },
                auto_attach_threshold: 0.75,
                resolved: { title: "mercy", year: 2026, imdb_id: "31050594" },
                results: [{
                  file_id: 1, language: "en", movie_name: "Mercy",
                  release: "Mercy.2026.1080p.AMZN.WEB-DL", year: 2026,
                  download_count: 812, match_score: 1.0, cached: false,
                  from_trusted: true, hearing_impaired: true,
                }],
              };
            }
            if (msg.op === "fetch") return { cues: CUES };

            /* Study mode's three questions. Stubbed rather than reaching the
             * real tables and the real dictionary, because what is under test
             * here is what the overlay does with the answers - which word gets
             * marked, what lands in the rail, what a save keeps. The tables
             * themselves are generated data with their own generator. */
            if (msg.op === "rank") {
              const ranks = {};
              for (const word of msg.args.words) {
                ranks[word] = RANKS[word] === undefined ? null : RANKS[word];
              }
              return { ranks };
            }
            if (msg.op === "lookup") {
              lookupCalls.push(msg.args.query);
              lookupTargets.push(msg.args.target);
              return {
                query: msg.args.query,
                definitions: [{ partOfSpeech: "verb", sense: `to ${msg.args.query}, in a way` }],
                phonetic: "/stub/",
                translation: `${msg.args.query}-in-${msg.args.target || "nothing"}`,
                source: "harness",
              };
            }
            if (msg.op === "deckSave") {
              deckSaves.push(msg.args.entry);
              return { added: true, entry: msg.args.entry, size: deckSaves.length };
            }
            if (msg.op === "deckTerms") {
              return { terms: deckSaves.map((entry) => `${entry.language}:${entry.term}`) };
            }
            return {};
          },
        },
        /* Matches chrome.storage.local's actual surface, not just the calls
         * that happened to exist when this was written. A missing method
         * throws inside a .catch()-ed promise, which passes silently: the
         * suite reported 62/62 green while three real calls were failing. */
        storage: { local: {
          get: async (k) => {
            const keys = typeof k === "string" ? [k] : Array.isArray(k) ? k : Object.keys(k ?? store);
            const out = {};
            for (const key of keys) if (key in store) out[key] = store[key];
            return out;
          },
          set: async (o) => Object.assign(store, o),
          remove: async (k) => {
            for (const key of typeof k === "string" ? [k] : k) delete store[key];
          },
          clear: async () => {
            for (const key of Object.keys(store)) delete store[key];
          },
        } },
      };

      /* Ranks for the words in the cues below. "frankly" is deliberately far
       * down the list and "about" near the top, so one line contains both a
       * word that must be marked and several that must not - which is the
       * actual claim, rather than "something got underlined". */
      const RANKS = {
        i: 5, have: 60, no: 30, idea: 900, what: 12, you: 0, are: 25,
        talking: 700, about: 90, and: 8, do: 40, not: 15, care: 400,
        frankly: 14200, get: 55, down: 120, fine: 500, did: 45, see: 70,
        that: 5, saw: 300, nothing: 250, at: 20, all: 35, ormon: null,
        sighs: 8800,
      };
      const lookupCalls = [];
      const lookupTargets = [];
      const deckSaves = [];

      // Cue payloads in the exact shape the daemon emits.
      const CUES = [
        { start: 0, end: 600000, text: "[Ormon] Get down!",
          runs: [{ text: "[Ormon]", color: "#ffc857", kind: "speaker" },
                 { text: " Get down!" }] },
        { start: 600000, end: 900000, text: "[sighs] Fine.",
          runs: [{ text: "[sighs]", styles: ["i"], kind: "sound", symbol: "\u{1F62E}‍\u{1F4A8}" },
                 { text: " Fine.", styles: ["i"] }] },
        // Wrapped the way subtitle files really are: two short lines broken
        // for a 4:3 television, not for the screen this will be shown on.
        { start: 1200000, end: 1500000,
          text: "I have no idea what you are talking\nabout, and frankly I do not care.",
          runs: [{ text: "I have no idea what you are talking\n" },
                 { text: "about, and frankly I do not care." }] },
        // Two speakers in one cue. Here the break is meaning, not wrapping,
        // and it sits at the boundary between two runs.
        { start: 1500000, end: 1800000,
          text: "- Did you see that?\n- I saw nothing at all.",
          runs: [{ text: "- Did you see that?\n" },
                 { text: "- I saw nothing at all." }] },
      ];

      const video = document.getElementById("v");
      Object.defineProperty(video, "duration", { get: () => 7200 });
      Object.defineProperty(video, "paused", { get: () => false });
      let t = 1;
      Object.defineProperty(video, "currentTime", { get: () => t, set: (x) => (t = x) });

      // Players own pointer events inside the player surface.
      for (const type of ["pointermove", "mousemove"]) {
        document.getElementById("player")
          .addEventListener(type, (e) => e.stopPropagation());
      }
    </script>

    <script src="../src/align.js"></script>
    <script src="../src/content.js"></script>
    <script src="../src/panel.js"></script>
    <script src="../src/study.js"></script>

    <script>
      // --- assertions -----------------------------------------------------
      const cases = [];
      const check = (name, fn) => cases.push({ name, fn });
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      // Cue 2 carries the italics, the sound run and the symbol. It is only
      // rendered while the playhead is inside it, so checks about it have to
      // move the clock first.
      const showSoundCue = async () => { video.currentTime = 700; await sleep(120); };
      const showSpeakerCue = async () => { video.currentTime = 1; await sleep(120); };
      const shadowOf = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-root"))?.shadowRoot;
      const panelShadow = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot && d.shadowRoot.querySelector(".sso-panel"))?.shadowRoot;

      /* The card menu is on a host of its own, outside the panel's shadow tree.
       * That is the point of it: a menu opened near the bottom of the panel was
       * being cut off at the panel's edge, and nothing above its own host can
       * clip it. So it is looked for in the document, not in the panel. */
      const menuShadow = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(".sso-menu"))?.shadowRoot;
      const menuItems = () => [...(menuShadow()?.querySelectorAll(".sso-menu__item") || [])];

      /* Settings are a window of their own now, not a screen in the panel, so
       * they are looked for in the document too. */
      const sheetShadow = () =>
        [...document.querySelectorAll("div")].find((d) => d.shadowRoot?.querySelector(".sso-sheet"))?.shadowRoot;
      const openSettings = async () => {
        [...panelShadow().querySelectorAll(".sso-win__head button")]
          .find((b) => b.textContent === "⚙")?.click();
        await sleep(220);
        return sheetShadow();
      };

      check("overlay lives in a shadow root, out of reach of page CSS", () => {
        if (!shadowOf()) throw new Error("no shadow root holding .sso-root");
      });

      check("cue text is not recoloured by the page's span rule", async () => {
        await showSpeakerCue();
        const run = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-speaker"));
        const color = getComputedStyle(run).color;
        if (color.includes("255, 0, 255")) throw new Error("page span colour leaked in: " + color);
      });

      check("italic survives the page's font-style reset", async () => {
        await showSoundCue();
        const italic = [...shadowOf().querySelectorAll(".sso-i")][0];
        if (!italic) throw new Error("no italic run rendered");
        if (getComputedStyle(italic).fontStyle !== "italic")
          throw new Error("font-style is " + getComputedStyle(italic).fontStyle);
      });

      check("speaker run keeps its identity colour", async () => {
        await showSpeakerCue();
        const speaker = shadowOf().querySelector(".sso-speaker");
        if (!speaker) throw new Error("no speaker run");
        const c = getComputedStyle(speaker).color;
        if (!c.includes("255, 200, 87")) throw new Error("speaker colour is " + c);
      });

      check("sound run is dimmed relative to dialogue", async () => {
        await showSoundCue();
        const sound = shadowOf().querySelector(".sso-sound");
        const dialogue = [...shadowOf().querySelectorAll(".sso-run")]
          .find((r) => !r.classList.contains("sso-sound") && !r.classList.contains("sso-speaker"));
        if (!sound || !dialogue) throw new Error("expected a sound run and a dialogue run");
        if (Number(getComputedStyle(sound).opacity) >= Number(getComputedStyle(dialogue).opacity))
          throw new Error("sound is not dimmer than speech");
      });

      check("sound symbol is rendered beside the words", async () => {
        await showSoundCue();
        const symbol = shadowOf().querySelector(".sso-symbol");
        if (!symbol || !symbol.textContent.trim()) throw new Error("no symbol");
        if (!shadowOf().querySelector(".sso-sound").textContent.includes("sighs"))
          throw new Error("symbol replaced the word instead of joining it");
      });

      check("CC handle appears despite the player swallowing pointer events", async () => {
        document.getElementById("player")
          .dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
        await sleep(80);
        const h = shadowOf().querySelector(".sso-handle");
        if (!h) throw new Error("handle missing");
        const cs = getComputedStyle(h);
        if (cs.visibility === "hidden" || Number(cs.opacity) === 0)
          throw new Error(`hidden: visibility=${cs.visibility} opacity=${cs.opacity}`);
      });

      /* A feed page: the page's own player is gone and the only video is one a
       * row plays while the pointer is over it. Sizes are the ones measured on
       * YouTube's results page - 504x211 in a 1440x900 window, duration 464s -
       * expressed as fractions of the window so the case does not depend on
       * the size of the browser running it. */
      async function onFeedPage(shape, run) {
        const player = document.getElementById("player");
        const handle = shadowOf().querySelector(".sso-handle");
        const preview = document.createElement("video");
        preview.style.display = "block";
        preview.style.width = `${Math.round(shape.width * window.innerWidth)}px`;
        preview.style.height = `${Math.round(shape.height * window.innerHeight)}px`;
        Object.defineProperty(preview, "duration", { get: () => 464 });
        Object.defineProperty(preview, "paused", { get: () => false });

        let holder = preview;
        if (shape.inLink) {
          holder = document.createElement("a");
          holder.href = "#watch";
          holder.style.display = "block";
          holder.append(preview);
        }
        document.body.append(holder);
        player.style.display = "none";     // no player on this page, only rows
        handle.dataset.visible = "false";
        try {
          preview.dispatchEvent(new PointerEvent("pointermove", { bubbles: true }));
          await sleep(80);
          return await run(handle, preview);
        } finally {
          holder.remove();
          player.style.display = "";
        }
      }

      const handleShowing = (handle) =>
        handle.dataset.visible === "true" && Number(getComputedStyle(handle).opacity) > 0;

      check("CC handle stays away from a feed row's hover preview", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("the handle appeared over a thumbnail - this page has nothing to subtitle");
        }));

      check("CC handle stays away from a video too small to be the page's subject", () =>
        onFeedPage({ width: 0.35, height: 0.235, inLink: false }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a video covering 8% of the window was treated as the page's subject");
        }));

      /* Size alone does not settle it. The preview keeps roughly its share of
       * the row, so in a narrower window it grows against the window: the same
       * tile that covers 7% of a maximised screen covers about 18% of a
       * 1000x600 one, which clears the floor. Being inside the link that opens
       * it is what still identifies it. */
      check("CC handle stays away from a hover preview large enough to clear the floor", () =>
        onFeedPage({ width: 0.55, height: 0.4, inLink: true }, (handle) => {
          if (handleShowing(handle))
            throw new Error("a link-wrapped preview got the handle once it was big enough");
        }));

      /* The control for the two above: the rule has to admit a player that is
       * merely large, not only one that fills the window, or an article with a
       * video in it would lose the handle. This is the watch page's 32%. */
      check("CC handle appears for a player that is large without filling the window", () =>
        onFeedPage({ width: 0.7, height: 0.46, inLink: false }, (handle) => {
          if (!handleShowing(handle))
            throw new Error("a player covering a third of the window did not get the handle");
        }));

      check("CC handle keeps its size against the page's button reset", () => {
        const box = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        if (box.width < 20 || box.height < 14)
          throw new Error(`collapsed to ${Math.round(box.width)}x${Math.round(box.height)}`);
      });

      check("overlay stays above chrome appended later at equal z-index", () => {
        const host = shadowOf().host;
        const later = document.getElementById("later");
        if (host.compareDocumentPosition(later) & Node.DOCUMENT_POSITION_FOLLOWING)
          throw new Error("player chrome is after the overlay in document order");
      });

      check("CC handle opens the panel", async () => {
        shadowOf().querySelector(".sso-handle").click();
        await sleep(250);
        if (!panelShadow()) throw new Error("panel did not open");
      });

      /* Prime stitches ads into the same stream, so currentTime keeps running
       * through the break while the film stands still. Simulate exactly that:
       * show an ad marker, advance the clock, hide it again. */
      const adBreak = async (seconds) => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);                       // detector polls at 400ms
        video.currentTime += seconds;           // stream advances, film does not
        await sleep(200);
        slot.innerHTML = "";
        await sleep(500);
      };

      check("an ad break is detected and its time removed", async () => {
        await showSpeakerCue();
        const before = window.__ssoApi.status().adDriftMs || 0;
        await adBreak(90);
        const after = window.__ssoApi.status().adDriftMs;
        if (Math.abs(after - before - 90000) > 1500)
          throw new Error(`measured ${Math.round((after - before) / 1000)}s of ad, expected ~90s`);
      });

      check("the same cue is still showing after the ad break", async () => {
        video.currentTime = 1;
        window.__ssoApi.clearAdDrift();
        await sleep(150);
        const before = shadowOf().querySelector(".sso-cue").textContent;
        await adBreak(90);
        // Film time is unchanged: stream moved 90s, all of it advertising.
        const after = shadowOf().querySelector(".sso-cue").textContent;
        if (before !== after)
          throw new Error(`cue changed across the ad break: "${before}" -> "${after}"`);
      });

      check("subtitles are hidden while the ad plays", async () => {
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="atvwebplayersdk-ad-timer-remaining-time" ' +
          'style="position:fixed;top:4px;left:4px;width:60px;height:20px">Ad</div>';
        await sleep(500);
        const text = shadowOf().querySelector(".sso-cue").textContent.trim();
        slot.innerHTML = "";
        await sleep(500);
        if (text) throw new Error("cue still rendered during the ad: " + text);
      });

      check("a marker that flickers is not counted as an ad", async () => {
        window.__ssoApi.clearAdDrift();
        const slot = document.getElementById("ad-slot");
        slot.innerHTML = '<div class="ad-timer" style="position:fixed;width:20px;height:10px"></div>';
        await sleep(500);
        video.currentTime += 0.5;   // far below the two-second floor
        slot.innerHTML = "";
        await sleep(500);
        if ((window.__ssoApi.status().adDriftMs || 0) !== 0)
          throw new Error("a sub-second flicker was counted as an ad break");
      });

      /* Dragging the cue. The overlay is click-through apart from the cue
       * itself, which sits where people click to pause - so a press that does
       * not move must reach the player, and one that moves must not. */
      /* `buttons` matters and used to be omitted.
       *
       * A real pointermove during a drag reports the button still held; only
       * once it is released does it read zero. The overlay uses exactly that to
       * notice a drag whose release went missing - a player that stops
       * propagation on pointer events loses it routinely - so a helper that
       * never sets `buttons` describes a gesture no mouse performs, and would
       * make that guard look broken while the real bug it fixes went untested. */
      const dragCue = async (fromX, fromY, toX, toY) => {
        const cue = shadowOf().querySelector(".sso-cue");
        cue.setPointerCapture = () => {};
        cue.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cue.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        cue.dispatchEvent(ev("pointermove", toX, toY, 1));
        cue.dispatchEvent(ev("pointerup", toX, toY, 0));
        await sleep(120);
      };

      check("dragging the subtitle moves it", async () => {
        await showSpeakerCue();
        const before = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        await dragCue(before.left + 20, before.top + 8, 300, 260);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (Math.abs(after.top - before.top) < 40)
          throw new Error(`barely moved: ${Math.round(before.top)} -> ${Math.round(after.top)}`);
      });

      check("the dragged position is remembered in settings", () => {
        const s = window.__ssoApi.status().settings.tracks[0];
        if (!s.placed) throw new Error("placed flag not set");
        if (s.posY > 60) throw new Error(`posY still near the bottom: ${s.posY}`);
      });

      check("subtitle size follows the picture, not the window", async () => {
        /* Reported as the subtitles rendering bigger on entering fullscreen.
         * They were 2.6vh - a fraction of the *viewport* - so going fullscreen
         * resized the text for a reason that has nothing to do with the film.
         * A subtitle belongs to the picture, so it is the picture it is
         * measured against, and this holds it to that. */
        const cue = shadowOf().querySelector(".sso-cue");
        const ratio = () => {
          const size = parseFloat(getComputedStyle(cue).fontSize);
          return size / video.getBoundingClientRect().height;
        };
        await showSpeakerCue();
        const full = ratio();
        video.style.height = "300px";
        await sleep(200);
        const small = ratio();
        video.style.height = "";
        await sleep(200);

        if (Math.abs(small - full) / full > 0.05) {
          throw new Error(
            `text was ${full.toFixed(4)} of the picture at full size and ` +
            `${small.toFixed(4)} at 300px - it is tracking the window`);
        }
      });

      check("a lost release does not leave the subtitle following the pointer", async () => {
        /* Reported as "I don't even drag, I just hover over the subtitle and it
         * jumps somewhere else".
         *
         * A press captures the pointer, so while the capture is held every
         * pointer event in the page retargets to the cue box - which is what
         * makes dragging work at all. Lose the release and that never ends, so
         * the next movement anywhere teleports the subtitle to it. Players do
         * lose it: they call stopPropagation on pointer events inside the
         * player surface.
         */
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = () => shadowOf().querySelector(".sso-cue");
        cue().setPointerCapture = () => {};
        cue().releasePointerCapture = () => {};
        const box = cue().getBoundingClientRect();

        // Press and move, then let go without the cue box ever hearing about it.
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 11, clientX: x, clientY: y, buttons, button: 0, bubbles: true });
        cue().dispatchEvent(ev("pointerdown", box.left + 30, box.top + 8, 1));
        cue().dispatchEvent(ev("pointermove", 320, 300, 1));
        await sleep(80);
        const afterDrag = window.__ssoApi.status().settings.tracks[0];

        // Now merely hover, with nothing pressed.
        cue().dispatchEvent(ev("pointermove", 700, 120, 0));
        await sleep(80);
        cue().dispatchEvent(ev("pointermove", 250, 500, 0));
        await sleep(120);
        const afterHover = window.__ssoApi.status().settings.tracks[0];

        if (afterHover.posX !== afterDrag.posX || afterHover.posY !== afterDrag.posY) {
          throw new Error(
            `hovering moved it from ${afterDrag.posX},${afterDrag.posY}` +
            ` to ${afterHover.posX},${afterHover.posY}`);
        }
      });

      /* The two tests above pass whether or not the box keeps hold of the point
       * you grabbed, because they only ask that it moved a lot. These ask that
       * it moved the RIGHT amount, which is the whole complaint: the anchor is
       * the box's bottom edge, so writing the pointer straight into it threw
       * away where inside the box the press had landed. */
      const grabAndDrag = async (grabDX, grabDY, byX, byY) => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        const cue = shadowOf().querySelector(".sso-cue");
        const before = cue.getBoundingClientRect();
        const fromX = before.left + grabDX;
        const fromY = before.top + grabDY;
        // Several moves, as a real pointer sends - one big jump would hide an
        // error that accumulates per move.
        const cueEl = shadowOf().querySelector(".sso-cue");
        cueEl.setPointerCapture = () => {};
        cueEl.releasePointerCapture = () => {};
        const ev = (type, x, y, buttons) => new PointerEvent(type,
          { pointerId: 7, clientX: x, clientY: y, button: 0, buttons, bubbles: true });
        cueEl.dispatchEvent(ev("pointerdown", fromX, fromY, 1));
        for (let step = 1; step <= 4; step++) {
          cueEl.dispatchEvent(ev("pointermove", fromX + (byX * step) / 4, fromY + (byY * step) / 4, 1));
        }
        cueEl.dispatchEvent(ev("pointerup", fromX + byX, fromY + byY, 0));
        await sleep(120);
        const after = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        return { movedX: after.left - before.left, movedY: after.top - before.top };
      };

      check("the box moves exactly as far as the pointer, not further", async () => {
        await showSpeakerCue();
        // Grabbed near the TOP of the box, which is where the old bug was worst:
        // the bottom anchor jumped to the pointer and the box gained its own
        // height on the way.
        const { movedX, movedY } = await grabAndDrag(24, 4, -70, -120);
        if (Math.abs(movedX - -70) > 3 || Math.abs(movedY - -120) > 3) {
          throw new Error(`dragged by -70,-120 but the box moved ${Math.round(movedX)},${Math.round(movedY)}`);
        }
      });

      check("a small drag downwards moves it downwards", async () => {
        await showSpeakerCue();
        // The "once I move it up I cannot bring it down" report: a nudge down
        // shorter than the box's own height used to move it UP.
        const { movedY } = await grabAndDrag(24, 4, 0, 18);
        if (movedY < 12) throw new Error(`nudged down 18px, box moved ${Math.round(movedY)}`);
      });

      check("the subtitle cannot be dragged off screen", async () => {
        await dragCue(300, 260, -800, -800);
        const box = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (box.left < -1 || box.top < -1)
          throw new Error(`escaped the viewport at ${Math.round(box.left)},${Math.round(box.top)}`);
      });

      check("a click on the subtitle still reaches the player", async () => {
        window.__ssoApi.resetPosition();
        await sleep(120);

        const count = () => reached++;
        player.addEventListener("click", count);
        const cue = shadowOf().querySelector(".sso-cue");
        const box = cue.getBoundingClientRect();
        // Press and release without moving: that is a click, not a drag.
        await dragCue(box.left + 10, box.top + 6, box.left + 10, box.top + 6);
        player.removeEventListener("click", count);
        if (reached === 0) throw new Error("the click was swallowed by the subtitle");
      });

      check("reset puts the subtitle back at the bottom centre", async () => {
        window.__ssoApi.resetPosition();
        await sleep(120);
        const s = window.__ssoApi.status().settings.tracks[0];
        if (s.posX !== 50 || s.posY !== 92 || s.placed)
          throw new Error(`reset left it at ${s.posX},${s.posY} placed=${s.placed}`);
      });

      check("placement mode gives something to drag between lines", async () => {
        // Park the playhead past the last cue, where nothing is rendered.
        // (Cue 1 covers 0-600s and cue 2 covers 600-900s, so 500 is not a gap.)
        video.currentTime = 950;
        await sleep(150);
        const empty = shadowOf().querySelector(".sso-cue").getBoundingClientRect();
        if (empty.width > 1) throw new Error("expected no cue in the gap");

        await sleep(150);

        if (standIn.width < 40 || standIn.height < 10)
          throw new Error("no stand-in to grab in placement mode");

        window.__ssoApi.setPlacing(false);
        await sleep(150);
        if (shadowOf().querySelector(".sso-cue").getBoundingClientRect().width > 1)
          throw new Error("stand-in outlived placement mode");
      });

      /* How wide the subtitle is allowed to get, and who decides where a line
       * breaks. The file wraps its own lines for a 4:3 television; obeying
       * that made the box hug the longest line in the file, so a cue used a
       * fraction of the screen and arrived a line longer than it needed. */
      const showLongCue = async () => { video.currentTime = 1300; await sleep(140); };
      const showTurnCue = async () => { video.currentTime = 1600; await sleep(140); };
      const cueBox = () => shadowOf().querySelector(".sso-cue").getBoundingClientRect();

      check("a line break made for a 4:3 television does not survive", async () => {
        window.__ssoApi.updateSettings({ rewrap: true });
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await showLongCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        if (text.includes("\n"))
          throw new Error("the file's own break was still deciding the width");
      });

      check("a turn between two speakers keeps its line break", async () => {
        await showTurnCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        if (!text.includes("\n"))
          throw new Error("two speakers were joined onto one line");
      });

      check("the file's breaks come back when rewrapping is turned off", async () => {
        window.__ssoApi.updateSettings({ rewrap: false });
        await showLongCue();
        const text = shadowOf().querySelector(".sso-cue").textContent;
        window.__ssoApi.updateSettings({ rewrap: true });
        if (!text.includes("\n")) throw new Error("break lost with rewrap off");
      });

      check("the box may use the whole width it is given", async () => {
        /* The limit is derived from what the line actually needs rather than
         * picked as a percentage. A fixed 60% only forces a wrap while the
         * window is narrow enough for this sentence to overflow it - at 1440px
         * it no longer did, the box correctly hugged its one line, and the test
         * failed for a reason that had nothing to do with what it checks. */
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 100 });
        await showLongCue();
        const natural = cueBox().width;

        const percent = Math.round(((natural * 0.7) / window.innerWidth) * 100);
        window.__ssoApi.updateTrackSettings(0, { widthPercent: percent });
        await sleep(140);

        const allowed = window.innerWidth * (percent / 100);
        const box = cueBox();
        // It used to be held to 92% of the width it had just asked for, so a
        // long line could never reach its limit and wrapped a line early.
        if (box.width < allowed - 2)
          throw new Error(`used ${Math.round(box.width)}px of the ${Math.round(allowed)}px allowed`);
        if (box.width > allowed + 2)
          throw new Error(`overflowed its limit: ${Math.round(box.width)}px`);
      });

      check("narrowing the width pushes the line onto more rows", async () => {
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await showLongCue();
        const wide = cueBox();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 30 });
        await sleep(140);
        const narrow = cueBox();
        if (narrow.width >= wide.width)
          throw new Error(`30% was not narrower than 90%: ${Math.round(narrow.width)} vs ${Math.round(wide.width)}`);
        if (narrow.height <= wide.height)
          throw new Error("the text did not rewrap onto more rows");
      });

      /* Placing the box against an edge while a short line is showing, then
       * letting a long one arrive. The drag can only measure the line in front
       * of it; the limit has to hold for the widest the box may get. */
      check("a long line stays on screen after placing against the edge", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateSettings({ rewrap: true });
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
        await showSpeakerCue();
        const short = cueBox();
        await dragCue(short.left + short.width / 2, short.top + 6, 4, short.top + 6);
        await showLongCue();
        const long = cueBox();
        if (long.left < -1 || long.right > window.innerWidth + 1)
          throw new Error(
            `long line spans ${Math.round(long.left)}..${Math.round(long.right)} in a ${window.innerWidth}px viewport`);
      });

      check("widening the box cannot push it off the screen", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 30 });
        await showLongCue();
        const box = cueBox();
        await dragCue(box.left + box.width / 2, box.top + 6, 4, box.top + 6);
        // Legal at 30% wide; the box is now told to be much wider.
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 90 });
        await sleep(160);
        const after = cueBox();
        if (after.left < -1)
          throw new Error(`widening pushed it ${Math.round(-after.left)}px off the left edge`);
      });

      check("dragging an edge resizes the subtitle", async () => {
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
        await showLongCue();
        const box = cueBox();
        const centre = window.innerWidth / 2;
        // Take hold of the right edge and pull it in to a quarter-width from
        // the centre, which is a half-width box.
        await dragCue(box.right - 4, box.top + 8, centre + window.innerWidth * 0.25, box.top + 8);
        const width = window.__ssoApi.status().settings.tracks[0].widthPercent;
        if (Math.abs(width - 50) > 3)
          throw new Error(`expected about 50%, got ${width}%`);
      });

      check("dragging the middle still moves rather than resizes", async () => {
        const before = window.__ssoApi.status().settings.tracks[0].widthPercent;
        const box = cueBox();
        await dragCue(box.left + box.width / 2, box.top + 8, 320, 240);
        const after = window.__ssoApi.status().settings.tracks[0];
        if (after.widthPercent !== before)
          throw new Error(`the width changed while moving: ${before}% -> ${after.widthPercent}%`);
        if (!after.placed) throw new Error("the drag did not move it");
        window.__ssoApi.resetPosition();
        window.__ssoApi.updateTrackSettings(0, { widthPercent: 80 });
      });

      check("panel opens beside the handle that opens it, not across the screen", () => {
        const handle = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        const panel = panelShadow().host.getBoundingClientRect();
        const sameSide = Math.abs(handle.right - panel.right) < 8;
        if (!sameSide)
          throw new Error(
            `handle right edge at ${Math.round(handle.right)}, panel right edge at ${Math.round(panel.right)}`);
        if (panel.top < handle.bottom)
          throw new Error("panel overlaps the handle instead of hanging below it");
      });

      /* Dragging the panel on a page that has moved the coordinate system.
       *
       * `position: fixed` stops being relative to the viewport as soon as an
       * ancestor has a transform, and streaming pages do that routinely. A
       * translated ancestor puts the panel somewhere else; a *scaled* one makes
       * it drift out from under the pointer as you drag, which is what "it
       * doesn't move at the same speed as the mouse" is.
       *
       * Both are checked, because they are one mapping with two failure shapes
       * and a fix for the first alone leaves the second exactly as it was.
       */
      const dragPanelTo = async (targetX, targetY) => {
        const host = panelShadow().host;
        const head = panelShadow().querySelector(".sso-win__head");
        // A synthetic PointerEvent has no live pointer behind it, so the real
        // capture calls throw. Same stub the cue drag uses.
        head.setPointerCapture = () => {};
        head.releasePointerCapture = () => {};
        const before = host.getBoundingClientRect();
        const startX = before.left + 60;
        const startY = before.top + 10;
        const send = (type, x, y, buttons) =>
          head.dispatchEvent(new PointerEvent(type,
            { bubbles: true, composed: true, pointerId: 7, clientX: x, clientY: y, buttons }));
        send("pointerdown", startX, startY, 1);
        await sleep(20);
        send("pointermove", targetX, targetY, 1);
        await sleep(40);
        send("pointerup", targetX, targetY, 0);
        const after = host.getBoundingClientRect();
        // The point that was grabbed should still be under the pointer.
        return {
          driftX: after.left - (targetX - (startX - before.left)),
          driftY: after.top - (targetY - (startY - before.top)),
        };
      };

      /* Both of these move the panel and must put it back. Later cases press
       * the middle of the screen expecting to reach the player, and a panel
       * left where it was dragged is over that point - which cost a run and
       * presented as study mode eating a click it never saw. */
      const parkPanel = () => {
        panelShadow()
          .querySelector(".sso-win__head")
          .dispatchEvent(new MouseEvent("dblclick", { bubbles: true, composed: true }));
      };

      check("the panel follows the pointer inside a translated container", async () => {
        document.body.style.transform = "translate(40px, 25px)";
        try {
          const { driftX, driftY } = await dragPanelTo(430, 300);
          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)
            throw new Error(`drifted ${Math.round(driftX)},${Math.round(driftY)}px from the pointer`);
        } finally {
          document.body.style.transform = "";
          parkPanel();
        }
      });

      check("the panel follows the pointer inside a scaled container", async () => {
        // The reported symptom: it moves, but not at the pointer's speed.
        document.body.style.transform = "scale(0.8)";
        try {
          const { driftX, driftY } = await dragPanelTo(380, 260);
          if (Math.abs(driftX) > 2 || Math.abs(driftY) > 2)
            throw new Error(`drifted ${Math.round(driftX)},${Math.round(driftY)}px from the pointer`);
        } finally {
          document.body.style.transform = "";
          parkPanel();
        }
      });

      check("double-clicking the title bar parks the panel back in the corner", async () => {
        await dragPanelTo(500, 420);
        parkPanel();
        await sleep(60);
        const panel = panelShadow().host.getBoundingClientRect();
        const handle = shadowOf().querySelector(".sso-handle").getBoundingClientRect();
        if (Math.abs(handle.right - panel.right) > 8)
          throw new Error(
            `parked at ${Math.round(panel.right)}, handle is at ${Math.round(handle.right)}`);
      });

      /* --- the redesign's load-bearing geometry --------------------------------
       *
       * Every one of these was a defect a screenshot caught after the tests were
       * green, which is the argument for their existing: the assertions below
       * are the numbers those screenshots were read for, so the next change to
       * either stylesheet has to answer to them rather than to somebody
       * remembering to look.
       */

      check("a folded subtitle card takes its controls with it", async () => {
        const cards = [...panelShadow().querySelectorAll(".sso-track")].filter((c) => !c.hidden);
        if (!cards.length) throw new Error("nothing attached to fold");
        const card = cards[0];
        const body = card.querySelector(".sso-track__body");
        const caret = card.querySelector(".sso-track__caret");
        if (card.dataset.open !== "true") caret.click();
        await sleep(40);
        const open = body.getBoundingClientRect().height;
        if (open === 0) throw new Error("an open card has no controls in it");

        caret.click();
        await sleep(40);
        /* The caret said folded while every control stayed on screen: the head
         * had a rule for the folded state and the body had none. */
        if (body.getBoundingClientRect().height !== 0)
          throw new Error(`folded, and ${Math.round(body.getBoundingClientRect().height)}px of controls stayed`);
        if (card.querySelector(".sso-track__shut").hidden)
          throw new Error("folded to a title bar that does not say how it is timed");

        caret.click();
        await sleep(40);
        if (body.getBoundingClientRect().height === 0) throw new Error("it would not unfold");
      });

      check("the panel can be made bigger than its contents need", async () => {
        /* Reported: "I cannot enlarge the panel if the content is already
         * fitting". The height was applied as a max-height, which can only ever
         * make a box shorter than its contents - so a corner dragged downwards
         * on a panel that already fitted stored a number and moved nothing. */
        const host = panelShadow().host;
        const wasWidth = host.getBoundingClientRect().width;
        const body = panelShadow().querySelector(".sso-panel__body");

        // Small enough that the contents certainly fit inside it.
        window.__ssoPanel.applySize(wasWidth, 200);
        await sleep(120);
        const small = body.getBoundingClientRect().height;

        window.__ssoPanel.applySize(wasWidth, 460);
        await sleep(150);
        const big = body.getBoundingClientRect().height;
        if (big <= small + 50)
          throw new Error(`asked for 460px and the body went ${Math.round(small)} -> ${Math.round(big)}`);

        // And it still cannot grow past the room under it.
        window.__ssoPanel.applySize(wasWidth, 5000);
        await sleep(150);
        const panel = host.getBoundingClientRect();
        if (panel.bottom > window.innerHeight)
          throw new Error(`it grew past the bottom of the window: ${Math.round(panel.bottom)}`);

        window.__ssoPanel.applySize(wasWidth, 420);
        await sleep(120);
      });

      check("the sync row fits on one line at every width the panel allows", async () => {
        /* Replaces an assertion that the offset field was under 80px wide -
         * a proxy for this, from when the row overflowed and pushed Reset out
         * of the panel. This measures the thing itself, at both ends of the
         * range the corner grips allow. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        if (card.dataset.open !== "true") card.querySelector(".sso-track__caret").click();
        await sleep(40);
        const row = card.querySelector(".sso-sync");
        const host = panelShadow().host;
        const was = host.getBoundingClientRect().width;

        for (const width of [280, 340, 640]) {
          window.__ssoPanel.applySize(width);
          await sleep(60);
          if (row.scrollWidth > row.clientWidth + 1)
            throw new Error(
              `at ${width}px the row needs ${row.scrollWidth} and has ${row.clientWidth}`);
          const nudges = row.querySelectorAll(".sso-nudge");
          if (nudges.length !== 4) throw new Error(`${nudges.length} nudge buttons, want 4`);
          for (const b of nudges) {
            const box = b.getBoundingClientRect();
            // 24px is the smallest comfortable pointer target.
            if (box.width < 24 || box.height < 24)
              throw new Error(
                `at ${width}px a nudge button is ${Math.round(box.width)}×${Math.round(box.height)}`);
          }
          /* The words stay, at every width the grips allow. The row costs 232px
           * against 236px usable at the 280px minimum, so there is no width at
           * which hiding the only part of this row that says what it does buys
           * anything. Measured, after an earlier version hid them below 320. */
          // The fine steps carry an empty span by design; the whole steps are
          // the ones that must still read as words.
          const said = [...row.querySelectorAll(".sso-nudge__word")].filter((n) => n.textContent);
          if (said.length !== 2) throw new Error(`${said.length} words on the row, want 2`);
          for (const word of said) {
            if (word.getBoundingClientRect().width === 0)
              throw new Error(`at ${width}px the buttons lost their words`);
          }
          // And the reading is still readable, not squeezed to nothing by the
          // group that takes the slack.
          const field = row.querySelector(".sso-sync__field");
          if (field.getBoundingClientRect().width < 50)
            throw new Error(
              `at ${width}px the reading is ${Math.round(field.getBoundingClientRect().width)}px`);
        }

        window.__ssoPanel.applySize(was);
        await sleep(60);
      });

      check("the nudge buttons say what is wrong, not which way to push", async () => {
        /* An arrow re-introduces exactly the question the words remove: film
         * time is stream time minus the offset, so a larger offset shows the
         * line later, and nobody should have to derive that mid-film. The
         * chevron is a magnitude and never stands alone. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const words = [...card.querySelectorAll(".sso-nudge__word")]
          .map((n) => n.textContent).filter(Boolean);
        // One word per side, on the whole step. Both buttons on a side carrying
        // it reads as a repeat rather than as two sizes of one thing.
        if (words.join(",") !== "Early,Late")
          throw new Error(`the buttons read ${words.join(", ") || "nothing"}`);
        for (const b of card.querySelectorAll(".sso-nudge")) {
          if (!b.querySelector(".sso-nudge__step")) throw new Error("a nudge button has no step mark");
          // The full sentence stays reachable even where the word is hidden.
          if (!/spoken/.test(b.title)) throw new Error(`no plain-language title on "${b.textContent}"`);
        }
      });

      check("the menu of verbs opens inside the panel and closes on anything", async () => {
        /* It is a child of .sso-panel rather than a floating host, which only
         * works because the panel is `overflow: hidden auto` - so the thing to
         * assert is that it is actually reachable, not merely present. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const opener = card.querySelector(".sso-track__more");
        opener.click();
        await sleep(60);
        const open = menuShadow()?.querySelector(".sso-menu");
        if (!open) throw new Error("nothing opened");

        const menuBox = open.getBoundingClientRect();
        if (menuBox.width === 0 || menuBox.height === 0) throw new Error("the menu has no size");
        /* Fully on screen, and free to leave the panel.
         *
         * Reported: the menu was cut off at the panel's edge. It was a child of
         * the panel, which scrolls, so the panel's overflow clipped it - fine
         * for content and wrong for a menu. It has its own host now, and the
         * only thing it has to stay inside is the window. */
        if (menuBox.left < 0 || menuBox.top < 0 ||
            menuBox.right > window.innerWidth || menuBox.bottom > window.innerHeight)
          throw new Error(
            `off screen: menu at ${Math.round(menuBox.left)},${Math.round(menuBox.top)} ` +
            `${Math.round(menuBox.width)}×${Math.round(menuBox.height)} ` +
            `in a ${window.innerWidth}×${window.innerHeight} window`);
        // Nothing may clip it: every item is where the box says it is.
        const last = [...open.querySelectorAll(".sso-menu__item")].pop();
        if (last.getBoundingClientRect().bottom > menuBox.bottom + 1)
          throw new Error("the last item is outside the menu box");
        // Every item must be a real target, not a 2px sliver behind an edge.
        for (const item of open.querySelectorAll(".sso-menu__item")) {
          const box = item.getBoundingClientRect();
          if (box.height < 24) throw new Error(`a menu item is ${Math.round(box.height)}px tall`);
        }

        // Escape closes it, and one press of the opener does not leave two.
        open.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
        if (menuShadow()?.querySelector(".sso-menu")) throw new Error("Escape did not close it");
        opener.click();
        await sleep(40);
        opener.click();
        await sleep(40);
        if ([...document.querySelectorAll("div")].filter((d) => d.shadowRoot?.querySelector(".sso-menu")).length > 1)
          throw new Error("two menus at once");
        /* And it survives the panel scrolling under it.
         *
         * The menu is a child of the scrolling container, so it travels with
         * the row it is anchored to. A scroll dismissal closed menus by itself:
         * re-fitting the panel to the viewport emits a scroll no reader caused,
         * and because the listener was registered `{ once: true }` and never
         * removed, it was the *previous* menu's handler that closed the next
         * one. Consistently the second menu of a session, which is exactly the
         * shape of bug that survives a manual check. */
        panelShadow().querySelector(".sso-panel").dispatchEvent(new Event("scroll"));
        await sleep(60);
        if (!menuShadow()?.querySelector(".sso-menu"))
          throw new Error("a scroll closed the menu");

        menuShadow()?.querySelector(".sso-menu")
          ?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
        // A third opening, after two dismissals, still works.
        opener.click();
        await sleep(60);
        if (!menuShadow()?.querySelector(".sso-menu"))
          throw new Error("a menu dismissed twice cannot be opened a third time");
        menuShadow()?.querySelector(".sso-menu")
          .dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(40);
      });

      check("hiding a subtitle says so on its card", async () => {
        /* Hide moved into the menu, so the control that used to carry this
         * state is not on screen. A subtitle gone from the picture with nothing
         * saying why reads as a fault rather than as something you did. */
        /* A button on the card, not a menu item. Taking a subtitle off the
         * picture for ten seconds because it covers something worth seeing is
         * one of the two things done mid-scene, and two clicks deep is where
         * the menu started feeling like a filing cabinet. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        const eye = card.querySelector(".sso-track__eye");
        if (!eye) throw new Error("no way to hide it");
        const box = eye.getBoundingClientRect();
        if (box.width < 22 || box.height < 22)
          throw new Error(`the hide button is ${Math.round(box.width)}×${Math.round(box.height)}`);

        eye.click();
        await sleep(120);
        if (card.dataset.hidden !== "true") throw new Error("the card does not say it is hidden");
        if (window.__ssoApi.status().tracks[0].visible)
          throw new Error("the subtitle is still on the picture");
        if (eye.dataset.on !== "false") throw new Error("the button does not say what it did");

        eye.click();
        await sleep(120);
        if (card.dataset.hidden !== "false") throw new Error("it would not come back");
      });

      check("undoing the timing is next to the timing", async () => {
        /* It was a menu item: open the menu, find it, click it - three actions
         * for the thing readers do most after over-shooting a nudge. */
        const card = [...panelShadow().querySelectorAll(".sso-track")].find((c) => !c.hidden);
        if (card.dataset.open !== "true") card.querySelector(".sso-track__caret").click();

        const root = window.__ssoApi.overlayRoots()[0];

      /* --- lining two subtitles up ---------------------------------------------
       *
       * Pure arithmetic on two lists of cue start times, so these need no video,
       * no attach and no timing. The cue lists are synthetic and deliberately
       * irregular: a regular grid self-correlates at every lag and would make
       * even unrelated files look like a perfect match.
       */
      const speech = (count, seed) => {
        // A cheap deterministic generator - gaps around 2.8s, log-normal-ish,
        // which is what real dialogue looks like.
        let x = seed;
        const next = () => (x = (x * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
        const out = [];
        let t = 30000;
        for (let i = 0; i < count; i++) {
          t += 600 + Math.round(4200 * next() * next() * 3);
          out.push(t);
        }
        return out;
      };

      check("two subtitles for the same film are lined up exactly", async () => {
        const align = window.__ssoAlign;
        if (!align) throw new Error("the aligner did not load");
        const a = speech(900, 7);
        for (const gap of [0, 4400, -12800, 42000, -120000]) {
          const answer = align.align(a, a.map((t) => t + gap));
          if (!answer.ok) throw new Error(`refused a ${gap}ms shift (conf ${answer.confidence})`);
          if (answer.shiftMs !== gap)
            throw new Error(`said ${answer.shiftMs} for a ${gap}ms shift`);
          if (answer.rate !== 1) throw new Error(`invented a rate of ${answer.rate}`);
        }
      });

         * drifts by minutes. The rate is picked from a closed set rather than
         * fitted: a free fit needs a constant-offset peak to seed it, and a 4%
         * stretch is exactly what destroys that peak. */
        const align = window.__ssoAlign;
        const a = speech(1100, 11);
        for (const rate of align.RATES) {
          if (rate === 1) continue;
          const answer = align.align(a, a.map((t) => Math.round(t * rate)));
          if (!answer.ok) throw new Error(`refused a ${rate} stretch`);
          if (Math.abs(answer.rate - rate) > 1e-9)
