<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Options preview</title>
  </head>
  <body>
    <!-- Renders the settings page against a stubbed service worker, so the
         layout can be checked without loading the extension into Chrome.
         Not a test - there is nothing asserted here; tests/options.html is the
         one that asserts. It exists because a table that renders wrong is not
         something a passing test would notice.

         The list is long on purpose. It held three rows, which is the one
         length at which an unbounded table looks fine, and the report that
         followed was "after using the extension for a while, the list of
         loaded subtitles becomes huge". -->
    <script>
      const FILMS = [
        ["Crime 101", "Crime.101.2025.1080p.AMZN.WEB-DL.DDP5.1.H.264-FLUX", "en", ["extension", "daemon"]],
        ["Battlestar Galactica: The Miniseries",
          "Battlestar.Galactica.Miniseries.S00E01.2003.1080p.BluRay", "tr", ["extension"]],
        ["Mercy", "Mercy.2026.720p", "en", ["daemon"]],
        ["The Americans", "The.Americans.2013.S04E03.1080p.WEB-DL.DD5.1.H.264-NTb", "en", ["extension", "daemon"]],
      ];
      // The count this machine's daemon cache actually holds.
      const entries = Array.from({ length: 273 }, (_, i) => {
        const [movie, release, language, held] = FILMS[i % FILMS.length];
        return {
          file_id: 1000 + i,
          movie_name: i < FILMS.length ? movie : `${movie} ${i}`,
          release, language, held_by: held,
          cached_at: Date.now() / 1000 - 3600 * (i + 1),
          bytes: 40000 + i * 97,
        };
      });

      window.chrome = {
        storage: { local: { get: async () => ({ "sso:provider": { apiKey: "abc", languages: ["en", "tr"] } }) } },
        runtime: {
          sendMessage: async ({ op }) => {
            if (op === "health") {
              return { served_by: "extension", has_api_key: true, daemon_running: false };
            }
            if (op === "cacheList") {
              return { entries, daemon_running: true, pending_deletions: 1 };
            }
            return {};
          },
        },
      };
    </script>
    <div id="mount"></div>
    <script>
      fetch("../src/options.html")
        .then((response) => response.text())
        .then((html) => {
          const parsed = new DOMParser().parseFromString(html, "text/html");
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "../src/options.css";
          document.head.append(link);
          document.body.replaceChildren(...parsed.body.children);
          const script = document.createElement("script");
          script.type = "module";
          script.src = "../src/options.js";
          document.body.append(script);
        });
    </script>
  </body>
</html>
