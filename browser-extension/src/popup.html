<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Overlay</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Subtitle Overlay</h1>
      <span id="daemon-state" class="pill pill--muted">checking…</span>
    </header>

    <!-- Replaces the body when the daemon is unreachable or unconfigured;
         nothing below it would work until that is fixed. -->
    <section id="blocker" class="blocker" hidden>
      <p id="blocker-message"></p>
      <pre id="blocker-hint" class="hint"></pre>
    </section>

    <main id="main">
      <p id="page-state" class="note">Checking this tab…</p>
      <p id="attached" class="note note--strong" hidden></p>

      <div class="actions">
        <button id="find" class="button button--primary">Find subtitles</button>
        <button id="panel" class="button">Control panel</button>
      </div>
      <div class="actions">
        <button id="toggle" class="button button--wide" hidden>Hide subtitles</button>
      </div>

      <p class="note note--dim">
        The control panel opens over the video, so it still works in fullscreen —
        that is where searching, timing and appearance live.
      </p>
    </main>

    <footer class="footer">
      <div id="shortcuts" class="shortcuts"></div>
      <button id="edit-shortcuts" class="linkish">Change shortcuts</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
