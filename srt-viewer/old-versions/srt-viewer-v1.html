
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SRT Side‑by‑Side Viewer</title>
<style>
  :root { --bg:#0b0f14; --fg:#e6edf3; --muted:#9aa4ad; --hl:#2b90d9; --row:#121822; --row2:#0f141c; --acc:#2ea043; }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;}
  .wrap{max-width:1200px;margin:0 auto;padding:16px;}
  h1{font-size:18px;margin:0 0 10px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .bar input[type="file"]{background:#111a24;border:1px solid #1f2937;border-radius:10px;padding:6px;color:var(--muted)}
  .btn{background:#1f2937;border:1px solid #2b3645;border-radius:10px;padding:8px 12px;color:#e6edf3;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-left:auto}
  table{width:100%;border-collapse:separate;border-spacing:0 6px}
  td{vertical-align:top;padding:10px 12px;background:var(--row);border:1px solid #1f2937}
  tr:nth-child(even) td{background:var(--row2)}
  td.left{border-right:none;border-radius:10px 0 0 10px}
  td.right{border-left:none;border-radius:0 10px 10px 0}
  .time{color:var(--muted);font-size:12px;margin-bottom:4px}
  .line{white-space:pre-wrap}
  tr.hover td{outline:2px solid var(--hl);z-index:1;position:relative}
  .empty{color:#6b7280;font-style:italic}
  .topbar{display:flex;gap:8px;align-items:center;margin:6px 0 14px}
  .search{flex:1;min-width:200px;background:#111a24;border:1px solid #1f2937;border-radius:10px;padding:8px;color:#e6edf3}
  .chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .badge{display:inline-block;background:#102b16;color:#9ae6b4;border:1px solid #1d4d2d;border-radius:999px;padding:2px 8px;font-size:12px;margin-left:8px}
  footer{color:var(--muted);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>SRT Side‑by‑Side Viewer <span class="badge">offline</span></h1>
  <div class="bar">
    <label>Left (e.g., English) <input id="left" type="file" accept=".srt,.vtt,text/plain"></label>
    <label>Right (e.g., Turkish) <input id="right" type="file" accept=".srt,.vtt,text/plain"></label>
    <button id="load" class="btn" disabled>Load</button>
    <span class="hint">Hover a row to cross‑highlight. Works fully offline.</span>
  </div>
  <div class="topbar">
    <input id="q" class="search" type="search" placeholder="Filter rows (regex ok)…">
    <label class="chk"><input id="hideEmpty" type="checkbox" checked> hide rows with an empty side</label>
  </div>
  <table id="tbl" aria-label="Aligned subtitles"><tbody></tbody></table>
  <footer>Tip: For popup dictionary/definitions, use a browser lookup extension (e.g., Yomitan). This page doesn’t send data anywhere.</footer>
</div>

<script>
function parseSRT(text){
  // Accepts SRT/VTT-ish. Returns array of {start,end,text}
  const s = [];
  const norm = text.replace(/\r/g,'').trim();
  const blocks = norm.split(/\n\s*\n/);
  for(const b of blocks){
    const lines = b.split('\n').filter(x=>x.trim().length>0);
    if(lines.length === 0) continue;
    // Drop index line if first is purely a number
    let i = 0;
    if(/^\d+$/.test(lines[0].trim())) i = 1;
    // Time line could be at i
    const m = (lines[i]||'').match(/(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?/);
    if(!m){ continue; }
    const toMs = (h,mn,s,ms)=> (parseInt(h)*3600+parseInt(mn)*60+parseInt(s))*1000 + parseInt((ms||'0').padEnd(3,'0'));
    const start = toMs(m[1],m[2],m[3],m[4]);
    const end   = toMs(m[5],m[6],m[7],m[8]);
    const textLines = lines.slice(i+1);
    const textBody = textLines.join('\n').replace(/\{\\an\d\}/g,'').replace(/<\/?[^>]+>/g, (t)=> t.match(/<br\s*\/?>/i)?'\n':'');
    s.push({start,end,text:textBody});
  }
  return s.sort((a,b)=>a.start-b.start);
}

function align(left,right){
  // Two-pointer merge by overlap
  const rows = [];
  let i=0,j=0;
  const overlap = (a,b)=> a && b && a.end>=b.start && b.end>=a.start;
  while(i<left.length || j<right.length){
    const L = left[i] || null;
    const R = right[j] || null;
    if(L && R && overlap(L,R)){
      rows.push({L,R}); i += (L.end<=R.end?1:0); j += (R.end<L.end?1:0);
    } else if(L && (!R || L.start < R.start)){
      rows.push({L,R:null}); i++;
    } else if(R){
      rows.push({L:null,R}); j++;
    } else break;
  }
  return rows;
}

function fmt(ms){
  const z=n=>String(n).padStart(2,'0');
  const h=Math.floor(ms/3600000);
  const m=Math.floor((ms%3600000)/60000);
  const s=Math.floor((ms%60000)/1000);
  return `${z(h)}:${z(m)}:${z(s)}`;
}

const $ = sel => document.querySelector(sel);
const tbl = $('#tbl tbody');
const leftInput = $('#left'), rightInput = $('#right'), btn = $('#load'), q = $('#q'), hideEmpty = $('#hideEmpty');
let DATA = [];

function render(){
  const rx = q.value ? new RegExp(q.value,'i') : null;
  tbl.innerHTML='';
  DATA.forEach((row,idx)=>{
    const ltxt = row.L?row.L.text:'';
    const rtxt = row.R?row.R.text:'';
    if(hideEmpty.checked && (!ltxt || !rtxt)) return;
    if(rx && !(rx.test(ltxt)||rx.test(rtxt))) return;

    const tr=document.createElement('tr');
    tr.dataset.idx=idx;
    tr.onmouseenter=()=>tr.classList.add('hover');
    tr.onmouseleave=()=>tr.classList.remove('hover');

    const tdL=document.createElement('td'); tdL.className='left';
    const tdR=document.createElement('td'); tdR.className='right';
    tdL.innerHTML = `<div class="time">${row.L?`${fmt(row.L.start)}–${fmt(row.L.end)}`:'—'}</div><div class="line ${row.L?'':'empty'}">${row.L?escapeHtml(ltxt):'(empty)'}</div>`;
    tdR.innerHTML = `<div class="time">${row.R?`${fmt(row.R.start)}–${fmt(row.R.end)}`:'—'}</div><div class="line ${row.R?'':'empty'}">${row.R?escapeHtml(rtxt):'(empty)'}</div>`;
    tr.appendChild(tdL); tr.appendChild(tdR);
    tbl.appendChild(tr);
  });
}

function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

function fileToText(f){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(String(e.target.result)); r.onerror=rej; r.readAsText(f); });
}

[leftInput,rightInput].forEach(inp => inp.addEventListener('change', ()=>{
  btn.disabled = !(leftInput.files.length && rightInput.files.length);
}));

btn.addEventListener('click', async ()=>{
  const [ltxt, rtxt] = await Promise.all([fileToText(leftInput.files[0]), fileToText(rightInput.files[0])]);
  const left = parseSRT(ltxt), right = parseSRT(rtxt);
  DATA = align(left,right);
  render();
});

[q,hideEmpty].forEach(el=>el.addEventListener('input', render));
</script>
</body>
</html>
