<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SRT Study Tool — Side-by-Side • Translate • Lookup • Chat • Play</title>
    <style>
        :root{
            --bg:#0b0f14; --fg:#e6edf3; --muted:#9aa4ad; --hl:#2b90d9;
            --row:#111827; --row2:#0f172a; --border:#1f2937; --ok:#2ea043; --bad:#ef4444;
        }
        html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
        .wrap{max-width:1250px;margin:0 auto;padding:16px}
        h1{font-size:18px;margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .badge{background:#102b16;color:#9ae6b4;border:1px solid #1d4d2d;border-radius:999px;padding:2px 8px;font-size:12px}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .in{background:#0f1620;border:1px solid var(--border);border-radius:10px;padding:8px;color:var(--fg)}
        .btn{background:#1f2937;border:1px solid #2b3645;border-radius:10px;padding:8px 12px;color:#e6edf3;cursor:pointer}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .hint{color:var(--muted);font-size:12px}
        details.box{border:1px solid var(--border);border-radius:12px;padding:10px;margin:10px 0;background:#0f1620}
        details.box summary{cursor:pointer;color:#cbd5e1;font-weight:600;margin:-10px -10px 8px -10px;padding:10px}
        .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
        .col-2{grid-column:span 2}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-12{grid-column:span 12}
        select,input[type="text"],input[type="password"],input[type="number"]{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:8px;color:#e6edf3}
        table{width:100%;border-collapse:separate;border-spacing:0 6px}
        td{vertical-align:top;padding:10px 12px;background:var(--row);border:1px solid var(--border)}
        tr:nth-child(even) td{background:var(--row2)}
        td.left{border-right:none;border-radius:10px 0 0 10px}
        td.right{border-left:none;border-radius:0 10px 10px 0}
        .time{color:var(--muted);font-size:12px;margin-bottom:4px}
        .line{white-space:pre-wrap;user-select:text}
        tr.hover td{outline:2px solid var(--hl);z-index:1;position:relative}
        .empty{color:#6b7280;font-style:italic}
        .ok{color:var(--ok)} .bad{color:var(--bad)}
        /* selection popup */
        .selpop{position:absolute;z-index:9999;background:#0f1620;border:1px solid var(--border);border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;min-width:280px;max-width:96vw}
        .selpop .row{margin-top:6px}
        .selpop .t{font-size:12px;color:#cbd5e1}
        .selpop .x{margin-left:auto;cursor:pointer;color:#9aa4ad}
        .links a{color:#9cc8ff;text-decoration:none;margin-right:8px;font-size:12px}
        .msg{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:8px;white-space:pre-wrap}
        /* chat drawer */
        .chat{position:fixed;right:16px;top:16px;width:430px;max-width:96vw;height:86vh;background:#0f1620;border:1px solid var(--border);border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,.45);display:none;flex-direction:column}
        .chat header{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
        .chat main{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
        .msg.user{border-color:#243b53}
        .msg.assistant{border-color:#1f3f2e}
        .chat footer{display:flex;flex-direction:column;gap:8px;padding:10px;border-top:1px solid var(--border)}
        textarea{background:#0b1220;border:1px solid var(--border);border-radius:10px;color:#e6edf3;padding:8px;min-height:80px}
        .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        /* player */
        .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .prog{flex:1;min-width:220px}
        input[type="range"]{width:260px}
        /* dictionary drawer */
        .drawer{position:fixed;left:16px;top:16px;width:460px;max-width:96vw;height:86vh;background:#0f1620;border:1px solid var(--border);border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,.45);display:none;flex-direction:column}
        .drawer header{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
        .drawer main{padding:10px;overflow:auto}
        .entry{border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:8px}
    </style>
</head>
<body>
<div class="wrap">
    <h1>SRT Study Tool <span class="badge">free-first • local-state • timeline-align</span>
        <span class="row" style="margin-left:auto">
      <button id="openDict" class="btn">Dictionary</button>
      <button id="openChat" class="btn">Chat</button>
    </span>
    </h1>

    <div class="row">
        <label class="in">Left (EN)<input id="left" type="file" accept=".srt,.vtt,text/plain" class="in"></label>
        <label class="in">Right (TR, optional)<input id="right" type="file" accept=".srt,.vtt,text/plain" class="in"></label>
        <button id="load" class="btn" disabled>Load</button>
        <span id="loadStatus" class="hint"></span>
    </div>

    <details class="box" open>
        <summary>Translate & Settings</summary>
        <div class="grid">
            <label class="col-3">Align mode
                <select id="alignMode" class="in">
                    <option value="timeline" selected>Timeline (no-miss, split/merge-safe)</option>
                    <option value="simple">Simple overlap</option>
                </select>
            </label>
            <label class="col-2">Tolerance (ms)
                <input id="tol" type="number" value="120" min="0" step="10" class="in">
            </label>
            <label class="col-3">Search
                <input id="q" type="text" class="in" placeholder="Regex or text">
            </label>
            <label class="col-2"><input id="hideEmpty" type="checkbox" checked> hide empty</label>
            <label class="col-2"><input id="persist" type="checkbox" checked> remember settings</label>

            <div class="col-12"><hr style="border:0;border-top:1px solid var(--border)"></div>

            <label class="col-3">Translate provider
                <select id="mtProvider" class="in">
                    <option value="mymemory" selected>MyMemory (free)</option>
                    <option value="libre">LibreTranslate</option>
                    <option value="openai">OpenAI (API)</option>
                    <option value="ollama">Ollama (local LLM)</option>
                </select>
            </label>
            <label class="col-3">Endpoint (auto for presets)
                <input id="mtEndpoint" class="in" placeholder="e.g., http://localhost:5000/translate">
            </label>
            <label class="col-3">API key (if needed)
                <input id="mtKey" type="password" class="in" placeholder="leave empty for MyMemory/libre public">
            </label>
            <label class="col-3">OpenAI/Ollama model
                <input id="mtModel" class="in" value="gpt-4o-mini">
            </label>
            <label class="col-2">Source
                <input id="src" class="in" value="en">
            </label>
            <label class="col-2">Target
                <input id="tgt" class="in" value="tr">
            </label>
            <label class="col-2">Batch
                <input id="batch" type="number" class="in" value="20" min="1" max="50">
            </label>
            <label class="col-5">Presets
                <select id="mtPresets" class="in">
                    <option value="">— choose —</option>
                    <option value="mymemory">MyMemory (free)</option>
                    <option value="libreLocal">LibreTranslate local http://localhost:5000/translate</option>
                    <option value="librePublic">LibreTranslate public https://libretranslate.com/translate</option>
                    <option value="openai">OpenAI https://api.openai.com/v1/chat/completions</option>
                    <option value="ollama">Ollama http://localhost:11434/api/chat</option>
                </select>
            </label>

            <div class="col-12 row">
                <button id="translateAll" class="btn">Auto-translate left → right</button>
                <progress id="prog" max="1" value="0" style="width:260px;height:10px"></progress>
                <span id="status" class="hint"></span>
                <button id="exportRight" class="btn" disabled>Export TR .srt</button>
            </div>
        </div>
    </details>

    <details class="box" open>
        <summary>Subtitle Player (time-synced highlighting)</summary>
        <div class="bar">
            <button id="playPause" class="btn" disabled>Play</button>
            <button id="stop" class="btn" disabled>Stop</button>
            <label>Speed <input id="speed" type="number" class="in" value="1.0" step="0.1" min="0.1" max="3"></label>
            <label>Offset ms <input id="offset" type="number" class="in" value="0" step="10"></label>
            <span class="hint" id="timeLabel">00:00:00.000</span>
        </div>
    </details>

    <table id="tbl"><tbody></tbody></table>
</div>

<!-- Selection popup -->
<div class="selpop" id="selPopup">
    <div class="row">
        <div class="t">Selection</div>
        <div class="x" id="closeSel">✕</div>
    </div>
    <div id="selText" class="msg" style="margin-top:6px"></div>
    <div class="row">
        <button id="selTranslate" class="btn">Translate selection</button>
        <button id="selDict" class="btn">EN dictionary</button>
        <button id="selAdd" class="btn">Add to dictionary</button>
    </div>
    <div class="links" style="margin-top:6px"></div>
    <div id="selResult" class="msg" style="display:none;margin-top:6px"></div>
</div>

<!-- Chat drawer -->
<div class="chat" id="chatBox">
    <header>
        <strong>Explain / Cultural Nuance Chat</strong>
        <span class="hint" id="chatHint"></span>
        <span class="row" style="margin-left:auto">
      <button id="closeChat" class="btn">Close</button>
    </span>
    </header>
    <main id="chatMain"></main>
    <footer>
        <label class="in" style="display:block">Selected / context (editable)
            <textarea id="chatContext" placeholder="Put the phrase or lines you want explained"></textarea>
        </label>
        <label class="in" style="display:block">Your question
            <textarea id="chatQuestion" placeholder="What does this idiom imply here? Any cultural nuance? Keep it concise."></textarea>
        </label>
        <div class="toolbar">
            <button id="chatAsk" class="btn">Ask in-app</button>
            <button id="chatCopy" class="btn">Copy prompt</button>
            <a id="chatOpenGPT" href="https://chat.openai.com/" target="_blank" class="btn">Open ChatGPT</a>
            <a id="chatOpenGemini" href="https://gemini.google.com/app" target="_blank" class="btn">Open Gemini</a>
        </div>
    </footer>
</div>

<!-- Dictionary drawer -->
<div class="drawer" id="dictBox">
    <header>
        <strong>Personal Dictionary</strong>
        <span class="row" style="margin-left:auto">
      <button id="dictExportCsv" class="btn">Export CSV</button>
      <button id="closeDict" class="btn">Close</button>
    </span>
    </header>
    <main id="dictMain"></main>
</div>

<script>
    /* ========= Utilities ========= */
    const $ = s => document.querySelector(s);
    const tbl = $('#tbl tbody');

    function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
    function safeRx(q){try{return new RegExp(q,'i');}catch{return new RegExp(q.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'),'i');}}
    function z(n,w=2){return String(n).padStart(w,'0');}
    function fmtClock(ms){
        const sign = ms<0?'-':''; ms=Math.abs(ms);
        const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), ms3=ms%1000;
        return `${sign}${z(h)}:${z(m)}:${z(s)}.${z(ms3,3)}`;
    }

    /* ========= SRT parsing/formatting ========= */
    const TIME_RE=/(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?/;
    function toMs(h,m,s,ms){return (parseInt(h)*3600+parseInt(m)*60+parseInt(s))*1000+parseInt(String(ms||'0').padEnd(3,'0'));}
    function parseSRT(text){
        const out=[]; const blocks=text.replace(/\r/g,'').trim().split(/\n\s*\n/);
        for(const b of blocks){
            const lines=b.split('\n').filter(x=>x.trim().length>0); if(!lines.length) continue;
            let i=0; if(/^\d+$/.test(lines[0].trim())) i=1;
            const m=(lines[i]||'').match(TIME_RE); if(!m) continue;
            const start=toMs(m[1],m[2],m[3],m[4]), end=toMs(m[5],m[6],m[7],m[8]);
            const body=lines.slice(i+1).join('\n').replace(/\{\\an\d\}/g,'').replace(/<\/?[^>]+>/g,t=>/br\s*\/?/i.test(t)?'\n':'');
            out.push({start,end,text:body});
        }
        return out.sort((a,b)=>a.start-b.start);
    }
    function fmtS(ms){
        const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000), ms3=ms%1000;
        return `${z(h)}:${z(m)}:${z(s)},${z(ms3,3)}`;
    }
    function toSRT(arr){
        return arr.map((c,i)=>`${i+1}\n${fmtS(c.start)} --> ${fmtS(c.end)}\n${c.text}\n`).join('\n');
    }

    /* ========= Alignment ========= */
    // Legacy simple overlap
    function alignSimple(L,R){
        const rows=[]; let i=0,j=0; const ov=(a,b)=>a&&b&&a.end>=b.start&&b.end>=a.start;
        while(i<L.length||j<R.length){
            const l=L[i]||null, r=R[j]||null;
            if(l&&r&&ov(l,r)){rows.push({L:l,R:r,start:Math.max(Math.min(l.start,r.start),Math.min(l.end,r.end)- (l.end-r.start<0?0:0)),end:Math.min(l.end,r.end)}); i+=(l.end<=r.end?1:0); j+=(r.end<l.end?1:0);}
            else if(l&&(!r||l.start<r.start)){rows.push({L:l,R:null,start:l.start,end:l.end}); i++;}
            else if(r){rows.push({L:null,R:r,start:r.start,end:r.end}); j++;}
            else break;
        }
        return rows;
    }

    // Timeline: union of boundaries, pick active left/right at slice mid with tolerance; merge same-active slices
    function alignTimeline(L,R,tolMs){
        const times=new Set(); L.forEach(c=>{times.add(c.start);times.add(c.end)}); R.forEach(c=>{times.add(c.start);times.add(c.end)});
        const T=[...times].sort((a,b)=>a-b); if(T.length<=1) return [];
        function activeAt(cues,t,guess){
            let k=Math.max(0,guess|0);
            while(k<cues.length && (cues[k].end+tolMs)<=t) k++;
            if(k<cues.length && (cues[k].start-tolMs)<=t && t<(cues[k].end+tolMs)) return k;
            if(k-1>=0 && (cues[k-1].start-tolMs)<=t && t<(cues[k-1].end+tolMs)) return k-1;
            return -1;
        }
        let li=0,ri=0; const out=[]; let cur=null;
        for(let i=0;i<T.length-1;i++){
            const a=T[i], b=T[i+1]; if(b===a) continue; const mid=(a+b)/2;
            const la=activeAt(L,mid,li); if(la>=0) li=la;
            const ra=activeAt(R,mid,ri); if(ra>=0) ri=ra;
            const left=la>=0?L[la]:null, right=ra>=0?R[ra]:null;
            if(!left && !right) continue;
            if(cur && cur._li===la && cur._ri===ra){cur.end=b;}
            else{ if(cur) out.push(cur); cur={L:left,R:right,start:a,end:b,_li:la,_ri:ra}; }
        }
        if(cur) out.push(cur);
        return out.map(r=>({L:r.L,R:r.R,start:r.start,end:r.end}));
    }

    /* ========= App State ========= */
    const leftInput=$('#left'), rightInput=$('#right'), loadBtn=$('#load'), loadStatus=$('#loadStatus');
    const alignMode=$('#alignMode'), tol=$('#tol'), q=$('#q'), hideEmpty=$('#hideEmpty'), persist=$('#persist');

    const mtProvider=$('#mtProvider'), mtEndpoint=$('#mtEndpoint'), mtKey=$('#mtKey'), mtModel=$('#mtModel'), mtPresets=$('#mtPresets');
    const src=$('#src'), tgt=$('#tgt'), batch=$('#batch'), translateAll=$('#translateAll'), prog=$('#prog'), statusEl=$('#status'), exportBtn=$('#exportRight');

    const playBtn=$('#playPause'), stopBtn=$('#stop'), speed=$('#speed'), offset=$('#offset'), timeLabel=$('#timeLabel');

    const selPopup=$('#selPopup'), selText=$('#selText'), selResult=$('#selResult'), closeSel=$('#closeSel'), linksBox=selPopup.querySelector('.links');
    const selTranslate=$('#selTranslate'), selDict=$('#selDict'), selAdd=$('#selAdd');

    const chatBox=$('#chatBox'), openChatBtn=$('#openChat'), closeChatBtn=$('#closeChat'), chatContext=$('#chatContext'), chatQuestion=$('#chatQuestion'), chatAsk=$('#chatAsk'), chatCopy=$('#chatCopy'), chatOpenGPT=$('#chatOpenGPT'), chatOpenGemini=$('#chatOpenGemini'), chatMain=$('#chatMain'), chatHint=$('#chatHint');

    const dictBox=$('#dictBox'), openDictBtn=$('#openDict'), closeDictBtn=$('#closeDict'), dictMain=$('#dictMain'), dictExportCsv=$('#dictExportCsv');

    let LEFT=[], RIGHT=[], ROWS=[];
    let SETTINGS=loadSettings(); applySettings();
    let DICT=loadDict();

    [leftInput,rightInput].forEach(i=>i.addEventListener('change',()=>{ loadBtn.disabled=!leftInput.files.length; }));

    loadBtn.addEventListener('click', async ()=>{
        loadStatus.textContent='Parsing…';
        const ltxt=await fileToText(leftInput.files[0]); LEFT=parseSRT(ltxt);
        RIGHT=[];
        if(rightInput.files?.length){ const rtxt=await fileToText(rightInput.files[0]); RIGHT=parseSRT(rtxt); }
        alignAndRender();
        exportBtn.disabled = !RIGHT.length;
        playBtn.disabled = !ROWS.length; stopBtn.disabled = !ROWS.length;
        loadStatus.textContent=`Loaded L=${LEFT.length}${RIGHT.length? ' R='+RIGHT.length:''} Rows=${ROWS.length}`;
    });

    [alignMode,tol,q,hideEmpty].forEach(el=>el.addEventListener('input',()=>{ alignMode.value==='simple'? ROWS=alignSimple(LEFT,RIGHT): alignAndRender(); render(); saveSettings(); }));
    [persist,mtProvider,mtEndpoint,mtKey,mtModel,src,tgt,batch].forEach(el=>el.addEventListener('input',saveSettings));
    mtPresets.addEventListener('change',()=>{
        const v=mtPresets.value;
        if(v==='mymemory'){mtProvider.value='mymemory'; mtEndpoint.value='';}
        if(v==='libreLocal'){mtProvider.value='libre'; mtEndpoint.value='http://localhost:5000/translate';}
        if(v==='librePublic'){mtProvider.value='libre'; mtEndpoint.value='https://libretranslate.com/translate';}
        if(v==='openai'){mtProvider.value='openai'; mtEndpoint.value='https://api.openai.com/v1/chat/completions';}
        if(v==='ollama'){mtProvider.value='ollama'; mtEndpoint.value='http://localhost:11434/api/chat'; mtModel.value='llama3.1:8b';}
        saveSettings();
    });

    function alignAndRender(){
        const mode=alignMode.value||'timeline';
        ROWS = mode==='simple' ? alignSimple(LEFT,RIGHT) : alignTimeline(LEFT,RIGHT,parseInt(tol.value||'0',10));
        render();
    }

    function render(){
        tbl.innerHTML=''; const rx=q.value? safeRx(q.value):null;
        ROWS.forEach((row,idx)=>{
            const ltxt=row.L?.text||'', rtxt=row.R?.text||'';
            if(hideEmpty.checked && (!ltxt || !rtxt)) return;
            if(rx && !(rx.test(ltxt)||rx.test(rtxt))) return;
            const tr=document.createElement('tr'); tr.dataset.idx=idx;
            tr.onmouseenter=()=>tr.classList.add('hover'); tr.onmouseleave=()=>tr.classList.remove('hover');
            tr.addEventListener('click',()=>{ // jump player to this row
                currentMs = row.start; lastTick=null; updateHighlight(); updateTimeLabel();
            });
            const tdL=document.createElement('td'); tdL.className='left';
            const tdR=document.createElement('td'); tdR.className='right';
            tdL.innerHTML=`<div class="time">${fmtClock(row.start)}–${fmtClock(row.end)}</div><div class="line ${ltxt?'':'empty'}">${escapeHtml(ltxt||'(empty)')}</div>`;
            tdR.innerHTML=`<div class="time">${fmtClock(row.start)}–${fmtClock(row.end)}</div><div class="line ${rtxt?'':'empty'}">${escapeHtml(rtxt||'(empty)')}</div>`;
            tr.appendChild(tdL); tr.appendChild(tdR); tbl.appendChild(tr);
        });
    }

    /* ========= Translate All ========= */
    translateAll.addEventListener('click', async ()=>{
        if(!LEFT.length){ alert('Load the left subtitle first.'); return; }
        statusEl.textContent='Translating…'; prog.max=LEFT.length; prog.value=0;
        const texts=LEFT.map(c=>c.text);
        let out = [];
        try{
            const provider=mtProvider.value;
            if(provider==='mymemory'){ out = await mtMyMemoryBatch(texts, src.value, tgt.value, parseInt(batch.value,10)); }
            else if(provider==='libre'){ out = await mtLibre(texts, src.value, tgt.value, mtEndpoint.value.trim()); }
            else if(provider==='openai'){ out = await mtOpenAI(texts, src.value, tgt.value, mtEndpoint.value.trim(), mtKey.value.trim(), mtModel.value.trim()||'gpt-4o-mini', parseInt(batch.value,10)); }
            else if(provider==='ollama'){ out = await mtOllama(texts, src.value, tgt.value, mtEndpoint.value.trim(), mtModel.value.trim()||'llama3.1:8b', parseInt(batch.value,10)); }
            else throw new Error('Unknown provider');
        }catch(e){
            statusEl.innerHTML = `<span class="bad">Failed</span>: ${escapeHtml(e.message||String(e))}`;
            return;
        }

        RIGHT = LEFT.map((L,i)=>({start:L.start,end:L.end,text:out[i]||''}));
        alignAndRender();
        exportBtn.disabled=false;
        statusEl.innerHTML = `<span class="ok">Done</span>`;
    });
    exportBtn.addEventListener('click',()=>{
        if(!RIGHT.length){alert('Nothing to export');return;}
        const srt=toSRT(RIGHT); const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob([srt],{type:'text/plain;charset=utf-8'}));
        a.download='translated.tr.srt'; document.body.appendChild(a); a.click(); a.remove();
    });

    /* Providers (browser-friendly) */
    async function mtMyMemoryBatch(items, src, tgt, B){
        // Free, no key. Rate limits apply. We go sequentially by small batches to be nice.
        const out=new Array(items.length); let done=0;
        for(let i=0;i<items.length;i++){
            const t = items[i];
            const u = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${encodeURIComponent(src)}|${encodeURIComponent(tgt)}`;
            const r = await fetch(u); if(!r.ok) throw new Error('MyMemory HTTP '+r.status);
            const j = await r.json(); out[i] = j?.responseData?.translatedText || '';
            prog.value = ++done;
            // tiny delay to be polite
            await new Promise(res=>setTimeout(res, 120));
        }
        return out;
    }
    async function mtLibre(items, src, tgt, endpoint){
        if(!endpoint) throw new Error('Libre endpoint empty');
        const out=[];
        for(let i=0;i<items.length;i++){
            const body=new URLSearchParams({q:items[i], source:src, target:tgt, format:'text'});
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
            if(!r.ok) throw new Error('Libre HTTP '+r.status);
            const j=await r.json();
            out.push(j?.translatedText || j?.[0]?.translatedText || j?.result || '');
            prog.value = i+1;
        }
        return out;
    }
    async function mtOpenAI(items, src, tgt, endpoint, key, model, B){
        if(!endpoint||!key) throw new Error('OpenAI endpoint/key missing');
        const out=new Array(items.length); let done=0;
        for(let i=0;i<items.length;i+=B){
            const chunk = items.slice(i,i+B);
            const system=`You are a professional subtitle translator. Translate ONLY the given items from ${src} to ${tgt}. Preserve line breaks and inline tags. Return JSON {"t":[...]} same length.`;
            const payload={model, messages:[{role:'system',content:system},{role:'user',content:JSON.stringify({items:chunk})}], temperature:0.2, response_format:{type:'json_object'}};
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(payload)});
            if(!r.ok) throw new Error('OpenAI HTTP '+r.status);
            const j=await r.json(); const content=j?.choices?.[0]?.message?.content||'{}';
            let arr=[]; try{ arr=JSON.parse(content).t||[]; }catch{ arr = content.split('\n'); }
            for(let k=0;k<chunk.length;k++) out[i+k]=arr[k]||'';
            done += chunk.length; prog.value = done;
        }
        return out;
    }
    async function mtOllama(items, src, tgt, endpoint, model, B){
        // Requires Ollama >= 0.1.34 with CORS allowed; else run through a local proxy.
        if(!endpoint) throw new Error('Ollama endpoint empty');
        const out=new Array(items.length); let done=0;
        for(let i=0;i<items.length;i+=B){
            const chunk=items.slice(i,i+B);
            const sys=`You translate English subtitles into natural ${tgt.toUpperCase()} subtitles. Keep meaning and brevity, preserve line breaks. Output JSON {"t":[...]} matching input length.`;
            const body={model, messages:[{role:'system',content:sys},{role:'user',content:JSON.stringify({items:chunk})}], stream:false};
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!r.ok) throw new Error('Ollama HTTP '+r.status);
            const j=await r.json(); let content=j?.message?.content||'{}', arr=[];
            try{arr=JSON.parse(content).t||[]}catch{arr=content.split('\n')}
            for(let k=0;k<chunk.length;k++) out[i+k]=arr[k]||'';
            done+=chunk.length; prog.value=done;
        }
        return out;
    }

    /* ========= Selection Popup: translate + dictionary + add ========= */
    document.addEventListener('mouseup',(ev)=>{
        const sel=window.getSelection().toString().trim(); if(!sel){ selPopup.style.display='none'; return; }
        if(!tbl.contains(window.getSelection().anchorNode)) return;
        selText.textContent=sel; selResult.style.display='none'; selResult.textContent='';
        linksBox.innerHTML='';
        const enc=encodeURIComponent(sel);
        addLink(`https://translate.google.com/?sl=${src.value||'en'}&tl=${tgt.value||'tr'}&text=${enc}`,'Google Translate');
        addLink(`https://www.deepl.com/translator#${src.value||'en'}/${tgt.value||'tr'}/${enc}`,'DeepL');
        addLink(`https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(sel.split(/\s+/)[0])}`,'Cambridge');
        addLink(`https://www.linguee.com/english-${(tgt.value||'tr')}/search?query=${enc}`,'Linguee');
        addLink(`https://sozluk.gov.tr/gts?ara=${enc}`,'TDK');
        addLink(`https://context.reverso.net/translation/english-${(tgt.value||'turkish')}/${enc}`,'Reverso');
        selPopup.style.left=(ev.pageX+10)+'px'; selPopup.style.top=(ev.pageY+10)+'px'; selPopup.style.display='block';
    });
    $('#closeSel').addEventListener('click',()=> selPopup.style.display='none');

    selTranslate.addEventListener('click', async ()=>{
        const text=selText.textContent.trim(); if(!text) return;
        selResult.style.display='block'; selResult.textContent='Translating…';
        try{
            // quick free translation: MyMemory
            const u=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(src.value)}|${encodeURIComponent(tgt.value)}`;
            const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
            const j=await r.json(); selResult.textContent = j?.responseData?.translatedText || '(no result)';
        }catch(e){ selResult.textContent='Error: '+(e.message||e); }
    });
    selDict.addEventListener('click', async ()=>{
        const text=selText.textContent.trim(); if(!text) return;
        selResult.style.display='block'; selResult.textContent='Looking up…';
        try{
            const word=text.split(/\s+/)[0];
            const r=await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
            if(!r.ok) throw new Error('HTTP '+r.status);
            const j=await r.json();
            const defs=[]; (j[0]?.meanings||[]).forEach(m=> (m.definitions||[]).slice(0,2).forEach(d=>defs.push('• '+d.definition)));
            selResult.textContent = defs.length? defs.join('\n') : 'No definitions found.';
        }catch(e){ selResult.textContent='Dictionary failed.'; }
    });
    selAdd.addEventListener('click', ()=>{
        const text=selText.textContent.trim(); const tr=selResult.textContent.trim();
        const entry={ts:Date.now(), src:src.value||'en', tgt:tgt.value||'tr', text, translation:(tr && !/^Error|Looking|Translating/.test(tr))?tr:'', context:extractCurrentRowText()};
        DICT.unshift(entry); saveDict(); renderDict();
        selResult.style.display='block'; selResult.textContent = (entry.translation? 'Saved.':'Saved (no translation text).');
    });

    function addLink(href,label){ const a=document.createElement('a'); a.href=href; a.target='_blank'; a.rel='noreferrer'; a.textContent=label; linksBox.appendChild(a); }
    function extractCurrentRowText(){ const h=tbl.querySelector('tr.hover'); if(!h) return ''; const L=h.querySelector('.left .line')?.textContent||''; const R=h.querySelector('.right .line')?.textContent||''; return (L + (R? '\n—\n'+R:'')); }

    /* ========= Chat ========= */
    openChatBtn.addEventListener('click', ()=>{
        chatBox.style.display='flex';
        const sel=window.getSelection().toString().trim();
        chatContext.value = sel || extractCurrentRowText() || '';
        updateChatHint();
    });
    closeChatBtn.addEventListener('click', ()=> chatBox.style.display='none');

    chatAsk.addEventListener('click', async ()=>{
        const ctx=chatContext.value.trim(); const q=chatQuestion.value.trim()||'Explain the meaning, idiom usage, tone, and cultural nuance. Be concise.';
        appendMsg('user', `Context:\n${ctx}\n\nQuestion:\n${q}`);
        try{
            const prov=mtProvider.value;
            if(prov==='openai'){ const text=await openaiChat(ctx,q,mtEndpoint.value.trim()||'https://api.openai.com/v1/chat/completions', mtKey.value.trim(), mtModel.value.trim()||'gpt-4o-mini'); appendMsg('assistant', text); }
            else if(prov==='ollama'){ const text=await ollamaChat(ctx,q, mtEndpoint.value.trim()||'http://localhost:11434/api/chat', mtModel.value.trim()||'llama3.1:8b'); appendMsg('assistant', text); }
            else { appendMsg('assistant','In-app chat needs OpenAI or Ollama configured. Use ChatGPT/Gemini buttons below.'); }
        }catch(e){ appendMsg('assistant','Chat failed: '+(e.message||e)); }
    });
    chatCopy.addEventListener('click', ()=>{
        const ctx=chatContext.value.trim(), q=chatQuestion.value.trim();
        const text=`Please explain the following subtitle in plain English and Turkish when useful, including idioms, tone, and cultural nuance.\n\nContext:\n${ctx}\n\nQuestion:\n${q||'Explain succinctly with examples.'}`;
        navigator.clipboard.writeText(text);
    });
    function appendMsg(role,text){ const d=document.createElement('div'); d.className='msg '+(role==='user'?'user':'assistant'); d.textContent=text; chatMain.appendChild(d); chatMain.scrollTop=chatMain.scrollHeight; }
    function updateChatHint(){ chatHint.textContent = (mtProvider.value==='openai'||mtProvider.value==='ollama')? '' : 'Tip: select OpenAI or Ollama to ask in-app.'; }
    async function openaiChat(ctx,q,endpoint,key,model){
        const payload={model, temperature:0.3, messages:[{role:'system',content:'You are an expert English tutor for Turkish learners. Be precise and concise.'},{role:'user',content:`Context:\n${ctx}\n\n${q}`}]};
        const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(payload)});
        if(!r.ok) throw new Error('OpenAI HTTP '+r.status); const j=await r.json(); return j?.choices?.[0]?.message?.content?.trim()||'';
    }
    async function ollamaChat(ctx,q,endpoint,model){
        const payload={model, stream:false, messages:[{role:'system',content:'You are an expert English tutor for Turkish learners. Be precise and concise.'},{role:'user',content:`Context:\n${ctx}\n\n${q}`}]};
        const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(!r.ok) throw new Error('Ollama HTTP '+r.status); const j=await r.json(); return j?.message?.content?.trim()||'';
    }

    /* ========= Dictionary drawer ========= */
    openDictBtn.addEventListener('click', ()=>{ dictBox.style.display='flex'; renderDict(); });
    closeDictBtn.addEventListener('click', ()=> dictBox.style.display='none');
    function renderDict(){
        dictMain.innerHTML='';
        if(!DICT.length){ dictMain.innerHTML='<div class="hint">Empty.</div>'; return; }
        for(const e of DICT){
            const div=document.createElement('div'); div.className='entry';
            const when=new Date(e.ts).toLocaleString();
            div.innerHTML=`<div class="hint">${when}</div><div><strong>${escapeHtml(e.text)}</strong></div><div class="hint">${escapeHtml(e.translation||'')}</div><div class="msg" style="margin-top:6px">${escapeHtml(e.context||'')}</div>`;
            dictMain.appendChild(div);
        }
    }
    dictExportCsv.addEventListener('click', ()=>{
        const rows=[['timestamp','text','translation','src','tgt','context']];
        for(const e of DICT){ rows.push([new Date(e.ts).toISOString(), e.text, e.translation||'', e.src, e.tgt, (e.context||'').replace(/\n/g,' \\n ') ]); }
        const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='dictionary.csv'; document.body.appendChild(a); a.click(); a.remove();
    });
    function loadDict(){ try{return JSON.parse(localStorage.getItem('srt_dict_v1')||'[]')}catch{return[]} }
    function saveDict(){ try{localStorage.setItem('srt_dict_v1',JSON.stringify(DICT))}catch{} }

    /* ========= Player ========= */
    let playing=false, startWall=0, startMs=0, currentMs=0, lastTick=null, rafId=null;
    playBtn.addEventListener('click', ()=>{
        if(!ROWS.length) return;
        if(!playing){ // start
            playing=true; playBtn.textContent='Pause'; startWall=performance.now(); startMs=currentMs; tick();
        }else{ // pause
            playing=false; playBtn.textContent='Play'; if(rafId) cancelAnimationFrame(rafId);
        }
    });
    stopBtn.addEventListener('click', ()=>{
        playing=false; playBtn.textContent='Play'; if(rafId) cancelAnimationFrame(rafId); currentMs=0; lastTick=null; updateHighlight(); updateTimeLabel();
    });
    function tick(){
        if(!playing) return;
        const now=performance.now();
        const dt= now - startWall;
        const sp= parseFloat(speed.value||'1');
        const off=parseInt(offset.value||'0',10);
        currentMs = startMs + dt*sp + off;
        updateHighlight(); updateTimeLabel();
        rafId = requestAnimationFrame(tick);
    }
    function updateTimeLabel(){ timeLabel.textContent=fmtClock(currentMs); }
    function updateHighlight(){
        const trs=tbl.querySelectorAll('tr');
        trs.forEach(tr=>tr.classList.remove('hover'));
        // find row containing currentMs
        for(const tr of trs){
            const idx=parseInt(tr.dataset.idx,10); const row=ROWS[idx];
            if(currentMs>=row.start && currentMs<row.end){ tr.classList.add('hover'); tr.scrollIntoView({block:'center',behavior:'instant'}); break; }
        }
    }

    /* ========= Helpers ========= */
    function fileToText(f){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=e=>res(String(e.target.result)); r.onerror=rej; r.readAsText(f);});}

    /* ========= Settings ========= */
    function loadSettings(){ try{return JSON.parse(localStorage.getItem('srt_settings_v2')||'{}')}catch{return{}} }
    function saveSettings(){
        if(!persist.checked) return;
        const S={
            alignMode:alignMode.value, tol:tol.value, hideEmpty:hideEmpty.checked,
            mtProvider:mtProvider.value, mtEndpoint:mtEndpoint.value, mtKey:mtKey.value, mtModel:mtModel.value,
            src:src.value, tgt:tgt.value, batch:batch.value
        };
        try{localStorage.setItem('srt_settings_v2',JSON.stringify(S))}catch{}
    }
    function applySettings(){
        alignMode.value=SETTINGS.alignMode||'timeline';
        tol.value=SETTINGS.tol||'120';
        hideEmpty.checked=SETTINGS.hideEmpty!==false;
        if(SETTINGS.mtProvider) mtProvider.value=SETTINGS.mtProvider;
        if(SETTINGS.mtEndpoint) mtEndpoint.value=SETTINGS.mtEndpoint;
        if(SETTINGS.mtKey) mtKey.value=SETTINGS.mtKey;
        if(SETTINGS.mtModel) mtModel.value=SETTINGS.mtModel;
        src.value=SETTINGS.src||'en'; tgt.value=SETTINGS.tgt||'tr'; batch.value=SETTINGS.batch||'20';
    }

    /* ========= Shortcuts ========= */
    document.addEventListener('keydown',(e)=>{
        if(e.key===' '){ e.preventDefault(); if(!playBtn.disabled) playBtn.click(); }
        if(e.key==='Escape'){ selPopup.style.display='none'; }
    });
</script>
