<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SRT Study Tool — v7</title>
    <style>
        :root {
            --bg: #0b0f14;
            --fg: #e6edf3;
            --muted: #9aa4ad;
            --hl: #2b90d9;
            --row: #111827;
            --row2: #0f172a;
            --border: #1f2937;
            --ok: #2ea043;
            --bad: #ef4444;
            --playing: #17324a;
            --playingBorder: #2b90d9;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        header.top {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(11, 15, 20, .92);
            backdrop-filter: saturate(1.2) blur(6px);
            border-bottom: 1px solid var(--border)
        }

        .wrap {
            max-width: 1250px;
            margin: 0 auto;
            padding: 10px 16px
        }

        h1 {
            font-size: 18px;
            margin: 0 0 6px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .badge {
            background: #102b16;
            color: #9ae6b4;
            border: 1px solid #1d4d2d;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .in {
            background: #0f1620;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            color: #e6edf3
        }

        .btn {
            background: #1f2937;
            border: 1px solid #2b3645;
            border-radius: 10px;
            padding: 8px 12px;
            color: #e6edf3;
            cursor: pointer
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .hint {
            color: var(--muted);
            font-size: 12px
        }

        /* collapsibles */
        .box {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin: 8px 0;
            background: #0f1620
        }

        .box > h4 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 8px 16px;
            align-items: center;
        }

        .form-grid input:not([type="checkbox"]),
        .form-grid select {
            width: 100%;
            box-sizing: border-box;
        }


        details.box summary {
            cursor: pointer;
            color: #cbd5e1;
            font-weight: 600;
            margin: -10px;
            padding: 10px
        }

        details.box[open] summary {
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(12, 1fr);
            gap: 10px
        }

        .col-2 {
            grid-column: span 2
        }

        .col-3 {
            grid-column: span 3
        }

        .col-4 {
            grid-column: span 4
        }

        .col-6 {
            grid-column: span 6
        }

        .col-12 {
            grid-column: span 12
        }

        select, input[type="text"], input[type="password"], input[type="number"] {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            color: #e6edf3
        }

        /* fixed control bar (always visible) */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            /* padding: 8px 0 */
        }

        .controls .spacer {
            flex: 1
        }

        .controls-wrapper {
            padding: 8px 0;
        }

        .timeline-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0 12px;
        }

        .timeline {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: #2b3645;
            border-radius: 3px;
            outline: none;
            transition: height .2s;
        }

        .timeline:hover {
            height: 8px;
        }

        .timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--hl);
            cursor: pointer;
        }

        .timeline::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--hl);
            cursor: pointer;
            border: none;
        }

        /* content area scrolls */
        main.content {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center
        }

        .tableWrap {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 16px;
            overflow: auto
        }

        /* table */
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0 6px;
            margin: 0 auto
        }

        td {
            width: 50%;
            vertical-align: top;
            padding: 10px 12px;
            background: var(--row);
            border: 1px solid var(--border)
        }

        tr:nth-child(even) td {
            background: var(--row2)
        }

        td.left {
            border-right: none;
            border-radius: 10px 0 0 10px
        }

        td.right {
            border-left: none;
            border-radius: 0 10px 10px 0
        }

        .time {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 4px
        }

        .line {
            white-space: pre-wrap;
            user-select: text
        }

        tr.hover td {
            outline: 1px dashed var(--hl)
        }

        tr.playing td {
            background: var(--playing);
            outline: 2px solid var(--playingBorder)
        }

        tr.past {
            opacity: 0.65;
        }

        tr.past td {
            background: var(--bg);
        }

        .ok {
            color: var(--ok)
        }

        .bad {
            color: var(--bad)
        }

        /* selection popup */
        .selpop {
            position: fixed;
            z-index: 9999;
            background: #0f1620;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            display: none;
            min-width: 320px;
            max-width: min(92vw, 780px)
        }

        .popbar {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: move
        }

        .selpop .t {
            font-size: 12px;
            color: #cbd5e1
        }

        .selpop .x {
            margin-left: auto;
            cursor: pointer;
            color: #9aa4ad
        }

        .msg {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            white-space: pre-wrap
        }

        .section {
            margin-top: 8px
        }

        .section h4 {
            margin: 0 0 4px;
            font-size: 12px;
            color: #9fb3c8
        }

        /* drawers */
        .drawer {
            position: fixed;
            right: 16px;
            top: 16px;
            width: 430px;
            max-width: 96vw;
            height: 86vh;
            background: #0f1620;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
            display: none;
            flex-direction: column;
            z-index: 9998
        }

        .drawer header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid var(--border)
        }

        .drawer main {
            padding: 10px;
            overflow: auto
        }

        .entry {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px
        }

        textarea {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #e6edf3;
            padding: 8px;
            min-height: 80px
        }
    </style>
</head>
<body>
<div class="app">
    <header class="top">
        <div class="wrap">
            <h1>SRT Study Tool <span class="badge">v7 • draggable popup • split panels</span>
                <span class="row" style="margin-left:auto">
          <button id="openDict" class="btn">Dictionary</button>
          <button id="openChat" class="btn">Chat</button>
        </span>
            </h1>

            <!-- Single Collapsible Panel -->
            <details class="box" open>
                <summary>Configuration</summary>

                <!-- Input Section -->
                <div class="box" id="boxLoad">
                    <h4>Input</h4>
                    <div class="form-grid">
                        <label for="left">Left (EN)</label>
                        <input id="left" type="file" accept=".srt,.vtt,text/plain" class="in">
                        <label for="right">Right (TR, optional)</label>
                        <input id="right" type="file" accept=".srt,.vtt,text/plain" class="in">
                        <div class="row" style="grid-column: 1 / -1; margin-top: 8px;">
                            <button id="load" class="btn" disabled>Load</button>
                            <span id="loadStatus" class="hint"></span>
                        </div>
                    </div>
                </div>

                <!-- Translation Section -->
                <div class="box" id="boxTranslate">
                    <h4>Translation</h4>
                    <div class="form-grid">
                        <label for="mtPresets">Presets</label>
                        <select id="mtPresets" class="in">
                            <option value="">— choose —</option>
                            <option value="mymemory">MyMemory (free)</option>
                            <option value="libreLocal">Libre local http://localhost:5000/translate
                            </option>
                            <option value="librePublic">Libre public
                                https://libretranslate.com/translate
                            </option>
                            <option value="openai">OpenAI
                                https://api.openai.com/v1/chat/completions
                            </option>
                            <option value="ollama">Ollama http://localhost:11434/api/chat</option>
                        </select>
                        <label for="mtProvider">Provider</label>
                        <select id="mtProvider" class="in">
                            <option value="mymemory" selected>MyMemory (free)</option>
                            <option value="libre">LibreTranslate</option>
                            <option value="openai">OpenAI (API)</option>
                            <option value="ollama">Ollama (local)</option>
                        </select>
                        <label for="mtEndpoint">Endpoint</label>
                        <input id="mtEndpoint" class="in" placeholder="auto for presets">
                        <label for="mtKey">API key</label>
                        <input id="mtKey" type="password" class="in">
                        <label for="mtModel">Model</label>
                        <input id="mtModel" class="in" value="gpt-4o-mini">
                        <label for="src">Source</label>
                        <input id="src" class="in" value="en">
                        <label for="tgt">Target</label>
                        <input id="tgt" class="in" value="tr">
                        <label for="batch">Batch</label>
                        <input id="batch" type="number" class="in" value="20" min="1" max="50">

                        <div class="row" style="grid-column: 1 / -1; margin-top: 8px;">
                            <button id="translateAll" class="btn">Auto-translate left → right
                            </button>
                            <progress id="prog" max="1" value="0"
                                      style="width:260px;height:10px"></progress>
                            <span id="status" class="hint"></span>
                            <button id="exportRight" class="btn" disabled>Export TR .srt</button>
                        </div>
                    </div>
                </div>

                <!-- Settings Section -->
                <div class="box" id="boxAlign">
                    <h4>Settings</h4>
                    <div class="form-grid">
                        <label for="alignMode">Align mode</label>
                        <select id="alignMode" class="in">
                            <option value="timeline" selected>Timeline (no-miss, split/merge-safe)
                            </option>
                            <option value="simple">Simple overlap</option>
                        </select>
                        <label for="tol">Tolerance (ms)</label>
                        <input id="tol" type="number" value="120" min="0" step="10" class="in">
                        <div style="grid-column: 1 / -1;">
                            <label>
                                <input id="followToggle" type="checkbox" checked> Follow
                                playback (auto-scroll)
                            </label>
                        </div>
                    </div>
                </div>
            </details>

            <!-- Always-on controls -->
            <div class="controls-wrapper">
                <div class="timeline-bar" id="timeline-bar" style="display: none;">
                    <span class="hint" id="timeLabel">00:00:00</span>
                    <input type="range" id="timeline" class="timeline" min="0" value="0" step="1">
                    <span class="hint" id="durationLabel">00:00:00</span>
                </div>
                <div class="controls">
                    <button id="playPause" class="btn" disabled>Play</button>
                    <button id="stop" class="btn" disabled>Stop</button>
                    <label>Speed <input id="speed" type="number" class="in" value="1.0" step="0.1"
                                        min="0.1" max="3"></label>
                    <span class="spacer"></span>
                    <input id="q" type="text" class="in" style="width: 210px;"
                           placeholder="Search text or HH:MM:SS and press Enter"/>
                    <span id="err" class="hint bad"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="content">
        <div class="tableWrap" id="scrollArea">
            <table id="tbl">
                <tbody></tbody>
            </table>
        </div>
    </main>
</div>

<!-- Selection popup (draggable) -->
<div class="selpop" id="selPopup">
    <div class="popbar" id="selDragBar">
        <div class="t">Selection</div>
        <div class="x" id="closeSel">✕</div>
    </div>
    <div id="selText" class="msg section"></div>
    <div class="section" id="selAgg"></div>
    <div class="section">
        <button id="selAdd" class="btn">Add to dictionary</button>
        <span class="hint" id="selStatus"></span>
    </div>
</div>

<!-- Chat drawer -->
<div class="drawer" id="chatBox">
    <header>
        <strong>Explain / Cultural Nuance</strong>
        <span class="row" style="margin-left:auto">
      <button id="closeChat" class="btn">Close</button>
    </span>
    </header>
    <main id="chatMain"></main>
    <div style="padding:10px;border-top:1px solid var(--border)">
        <label style="display:block;margin-bottom:8px">Context
            <textarea id="chatContext" placeholder="Paste selection or lines"></textarea>
        </label>
        <label style="display:block;margin-bottom:8px">Question
            <textarea id="chatQuestion"
                      placeholder="Explain meaning, idiom, tone, cultural nuance. Be concise."></textarea>
        </label>
        <div class="row">
            <button id="chatAsk" class="btn">Ask (OpenAI/Ollama)</button>
            <button id="chatCopy" class="btn">Copy prompt</button>
            <a href="https://chat.openai.com/" target="_blank" class="btn">Open ChatGPT</a>
            <a href="https://gemini.google.com/app" target="_blank" class="btn">Open Gemini</a>
        </div>
    </div>
</div>

<!-- Dictionary drawer -->
<div class="drawer" id="dictBox" style="left:16px;right:auto">
    <header>
        <strong>Personal Dictionary</strong>
        <span class="row" style="margin-left:auto">
      <button id="dictExportCsv" class="btn">Export CSV</button>
      <button id="closeDict" class="btn">Close</button>
    </span>
    </header>
    <main id="dictMain"></main>
</div>

<script>
    /* ===== minimal runtime error surfacing ===== */
    window.addEventListener('error', e => {
        console.error('Unhandled error:', e.error || e.message);
        const el = document.getElementById('err');
        if (el) el.textContent = e.message;
    });

    /* ========= Utilities ========= */
    const $ = s => document.querySelector(s);
    const tbl = $('#tbl tbody'), scrollArea = $('#scrollArea');

    function escapeHtml(s) {
        return s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }

    function safeRx(q) {
        try {
            return new RegExp(q, 'i');
        } catch {
            return new RegExp(q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'), 'i');
        }
    }

    function z(n, w = 2) {
        return String(n).padStart(w, '0');
    }

    function fmtClockSecs(ms) {
        const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000),
            s = Math.floor(ms % 60000 / 1000);
        return `${z(h)}:${z(m)}:${z(s)}`;
    }

    function parseHHMMSS(s) {
        const m = s.trim().match(/^(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
        if (!m) return null;
        return (+m[1]) * 3600000 + (+m[2]) * 60000 + (+m[3]) * 1000;
    }

    /* ========= SRT parsing/formatting ========= */
    const TIME_RE = /(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?/;

    function toMs(h, m, s, ms) {
        return (parseInt(h) * 3600 + parseInt(m) * 60 + parseInt(s)) * 1000 + parseInt(String(ms || '0').padEnd(3, '0'));
    }

    function parseSRT(text) {
        const out = [];
        const blocks = text.replace(/\r/g, '').trim().split(/\n\s*\n/);
        for (const b of blocks) {
            const lines = b.split('\n').filter(x => x.trim().length > 0);
            if (!lines.length) continue;
            let i = 0;
            if (/^\d+$/.test(lines[0].trim())) i = 1;
            const m = (lines[i] || '').match(TIME_RE);
            if (!m) continue;
            const start = toMs(m[1], m[2], m[3], m[4]), end = toMs(m[5], m[6], m[7], m[8]);
            const body = lines.slice(i + 1).join('\n').replace(/\{\\an\d\}/g, '').replace(/<\/?[^>]+>/g, t => /br\s*\/?/i.test(t) ? '\n' : '');
            out.push({start, end, text: body});
        }
        return out.sort((a, b) => a.start - b.start);
    }

    function fmtS(ms) {
        const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000),
            s = Math.floor(ms % 60000 / 1000), ms3 = ms % 1000;
        return `${z(h)}:${z(m)}:${z(s)},${z(ms3, 3)}`;
    }

    function toSRT(arr) {
        return arr.map((c, i) => `${i + 1}\n${fmtS(c.start)} --> ${fmtS(c.end)}\n${c.text}\n`).join('\n');
    }

    /* ========= Alignment ========= */
    function alignSimple(L, R) {
        const rows = [];
        let i = 0, j = 0;
        const ov = (a, b) => a && b && a.end >= b.start && b.end >= a.start;
        while (i < L.length || j < R.length) {
            const l = L[i] || null, r = R[j] || null;
            if (l && r && ov(l, r)) {
                rows.push({
                    L: l,
                    R: r,
                    start: Math.max(l.start, r.start),
                    end: Math.min(l.end, r.end)
                });
                i += (l.end <= r.end ? 1 : 0);
                j += (r.end < l.end ? 1 : 0);
            } else if (l && (!r || l.start < r.start)) {
                rows.push({L: l, R: null, start: l.start, end: l.end});
                i++;
            } else if (r) {
                rows.push({L: null, R: r, start: r.start, end: r.end});
                j++;
            } else break;
        }
        return rows;
    }

    function alignTimeline(L, R, tolMs) {
        const times = new Set();
        L.forEach(c => {
            times.add(c.start);
            times.add(c.end)
        });
        R.forEach(c => {
            times.add(c.start);
            times.add(c.end)
        });
        const T = [...times].sort((a, b) => a - b);
        if (T.length <= 1) return [];

        function activeAt(cues, t, guess) {
            let k = Math.max(0, guess | 0);
            while (k < cues.length && (cues[k].end + tolMs) <= t) k++;
            if (k < cues.length && (cues[k].start - tolMs) <= t && t < (cues[k].end + tolMs)) return k;
            if (k - 1 >= 0 && (cues[k - 1].start - tolMs) <= t && t < (cues[k - 1].end + tolMs)) return k - 1;
            return -1;
        }

        let li = 0, ri = 0;
        const out = [];
        let cur = null;
        for (let i = 0; i < T.length - 1; i++) {
            const a = T[i], b = T[i + 1];
            if (b === a) continue;
            const mid = (a + b) / 2;
            const la = activeAt(L, mid, li);
            if (la >= 0) li = la;
            const ra = activeAt(R, mid, ri);
            if (ra >= 0) ri = ra;
            const left = la >= 0 ? L[la] : null, right = ra >= 0 ? R[ra] : null;
            if (!left && !right) continue;
            if (cur && cur._li === la && cur._ri === ra) {
                cur.end = b;
            } else {
                if (cur) out.push(cur);
                cur = {L: left, R: right, start: a, end: b, _li: la, _ri: ra};
            }
        }
        if (cur) out.push(cur);
        return out.map(r => ({L: r.L, R: r.R, start: r.start, end: r.end}));
    }

    /* ========= App State ========= */
    const leftInput = $('#left'), rightInput = $('#right'), loadBtn = $('#load'),
        loadStatus = $('#loadStatus');
    const alignMode = $('#alignMode'), tol = $('#tol'), searchBox = $('#q');
    const mtProvider = $('#mtProvider'), mtEndpoint = $('#mtEndpoint'), mtKey = $('#mtKey'),
        mtModel = $('#mtModel'), mtPresets = $('#mtPresets');
    const src = $('#src'), tgt = $('#tgt'), batch = $('#batch'), translateAll = $('#translateAll'),
        prog = $('#prog'), statusEl = $('#status'), exportBtn = $('#exportRight');
    const playBtn = $('#playPause'), stopBtn = $('#stop'), speed = $('#speed'),
        timeLabel = $('#timeLabel'), followToggle = $('#followToggle'),
        timeline = $('#timeline'), durationLabel = $('#durationLabel'),
        timelineBar = $('#timeline-bar');

    const selPopup = $('#selPopup'), selText = $('#selText'), selAgg = $('#selAgg'),
        closeSel = $('#closeSel'), selAdd = $('#selAdd'), selStatus = $('#selStatus'),
        selDragBar = $('#selDragBar');
    const chatBox = $('#chatBox'), openChatBtn = $('#openChat'), closeChatBtn = $('#closeChat'),
        chatContext = $('#chatContext'), chatQuestion = $('#chatQuestion'), chatAsk = $('#chatAsk'),
        chatCopy = $('#chatCopy'), chatMain = $('#chatMain');
    const dictBox = $('#dictBox'), openDictBtn = $('#openDict'), closeDictBtn = $('#closeDict'),
        dictMain = $('#dictMain'), dictExportCsv = $('#dictExportCsv');

    let LEFT = [], RIGHT = [], ROWS = [];
    let DICT = loadDict();
    let popupData = null;
    let followScroll = true;
    let userScrollTimeout = null;
    let currentMs = 0, playing = false, startWall = 0, startMs = 0, rafId = null, currentIdx = -1;

    /* Enable Load when left file picked */
    [leftInput, rightInput].forEach(i => {
        ['change', 'input'].forEach(ev => i.addEventListener(ev, () => {
            loadBtn.disabled = !(leftInput.files && leftInput.files.length > 0);
        }));
    });

    /* Load */
    loadBtn.addEventListener('click', async () => {
        loadStatus.textContent = 'Parsing…';
        const ltxt = await fileToText(leftInput.files[0]);
        LEFT = parseSRT(ltxt);
        RIGHT = [];
        if (rightInput.files?.length) {
            const rtxt = await fileToText(rightInput.files[0]);
            RIGHT = parseSRT(rtxt);
        }
        alignAndRender();
        exportBtn.disabled = !RIGHT.length;
        playBtn.disabled = !ROWS.length;
        stopBtn.disabled = !ROWS.length;
        loadStatus.textContent = `Loaded L=${LEFT.length}${RIGHT.length ? ' R=' + RIGHT.length : ''} Rows=${ROWS.length}`;

        if (ROWS.length > 0) {
            const totalDuration = ROWS[ROWS.length - 1].end;
            timeline.max = totalDuration;
            durationLabel.textContent = fmtClockSecs(totalDuration);
            timelineBar.style.display = 'flex';
            currentMs = 0;
            timeline.value = 0;
            updateTimeLabel();
        } else {
            timelineBar.style.display = 'none';
        }
    });

    /* Align changes */
    [alignMode, tol].forEach(el => el.addEventListener('input', alignAndRender));

    /* Search: filter live; Enter -> if HH:MM:SS jump */
    searchBox.addEventListener('input', render);
    searchBox.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const v = parseHHMMSS(searchBox.value || '');
            if (v != null) {
                currentMs = v;
                timeline.value = v;
                updateHighlight(true);
                updateTimeLabel();
                e.preventDefault();
            }
        }
    });

    timeline.addEventListener('input', () => {
        const newMs = parseInt(timeline.value, 10);
        currentMs = newMs;
        startMs = newMs;
        startWall = performance.now();
        updateTimeLabel();
        updateHighlight(true);
    });

    /* Render + Align */
    function alignAndRender() {
        const mode = alignMode.value || 'timeline';
        ROWS = mode === 'simple' ? alignSimple(LEFT, RIGHT) : alignTimeline(LEFT, RIGHT, parseInt(tol.value || '0', 10));
        render();
        updateHighlight(true);
    }

    function render() {
        tbl.innerHTML = '';
        const q = searchBox.value?.trim();
        const rx = q ? safeRx(q) : null;
        ROWS.forEach((row, idx) => {
            const ltxt = row.L?.text || '', rtxt = row.R?.text || '';
            if (rx && !(rx.test(ltxt) || rx.test(rtxt))) return;
            const tr = document.createElement('tr');
            tr.dataset.idx = idx;
            tr.addEventListener('mouseenter', () => tr.classList.add('hover'));
            tr.addEventListener('mouseleave', () => tr.classList.remove('hover'));
            tr.addEventListener('click', () => {
                currentMs = row.start;
                timeline.value = row.start;
                updateHighlight(true);
                updateTimeLabel();
            });
            const tdL = document.createElement('td');
            tdL.className = 'left';
            const tdR = document.createElement('td');
            tdR.className = 'right';
            tdL.innerHTML = `<div class="time">${fmtClockSecs(row.start)}–${fmtClockSecs(row.end)}</div><div class="line">${escapeHtml(ltxt || '(empty)')}</div>`;
            tdR.innerHTML = `<div class="time">${fmtClockSecs(row.start)}–${fmtClockSecs(row.end)}</div><div class="line">${escapeHtml(rtxt || '(empty)')}</div>`;
            tr.appendChild(tdL);
            tr.appendChild(tdR);
            tbl.appendChild(tr);
        });
    }

    /* ===== Translate All ===== */
    translateAll.addEventListener('click', async () => {
        if (!LEFT.length) {
            alert('Load the left subtitle first.');
            return;
        }
        statusEl.textContent = 'Translating…';
        prog.max = LEFT.length;
        prog.value = 0;
        const texts = LEFT.map(c => c.text);
        let out = [];
        try {
            const provider = mtProvider.value;
            if (provider === 'mymemory') {
                out = await mtMyMemoryBatch(texts, src.value, tgt.value, parseInt(batch.value, 10));
            } else if (provider === 'libre') {
                out = await mtLibre(texts, src.value, tgt.value, mtEndpoint.value.trim());
            } else if (provider === 'openai') {
                out = await mtOpenAI(texts, src.value, tgt.value, mtEndpoint.value.trim(), mtKey.value.trim(), mtModel.value.trim() || 'gpt-4o-mini', parseInt(batch.value, 10));
            } else if (provider === 'ollama') {
                out = await mtOllama(texts, src.value, tgt.value, mtEndpoint.value.trim(), mtModel.value.trim() || 'llama3.1:8b', parseInt(batch.value, 10));
            } else throw new Error('Unknown provider');
        } catch (e) {
            statusEl.innerHTML = `<span class="bad">Failed</span>: ${escapeHtml(e.message || String(e))}`;
            return;
        }
        RIGHT = LEFT.map((L, i) => ({start: L.start, end: L.end, text: out[i] || ''}));
        alignAndRender();
        exportBtn.disabled = false;
        statusEl.innerHTML = `<span class="ok">Done</span>`;
    });
    exportBtn.addEventListener('click', () => {
        if (!RIGHT.length) {
            alert('Nothing to export');
            return;
        }
        const srt = toSRT(RIGHT);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([srt], {type: 'text/plain;charset=utf-8'}));
        a.download = 'translated.tr.srt';
        document.body.appendChild(a);
        a.click();
        a.remove();
    });
    mtPresets.addEventListener('change', () => {
        const v = mtPresets.value;
        if (v === 'mymemory') {
            mtProvider.value = 'mymemory';
            mtEndpoint.value = '';
        }
        if (v === 'libreLocal') {
            mtProvider.value = 'libre';
            mtEndpoint.value = 'http://localhost:5000/translate';
        }
        if (v === 'librePublic') {
            mtProvider.value = 'libre';
            mtEndpoint.value = 'https://libretranslate.com/translate';
        }
        if (v === 'openai') {
            mtProvider.value = 'openai';
            mtEndpoint.value = 'https://api.openai.com/v1/chat/completions';
        }
        if (v === 'ollama') {
            mtProvider.value = 'ollama';
            mtEndpoint.value = 'http://localhost:11434/api/chat';
            mtModel.value = 'llama3.1:8b';
        }
    });

    /* ===== Providers ===== */
    async function mtMyMemoryBatch(items, src, tgt, B) {
        const out = new Array(items.length);
        let done = 0;
        for (let i = 0; i < items.length; i++) {
            const t = items[i];
            const u = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${encodeURIComponent(src)}|${encodeURIComponent(tgt)}`;
            const r = await fetch(u);
            if (!r.ok) throw new Error('MyMemory HTTP ' + r.status);
            const j = await r.json();
            out[i] = j?.responseData?.translatedText || '';
            prog.value = ++done;
            await new Promise(res => setTimeout(res, 120));
        }
        return out;
    }

    async function mtLibre(items, src, tgt, endpoint) {
        if (!endpoint) throw new Error('Libre endpoint empty');
        const out = [];
        for (let i = 0; i < items.length; i++) {
            const body = new URLSearchParams({
                q: items[i],
                source: src,
                target: tgt,
                format: 'text'
            });
            const r = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
                body
            });
            if (!r.ok) throw new Error('Libre HTTP ' + r.status);
            const j = await r.json();
            out.push(j?.translatedText || j?.[0]?.translatedText || j?.result || '');
            prog.value = i + 1;
        }
        return out;
    }

    async function mtOpenAI(items, src, tgt, endpoint, key, model, B) {
        if (!endpoint || !key) throw new Error('OpenAI endpoint/key missing');
        const out = new Array(items.length);
        let done = 0;
        for (let i = 0; i < items.length; i += B) {
            const chunk = items.slice(i, i + B);
            const system = `You are a professional subtitle translator. Translate ONLY the given items from ${src} to ${tgt}. Preserve line breaks and inline tags. Return JSON {"t":[...]} same length.`;
            const payload = {
                model,
                messages: [{role: 'system', content: system}, {
                    role: 'user',
                    content: JSON.stringify({items: chunk})
                }],
                temperature: 0.2,
                response_format: {type: 'json_object'}
            };
            const r = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key},
                body: JSON.stringify(payload)
            });
            if (!r.ok) throw new Error('OpenAI HTTP ' + r.status);
            const j = await r.json();
            const content = j?.choices?.[0]?.message?.content || '{}';
            let arr = [];
            try {
                arr = JSON.parse(content).t || [];
            } catch {
                arr = content.split('\n');
            }
            for (let k = 0; k < chunk.length; k++) out[i + k] = arr[k] || '';
            done += chunk.length;
            prog.value = done;
        }
        return out;
    }

    async function mtOllama(items, src, tgt, endpoint, model, B) {
        if (!endpoint) throw new Error('Ollama endpoint empty');
        const out = new Array(items.length);
        let done = 0;
        for (let i = 0; i < items.length; i += B) {
            const chunk = items.slice(i, i + B);
            const sys = `You translate English subtitles into natural ${tgt.toUpperCase()} subtitles. Keep meaning and brevity, preserve line breaks. Output JSON {"t":[...]} matching input length.`;
            const body = {
                model,
                messages: [{role: 'system', content: sys}, {
                    role: 'user',
                    content: JSON.stringify({items: chunk})
                }],
                stream: false
            };
            const r = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if (!r.ok) throw new Error('Ollama HTTP ' + r.status);
            const j = await r.json();
            let content = j?.message?.content || '{}', arr = [];
            try {
                arr = JSON.parse(content).t || []
            } catch {
                arr = content.split('\n')
            }
            for (let k = 0; k < chunk.length; k++) out[i + k] = arr[k] || '';
            done += chunk.length;
            prog.value = done;
        }
        return out;
    }

    /* ===== Player ===== */
    playBtn.addEventListener('click', () => {
        if (!ROWS.length) return;
        if (!playing) {
            playing = true;
            playBtn.textContent = 'Pause';
            startWall = performance.now();
            startMs = currentMs;
            tick();
        } else {
            playing = false;
            playBtn.textContent = 'Play';
            if (rafId) cancelAnimationFrame(rafId);
        }
    });
    stopBtn.addEventListener('click', () => {
        playing = false;
        playBtn.textContent = 'Play';
        if (rafId) cancelAnimationFrame(rafId);
        currentMs = 0;
        timeline.value = 0;
        updateHighlight(true);
        updateTimeLabel();
    });
    scrollArea.addEventListener('scroll', () => {
        if (!followToggle.checked) return;
        followScroll = false;
        if (userScrollTimeout) clearTimeout(userScrollTimeout);
        userScrollTimeout = setTimeout(() => {
            followScroll = true;
        }, 3000);
    });

    function tick() {
        if (!playing) return;
        const now = performance.now();
        const dt = now - startWall;
        const sp = parseFloat(speed.value || '1');
        currentMs = startMs + dt * sp;
        timeline.value = currentMs;
        updateHighlight(false);
        updateTimeLabel();
        rafId = requestAnimationFrame(tick);
    }

    function updateTimeLabel() {
        timeLabel.textContent = fmtClockSecs(currentMs);
    }

    function updateHighlight(forceScroll) {
        const trs = [...tbl.querySelectorAll('tr')];
        let newIdx = -1;

        trs.forEach((tr, i) => {
            const row = ROWS[parseInt(tr.dataset.idx, 10)];
            if (currentMs >= row.start && currentMs < row.end) {
                newIdx = i;
                tr.classList.add('playing');
                tr.classList.remove('past');
            } else if (row.end < currentMs) {
                tr.classList.add('past');
                tr.classList.remove('playing');
            } else {
                tr.classList.remove('past');
                tr.classList.remove('playing');
            }
        });

        if (newIdx !== currentIdx) {
            currentIdx = newIdx;
            if (newIdx >= 0) {
                if (followToggle.checked && followScroll && (forceScroll || !elementFullyVisible(trs[newIdx]))) {
                    trs[newIdx].scrollIntoView({block: 'center'});
                }
            }
        } else {
            if (newIdx >= 0 && followToggle.checked && followScroll && !elementFullyVisible(trs[newIdx]) && (forceScroll || playing)) {
                trs[newIdx].scrollIntoView({block: 'center'});
            }
        }
    }

    function elementFullyVisible(el) {
        const r = el.getBoundingClientRect(), p = scrollArea.getBoundingClientRect();
    }

    /* ===== Selection Popup: placement + auto-fetch + drag ===== */
    let popupPos = {x: 100, y: 100}, dragging = false, dragDx = 0, dragDy = 0;

    function placePopup(x, y) {
        // clamp inside viewport
        const W = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
        const H = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        const pw = selPopup.offsetWidth || 360;
        const ph = selPopup.offsetHeight || 260;
        const nx = Math.min(Math.max(8, x), W - pw - 8);
        const ny = Math.min(Math.max(8, y), H - ph - 8);
        popupPos = {x: nx, y: ny};
        selPopup.style.left = nx + 'px';
        selPopup.style.top = ny + 'px';
    }

    selDragBar.addEventListener('mousedown', (e) => {
        if (selPopup.style.display !== 'block') return;
        dragging = true;
        dragDx = e.clientX - popupPos.x;
        dragDy = e.clientY - popupPos.y;
        document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        placePopup(e.clientX - dragDx, e.clientY - dragDy);
    });
    document.addEventListener('mouseup', () => {
        if (dragging) {
            dragging = false;
            document.body.style.userSelect = '';
        }
    });

    document.addEventListener('mouseup', async (ev) => {
        // ignore clicks within popup (don’t re-open)
        if (selPopup.style.display === 'block' && selPopup.contains(ev.target)) return;

        const selObj = window.getSelection();
        const sel = selObj.toString().trim();
        if (!sel || !tbl.contains(selObj.anchorNode)) {
            selPopup.style.display = 'none';
            followScroll = true;
            return;
        }

        // locate near selection (viewport coords); then clamp
        const r = selObj.rangeCount ? selObj.getRangeAt(0).getBoundingClientRect() : null;
        const x = (r ? r.left : ev.clientX) + 10;
        const y = (r ? r.bottom : ev.clientY) + 10;

        selPopup.style.display = 'block';
        selPopup.style.left = '0px';
        selPopup.style.top = '0px'; // ensure offsetWidth is real
        placePopup(x, y);

        followScroll = false;
        selText.textContent = sel;
        selAgg.innerHTML = '<div class="hint">Fetching…</div>';
        selStatus.textContent = '';

        const langFrom = src.value || 'en', langTo = tgt.value || 'tr';
        const q = encodeURIComponent(sel);
        const p1 = fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=${encodeURIComponent(langFrom)}|${encodeURIComponent(langTo)}`).then(r => r.ok ? r.json() : null).catch(err => {
            console.error('MyMemory fetch failed:', err);
            return null;
        });
        const word = encodeURIComponent(sel.split(/\s+/)[0]);
        const p2 = fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`).then(r => r.ok ? r.json() : null).catch(err => {
            console.error('DictionaryAPI fetch failed:', err);
            return null;
        });
        const p3 = fetch(`https://api.datamuse.com/words?ml=${word}&max=6`).then(r => r.ok ? r.json() : null).catch(err => {
            console.error('Datamuse fetch failed:', err);
            return null;
        });

        const [mm, dict, muse] = await Promise.all([p1, p2, p3]);
        const tr = mm?.responseData?.translatedText || '';
        const defs = [];
        if (Array.isArray(dict) && dict[0]?.meanings) {
            dict[0].meanings.forEach(m => (m.definitions || []).slice(0, 2).forEach(d => defs.push('• ' + d.definition)));
        }
        const syns = Array.isArray(muse) ? muse.slice(0, 6).map(x => x.word) : [];

        selAgg.innerHTML = [
            `<div class="section"><h4>Translation (${langFrom}→${langTo})</h4><div class="msg">${escapeHtml(tr || '(no result)')}</div></div>`,
            `<div class="section"><h4>EN Definitions</h4><div class="msg">${escapeHtml(defs.length ? defs.join('\n') : 'No definitions found.')}</div></div>`,
            `<div class="section"><h4>Synonyms</h4><div class="msg">${escapeHtml(syns.join(', ') || '—')}</div></div>`,
            `<div class="section"><h4>Quick Links</h4>
      <div class="msg">
        <a href="https://translate.google.com/?sl=${langFrom}&tl=${langTo}&text=${q}" target="_blank">Google Translate</a> ·
        <a href="https://www.deepl.com/translator#${langFrom}/${langTo}/${q}" target="_blank">DeepL</a> ·
        <a href="https://tureng.com/en/turkish-english/${q}" target="_blank">Tureng</a> ·
        <a href="https://en.wiktionary.org/wiki/${word}" target="_blank">Wiktionary</a> ·
        <a href="https://context.reverso.net/translation/english-${langTo === 'tr' ? 'turkish' : langTo}/${q}" target="_blank">Reverso</a> ·
        <a href="https://sozluk.gov.tr/gts?ara=${q}" target="_blank">TDK</a>
      </div>
    </div>`
        ].join('');

        popupData = {
            selection: sel,
            translation: tr,
            definitions: defs,
            synonyms: syns,
            src: langFrom,
            tgt: langTo,
            context: extractCurrentRowText()
        };
    });
    closeSel.addEventListener('click', () => {
        selPopup.style.display = 'none';
        followScroll = true;
    });

    /* ===== Chat ===== */
    openChatBtn.addEventListener('click', () => {
        chatBox.style.display = 'flex';
        const sel = window.getSelection().toString().trim();
        chatContext.value = sel || extractCurrentRowText() || '';
    });
    closeChatBtn.addEventListener('click', () => chatBox.style.display = 'none');
    chatCopy.addEventListener('click', () => {
        const ctx = chatContext.value.trim(),
            q = chatQuestion.value.trim() || 'Explain meaning, idiom, tone, cultural nuance.';
        const text = `Please explain the following subtitle (EN→TR learner). Be concise.\n\nContext:\n${ctx}\n\nQuestion:\n${q}`;
        navigator.clipboard.writeText(text);
    });
    chatAsk.addEventListener('click', () => {
        alert('Configure OpenAI/Ollama in Translate section to enable in-app chat.');
    });

    /* ===== Dictionary ===== */
    openDictBtn.addEventListener('click', () => {
        dictBox.style.display = 'flex';
        renderDict();
    });
    closeDictBtn.addEventListener('click', () => dictBox.style.display = 'none');

    function renderDict() {
        dictMain.innerHTML = '';
        if (!DICT.length) {
            dictMain.innerHTML = '<div class="hint">Empty.</div>';
            return;
        }
        for (const e of DICT) {
            const div = document.createElement('div');
            div.className = 'entry';
            const when = new Date(e.ts).toLocaleString();
            div.innerHTML = `<div class="hint">${when}</div>
      <div><strong>${escapeHtml(e.selection)}</strong> <span class="hint">(${escapeHtml(e.src)}→${escapeHtml(e.tgt)})</span></div>
      <div class="section"><h4>Translation</h4><div class="msg">${escapeHtml(e.translation || '')}</div></div>
      <div class="section"><h4>Definitions</h4><div class="msg">${escapeHtml((e.definitions || []).join('\n') || '—')}</div></div>
      <div class="section"><h4>Synonyms</h4><div class="msg">${escapeHtml((e.synonyms || []).join(', ') || '—')}</div></div>
      <div class="section"><h4>Context</h4><div class="msg">${escapeHtml(e.context || '')}</div></div>`;
            dictMain.appendChild(div);
        }
    }

    dictExportCsv.addEventListener('click', () => {
        const rows = [['timestamp', 'selection', 'translation', 'src', 'tgt', 'definitions', 'synonyms', 'context']];
        for (const e of DICT) {
            rows.push([new Date(e.ts).toISOString(), e.selection, e.translation || '', e.src, e.tgt, (e.definitions || []).join(' | '), (e.synonyms || []).join(' | '), (e.context || '').replace(/\n/g, ' \\n ')]);
        }
        const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
        a.download = 'dictionary.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
    });

    function loadDict() {
        try {
            return JSON.parse(localStorage.getItem('srt_dict_v3') || '[]')
        } catch {
            return []
        }
    }

    function saveDict() {
        try {
            localStorage.setItem('srt_dict_v3', JSON.stringify(DICT))
        } catch {
        }
    }

    /* Save to dict */
    selAdd.addEventListener('click', () => {
        if (!popupData) return;
        DICT.unshift({ts: Date.now(), ...popupData});
        saveDict();
        renderDict();
        selStatus.textContent = 'Saved to dictionary.';
    });

    function extractCurrentRowText() {
        const h = tbl.querySelector('tr.playing') || tbl.querySelector('tr.hover');
        if (!h) return '';
        const L = h.querySelector('.left .line')?.textContent || '';
        const R = h.querySelector('.right .line')?.textContent || '';
        return (L + (R ? '\n—\n' + R : ''));
    }

    /* ===== Helpers ===== */
    function fileToText(f) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => res(String(e.target.result));
            r.onerror = rej;
            r.readAsText(f);
        });
    }

    /* ===== Keyboard ===== */
    function isTypingTarget(el) {
        const t = el.tagName;
        return t === 'INPUT' || t === 'TEXTAREA' || el.isContentEditable;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === ' ') {
            if (isTypingTarget(e.target)) return; // let space type in inputs (incl. search)
            e.preventDefault();
            if (!playBtn.disabled) playBtn.click();
        }
        if (e.key === 'Escape') {
            if (selPopup.style.display === 'block') {
                selPopup.style.display = 'none';
                followScroll = true;
            }
        }
    });
</script>
