[project]
name = "subtitle-daemon"
version = "0.1.0"
description = "Local service that finds, downloads and caches subtitles for whatever is currently playing"
requires-python = ">=3.11"

# No runtime dependencies, deliberately. Every route the daemon serves and every
# request it makes fits http.server and urllib. That
# keeps `subtitle-daemon` startable with nothing installed, which is what makes
# the extension's one-click path actually one click.
dependencies = []

[project.scripts]
subtitle-daemon = "subtitle_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_daemon"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "corpus: drives align.js over every pair of the live download cache; minutes, not seconds",
]

[tool.ruff]
line-length = 100
src = ["src"]
